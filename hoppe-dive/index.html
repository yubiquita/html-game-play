    // 上の帯: 階（④エクストラでは だっしゅつ あと N）、点、残機、経験値
    const E = s.extra, XT = cfg.extra.text;
    const label = E ? XT.left + Math.max(0, E.left) : 'B' + s.floor + 'F';
    B.text(g, label, 3, 3, E ? GOLD : WHITE, INK);
    const sc = String(s.score);
    B.text(g, sc, V.w - 3 - B.textW(sc), 3, WHITE, INK);
    const lx = Math.max(30, B.textW(label) + 8);
    for (let i = 0; i < s.lives; i++) g.drawImage(A.seed, lx + i * 7, 3);
    if (app.maxDiff) g.drawImage(A.crown, V.w - 3 - B.textW(sc) - 15, 3); // 最大難易度の印（ランの始めに決まる）
    if (app.achFlash > 0 && Math.floor(app.achFlash * 6) % 2 === 0) g.drawImage(A.medalS, lx + 2 + s.lives * 7, 2); // 実績を取った（名前はあとで）
    const prev = E ? s.xpNeed - cfg.extra.xpPer : s.level === 0 ? 0 : s.xpNeed - cfg.xpBase * Math.pow(cfg.xpGrowth, s.level);
    const k = Math.max(0, Math.min(1, (s.xp - prev) / (s.xpNeed - prev)));
    g.fillStyle = INK; g.fillRect(3, 12, V.w - 6, 2);
    g.fillStyle = GOLD; g.fillRect(3, 12, Math.round((V.w - 6) * k), 2);

    if (s.phase === 'choose') drawCards(g, app, s);
    // ④宝の間のあと: 崩れ始め の文字 / 入れないときのヒント
    if (s.phase === 'clear' && app.mode !== 'result') {
      const U = cfg.ui, t = app.clearT;
      if (app.clearPath === 'extra' && t >= U.clearSec + 0.3) centerText(g, XT.go, 46, '#fee761', INK, 2);
      if (app.clearPath === 'denied' && t >= U.clearSec + U.darkSec) {
        centerText(g, XT.hint, 40, WHITE, INK);
        drawHintPanels(g, Math.min(1, (t - U.clearSec - U.darkSec - 0.4) / 0.8));
      }
    }
    if (app.mode === 'result') drawResult(g, app, s);
    if (app.mode === 'tip' && app.tip) drawTip(g, app, A);
    if (app.mode === 'countdown') {
      g.fillStyle = INK; g.fillRect(0, 0, V.w, V.h);
      centerText(g, String(Math.ceil(app.countdown)), 44, WHITE, INK, 3);
    }
    if (app.paused) { g.fillStyle = INK; g.fillRect(0, 0, V.w, V.h); centerText(g, 'ポーズ', 50, WHITE, INK); }
  }

  // ④入れないときのヒントに添える 9マス（床のマスと同じ傾きの小さな平行四辺形）。真ん中だけ光る = 今は1マスしか動けない
  function drawHintPanels(g, k) {
    if (k <= 0) return;
    const w = 13, h = 6, x0 = 96 - Math.round((3 * w) / 2) - 2, y0 = 58;
    g.globalAlpha = k;
    for (let lane = 0; lane < 3; lane++) for (let col = 0; col < 3; col++) {
      const here = lane === 1 && col === 1, y = y0 + lane * (h + 1), dx = (2 - lane) * 2;
      for (let r = 0; r < h; r++) {
        const sx = x0 + col * (w + 1) + dx + Math.floor((h - 1 - r) / 2), yy = y + r;
        if (here) { g.fillStyle = '#ffffff'; g.fillRect(sx, yy, w, 1); }
        else { g.fillStyle = '#5a6988'; if (r === 0 || r === h - 1) g.fillRect(sx + 1, yy, w - 2, 1); else { g.fillRect(sx, yy, 1, 1); g.fillRect(sx + w - 1, yy, 1, 1); } }
      }
    }
    g.globalAlpha = 1;
  }

  function drawCards(g, app, s) {
    const cfg = Game.config;
    const cs = R.cards(s.offer.length);
    const ready = app.chooseT >= cfg.ui.chooseLock;
    centerText(g, 'ひとつ えらんでね', 19, WHITE, INK);
    const smin = s.ranks.speedMin || 0;
    cs.forEach((c, i) => {
      const id = s.offer[i], rank = s.ranks[id] + 1;
      const info = Game.levelup.card(cfg, id, rank);
      // さいしょの はやさ の段階までの はやさ は、選んでも速くならない（灰色。説明を差し替え、段階の印は下限まで空色）
      const same = id === 'speed' && rank <= smin;
      g.fillStyle = INK; g.fillRect(c.x - 1, c.y - 1, c.w + 2, c.h + 2);
      g.fillStyle = ready && !same ? '#3a4466' : '#262b44'; g.fillRect(c.x, c.y, c.w, c.h);
      g.fillStyle = '#5a6988'; g.fillRect(c.x, c.y, c.w, 1);
      B.text(g, info.name, c.x + 3, c.y + 4, same ? '#8b9bb4' : GOLD, INK);
      // 段階の印
      const max = cfg.upgrades.find((u) => u.id === id).max;
      for (let r = 0; r < max; r++) { g.fillStyle = same ? (r < smin ? (r < rank ? '#0099db' : '#124e89') : '#3a4466') : r < rank ? GOLD : '#262b44'; g.fillRect(c.x + 3 + r * 5, c.y + 14, 4, 3); }
      B.wrap(same ? cfg.meta.speedStart.same : info.desc, 9).slice(0, 5).forEach((line, j) => B.text(g, line, c.x + 3, c.y + 22 + j * 9, same ? '#8b9bb4' : WHITE));
      B.text(g, String(i + 1), c.x + c.w - 8, c.y + c.h - 9, '#8b9bb4');
    });
  }

  function drawResult(g, app, s) {
    const V = Game.config.view, res = app.result;
    g.fillStyle = 'rgba(24,20,37,0.85)'; g.fillRect(0, 0, V.w, V.h);
    const clear = s.cleared, E = s.extra, XT = Game.config.extra.text;
    centerText(g, clear ? 'クリア!' : 'ゲームオーバー', 14, clear ? GOLD : WHITE, INK, 2);
    let y = 36;
    // ④エクストラ: だっしゅつ せいこう / だっしゅつ しっぱい (B○F)
    if (E) { centerText(g, E.escaped ? XT.ok : XT.ng + ' (B' + s.floor + 'F)', 33, E.escaped ? '#63c74d' : '#f6757a', INK); y = 43; }
    if (res) {
      // 追いつきの罰があれば、倍率の横に「けはい -N%」（倍率は罰を含めた値）
      centerText(g, 'てん ' + s.score + '  ' + fmtMul(res.mult) + (res.boost > 0 ? '  けはい -' + Math.round(Game.config.meta.catchup.k * res.boost * 100) + '%' : ''), y, WHITE, INK); y += 10;
      // きろくの順位: 1 位は しんきろく!（赤、点滅）、2〜8 位は N い
      const fl = '= さいごの てん ' + res.final, rk = res.rank === 1 ? 'しんきろく!' : res.rank ? res.rank + 'い' : '';
      const tw = B.textW(fl) + (rk ? 6 + B.textW(rk) : 0), fx0 = Math.floor((V.w - tw) / 2);
      B.text(g, fl, fx0, y, GOLD, INK);
      if (rk && (res.rank > 1 || Math.floor(app.time * 3) % 3 !== 2)) B.text(g, rk, fx0 + B.textW(fl) + 6, y, res.rank === 1 ? '#e43b44' : WHITE, INK);
      y += 10;
    } else { centerText(g, 'てん ' + s.score, y, WHITE, INK); y += 10; }
    if (clear) { centerText(g, E && E.escaped ? '(はやさ +' + s.timeBonus + ' だっしゅつ +' + E.bonus + ' こみ)' : '(はやさボーナス +' + s.timeBonus + ' こみ)', y, '#8b9bb4', INK); y += 10; }
    if (res) { centerText(g, 'もちかえった たから +' + res.gain.gain, y + 2, '#2ce8f5', INK); y += 12; }
    centerText(g, (E ? '' : 'B' + s.floor + 'F  ') + fmtTime(s.t), y, WHITE, INK); y += 10;
    if (res && res.gain.unlocked.length) centerText(g, unlockText(res.gain.unlocked), y, GOLD, INK);
    B.text(g, 'SEED ' + s.seed, 3, 3, '#5a6988'); // 左上（9けたの SEED が下の「タップで キャンプへ」に重ならないように）
    if (res && res.ach && res.ach.length) {
      const t = 'じっせき +' + res.ach.length;
      g.drawImage(Game.bake.all().medalS, V.w - 13 - B.textW(t), V.h - 11);
      B.text(g, t, V.w - 3 - B.textW(t), V.h - 10, GOLD, INK);
    }
    if (app.resultT > 0.8 && Math.floor(app.time * 2) % 2 === 0) centerText(g, 'タップで キャンプへ', 97, WHITE, INK);
  }

  const fmtMul = (m) => 'x' + (Math.floor(m * 100 + 1e-6) / 100).toFixed(2);
  const unlockText = (ids) => ids.map((id) => Game.meta.unlockName(id, Game.config)).join('と ') + 'が つかえるように なった!';

  // ---- キャンプ ----
  // 位置（窓の中のドット）: 上の帯、◀ しゅっぱつ ▶、カード（3択と同じ位置）、カードの下半分の − ＋
  const CAMP = { prev: { x: 4, y: 13, w: 30, h: 15 }, go: { x: 48, y: 13, w: 96, h: 15 }, next: { x: 158, y: 13, w: 30, h: 15 }, perPage: 3 };
  R.campLayout = function (n) {
    return {
      prev: CAMP.prev, go: CAMP.go, next: CAMP.next,
      cards: R.cards(n).map((c) => Object.assign({}, c, { minus: { x: c.x, y: c.y + 43, w: 28, h: c.h - 43 }, plus: { x: c.x + 30, y: c.y + 43, w: c.w - 30, h: c.h - 43 } })),
    };
  };
  // ページ: 恒久強化・アンロックのカード（3枚ずつ）のあとに、実績のページ（ACH.perPage 個ずつ）
  const ACH = { cols: 7, rows: 2, w: 24, h: 18, gap: 2, y: 31 };
  ACH.perPage = ACH.cols * ACH.rows;
  // 恒久強化のページのあとに、アンロック（まえうしろ・レーン・さいしょの はやさ）のページ。アンロックは新しいページから
  const perkPages = () => Math.ceil(Game.meta.perkIds(Game.config).length / CAMP.perPage);
  R.campPerkPages = () => perkPages() + Math.ceil(Game.meta.unlockIds(Game.config).length / CAMP.perPage);
  R.isUnlockPage = (page) => page >= perkPages() && page < R.campPerkPages();
  R.achPages = () => Math.ceil(Game.config.achieve.list.length / ACH.perPage);
  // あそびかた: いちばん最後のページ（1ページ目から ◀ で開く）
  R.boardPage = () => R.campPerkPages() + R.achPages(); // きろく（実績のあと）
  R.howtoPage = () => R.boardPage() + 1;
  R.campPages = () => R.howtoPage() + 1;
  R.campIds = (page) => {
    const P = CAMP.perPage;
    if (page < perkPages()) return Game.meta.perkIds(Game.config).slice(page * P, (page + 1) * P);
    if (page < R.campPerkPages()) { const k = page - perkPages(); return Game.meta.unlockIds(Game.config).slice(k * P, (k + 1) * P); }
    return [];
  };
  R.achIds = (page) => { const k = page - R.campPerkPages(); return k < 0 ? [] : Game.config.achieve.list.slice(k * ACH.perPage, (k + 1) * ACH.perPage).map((a) => a.id); };
  R.achPageOf = (id) => R.campPerkPages() + Math.floor(Game.config.achieve.list.findIndex((a) => a.id === id) / ACH.perPage);
  R.achLayout = function (n) {
    const x0 = Math.floor((Game.config.view.w - (ACH.cols * ACH.w + (ACH.cols - 1) * ACH.gap)) / 2);
    return {
      cells: Array.from({ length: n }, (_, i) => ({ x: x0 + (i % ACH.cols) * (ACH.w + ACH.gap), y: ACH.y + Math.floor(i / ACH.cols) * (ACH.h + ACH.gap), w: ACH.w, h: ACH.h })),
      panel: { x: x0, y: ACH.y + ACH.rows * (ACH.h + ACH.gap) + 1, w: ACH.cols * ACH.w + (ACH.cols - 1) * ACH.gap, h: 26 },
    };
  };

  // キャンプの小物は窓の外に置く（窓の中はカードで埋まるので）: 縦持ちは窓の下、横持ちは窓の左右
  function drawCampOutside(g, app, A) {
    const fire = A.fire[Math.floor(app.time * 6) % 2];
    const ham = A.ham.hold.n;
    if (R.portrait) {
      const cx = Math.floor(R.Lw / 2), y = R.fy + 108 + Math.min(60, Math.floor((R.Lh - R.fy - 108) * 0.3));
      g.drawImage(A.tent, cx - 52, y - A.tent.height);
      g.drawImage(fire, cx - 4, y - fire.height);
      g.drawImage(ham, cx + 8, y - 16);
      g.drawImage(A.pile, cx + 30, y - A.pile.height);
    } else if (R.fx >= 26) {
      const y = R.fy + 92;
      g.drawImage(A.tent, Math.floor(R.fx / 2) - 12, y - A.tent.height);
      g.drawImage(A.pile, R.fx + 192 + Math.floor(R.fx / 2) - 10, y - A.pile.height);
    }
  }

  function button(g, r, label, on, color = WHITE) {
    g.fillStyle = INK; g.fillRect(r.x - 1, r.y - 1, r.w + 2, r.h + 2);
    g.fillStyle = on ? '#5a6988' : '#262b44'; g.fillRect(r.x, r.y, r.w, r.h);
    if (on) { g.fillStyle = '#8b9bb4'; g.fillRect(r.x, r.y, r.w, 1); }
    if (typeof label === 'string') B.text(g, label, r.x + Math.floor((r.w - B.textW(label)) / 2), r.y + Math.floor((r.h - 7) / 2), on ? color : '#5a6988');
    else g.drawImage(label, r.x + Math.floor((r.w - label.width) / 2), r.y + Math.floor((r.h - label.height) / 2));
  }
  // 大きな − ＋（文字を2倍にする）
  function bigSign(g, r, ch, on) {
    button(g, r, '', on);
    const c = B.mk(7, 9), cg = c.getContext('2d');
    B.text(cg, ch, 1, 1, on ? WHITE : '#5a6988', INK);
    g.drawImage(c, r.x + Math.floor((r.w - 14) / 2), r.y + Math.floor((r.h - 18) / 2), 14, 18);
  }

  function drawCamp(g, app, A) {
    const cfg = Game.config, V = cfg.view, M = Game.meta, save = app.save, cp = app.camp;
    // 上の帯: たから（のこり）と倍率。数え上げの間は表示だけ少ない値から
    const shown = cp.count ? Math.round(cp.count.from + (cp.count.to - cp.count.from) * Math.min(1, cp.count.t / cp.count.dur)) : save.treasure;
    const view = Object.assign({}, save, { treasure: shown });
    g.drawImage(A.gem, 3, 3);
    B.text(g, String(shown), 12, 3, GOLD, INK);
    B.text(g, '(のこり ' + M.unspent(view, cfg) + ')', 14 + B.textW(String(shown)) + 3, 3, WHITE, INK);
    const mul = fmtMul(M.multiplier(view, cfg)), mx = V.w - 3 - B.textW('ばいりつ ' + mul);
    B.text(g, 'ばいりつ ' + mul, mx, 3, GOLD, INK);

    // ◀ しゅっぱつ ▶
    const ids = R.campIds(cp.page), L = R.campLayout(ids.length);
    button(g, L.prev, A.arrowL, true);
    button(g, L.next, A.arrowR, true);
    button(g, L.go, 'しゅっぱつ', true, GOLD);
    // カード、または実績のページ
    ids.forEach((id, i) => drawCampCard(g, app, A, L.cards[i], M.card(id, view, cfg)));
    const achIds = R.achIds(cp.page);
    if (achIds.length) drawAchPage(g, app, A, achIds);
    if (cp.page === R.howtoPage()) { drawHowto(g, app, A); button(g, R.storyLayout().replay, 'おはなし', true, GOLD); }
    if (cp.page === R.boardPage()) drawBoard(g, app);
    // 下: ページの印、または新しく使えるようになったアンロック
    if (cp.msg && cp.msg.t > 0) centerText(g, cp.msg.text, 99, GOLD, INK);
    else {
      const n = R.campPages(), x0 = Math.floor(V.w / 2 - (n * 6 - 2) / 2);
      for (let p = 0; p < n; p++) { g.fillStyle = p === cp.page ? GOLD : '#3a4466'; g.fillRect(x0 + p * 6, 101, 4, 3); }
      // 最大難易度の印（右下）: 何も振らず、まえうしろ・レーンを入れているとき。宝の量・さいしょの はやさ・連敗は関係ない
      // （ページの印と重ならないよう、王冠＋「さいだい」。ランの上の帯と同じ王冠）
      if (M.isMaxDifficulty(save, cfg)) { const t = 'さいだい', tx = V.w - 3 - B.textW(t); B.text(g, t, tx, 99, GOLD, INK); g.drawImage(A.crown, tx - 14, 99); }
      // アンロックのページは、左下に見出し（けはい の代わり）
      if (R.isUnlockPage(cp.page)) B.text(g, 'アンロック', 3, 99, '#2ce8f5', INK);
      // 追いつき（おたからの けはい）: 連敗があれば左下に、出やすさを 3 つの丸で（p を 0.3 ごとに丸める）。上の帯の倍率は罰を含めた値
      const kp = R.isUnlockPage(cp.page) ? 0 : M.boost(save, cfg);
      if (kp > 0) {
        const dots = Math.max(1, Math.min(3, Math.round(kp / 0.3))), kx = 4 + B.textW('けはい') + 3;
        B.text(g, 'けはい', 3, 99, '#feae34', INK);
        for (let i = 0; i < 3; i++) { g.fillStyle = INK; g.fillRect(kx + i * 5 - 1, 100, 5, 5); g.fillStyle = i < dots ? '#feae34' : '#3a4466'; g.fillRect(kx + i * 5, 101, 3, 3); }
      }
    }
    if (app.paused) { g.fillStyle = INK; g.fillRect(0, 0, V.w, V.h); centerText(g, 'ポーズ', 50, WHITE, INK); }
  }

  // 実績のページ: メダルを並べ、選んだものの名前と条件（シークレットのまだのものはヒント）を下の枠に出す
  function drawAchPage(g, app, A, ids) {
    const cfg = Game.config, rec = app.rec, L = R.achLayout(ids.length), t = app.time;
    ids.forEach((id, i) => {
      const c = L.cells[i], a = Game.achieve.info(id, cfg), got = !!rec.got[id], sel = app.camp.sel === id;
      g.fillStyle = sel ? GOLD : INK; g.fillRect(c.x - 1, c.y - 1, c.w + 2, c.h + 2);
      g.fillStyle = got ? '#3a4466' : '#262b44'; g.fillRect(c.x, c.y, c.w, c.h);
      const img = A.medal[got ? a.kind : 'locked'];
      g.drawImage(img, c.x + Math.floor((c.w - img.width) / 2), c.y + 3);
      if (!got && a.kind === 'secret') B.text(g, '?', c.x + 10, c.y + 9, '#8b9bb4');
      if (got && a.kind === 'platinum' && Math.floor(t * 3) % 3 !== 2) g.drawImage(A.sparkle[Math.floor(t * 6) % 2], c.x + 15, c.y + 1); // でんせつの たんけんか はきらめく
      if (got && rec.fresh.includes(id) && Math.floor(t * 3) % 2 === 0) { g.fillStyle = '#e43b44'; g.fillRect(c.x + c.w - 4, c.y + 1, 3, 3); } // 新しい印
    });
    const P = L.panel;
    g.fillStyle = INK; g.fillRect(P.x - 1, P.y - 1, P.w + 2, P.h + 2);
    g.fillStyle = '#262b44'; g.fillRect(P.x, P.y, P.w, P.h);
    const id = app.camp.sel;
    if (!id) {
      B.text(g, 'じっせき ' + Game.achieve.count(rec) + ' / ' + cfg.achieve.list.length, P.x + 3, P.y + 3, GOLD);
      B.text(g, 'メダルを タップで せつめい', P.x + 3, P.y + 14, '#8b9bb4');
      return;
    }
    const a = Game.achieve.info(id, cfg), got = !!rec.got[id], hidden = !got && a.kind === 'secret';
    B.text(g, hidden ? '???' : a.name, P.x + 3, P.y + 3, got ? GOLD : WHITE);
    if (got) B.text(g, 'とった!', P.x + P.w - 3 - B.textW('とった!'), P.y + 3, '#63c74d');
    B.wrap(hidden ? a.hint : a.desc, 29).slice(0, 2).forEach((line, j) => B.text(g, line, P.x + 3, P.y + 12 + j * 7, hidden ? '#8b9bb4' : WHITE));
  }

  function drawCampCard(g, app, A, c, info) {
    g.fillStyle = INK; g.fillRect(c.x - 1, c.y - 1, c.w + 2, c.h + 2);
    g.fillStyle = '#3a4466'; g.fillRect(c.x, c.y, c.w, c.h);
    g.fillStyle = '#5a6988'; g.fillRect(c.x, c.y, c.w, 1);
    B.text(g, info.name, c.x + 3, c.y + 2, GOLD, INK);
    const lines = (str, color) => B.wrap(str, 9).slice(0, 3).forEach((line, j) => B.text(g, line, c.x + 3, c.y + 19 + j * 8, color));
    if (info.kind === 'perk') {
      const dx = info.max > 4 ? 5 : 6; // 段階 5 の丸は詰めて「さいだい」と重ねない
      for (let r = 0; r < info.max; r++) { g.fillStyle = r < info.rank ? GOLD : '#262b44'; g.fillRect(c.x + 3 + r * dx, c.y + 12, 4, 4); }
      if (info.full) B.text(g, 'さいだい', c.x + c.w - 3 - B.textW('さいだい'), c.y + 11, GOLD);
      else {
        const p = String(info.price);
        B.text(g, p, c.x + c.w - 3 - B.textW(p), c.y + 11, info.canBuy ? WHITE : '#e43b44');
        g.drawImage(A.gem, c.x + c.w - 13 - B.textW(p), c.y + 11);
      }
      lines(info.desc, WHITE);
      bigSign(g, c.minus, '-', info.canRefund);
      bigSign(g, c.plus, '+', info.canBuy);
    } else if (info.kind === 'speed') {
      // さいしょの はやさ: 右上がりの速度メーター（選んだ段階まで金色）と段階、倍率の増え分。−＋ の代わりに ◀ ▶
      const S = Game.config.meta.speedStart;
      for (let r = 0; r < info.max; r++) { const h = 2 + r; g.fillStyle = info.unlocked && r < info.level ? GOLD : '#262b44'; g.fillRect(c.x + 3 + r * 5, c.y + 17 - h, 4, h); }
      if (info.unlocked) {
        const lv = info.level + '/' + info.max;
        B.text(g, lv, c.x + c.w - 3 - B.textW(lv), c.y + 11, info.level ? GOLD : '#8b9bb4');
        B.text(g, 'ばいりつ+' + (S.mul * info.level).toFixed(2), c.x + 3, c.y + 19, info.level ? GOLD : '#8b9bb4');
        B.wrap(info.desc, 9).slice(0, 2).forEach((line, j) => B.text(g, line, c.x + 3, c.y + 27 + j * 8, WHITE));
        button(g, c.minus, A.arrowL, info.level > 0);
        button(g, c.plus, A.arrowR, info.level < info.max);
      } else {
        lines(S.locked, '#8b9bb4');
        button(g, { x: c.x, y: c.y + 43, w: c.w, h: c.h - 43 }, 'まだ', false);
      }
    } else {
      B.text(g, 'ばいりつ+' + Game.config.meta.mul.unlock.toFixed(2), c.x + 3, c.y + 11, info.on ? GOLD : '#8b9bb4');
      if (!info.unlocked) {
        lines('ランで さいだいに すると つかえる', '#8b9bb4');
        button(g, { x: c.x, y: c.y + 43, w: c.w, h: c.h - 43 }, 'まだ', false);
      } else {
        lines(info.desc, WHITE);
        button(g, c.minus, 'きる', !info.on ? false : true);
        button(g, c.plus, 'いれる', !info.on, GOLD);
        // 今の状態に印
        const cur = info.on ? c.plus : c.minus;
        g.fillStyle = info.on ? GOLD : WHITE; g.fillRect(cur.x + 2, cur.y + cur.h - 3, cur.w - 4, 1);
      }
    }
  }

  const fmtTime = (t) => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');

  R.laneY = laneY;
  R.laneDx = laneDx;
  Game.render = R;
})();
</script>
<script>
// 保存データの読み書き。②の恒久強化（hoppe-dive.meta、検め方は meta.parse）、③の実績（hoppe-dive.records、検め方は achieve.parse）、きろく（hoppe-dive.board、board.parse）、ヒントを見たか（hoppe-dive.tips、parseTips）。
// 読めない・壊れている・版が違うときは最初の状態から始める。書けない（容量・プライベートモード）ときは黙って続ける
(function () {
  const Game = (window.Game = window.Game || {});

  function read(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function write(key, data) {
    try { localStorage.setItem(key, JSON.stringify(data)); return true; } catch (e) { return false; }
  }

  const load = (cfg = Game.config) => Game.meta.parse(read(cfg.meta.key), cfg);
  const store = (save, cfg = Game.config) => write(cfg.meta.key, save);
  const loadRecords = (cfg = Game.config) => Game.achieve.parse(read(cfg.achieve.key), cfg);
  const storeRecords = (rec, cfg = Game.config) => write(cfg.achieve.key, rec);

  const loadBoard = (cfg = Game.config) => Game.board.parse(read(cfg.board.key), cfg);
  const storeBoard = (board, cfg = Game.config) => write(cfg.board.key, board);

  // はじめて取ったときの操作の紹介（ヒント）を見たか。{ v, seen: { move: true, lane: true } }（見たものだけ）
  const freshTips = (cfg = Game.config) => ({ v: cfg.tips.version, seen: {} });
  function parseTips(raw, cfg = Game.config) {
    let d = null;
    try { if (typeof raw === 'string') d = JSON.parse(raw); } catch (e) { return freshTips(cfg); }
    const t = freshTips(cfg);
    if (!d || d.v !== cfg.tips.version || !d.seen || typeof d.seen !== 'object') return t;
    for (const id of cfg.tips.order.concat(cfg.tips.rare)) if (d.seen[id] === true) t.seen[id] = true;
    return t;
  }
  const loadTips = (cfg = Game.config) => parseTips(read(cfg.tips.key), cfg);
  const storeTips = (tips, cfg = Game.config) => write(cfg.tips.key, tips);

  Game.save = { load, store, loadRecords, storeRecords, loadBoard, storeBoard, freshTips, parseTips, loadTips, storeTips };
})();
</script>
<script>
// ループと場面の切り替え（タイトル → キャンプ → ラン ⇄ 3択 → 結果 → キャンプ）。決まった刻みでルールを進め、出来事を fx / audio に配る
// URL: ?seed=123 で乱数を固定、?bot=near|relaxed で自動プレイ（キャンプを飛ばす）、?lives=3&pretaken=move,lane で恒久強化を上書き（テスト用）、
//      ?rare=pup|mimic|fly&rareFloor=2 で③のランダムイベントを必ず起こす
// window.HOPPE_TEST = { rare, rareFloor, preset: 'max' | 'unlocks' | 'none', noStore, nearClear } で、確かめ用の HTML を作る（tests/variants.mjs）。
//   preset: 保存データの代わりに使う設定（max: 恒久強化を全部最大＋アンロック2つ、unlocks: アンロック2つだけ、none: まっさら）。noStore: 保存しない。
//   nearClear: 宝の間の直前から始める（④脱出エクストラの確かめ用）
(function () {
  const Game = (window.Game = window.Game || {});
  const cfg = Game.config;
  const q = new URLSearchParams(location.search);
  const T = window.HOPPE_TEST || {};
  const A = Game.achieve;

  const app = (Game.app = {
    mode: 'title',          // title | story | camp | run | tip | countdown | result
    tips: null,             // ヒントを見たか（save.parseTips）
    tip: null,              // 今出しているヒント: { queue: ['move', 'lane'] の先頭を出している, t: 出してからの秒 }。ランは止まる
    story: null,            // おはなし: { page, t: その 1 枚を開いてからの秒, from: 'title' | 'camp' }
    save: null,             // ②の保存データ（meta.js）
    rec: null,              // ③の実績の記録（achieve.js）
    board: null,            // きろく（board.js）
    tr: null, maxDiff: false, runAch: [], achFlash: 0, // 1回のランの数え、始めに最大難易度だったか、このランで取った実績、上の帯の印の残り秒
    batGone: {},            // てんじょうの コウモリ: 飛び去った番号 → 時刻（描画だけ。ルールに入れない）
    camp: { page: 0, count: null, msg: null, sel: null, howto: null, boardNew: 0 }, // boardNew: きろくのページで点滅させる行（今のランの順位。0 なし） // howto: あそびかたの見本 { scene: 選んだ場面, t0: 選んだ時刻 } // sel: 実績のページで選んだ実績 // count: 宝の数え上げ { from, to, t, dur, n }、msg: 下に出す知らせ { text, t }
    result: null,           // ランの終わり: { mult, final, gain: meta.applyRun の返り値 }
    rules: null, bot: null,
    time: 0, acc: 0, paused: false, manual: false,
    countdown: 0, chooseT: 0, hitT: 0, landT: 0, resultT: 0, clearT: 0, titleDist: 0,
    clearPath: null, escT: 0, // ④宝の間のあと: 'extra'（崩れ始める → エクストラ）| 'denied'（暗転とヒント → 結果）、脱出成功の場面の秒
    cmds: [], lastEvents: [],
    fx: null, audio: null,
  });

  function runOptions() {
    const o = Object.assign(Game.meta.runOptions(app.save, cfg), { seed: q.get('seed') != null ? +q.get('seed') : Math.floor(Math.random() * 1e9) });
    if (q.get('lives')) o.lives = +q.get('lives');
    if (q.get('pretaken')) o.pretaken = q.get('pretaken').split(',');
    const rare = q.get('rare') || T.rare;
    if (rare) { o.rare = rare; o.rareFloor = +(q.get('rareFloor') || T.rareFloor || 2); }
    return o;
  }

  function makeBot(kind, seed) {
    const k = cfg.bot[kind] != null ? kind : 'near';
    return Game.bot.create(cfg, { reaction: cfg.bot[k], rockJudge: cfg.bot.rockJudge[k], seed });
  }

  function start() {
    app.rules = Game.rules.create(cfg, runOptions());
    app.bot = q.get('bot') ? makeBot(q.get('bot'), app.rules.seed) : app.bot && app.botForce ? makeBot('near', app.rules.seed) : null;
    app.mode = 'run';
    app.result = null;
    app.tr = A.tracker(); app.maxDiff = Game.meta.isMaxDifficulty(app.save, cfg); app.runAch = []; app.achFlash = 0; app.batGone = {};
    app.acc = 0; app.cmds = []; app.chooseT = 0; app.hitT = 0; app.landT = 0; app.resultT = 0; app.clearT = 0;
    app.clearPath = null; app.escT = 0;
    app.fx.reset();
    if (T.nearClear) nearClear();
    // アンロックで最初から持っていて、まだ見ていないヒント（?pretaken= で上書きしたテストのランでは出さない）
    // レアイベントの紹介も、それが始まる階に着いたとき（ここでは B1F）に出す
    showTips((q.get('pretaken') ? [] : cfg.tips.order.filter((id) => app.rules.ranks[id] >= 1)).concat(rareTip()));
  }

  // ---- はじめて取ったときの操作の紹介（ヒント）。設計書: docs/specs/2026-11-04-hoppe-dive-tips-design.md ----
  // この階で始まるレアイベント（紹介用。始まるのは着いてから rare.startSec 秒あと）
  const rareTip = () => { const k = Game.rare && app.rules ? Game.rare.upcoming(app.rules, cfg) : null; return k ? [k] : []; };
  // ids のうち、まだ見ていないものを順に出す。ボットが遊んでいるときは出さない
  function showTips(ids) {
    const queue = ids.filter((id) => !app.tips.seen[id]);
    if (!queue.length || app.bot) return;
    app.tip = { queue, t: 0 };
    app.mode = 'tip';
    app.audio.on({ type: 'camp_page' });
  }
  // 閉じる: 見たことを保存して次へ。全部閉じたら、3択のあとと同じくそのまま再開（ルールの時間は止まっていたので、着地の猶予は残っている）
  function tipInput(e) {
    if (!(e.type === 'tap' || e.type === 'key' || e.type === 'cmd' || e.type === 'esc') || app.tip.t < cfg.tips.closeSec) return;
    app.tips.seen[app.tip.queue.shift()] = true;
    if (!T.noStore) Game.save.storeTips(app.tips, cfg);
    if (app.tip.queue.length) { app.tip.t = 0; app.audio.on({ type: 'camp_page' }); return; }
    app.tip = null;
    app.mode = 'run';
  }

  // 確かめ用: 宝の間の直前にする（3択を offer[0] で 15 回取り、あと少しで 16 回目のレベルアップ）
  function nearClear() {
    const s = app.rules, LV = Game.levelup;
    for (let i = 1; i < cfg.clearLevel; i++) {
      const o = LV.offer(s, cfg);
      if (o.length) Game.rules.pick(Object.assign(s, { phase: 'choose', offer: o }), 0, cfg);
      s.level = i;
      s.xpNeed += cfg.xpBase * Math.pow(cfg.xpGrowth, i);
    }
    s.phase = 'run'; s.floor = cfg.clearLevel; s.intro = [];
    s.xp = s.xpNeed - 60;
    s.nextSpawnT = s.t + 1;
  }

  // ランの終わり: 倍率はランで使った設定で計算してから、宝を足して保存する
  function finishRun() {
    const s = app.rules;
    const before = app.save.treasure;
    const p = s.assist.lootBoost || 0; // そのランの追いつきの p（連敗はこのあと applyRun で変わる）
    const mult = Game.meta.multiplier(app.save, cfg, p), final = Game.meta.finalScore(s.score, app.save, cfg, p);
    const gain = Game.meta.applyRun(app.save, s, cfg);
    persist();
    gainAch(A.update(app.rec, { s, tr: app.tr, maxDiff: app.maxDiff, final, gain: gain.gain }, cfg), true);
    // きろく: ランの終わりに必ず1回入れる
    const d = new Date(), date = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const rank = Game.board.add(app.board, { final, score: s.score, mult, cleared: !!s.cleared, escaped: !!(s.extra && s.extra.escaped), floor: s.floor, t: s.t, date, seed: s.seed }, cfg);
    if (!T.noStore) Game.save.storeBoard(app.board, cfg);
    app.result = { mult, final, gain, before, ach: app.runAch.slice(), rank, boost: s.assist.lootBoost || 0 };
    app.mode = 'result'; app.resultT = 0;
    if (gain.unlocked.length) app.audio.on({ type: 'unlock_new' });
    else if (rank) app.audio.on({ type: rank === 1 ? 'record_new' : 'record_rank' });
  }

  // 保存（確かめ用の HTML では保存しない）
  function persist() { if (!T.noStore) Game.save.store(app.save, cfg); }
  function persistRec() { if (!T.noStore) Game.save.storeRecords(app.rec, cfg); }

  // ---- 実績 ----
  // 新しく取った実績（記録には付けてある）。ランの最中は上の帯の印と小さな音だけ
  function gainAch(ids, quiet) {
    if (!ids.length) return;
    app.runAch.push(...ids);
    persistRec();
    if (quiet) return;
    app.achFlash = cfg.achieve.flashSec;
    app.audio.on({ type: 'achieve' });
  }

  // キャンプで満たした実績（強化を買った・アンロックを入れた・全部最大）。下の知らせと音
  function campAch() {
    const ids = A.update(app.rec, { save: app.save }, cfg);
    if (!ids.length) return;
    persistRec();
    app.audio.on({ type: 'achieve' });
    app.camp.msg = { text: 'じっせき: ' + A.info(ids[0], cfg).name + (ids.length > 1 ? ' ほか ' + (ids.length - 1) : ''), t: 4 };
  }

  // てんじょうの コウモリをタップした
  function tapBat(e) {
    const b = Game.render.batAt(app, e.x, e.y);
    if (!b) return false;
    app.batGone[b.i] = app.time;
    app.fx.on({ type: 'bat', x: b.x, y: b.y }, app);
    app.audio.on({ type: 'bat' });
    if (A.grant(app.rec, 'bat')) gainAch(['bat'].concat(A.update(app.rec, {}, cfg))); // コウモリで全部そろったときのため
    return true;
  }

  // ---- キャンプ ----
  function enterCamp() {
    const res = app.result;
    app.mode = 'camp';
    app.fx.reset();
    app.camp.count = res && res.gain.gain > 0 ? { from: res.before, to: app.save.treasure, t: 0, dur: Math.min(2, 0.6 + res.gain.gain / 400), n: 0 } : null;
    app.camp.msg = null; app.camp.sel = null;
    app.camp.boardNew = res ? res.rank : 0;
    if (res && res.gain.unlocked.length) {
      app.camp.msg = { text: res.gain.unlocked.map((id) => Game.meta.unlockName(id, cfg)).join('と ') + 'が つかえる!', t: 4 };
      app.camp.page = Game.render.campPerkPages() - 1; // アンロックのページを開く
    } else if (res && res.rank === 1) {
      app.camp.msg = { text: 'しんきろく!', t: 4 };
      app.camp.page = Game.render.boardPage(); // きろくのページを開く
    } else if (res && res.ach.length) {
      const n = res.ach.length;
      app.camp.msg = { text: 'じっせき: ' + A.info(res.ach[0], cfg).name + (n > 1 ? ' ほか ' + (n - 1) : ''), t: 4 };
      app.camp.page = Game.render.achPageOf(res.ach[0]); // 実績のページを開く
    }
    // はじめての人（保存データがまっさら）には、あそびかたを開いて見せる
    if (!res && isFresh()) { app.camp.page = Game.render.howtoPage(); app.camp.howto = { scene: 0, t0: app.time }; }
    app.result = null;
    campAch(); // 前からの保存データで、もう満たしているもの
  }

  // はじめての人（保存データがまっさら: 宝 0・実績 0）
  function isFresh() { return app.save.treasure === 0 && A.count(app.rec) === 0; }

  // ---- おはなし（オープニングの紙芝居）。設計書: docs/specs/2026-11-04-hoppe-dive-opening-design.md ----
  // from: 'title'（はじめて。終わったらキャンプの あそびかた）| 'camp'（あそびかた の おはなし から。終わったら あそびかた へ戻る）
  function startStory(from) {
    app.mode = 'story';
    app.story = { page: 0, t: 0, from };
    app.fx.reset();
    app.audio.on({ type: 'camp_page' });
  }
  const storyLen = (page) => cfg.story.pages[page].reduce((n, l) => n + [...l].length, 0);
  // めくる: 文の途中なら全部出す。出し終わっていれば次の 1 枚（4 枚目のあとは終わる）
  function storyNext() {
    const st = app.story, n = storyLen(st.page);
    if (st.t * cfg.story.cps < n) { st.t = n / cfg.story.cps; return; }
    if (st.page + 1 >= cfg.story.pages.length) return endStory();
    st.page++; st.t = 0;
    app.audio.on({ type: 'camp_page' });
  }
  function endStory() {
    const from = app.story.from;
    app.story = null;
    if (from === 'title') return enterCamp(); // まっさらなので、あそびかた のページが開く
    app.mode = 'camp';
    app.camp.page = Game.render.howtoPage(); app.camp.howto = { scene: 0, t0: app.time };
  }
  function storyInput(e) {
    if (e.type === 'esc') return endStory();
    if (e.type === 'key') return storyNext();
    if (e.type !== 'tap') return;
    const p = Game.render.toField(e.x, e.y), r = Game.render.storyLayout().skip;
    if (p.x >= r.x && p.x < r.x + r.w && p.y >= r.y && p.y < r.y + r.h) return endStory();
    storyNext();
  }

  // 実績のページを離れたら、そのページの新しい印を消す
  function leavePage() {
    const ids = Game.render.achIds(app.camp.page);
    if (ids.length && A.seen(app.rec, ids)) persistRec();
    app.camp.sel = null;
    if (app.camp.page === Game.render.boardPage()) app.camp.boardNew = 0; // 今のランの行の点滅は、ページを離れたら消す
  }

  function campPage(d) {
    const n = Game.render.campPages();
    leavePage();
    app.camp.page = (app.camp.page + d + n) % n;
    app.camp.howto = { scene: 0, t0: app.time }; // あそびかたは、開いたら場面 0 から
    app.audio.on({ type: 'camp_page' });
  }

  function campGo() {
    app.camp.count = null;
    leavePage();
    persist();
    app.audio.on({ type: 'camp_go' });
    start();
  }

  // カードの − ＋（アンロックは きる／いれる）
  function campCard(id, plus) {
    const M = Game.meta, save = app.save;
    let ok;
    if (id === cfg.meta.speedStart.id) ok = M.setSpeedStart(save, save.speedStart + (plus ? 1 : -1), cfg); // さいしょの はやさ: ◀ ▶
    else if (cfg.meta.unlocks.some((u) => u.id === id)) ok = save.unlocked[id] && save.use[id] !== plus && M.toggleUnlock(save, id);
    else ok = plus ? M.buy(save, id, cfg) : M.refund(save, id, cfg);
    app.audio.on({ type: ok ? (plus ? 'camp_plus' : 'camp_minus') : 'camp_deny' });
    if (ok) { persist(); campAch(); }
    return ok;
  }

  function campInput(e) {
    if (e.type === 'cmd') {
      // スワイプは中身を指でずらす向き（左へ払う = 次）。キーは矢印の向き
      if (e.cmd === 'fwd' || e.cmd === 'back') campPage((e.cmd === 'fwd') === !!e.swipe ? -1 : 1);
      return;
    }
    if (e.type === 'key') return campGo();
    if (e.type !== 'tap') return;
    const p = Game.render.toField(e.x, e.y);
    const inR = (r) => p.x >= r.x && p.x < r.x + r.w && p.y >= r.y && p.y < r.y + r.h;
    const ids = Game.render.campIds(app.camp.page), L = Game.render.campLayout(ids.length);
    if (inR(L.go)) return campGo();
    if (inR(L.prev)) return campPage(-1);
    if (inR(L.next)) return campPage(1);
    // あそびかた: 一覧の行をタップすると、その場面の見本にする
    if (app.camp.page === Game.render.howtoPage()) {
      if (inR(Game.render.storyLayout().replay)) return startStory('camp');
      Game.render.howtoLayout().rows.forEach((r) => { if (r.scene != null && inR(r)) { app.camp.howto = { scene: r.scene, t0: app.time }; app.audio.on({ type: 'camp_page' }); } });
      return;
    }
    const achIds = Game.render.achIds(app.camp.page);
    if (achIds.length) {
      Game.render.achLayout(achIds.length).cells.forEach((c, i) => { if (inR(c)) { app.camp.sel = achIds[i]; app.audio.on({ type: 'camp_plus' }); } });
      return;
    }
    L.cards.forEach((c, i) => { if (inR(c.minus)) campCard(ids[i], false); else if (inR(c.plus)) campCard(ids[i], true); });
  }

  function updateCamp(dt) {
    const c = app.camp.count;
    if (app.camp.msg && app.camp.msg.t > 0) app.camp.msg.t -= dt;
    if (!c) return;
    c.t += dt;
    const k = Math.min(1, c.t / c.dur), every = 0.06;
    while (c.n * every < Math.min(c.t, c.dur)) app.audio.on({ type: 'camp_count', i: c.n++ });
    if (k >= 1) { app.camp.count = null; app.audio.on({ type: 'camp_count_end' }); app.fx.on({ type: 'camp_count_end' }, app); }
  }

  function dispatch(events) {
    for (const e of events) {
      app.lastEvents.push(e);
      if (app.lastEvents.length > 300) app.lastEvents.shift();
      app.fx.on(e, app);
      app.audio.on(e, app);
      if (e.type === 'levelup_start') app.chooseT = 0;
      if (e.type === 'levelup_land' || e.type === 'land') app.landT = cfg.ui.landSec;
      if (e.type === 'hit') app.hitT = e.fatal ? cfg.ui.hitFreeze : 0.25;
    }
    // 実績（ランの最中に満たしたもの）
    if (app.tr && app.rules) {
      A.observe(app.tr, events);
      gainAch(A.update(app.rec, { s: app.rules, tr: app.tr, maxDiff: app.maxDiff }, cfg));
    }
  }

  function pick(i) {
    const s = app.rules;
    if (!s || s.phase !== 'choose' || app.chooseT < cfg.ui.chooseLock || i < 0 || i >= s.offer.length) return;
    const ev = Game.rules.pick(s, i, cfg);
    dispatch(ev);
    // まえうしろ・レーンを はじめて取った（段階 0 → 1）
    const p = ev.find((e) => e.type === 'levelup_pick');
    showTips((p && p.rank === 1 && cfg.tips.order.includes(p.id) ? [p.id] : []).concat(rareTip()));
  }

  // ---- 入力 ----
  function onInput(e) {
    if (e.type === 'down') app.audio.unlock();
    if (app.paused || app.mode === 'countdown') return;
    const s = app.rules;
    if (app.mode === 'title') { if (e.type === 'tap' || e.type === 'key') { if (isFresh()) startStory('title'); else enterCamp(); } return; }
    if (app.mode === 'story') return storyInput(e);
    if (app.mode === 'tip') return tipInput(e);
    if (app.mode === 'camp') return campInput(e);
    if (app.mode === 'result') { if ((e.type === 'tap' || e.type === 'key') && app.resultT > 0.8) enterCamp(); return; }
    if (!s) return;
    // ④入れないとき: ヒントが出てから少しあとのタップで結果へ
    if (s.phase === 'clear') {
      if (app.clearPath === 'denied' && (e.type === 'tap' || e.type === 'key') && app.clearT >= cfg.ui.clearSec + cfg.ui.darkSec + 0.5) finishRun();
      return;
    }
    if (s.phase === 'choose') {
      if (e.type === 'pick') pick(e.i);
      if (e.type === 'tap') {
        const p = Game.render.toField(e.x, e.y);
        Game.render.cards(s.offer.length).forEach((c, i) => { if (p.x >= c.x && p.x < c.x + c.w && p.y >= c.y && p.y < c.y + c.h) pick(i); });
      }
      return;
    }
    if (s.phase !== 'run') return;
    if (e.type === 'tap' && tapBat(e) && !e.control) return; // 上の3分の1ならジャンプにしない
    if (e.type === 'cmd' && e.control !== false) app.cmds.push(Game.input.orient(e.cmd, !!s.extra)); // ④エクストラでは画面の向きどおり
    if ((e.type === 'tap' && e.control) || e.type === 'key') app.cmds.push('jump');
  }

  // ---- 1フレーム ----
  // 今の場面に合う BGM（タイトル / 階の色合い / 3択と終わりは止める）
  function musicKey() {
    if (app.mode === 'title' || app.mode === 'story' || app.mode === 'camp') return 'title';
    const s = app.rules;
    if (!s || app.mode === 'result') return null;
    if (s.extra && (s.phase === 'run' || s.phase === 'choose')) return 'extra'; // ④エクストラの間はずっと同じ曲
    if (s.phase !== 'run') return null;
    return Math.min(3, Math.floor((s.floor - 1) / 4));
  }

  function update(dt) {
    app.time += dt;
    app.fx.update(dt);
    app.audio.music(musicKey());
    app.audio.tick();
    if (app.paused) return;
    if (app.mode === 'title') { app.titleDist += 40 * dt; return; }
    if (app.mode === 'story') { app.story.t += dt; return; }
    if (app.mode === 'tip') { app.tip.t += dt; return; }
    if (app.mode === 'camp') return updateCamp(dt);
    if (app.mode === 'countdown') { app.countdown -= dt; if (app.countdown <= 0) app.mode = 'run'; return; }
    if (app.mode === 'result') { app.resultT += dt; return; }
    const s = app.rules;
    if (app.landT > 0) app.landT -= dt;
    if (app.achFlash > 0) app.achFlash -= dt;
    // ④崩れる遺跡: 小石が床で砕ける音（演出は fx が時間から作る）
    if ((s.extra && s.phase === 'run') || app.clearPath === 'extra') for (let n = app.fx.collapseTick(app, dt); n > 0; n--) app.audio.on({ type: 'pebble' });
    if (s.phase === 'run') {
      if (app.hitT > 0) { app.hitT -= dt; }
      app.acc = Math.min(app.acc + dt, 0.25);
      while (app.acc >= cfg.dt && s.phase === 'run') {
        app.acc -= cfg.dt;
        const cmds = app.cmds.splice(0);
        if (app.bot) cmds.push(...Game.bot.act(app.bot, s, cfg));
        dispatch(Game.rules.step(s, cmds, cfg));
      }
    } else if (s.phase === 'choose') {
      app.chooseT += dt;
      if (app.bot && app.chooseT >= cfg.ui.chooseLock) pick(Game.bot.pick(app.bot, s));
    } else if (s.phase === 'over') {
      app.hitT -= dt;
      if (app.hitT <= 0) finishRun();
    } else if (s.phase === 'clear') {
      const U = cfg.ui;
      app.clearT += dt;
      if (!app.clearPath && app.clearT >= U.clearSec) {
        app.clearPath = Game.meta.canEnterExtra(s.ranks) ? 'extra' : 'denied';
        const e = { type: app.clearPath === 'extra' ? 'collapse' : 'extra_denied' };
        app.fx.on(e, app); app.audio.on(e, app);
      }
      if (app.clearPath === 'extra' && app.clearT >= U.clearSec + U.extraIntroSec) { app.acc = 0; dispatch(Game.rules.startExtra(s, cfg)); }
      else if (app.clearPath === 'denied' && app.clearT >= U.clearSec + U.darkSec + U.hintSec) finishRun();
    } else if (s.phase === 'escaped') {
      app.escT += dt;
      if (app.escT >= cfg.ui.escapeSec) finishRun();
    }
  }

  function setHidden(h) {
    app.audio.setHidden(h);
    if (h) { app.paused = true; return; }
    if (!app.paused) return;
    app.paused = false;
    if (app.mode === 'run' && app.rules && app.rules.phase === 'run') { app.mode = 'countdown'; app.countdown = cfg.ui.countdown; }
  }

  // ファビコンとホーム画面のアイコン: 主人公（ほっぺ少し・走る姿）のドット絵を、ぼかさずに整数倍で拡大して作る
  function setIcons() {
    const img = Game.bake.all().hamG[1].run[0].n;
    // 色の付いたドットの範囲だけを切り出す
    const d = img.getContext('2d').getImageData(0, 0, img.width, img.height).data;
    let x0 = img.width, y0 = img.height, x1 = -1, y1 = -1;
    for (let y = 0; y < img.height; y++) for (let x = 0; x < img.width; x++) if (d[(y * img.width + x) * 4 + 3]) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    if (x1 < 0) return;
    const w = x1 - x0 + 1, h = y1 - y0 + 1;
    const make = (size, bg, pad) => {
      const c = Game.bake.mk(size, size), g = c.getContext('2d');
      g.imageSmoothingEnabled = false;
      if (bg) { g.fillStyle = bg; g.fillRect(0, 0, size, size); }
      const k = Math.max(1, Math.floor((size - 2 * pad) / Math.max(w, h)));
      g.drawImage(img, x0, y0, w, h, Math.floor((size - w * k) / 2), Math.floor((size - h * k) / 2), w * k, h * k);
      return c.toDataURL('image/png');
    };
    const link = (rel, href) => { const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l); };
    link('icon', make(64, null, 0));
    link('apple-touch-icon', make(180, '#181425', 18));
  }

  // ---- 起動 ----
  function boot() {
    app.save = T.preset ? presetSave(T.preset) : Game.save.load(cfg);
    app.rec = T.noStore ? A.fresh(cfg) : Game.save.loadRecords(cfg);
    app.board = T.noStore ? Game.board.fresh(cfg) : Game.save.loadBoard(cfg);
    app.tips = T.noStore ? Game.save.freshTips(cfg) : Game.save.loadTips(cfg);
    const canvas = document.getElementById('c');
    Game.render.init(canvas);
    setIcons();
    app.fx = Game.fx.create(cfg);
    app.audio = Game.audio.create(cfg);
    Game.input.create(cfg, canvas, onInput);
    document.addEventListener('visibilitychange', () => setHidden(document.hidden));
    let last = performance.now();
    const frame = (now) => {
      const dt = Math.max(0, Math.min(0.1, (now - last) / 1000));
      last = now;
      if (!app.manual) update(dt);
      Game.render.draw(app);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
    if (q.get('bot')) start();
  }

  // 確かめ用の HTML の設定（max: 恒久強化を全部最大＋アンロック全部、unlocks: アンロックだけ、none: まっさら）。さいしょの はやさ は使える状態で段階 0（キャンプで選ぶ）
  function presetSave(kind) {
    const M = Game.meta, sv = M.fresh(cfg);
    if (kind === 'none') return sv;
    for (const u of cfg.meta.unlocks) { sv.unlocked[u.id] = true; sv.use[u.id] = true; }
    sv.unlocked.speed = true;
    if (kind === 'max') { sv.treasure = M.total(cfg); for (const p of cfg.meta.perks) sv.alloc[p.id] = p.max; }
    return sv;
  }

  // テスト用: 実時間に関係なく進める
  Game.debug = {
    step(sec) { app.manual = true; for (let i = 0; i < Math.round(sec * 60); i++) update(1 / 60); Game.render.draw(app); },
    start() { start(); },
    nearClear() { nearClear(); },
    camp() { enterCamp(); },
    reload() { app.save = Game.save.load(cfg); app.rec = Game.save.loadRecords(cfg); app.board = Game.save.loadBoard(cfg); app.tips = Game.save.loadTips(cfg); },
    input: onInput,
    setHidden,
  };

  boot();
})();
</script>
</body>
</html>
