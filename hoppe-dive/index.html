      // 段階ごとの効果（runOptions へ変換するときに使う）

        speedCap: [0, 210, 195, 180],                 // calm（最大でレベルアップ 1 つ分 220→180 を打ち消す）: 走る速さの上限（ドット/秒。0 は上限なし）。距離の点は上限の前の速さで数える

        luck: [0, 0.06, 0.12, 0.18],                  // luck: 型が出てくるたびに、丸ごと来ない確率（仮。テストプレイで決める）

      // 追いつき型（おたからの けはい）: 連敗 streak で p = min(step × streak, cap)。3択に p でおたからを入れ、倍率に (1 − k × p) をかける

        { id: 'score1', kind: 'score', name: 'いちまんてん', desc: 'さいごの てんが 10000 いじょう' },
        { id: 'score2', kind: 'score', name: 'さんまんてん', desc: 'さいごの てんが 30000 いじょう' },

        { id: 'rich', kind: 'run', name: 'おおもうけ', desc: '1かいで たからを 800 ひろう' },

<script>
// ②の外側のループ: 宝（通貨）、恒久強化の値段と付け外し、アンロック、点の倍率、保存データ → runOptions。
// 保存データはただのデータ。DOM・localStorage には触らない（読み書きは save.js）。設計書: docs/specs/2026-11-03-hoppe-dive-meta-design.md
// save: { v, treasure, alloc: { 恒久強化の id: 段階 }, unlocked: { move, lane, speed }, use: { move, lane }, streak: 連敗の数（追いつき型。設計書 perks2 3 節）,
//         speedStart: さいしょの はやさ の段階（unlocked.speed のときだけ。設計書 speed-unlock） }
(function () {
  const Game = (window.Game = window.Game || {});
  const C = (cfg) => (cfg || Game.config).meta;
  const perk = (id, cfg) => C(cfg).perks.find((p) => p.id === id);

  function fresh(cfg) {
    const M = C(cfg), s = { v: M.version, treasure: 0, alloc: {}, unlocked: {}, use: {}, streak: 0, speedStart: 0 };
    for (const p of M.perks) s.alloc[p.id] = 0;
    for (const u of M.unlocks) { s.unlocked[u.id] = false; s.use[u.id] = false; }
    s.unlocked.speed = false;
    return s;
  }

  // 段階 rank（1〜max）に上げる値段
  function cost(id, rank, cfg) { return perk(id, cfg).price * rank; }
  // id の段階 0 → rank までの合計
  function costTo(id, rank, cfg) { let n = 0; for (let r = 1; r <= rank; r++) n += cost(id, r, cfg); return n; }
  // 全部を最大にする合計（T）
  function total(cfg) { return C(cfg).perks.reduce((n, p) => n + costTo(p.id, p.max, cfg), 0); }

  function spent(save, cfg) { return C(cfg).perks.reduce((n, p) => n + costTo(p.id, save.alloc[p.id] || 0, cfg), 0); }
  function unspent(save, cfg) { return save.treasure - spent(save, cfg); }
  const unlocksOn = (save, cfg) => C(cfg).unlocks.filter((u) => save.unlocked[u.id] && save.use[u.id]).length;
  // さいしょの はやさ: 使える段階の上限（はやさの最大）と、今の段階（使えなければ 0）
  const speedMax = (cfg) => (cfg || Game.config).upgrades.find((u) => u.id === 'speed').max;
  const speedStartOf = (save) => (save.unlocked && save.unlocked.speed ? save.speedStart || 0 : 0);
  // 段階を n にする（◀ ▶）。使えないとき・範囲の外は false
  function setSpeedStart(save, n, cfg) {
    if (!save.unlocked.speed || !Number.isInteger(n) || n < 0 || n > speedMax(cfg) || n === save.speedStart) return false;
    save.speedStart = n;
    return true;
  }

  // 追いつき型の出やすさ p = min(step × 連敗, cap)。ランの開始時に決めて runOptions で渡す
  function boost(save, cfg) { const K = C(cfg).catchup; return Math.min(K.step * (save.streak || 0), K.cap); }
  // 罰を含めない倍率（最大難易度・最大の倍率と同じ物差し）。
  // 振っていない宝のうち「まだ振れる分（T − 振った宝）」だけを数える。全部最大のあとにためた宝は倍率にならない（倍率は難しさに払うもの）
  function baseMultiplier(save, cfg) {
    const M = C(cfg), T = total(cfg);
    return 1 + M.mul.unspent * Math.min(Math.max(0, unspent(save, cfg)), T - spent(save, cfg)) / T + M.mul.unlock * unlocksOn(save, cfg) + M.speedStart.mul * speedStartOf(save);
  }
  // 倍率: p はそのランの出やすさ（省くと保存データの連敗から）。追いつきの罰 (1 − k × p) をかける
  function multiplier(save, cfg, p) {
    if (p == null) p = boost(save, cfg);
    return baseMultiplier(save, cfg) * (1 - C(cfg).catchup.k * p);
  }
  // 最後の点: ランの点（早さのボーナス込み）× 倍率、切り捨て。ここ1か所で計算する
  function finalScore(score, save, cfg, p) { return Math.floor(score * multiplier(save, cfg, p) + 1e-9); }

  // ---- 付け外し（いつでも無料。外すと宝は「振っていない」に戻る） ----
  function canBuy(save, id, cfg) {
    const p = perk(id, cfg), r = save.alloc[id] || 0;
    return !!p && r < p.max && unspent(save, cfg) >= cost(id, r + 1, cfg);
  }
  function buy(save, id, cfg) { if (!canBuy(save, id, cfg)) return false; save.alloc[id] = (save.alloc[id] || 0) + 1; return true; }
  function refund(save, id, cfg) { if (!perk(id, cfg) || !(save.alloc[id] > 0)) return false; save.alloc[id]--; return true; }
  function toggleUnlock(save, id) { if (!save.unlocked[id]) return false; save.use[id] = !save.use[id]; return true; }

  // ---- 保存データ → rules.create の runOptions（seed は呼ぶ側で） ----
  function runOptions(save, cfg) {
    const M = C(cfg), E = M.effect, a = save.alloc;
    const r = (id) => a[id] || 0;
    return {
      lives: E.lives[r('lives')],
      speedStart: speedStartOf(save),
      pretaken: M.unlocks.filter((u) => save.unlocked[u.id] && save.use[u.id]).map((u) => u.id),
      assist: {
        warnPlus: E.warnPlus[r('rockWarn')],
        rockMark: E.rockMark[r('rockWarn')],
        preview: E.preview[r('preview')],
        swapPlus: E.swapPlus[r('swap')],
        jumpGrace: E.jumpGrace[r('jump')],
        xpMul: E.xpMul[r('map')],
        speedCap: E.speedCap[r('calm')],
        magnet: E.magnet[r('magnet')],
        rockGap: E.rockGap[r('rockGap')],
        luck: E.luck[r('luck')],
        lootBoost: boost(save, cfg),
      },
    };
  }

  // ---- ランの結果を反映する（宝を足す、アンロックを使えるようにする） ----
  // 返す値: { loot: 拾った宝, bonus: クリアのボーナス, escape: 脱出のボーナス, bag: たからぶくろで増えた分, gain: 合計, unlocked: [新しく使えるようになった id] }
  // 連敗: クリアしなければ +1、クリアすれば 0（脱出は問わない）
  function applyRun(save, state, cfg) {
    const M = C(cfg);
    const loot = state.loot || 0, bonus = state.cleared ? M.clearBonus : 0;
    const escape = state.extra && state.extra.escaped ? (cfg || Game.config).extra.treasure : 0;
    const sum = loot + bonus + escape, gain = Math.floor(sum * M.effect.bagMul[save.alloc.bag || 0] + 1e-9);
    save.treasure += gain;
    save.streak = state.cleared ? 0 : (save.streak || 0) + 1;
    const unlocked = [];
    for (const u of M.unlocks) if ((state.ranks[u.id] || 0) >= 3 && !save.unlocked[u.id]) { save.unlocked[u.id] = true; unlocked.push(u.id); }
    if ((state.ranks.speed || 0) >= speedMax(cfg) && !save.unlocked.speed) { save.unlocked.speed = true; unlocked.push(M.speedStart.id); }
    return { loot, bonus, escape, bag: gain - sum, gain, unlocked };
  }

  // ④ 脱出エクストラに入れるか（クリアの時点で、レーン移動と前後移動がどちらも段階 1 以上）
  function canEnterExtra(ranks) { return (ranks.move || 0) >= 1 && (ranks.lane || 0) >= 1; }
  // 最大難易度: 何も振らず、アンロック（まえうしろ・レーン）を全部入れている。宝の量・さいしょの はやさ・連敗は問わない（設計書 speed-unlock 1 節）
  function isMaxDifficulty(save, cfg) {
    const M = C(cfg);
    return spent(save, cfg) === 0 && unlocksOn(save, cfg) === M.unlocks.length;
  }
  function maxMultiplier(cfg) { const M = C(cfg); return 1 + M.mul.unspent + M.mul.unlock * M.unlocks.length + M.speedStart.mul * speedMax(cfg); }

  // ---- 保存データの読み込み（壊れていたら最初の状態） ----
  // raw: JSON の文字列か、読んだ値。足りない項目は最初の値で補う。振りすぎ（値段が変わったなど）は振りを外す
  function parse(raw, cfg) {
    const M = C(cfg), f = fresh(cfg);
    let d = raw;
    try { if (typeof raw === 'string') d = JSON.parse(raw); } catch (e) { return f; }
    if (!d || typeof d !== 'object' || d.v !== M.version) return f;
    const nat = (x) => Number.isInteger(x) && x >= 0;
    if (!nat(d.treasure)) return f;
    const s = fresh(cfg);
    s.treasure = d.treasure;
    if (d.streak != null) { if (!nat(d.streak)) return f; s.streak = d.streak; } // perks2 の前の保存データには無い → 0
    for (const p of M.perks) {
      const x = d.alloc && d.alloc[p.id];
      if (x == null) continue;
      if (!nat(x) || x > p.max) return f;
      s.alloc[p.id] = x;
    }
    for (const u of M.unlocks) {
      s.unlocked[u.id] = !!(d.unlocked && d.unlocked[u.id] === true);
      s.use[u.id] = s.unlocked[u.id] && !!(d.use && d.use[u.id] === true);
    }
    // さいしょの はやさ: 使えないとき・範囲の外は 0（はやさの アンロックの前の保存データには無い）
    s.unlocked.speed = !!(d.unlocked && d.unlocked.speed === true);
    s.speedStart = s.unlocked.speed && Number.isInteger(d.speedStart) && d.speedStart >= 0 && d.speedStart <= speedMax(cfg) ? d.speedStart : 0;
    if (spent(s, cfg) > s.treasure) for (const p of M.perks) s.alloc[p.id] = 0;
    return s;
  }

  // カードの文字: 恒久強化は次の段階の効果（最大なら今の効果）
  function card(id, save, cfg) {
    const M = C(cfg), p = perk(id, cfg);
    if (p) {
      const r = save.alloc[id] || 0, max = r >= p.max;
      return { kind: 'perk', id, name: p.name, rank: r, max: p.max, desc: p.desc[max ? r : r + 1], price: max ? 0 : cost(id, r + 1, cfg), full: max, canBuy: canBuy(save, id, cfg), canRefund: r > 0 };
    }
    if (id === M.speedStart.id) return { kind: 'speed', id, name: M.speedStart.name, desc: M.speedStart.desc, unlocked: !!save.unlocked.speed, level: speedStartOf(save), max: speedMax(cfg) };
    const u = M.unlocks.find((x) => x.id === id);
    return { kind: 'unlock', id, name: u.name, desc: u.desc, unlocked: !!save.unlocked[id], on: !!save.use[id] };
  }
  // キャンプに並べるカード: 恒久強化と、アンロック（まえうしろ・レーン・さいしょの はやさ）。アンロックは新しいページから
  const perkIds = (cfg) => C(cfg).perks.map((p) => p.id);
  const unlockIds = (cfg) => C(cfg).unlocks.map((u) => u.id).concat(C(cfg).speedStart.id);
  const order = (cfg) => perkIds(cfg).concat(unlockIds(cfg));
  // 新しく使えるようになったアンロックの名前
  const unlockName = (id, cfg) => (id === C(cfg).speedStart.id ? C(cfg).speedStart.name : C(cfg).unlocks.find((u) => u.id === id).name);

  Game.meta = { fresh, cost, costTo, total, spent, unspent, boost, baseMultiplier, multiplier, finalScore, canBuy, buy, refund, toggleUnlock, runOptions, applyRun, canEnterExtra, isMaxDifficulty, maxMultiplier, parse, card, order, perkIds, unlockIds, unlockName, setSpeedStart, speedStartOf };
})();
</script>
<script>
// シード付きの乱数（mulberry32）。状態は整数1つで、ルールの状態の中に持つ（写しても同じ列になる）
(function () {
  const Game = (window.Game = window.Game || {});

  // o.rng（整数）を進めて [0,1) を返す
  function next(o) {
    let t = (o.rng = (o.rng + 0x6d2b79f5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const int = (o, n) => Math.floor(next(o) * n);
  const pick = (o, arr) => arr[int(o, arr.length)];
  // 重み付き。items: [{ weight }]
  function weighted(o, items) {
    let sum = 0;
    for (const it of items) sum += it.weight;
    let r = next(o) * sum;
    for (const it of items) { r -= it.weight; if (r < 0) return it; }
    return items[items.length - 1];
  }
  const seedFrom = (s) => (typeof s === 'number' ? s | 0 : [...String(s)].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619), 2166136261) | 0);

  Game.rng = { next, int, pick, weighted, seedFrom };
})();
</script>
<script>
// ③ランダムイベント（シークレット）: まいごの こハムスター / たからばこの まもの / そらとぶ たね。
// 階の色ごとに 1 つ（まいご = 茶 / たね = 緑 / まもの = 赤）。起きるかは、イベントごとにランのシードから作る別の乱数で引く（ランの乱数の列は変えない）。
// その色の最初の階で始める。出る条件（needs: まえうしろ・レーンの段階）がそろっていなければ、その色の階のうちは持ち越す。色が過ぎたら取りやめ。
// 1 つのイベントは 1 回のランで 1 回まで。同時には起こさない（前のが終わるまで待つ）。
// 状態はルールの状態の中の s.rare（今の予定。ただのデータ）と s.rareNext（あとの予定の並び）。DOM に触らない。
// 設計書: docs/specs/2026-11-03-hoppe-dive-achievements-design.md 3節、docs/specs/2026-11-04-hoppe-dive-rare-luck-design.md A
(function () {
  const Game = (window.Game = window.Game || {});
  const RNG = Game.rng;
  const KINDS = ['pup', 'mimic', 'fly'];

  // シードから決める。起きるイベントの予定を、色の順に並べて返す（空なら何も起きない）。イベントごとに別に引く
  function decide(seed, cfg) {
    const C = cfg.achieve.rare, o = { rng: (RNG.seedFrom(seed) ^ 0x2545f491) | 0 };
    const out = [];
    for (const k of KINDS) if (RNG.next(o) < C.chance[k]) out.push(k);
    // イベントの中の乱数は、イベントごとに別の列（シードと種類から）
    return out.sort((a, b) => C.stage[a] - C.stage[b]).map((k) => plan(k, C.stage[k] * C.stageFloors + 1, (RNG.seedFrom(seed) ^ (0x2545f491 + 0x9e3779b * (KINDS.indexOf(k) + 1))) | 0, C.stage[k]));
  }
  // stage: 出る色（0 茶 / 1 緑 / 2 赤）。null は確かめ用（色を問わず floor の階から）
  const plan = (kind, floor, rng, stage = null) => ({ kind, floor, rng, stage, state: 'wait', e: null });

  // runOptions.rare: 'mimic' か { kind, floor }（確かめ用。その 1 つだけを起こす）。null なら起こさない。予定の並びを返す
  function fromOptions(opt, seed, cfg) {
    if (opt.rare === null || (opt.noSpawn && opt.rare === undefined)) return [];
    if (opt.rare) {
      const kind = typeof opt.rare === 'string' ? opt.rare : opt.rare.kind;
      if (!KINDS.includes(kind)) return [];
      return [plan(kind, (opt.rare.floor || opt.rareFloor || 2), (RNG.seedFrom(seed) ^ 0x2545f491) | 0)];
    }
    return decide(seed, cfg);
  }
  // 出る条件（まえうしろ・レーンの段階の下限）がそろっているか
  const ready = (s, cfg, kind) => Object.entries(cfg.achieve.rare.needs[kind] || {}).every(([id, n]) => (s.ranks[id] || 0) >= n);
  const stageOf = (floor, cfg) => Math.floor((floor - 1) / cfg.achieve.rare.stageFloors);

  const end = (r, ok, ev, s) => { r.state = ok ? 'ok' : 'fail'; r.e = null; ev.push({ type: 'rare_end', t: s.t, kind: r.kind, ok }); };

  // 階に着いたら始める
  function begin(s, cfg, ev) {
    const r = s.rare, C = cfg.achieve.rare, h = s.h;
    if (r.kind === 'pup') {
      const lanes = [0, 1, 2].filter((l) => l !== h.lane);
      const lane = lanes[RNG.int(r, lanes.length)];
      const id = s.nextId;
      Game.rules.place(s, { items: [{ k: 'pup', lane, at: C.pup.at, h: 0 }] }, cfg);
      r.e = { id };
    } else if (r.kind === 'mimic') {
      r.e = { ph: 'enter', t: 0, x: -16, x0: -16, lp: h.lp, z: 0, dodged: 0 };
    } else {
      // そらとぶ たね: 窓の右から、乱数で決めた最初のマスへ飛んでくる
      const col = RNG.int(r, 3), lane = RNG.int(r, 3), F = cfg.achieve.rare.fly;
      r.e = { ph: 'enter', t: 0, pt: 0, col, lane, fx: cfg.view.w + 8, flp: lane, x: cfg.view.w + 8, lp: lane, h: F.h[1] };
    }
    r.state = 'on';
    ev.push({ type: 'rare_start', t: s.t, kind: r.kind });
  }

  function update(s, cfg, ev) {
    let r = s.rare;
    if (!r || s.phase !== 'run' || s.extra) return; // ④エクストラでは起こさない
    // 終わった（成功・失敗・取りやめ）なら、次の予定へ
    if (r.state !== 'wait' && r.state !== 'on' && s.rareNext && s.rareNext.length) r = s.rare = s.rareNext.shift();
    if (r.state === 'wait') {
      const C = cfg.achieve.rare;
      // 色の決まった予定: 色が過ぎたら取りやめ（次の予定は、次の刻みで見る）
      if (r.stage != null && stageOf(s.floor, cfg) > r.stage) { r.state = 'skip'; return; }
      // 予定の階から。出る条件がそろうまで待つ。階に着いてから startSec 秒あと（紹介を読んで、操作に戻る猶予）
      if (s.floor >= r.floor && ready(s, cfg, r.kind) && (r.stage == null || s.t >= (s.floorAt || 0) + C.startSec)) begin(s, cfg, ev);
    }
    if (r.state !== 'on') return;
    // まものは、金の階に入ったら あきらめる（ごほうびなし）
    if (r.kind === 'mimic' && r.stage != null && stageOf(s.floor, cfg) > r.stage) return end(r, false, ev, s);
    const dt = cfg.dt;
    if (r.kind === 'pup') {
      const o = s.objs.find((x) => x.id === r.e.id);
      if (!o || o.done) end(r, !!(o && o.got), ev, s);
    } else if (r.kind === 'mimic') mimic(s, cfg, r, dt, ev);
    else fly(s, cfg, r, dt, ev);
  }

  // たからばこの まもの: 後ろに付いてきて、予告のあとで前へ飛びかかる。3回よけると宝を落とす。かまれると宝の1割を取られる
  function mimic(s, cfg, r, dt, ev) {
    const M = cfg.achieve.rare.mimic, e = r.e, h = s.h;
    const target = h.x - M.behind;
    const follow = () => { e.lp += (h.lp - e.lp) * Math.min(1, dt / M.laneLag); };
    e.t += dt;
    switch (e.ph) {
      case 'enter': {
        const k = Math.min(1, e.t / M.enterSec);
        e.x = e.x0 + (target - e.x0) * k; e.z = hop(e.t, 0.25, 3); follow();
        if (k >= 1) { e.ph = 'wait'; e.t = 0; e.z = 0; }
        break;
      }
      case 'wait':
        e.x += Math.sign(target - e.x) * Math.min(Math.abs(target - e.x), 120 * dt); follow();
        if (e.t >= M.waitSec) { e.ph = 'tell'; e.t = 0; ev.push({ type: 'mimic_tell', t: s.t, x: e.x, lane: Math.round(e.lp) }); }
        break;
      case 'tell':
        if (e.t >= M.tellSec) { e.ph = 'leap'; e.t = 0; e.x0 = e.x; e.lp = Math.round(e.lp); }
        break;
      case 'leap': {
        const u = Math.min(1, e.t / M.leapSec);
        e.x = e.x0 + M.leapDx * u; e.z = 4 * M.leapH * u * (1 - u);
        if (Math.abs(e.lp - h.lp) < 0.5 && Math.abs(e.x - h.x) < M.biteW && h.z < M.biteH) {
          const stolen = Math.floor(s.loot * M.steal);
          s.loot -= stolen;
          e.ph = 'flee'; e.t = 0;
          ev.push({ type: 'mimic_bite', t: s.t, x: h.x, lane: Math.round(h.lp), stolen });
          break;
        }
        if (u >= 1) {
          e.dodged++; e.z = 0;
          ev.push({ type: 'mimic_dodge', t: s.t, x: e.x, lane: Math.round(e.lp), n: e.dodged });
          if (e.dodged >= M.needDodge) {
            // 宝を落として消える（落とした宝はふつうに拾える）
            const id = s.nextId++;
            s.objs.push({ id, k: 'big', wx: s.dist + e.x + 6, lane: Math.round(e.lp), h: 0, minSep: 99, hit: false });
            ev.push({ type: 'mimic_give', t: s.t, x: e.x, lane: Math.round(e.lp) });
            return end(r, true, ev, s);
          }
          e.ph = 'back'; e.t = 0; e.x0 = e.x;
        }
        break;
      }
      case 'back': {
        const k = Math.min(1, e.t / M.backSec);
        e.x = e.x0 + (target - e.x0) * k; e.z = hop(e.t, 0.2, 3);
        if (k >= 1) { e.ph = 'wait'; e.t = 0; e.z = 0; }
        break;
      }
      case 'flee':
        e.x -= 150 * dt; e.z = hop(e.t, 0.2, 3);
        if (e.x < -24) end(r, false, ev, s);
        break;
    }
  }
  const hop = (t, per, h) => { const u = (t % per) / per; return 4 * h * u * (1 - u); };

  // そらとぶ たね: 9マス（前後3列 × 3レーン）の上を、マスからマスへ移る。いつも地面からは届かない高さ（跳ばないと取れない）。
  // 同じマスで、高さの差が拾える範囲なら取れる。sec 秒で飛び去る。直しの設計書 1
  function fly(s, cfg, r, dt, ev) {
    const F = cfg.achieve.rare.fly, e = r.e, h = s.h, X = cfg.layout.colX;
    e.t += dt; e.pt += dt;
    e.h = F.h[0] + (F.h[1] - F.h[0]) * (0.5 + 0.5 * Math.sin((e.t * 2 * Math.PI) / 1.7));
    const glide = (dur) => {
      const k = Math.min(1, e.pt / dur), u = k * k * (3 - 2 * k);
      e.x = e.fx + (X[e.col] - e.fx) * u; e.lp = e.flp + (e.lane - e.flp) * u;
      return k >= 1;
    };
    if (e.t >= F.sec && e.ph !== 'leave') e.ph = 'leave';
    switch (e.ph) {
      case 'enter': if (glide(F.enterSec)) { e.ph = 'stay'; e.pt = 0; } break;
      case 'stay':
        if (e.pt >= F.stay) {
          const next = [[e.col - 1, e.lane], [e.col + 1, e.lane], [e.col, e.lane - 1], [e.col, e.lane + 1]].filter(([c, l]) => c >= 0 && c <= 2 && l >= 0 && l <= 2);
          const [c, l] = next[RNG.int(r, next.length)];
          e.fx = e.x; e.flp = e.lp; e.col = c; e.lane = l; e.ph = 'move'; e.pt = 0;
        }
        break;
      case 'move': if (glide(F.moveSec)) { e.ph = 'stay'; e.pt = 0; } break;
      case 'leave':
        e.x += 120 * dt; e.h += 40 * dt;
        if (e.x > cfg.view.w + 12) return end(r, false, ev, s);
        return;
    }
    if (e.ph === 'enter') return;
    // 近いほうのマス
    let nc = 0;
    for (let c = 1; c < 3; c++) if (Math.abs(X[c] - e.x) < Math.abs(X[nc] - e.x)) nc = c;
    if (nc === h.col && Math.round(e.lp) === Math.round(h.lp) && Math.abs(h.z - e.h) <= cfg.obj.item.reach) {
      ev.push({ type: 'fly_catch', t: s.t, x: e.x, lane: Math.round(e.lp), h: e.h });
      end(r, true, ev, s);
    }
  }

  // この階で始まる予定のイベント（紹介を、階に着いたときに出すため）。前のイベントが続いていれば null
  function upcoming(s, cfg) {
    let r = s.rare;
    if (!r || s.extra) return null;
    if (r.state === 'on') return null;
    if (r.state !== 'wait') r = (s.rareNext || [])[0];
    if (!r || r.state !== 'wait') return null;
    if (r.stage != null && stageOf(s.floor, cfg) !== r.stage) return null;
    return s.floor >= r.floor && ready(s, cfg, r.kind) ? r.kind : null;
  }

  // 床が抜けたとき・残機を使ったときの吹き飛ばしで、途中のイベントは消える。
  // ただし まものは、階をまたいで追い続ける（速いと 1 階のうちに 3 回よけきれないため）。次の階で後ろから入り直す。よけた数は残す
  function cancel(s, ev) {
    const r = s.rare;
    if (!r || r.state !== 'on') return;
    if (r.kind === 'mimic' && r.e.ph !== 'flee') { Object.assign(r.e, { ph: 'enter', t: 0, x: -16, x0: -16, z: 0, lp: s.h.lp }); return; }
    end(r, false, ev, s);
  }

  Game.rare = { KINDS, decide, fromOptions, update, cancel, upcoming };
})();

<script>
// 障害物の「型」と、出してよいかの確かめ（公平さ）、今の段階に応じた選び方。
// 時間の決まり: 型の中の at（秒）は「その物が窓の右端に入る時刻」。地面の物は at + 走る時間 でハムスターの列に着く。
// 落石は、同じ at の地面の物がその列に着く瞬間に落ちる（影は rockWarn 秒前から出る）。だから地面の物と落石は同じ時間の物差しで並べられる。
// 石と地面の物を組む型では、地面の物を spawn.rockShift ＋ いしの すきま 秒だけあとにする（石が先に落ちる。同時だと人は迷う）。
// レーン・列の書き方: '@' = 型を出した時点のハムスターのレーン（列）、'@+' = その隣、'!' = それ以外、'*' = どれでも
(function () {
  const Game = (window.Game = window.Game || {});
  const R = Game.rng;

  // わなの並び（奥・中・手前 のレーンごとに、何秒遅れて来るか）。'/' は奥ほど前（右）にある
  const SHAPES = {
    '|': [0, 0, 0],
    '/': [0.3, 0.15, 0],
    '\\': [0, 0.15, 0.3],
    '^': [0, 0.2, 0],     // 凸: 中央だけ前
    'v': [0.2, 0, 0.2],   // 凹: 中央だけ後ろ
  };
  // 形（ななめ・でこぼこ）は、わなの最後の段階（レーン移動のあとでだけ取れる）で出る
  const shapesFor = (trapRank) => (trapRank >= 5 ? ['|', '/', '\\', '^', 'v'] : ['|']);

  // 型の一覧。requires: 出してよい条件（段階の下限）、threats: 同時に気にする物の数
  // noIntro: 段階を取った直後に単独で見せる紹介に使わない
  const LIST = [
    { id: 'trap1', requires: {}, weight: 3, threats: 1, items: [{ k: 'traps', shape: '|', at: 0 }] },
    { id: 'trapL', requires: { trap: 1 }, weight: 3, threats: 1, items: [{ k: 'traps', shape: '*', at: 0, long: true }] },
    { id: 'stal1', requires: { trap: 2 }, weight: 2, threats: 1, items: [{ k: 'stals', shape: '*', at: 0 }] },
    { id: 'trapStal', requires: { trap: 2 }, weight: 2, threats: 2, noIntro: true, items: [{ k: 'traps', shape: '*', at: 0 }, { k: 'stals', shape: '*', at: 0.55 }] },
    { id: 'stalTrap', requires: { trap: 2 }, weight: 2, threats: 2, noIntro: true, items: [{ k: 'stals', shape: '*', at: 0 }, { k: 'traps', shape: '*', at: 0.45 }] },
    { id: 'trap2', requires: { trap: 3 }, weight: 3, threats: 2, items: [{ k: 'traps', shape: '*', at: 0 }, { k: 'traps', shape: '*', at: 0.95 }] },
    { id: 'trapL2', requires: { trap: 4 }, weight: 2, threats: 2, items: [{ k: 'traps', shape: '*', at: 0, long: true }, { k: 'traps', shape: '*', at: 0.85 }] },
    { id: 'trap2t', requires: { trap: 4 }, weight: 2, threats: 2, noIntro: true, items: [{ k: 'traps', shape: '*', at: 0 }, { k: 'traps', shape: '*', at: 0.8 }] },
    { id: 'trapS', requires: { trap: 5, lane: 1 }, weight: 4, threats: 1, items: [{ k: 'traps', shape: '*', at: 0 }] },

    { id: 'rock1', requires: { move: 1 }, weight: 3, threats: 1, items: [{ k: 'rock', col: '@', lanes: ['@'], at: 0 }] },
    { id: 'rockTrap', requires: { move: 1, trap: 1 }, weight: 2, threats: 2, items: [{ k: 'traps', shape: '*', at: 0 }, { k: 'rock', col: '@', lanes: ['@'], at: 0 }] },
    { id: 'rock2', requires: { move: 2 }, weight: 3, threats: 2, items: [{ k: 'rock', col: '@', lanes: ['@'], at: 0 }, { k: 'rock', col: '@+', lanes: ['@'], at: 0 }] },
    { id: 'rock2s', requires: { move: 2 }, weight: 2, threats: 2, items: [{ k: 'rock', col: '@', lanes: ['@'], at: 0 }, { k: 'rock', col: '*', lanes: ['*'], at: 0.45 }] },
    { id: 'rockWide', requires: { move: 2, lane: 1 }, weight: 2, threats: 1, items: [{ k: 'rock', col: '@', lanes: ['@', '@+'], at: 0 }] },

    { id: 'block1', requires: { lane: 1 }, weight: 3, threats: 1, items: [{ k: 'block', lanes: ['@'], at: 0 }] },
    { id: 'blockTrap', requires: { lane: 1, trap: 1 }, weight: 2, threats: 2, items: [{ k: 'block', lanes: ['@'], at: 0 }, { k: 'traps', shape: '|', at: 0.45, skip: 'block' }] },
    { id: 'block2', requires: { lane: 2 }, weight: 3, threats: 1, items: [{ k: 'block', lanes: ['@', '!'], at: 0 }] }, // 自分のレーンとほかの1本（真ん中だけ空くこともある）
    { id: 'blockSwap', requires: { lane: 3 }, weight: 3, threats: 1, items: [{ k: 'block', lanes: ['!'], swapTo: ['@'], swapX: 'cfg', at: 0 }] },
    { id: 'block2Swap', requires: { lane: 3 }, weight: 2, threats: 1, items: [{ k: 'block', lanes: ['@', '!'], swapTo: ['!+'], swapX: 'cfg', at: 0 }] },

    // 宝の一列は、とおせんぼと組む（1本のレーンに並ぶだけでは危なくないので）。lanes: ['row'] は一列と同じレーン
    { id: 'rowOut', requires: { loot: 3, lane: 1 }, weight: 1, threats: 1, items: [{ k: 'row', lane: '*', at: 0, n: 5, step: 0.12 }, { k: 'block', lanes: ['row'], at: 0.78 }] },
    { id: 'rowIn', requires: { loot: 3, lane: 1 }, weight: 1, threats: 1, items: [{ k: 'block', lanes: ['row'], at: 0 }, { k: 'row', lane: '*', at: 0.3, n: 5, step: 0.12 }] },
  ];
  const byId = Object.fromEntries(LIST.map((p) => [p.id, p]));

  const meets = (req, ranks) => Object.keys(req).every((k) => (ranks[k] || 0) >= req[k]);

  // ---- 型を具体的な物の並びにする ----
  // open: レーン移動が解禁されているか。解禁前は、移れないレーンに物を置かない
  function lanePick(o, spec, here, used, open = true) {
    const other = [0, 1, 2].filter((l) => l !== here);
    switch (spec) {
      case '@': return here;
      case '@+': return here === 1 ? R.pick(o, [0, 2]) : 1;
      case '!': return R.pick(o, other);
      case '*': return open ? R.int(o, 3) : here;
      case '!+': return [0, 1, 2].filter((l) => !used.includes(l)); // 今ふさいでいない残り（配列を返す）
      default: return spec;
    }
  }
  function colPick(o, spec, here) {
    if (spec === '@') return here;
    if (spec === '@+') return here === 1 ? R.pick(o, [0, 2]) : 1;
    if (spec === '*') return R.int(o, 3);
    return spec;
  }

  // o: 乱数の持ち主（state）。here: { col, lane }。ranks: 今の段階
  // cap: おちついての速さの上限（0 は上限なし）。gap: いしの すきま（秒）
  function resolve(o, pat, here, ranks, cap = 0, gap = 0) {
    const items = [];
    // 石と地面の物を組む型: 地面の物を石より rockShift ＋ gap 秒あとにする
    const hasRock = pat.items.some((x) => x.k === 'rock');
    const late = (it) => (hasRock && it.k !== 'rock' ? Game.config.spawn.rockShift + gap : 0);
    let blockLanes = [];
    // 一列のレーン（とおせんぼの lanes: ['row'] が使う）は先に決める
    const rowIt = pat.items.find((x) => x.k === 'row');
    const rowLane = rowIt ? lanePick(o, rowIt.lane, here.lane, [], here.open !== false) : null;
    for (const it of pat.items) {
      if (it.k === 'traps' || it.k === 'stals') {
        const shape = it.shape === '*' ? R.pick(o, shapesFor(ranks.trap || 0)) : it.shape;
        const off = SHAPES[shape];
        const w = it.long ? Game.rules.longTrapW(ranks, Game.config, cap) : 0;
        for (let l = 0; l < 3; l++) {
          if (it.skip === 'block' && blockLanes.includes(l)) continue;
          const x = { k: it.k === 'traps' ? 'trap' : 'stal', at: it.at + late(it) + off[l], lane: l };
          if (w) x.w = w;
          items.push(x);
        }
      } else if (it.k === 'rock') {
        const col = colPick(o, it.col, here.col);
        const lanes = [];
        for (const s of it.lanes) {
          const l = lanePick(o, s, here.lane, lanes, here.open !== false);
          if (!lanes.includes(l)) lanes.push(l);
        }
        items.push({ k: 'rock', at: it.at, col, lanes });
      } else if (it.k === 'block') {
        const lanes = [];
        for (const s of it.lanes) {
          let l = s === 'row' ? rowLane : lanePick(o, s, here.lane, lanes);
          if (s === '@+' && lanes.includes(l)) l = [0, 1, 2].find((x) => !lanes.includes(x));
          if (!lanes.includes(l)) lanes.push(l);
        }
        let swapTo = null;
        if (it.swapTo) {
          swapTo = [];
          for (const s of it.swapTo) {
            const v = lanePick(o, s, here.lane, lanes);
            for (const l of [].concat(v)) if (!swapTo.includes(l)) swapTo.push(l);
          }
          // 2本の入れ替え: 空いていた1本 F と、ふさいでいた1本 → 合わせて2本。
          // 新しい空きは、F の隣のレーンにする（端から端へ一瞬で動かなくてよいように）
          if (swapTo.length < lanes.length) {
            const F = swapTo[0], adj = lanes.filter((l) => Math.abs(l - F) === 1);
            const free = adj.length ? adj[R.int(o, adj.length)] : lanes[R.int(o, lanes.length)];
            swapTo.push(lanes.find((l) => l !== free));
          }
        }
        blockLanes = lanes.slice();
        items.push({ k: 'block', at: it.at + late(it), lanes, swapTo, swapX: it.swapX === 'cfg' ? Game.config.spawn.swapX : it.swapX || 0 });
      } else if (it.k === 'row') {
        const lane = rowLane;
        for (let i = 0; i < it.n; i++) items.push({ k: 'gem', at: it.at + i * it.step, lane, h: 0, row: true });
      }
    }
    return { id: pat.id, threats: pat.threats, items };
  }

  // ---- 跳び方の放物線（時間は「その物がハムスターの列に着く時刻」の物差し） ----
  // わな（中心が t=0 に着く）を越えられる、跳び始めの時刻の範囲 [lo, hi]
  function safeJump(ranks, cfg, w, cap = 0) {
    const RU = Game.rules, J = RU.jumpOf(ranks, cfg), sp = RU.speedAt(ranks, cfg, cap);
    const X = (w + cfg.hamster.trapBox) / 2 / sp;
    const e = (J.sec - RU.trapClearSec(ranks, cfg)) / 2; // 跳んでから、わなの高さを越えるまで
    return { lo: X + e - J.sec, hi: -X - e, J };
  }
  const arcZ = (J, u) => 4 * J.h * u * (1 - u);

  // 宝を添える（危ないところに置く）。わながあれば、早めか遅めに跳んだ軌道の上に置く（宝をめがけて跳ぶと、わなに落ちやすい）。
  // わなの真上には置かない（影がわなに重なって、どのレーンの宝か分からなくなる）。わなの中心から lootOff ドット以上ずらす
  // reach: ハムスターが行けるレーン
  function addLoot(o, inst, ranks, cfg, reach, cap = 0) {
    const kinds = [{ k: 'seed', weight: 4 }];
    if (ranks.loot >= 1) kinds.push({ k: 'gem', weight: 3 });
    if (ranks.loot >= 2) kinds.push({ k: 'big', weight: 2 });
    if (ranks.loot >= 4) kinds.push({ k: 'statue', weight: 1 });
    const k = R.weighted(o, kinds).k;
    const traps = inst.items.filter((x) => x.k === 'trap' && reach.includes(x.lane));
    let item;
    if (traps.length) {
      const t = R.pick(o, traps);
      const w = t.w || cfg.obj.trap.w, { lo, hi, J } = safeJump(ranks, cfg, w, cap);
      const side = R.next(o) < 0.5 ? -1 : 1;                                         // -1: 手前（早めに跳んだ上り）、1: 奥（遅めに跳んだ下り）
      const j = side < 0 ? lo + (hi - lo) * cfg.spawn.lootEarly : hi - (hi - lo) * cfg.spawn.lootEarly;
      let u = k === 'statue' ? 0.5 : side < 0 ? 0.3 : 0.7;                           // 像は頂上、ほかは上り・下りの途中
      const sp = Game.rules.speedAt(ranks, cfg, cap), minDt = (w / 2 + cfg.spawn.lootOff) / sp;
      if (side * (j + u * J.sec) < minDt) u = Math.max(0.12, Math.min(0.88, (side * minDt - j) / J.sec));
      item = { k, at: t.at + j + u * J.sec, lane: t.lane, h: Math.round(arcZ(J, u)) - (k === 'statue' ? 2 : 0) };
    } else {
      item = { k, at: 0.15, lane: R.pick(o, reach), h: k === 'statue' ? Game.rules.jumpOf(ranks, cfg).h - 2 : 0 };
    }
    inst.items.push(item);
    // 番の わな: 宝の段階に応じて、宝のあとの同じレーンに わなが増える（取らなくても出る）
    if (R.next(o) < cfg.lootGuard[ranks.loot || 0]) inst.items.push({ k: 'trap', at: item.at + cfg.spawn.lootGuardSec, lane: item.lane, guard: true });
  }

  // ひまわりの種の列。型の間を広げない（filler）。わながあれば、越える跳び方の放物線に沿って並べる
  function addSeeds(o, inst, gapSec, reach, ranks, cfg, cap = 0) {
    const traps = inst.items.filter((x) => x.k === 'trap' && reach.includes(x.lane));
    if (traps.length && R.next(o) < cfg.spawn.seedArcChance) {
      const t = R.pick(o, traps);
      const { lo, hi, J } = safeJump(ranks, cfg, t.w || cfg.obj.trap.w, cap);
      const j = (lo + hi) / 2;
      for (const u of [0.15, 0.32, 0.5, 0.68, 0.85]) inst.items.push({ k: 'seed', at: t.at + j + u * J.sec, lane: t.lane, h: Math.round(arcZ(J, u)), filler: true, arc: true });
      return;
    }
    const end = inst.items.reduce((m, x) => Math.max(m, x.at), 0);
    const n = 3 + R.int(o, 3), lane = R.pick(o, reach), from = end + gapSec * 0.35;
    for (let i = 0; i < n; i++) inst.items.push({ k: 'seed', at: from + i * 0.1, lane, h: 0, filler: true });
  }

  // ---- 公平さ（実際のルールを写して、当たらずに抜ける道を探す） ----
  const fairCache = new Map();
  const isThreat = (x) => x.k === 'trap' || x.k === 'rock' || x.k === 'block' || x.k === 'stal';

  function controlsOf(ranks) { return { move: (ranks.move || 0) >= 1, lane: (ranks.lane || 0) >= 1 }; }

  function actionsFor(st, ctl) {
    const a = [null, 'jump'];
    if (ctl.move) a.push('fwd', 'back');
    if (ctl.lane) a.push('far', 'near');
    return a;
  }

  // 始めの位置ひとつについて、深さ優先で道を探す（見つかればすぐ終わる）
  function searchFrom(cfg, ranks, threatInst, col, lane, budget, cap = 0) {
    const RU = Game.rules;
    const s0 = RU.create(cfg, { seed: 1, noSpawn: true, ranks, assist: { speedCap: cap } });
    RU.setCell(s0, col, lane);
    RU.place(s0, threatInst, cfg);
    const t0 = s0.t, D = cfg.fair.decide, ctl = controlsOf(ranks);
    const seen = new Set();
    let nodes = 0;
    const key = (s) => {
      const h = s.h;
      return Math.round(s.t * 60) + ':' + h.col + h.lane + ':' + (h.mv ? h.mv.k + h.mv.to : '-') + ':' + h.jt.toFixed(2) + ':' + (h.queued || '');
    };
    function dfs(s) {
      if (++nodes > budget) return false;
      if (!s.objs.length && !s.rocks.length) return true;
      const acts = s.t - t0 < cfg.spawn.lead + cfg.fair.reaction ? [null] : actionsFor(s, ctl);
      for (const a of acts) {
        const ns = structuredClone(s);
        let dead = false;
        for (let f = 0; f < D; f++) {
          RU.step(ns, f === 0 && a ? [a] : [], cfg);
          if (ns.phase === 'over') { dead = true; break; }
        }
        if (dead) continue;
        const k = key(ns);
        if (seen.has(k)) continue;
        seen.add(k);
        if (dfs(ns)) return true;
      }
      return false;
    }
    return dfs(s0);
  }

  // 型（具体化したもの）が、今の段階で公平か。全部の始めの位置から抜けられること
  function fair(cfg, ranks, inst, cap = 0) {
    const threats = { id: inst.id, items: inst.items.filter(isThreat) };
    if (!threats.items.length) return true;
    const ctl = controlsOf(ranks);
    const k = JSON.stringify([threats.items, Game.rules.speedAt(ranks, cfg, cap), ranks.move || 0, ranks.lane || 0, ranks.greed || 0]);
    if (fairCache.has(k)) return fairCache.get(k);
    const cols = ctl.move ? [0, 1, 2] : [1], lanes = ctl.lane ? [0, 1, 2] : [1];
    let ok = true;
    for (const c of cols) for (const l of lanes) if (ok && !searchFrom(cfg, ranks, threats, c, l, 4000, cap)) ok = false;
    fairCache.set(k, ok);
    return ok;
  }

  const maxThreats = (state, cfg) => Math.min(3, 1 + Math.floor(Game.levelup.taken(state) / cfg.spawn.maxThreatsEvery));

  // 次の型を選んで具体化する。state.intro にあれば、それを単独で先に出す
  function choose(state, cfg) {
    const ranks = state.ranks, open = (ranks.lane || 0) >= 1;
    const here = { col: state.h.col, lane: state.h.lane, open }, reach = open ? [0, 1, 2] : [state.h.lane];
    const cap = maxThreats(state, cfg), sc = (state.assist && state.assist.speedCap) || 0, rg = (state.assist && state.assist.rockGap) || 0, lk = (state.assist && state.assist.luck) || 0;
    let pool = LIST.filter((p) => meets(p.requires, ranks) && p.threats <= cap);
    let intro = false;
    while (state.intro.length) {
      const p = byId[state.intro.shift()];
      if (p && !p.noIntro && meets(p.requires, ranks)) { pool = [p]; intro = true; break; }
    }
    for (let tries = 0; tries < 12; tries++) {
      const pat = R.weighted(state, pool);
      const inst = resolve(state, pat, here, ranks, sc, rg);
      if (!fair(cfg, ranks, inst, sc)) { if (!intro) continue; pool = LIST.filter((p) => meets(p.requires, ranks) && p.threats <= cap); intro = false; continue; }
      if (pat.threats > 0 && R.next(state) < cfg.spawn.lootChance) {
        addLoot(state, inst, ranks, cfg, reach, sc);
        // 番の わなで抜けられなくなったら、番を外す
        if (inst.items.some((x) => x.guard) && !fair(cfg, ranks, inst, sc)) inst.items = inst.items.filter((x) => !x.guard);
      }
      const gap = cfg.spawn.gapSec[ranks.trap || 0];
      if (!intro && R.next(state) < cfg.spawn.seedRunChance) addSeeds(state, inst, gap, reach, ranks, cfg, sc);
      inst.gap = Math.max(gap, cfg.spawn.minGapSec) + (intro ? 0.6 : 0);
      // いしの すきま: 石の入った型は、全部を rg 秒あとにずらし（前の型との すきま）、型の間にも rg 秒足す（次の型との すきま）
      if (rg > 0 && inst.items.some((x) => x.k === 'rock')) { for (const x of inst.items) x.at += rg; inst.gap += rg; }
      // こううん: 当たると、この 1 回の出現の物（障害と添えた宝。わなを越える弧の種も）が丸ごと来ない。型の間の種の列は残す。
      // 引くのはランの乱数とは別の列（state.luckR）。紹介の型では引かない。消えた物は inst.lucky（画面の演出だけに使う）
      if (lk > 0 && !intro && state.luckR && R.next(state.luckR) < lk) {
        inst.lucky = inst.items.filter((x) => !x.filler || x.arc);
        inst.items = inst.items.filter((x) => x.filler && !x.arc);
      }
      return inst;
    }
    return resolve(state, byId.trap1, here, ranks, sc);
  }

  // 新しく取った段階で出せるようになった型（紹介用）
  function introducedBy(id, rank) {
    return LIST.filter((p) => p.requires[id] === rank).map((p) => p.id);
  }

  Game.patterns = { LIST, SHAPES, shapesFor, meets, resolve, fair, choose, introducedBy, maxThreats, fairCache, addLoot, addSeeds, safeJump };
})();

<script>
// 3択のレベルアップ。各強化の「次の段階」から、種類の違うものを最大3つ選ぶ
(function () {
  const Game = (window.Game = window.Game || {});
  const R = Game.rng;

  function initRanks(cfg, pretaken) {
    const ranks = {};
    for (const u of cfg.upgrades) ranks[u.id] = 0;
    for (const id of pretaken || []) if (id in ranks) ranks[id] = Math.max(ranks[id], 1);
    return ranks;
  }

  // 次の段階が残っていて、その段階の条件（needs）を満たす強化の id
  function available(state, cfg) {
    const ok = (u) => {
      const need = u.needs && u.needs[state.ranks[u.id] + 1];
      return !need || Object.keys(need).every((k) => (state.ranks[k] || 0) >= need[k]);
    };
    return cfg.upgrades.filter((u) => state.ranks[u.id] < u.max && ok(u)).map((u) => u.id);
  }

  // 均等に、重ならないように最大3つ。
  // 追いつき型（assist.lootBoost = p）: おたからを出せるとき、確率 p で先に1枠入れる。p = 0 のときは乱数を引かない（今のシードの並びを変えない）
  function offer(state, cfg) {
    const pool = available(state, cfg);
    const out = [];
    const p = (state.assist && state.assist.lootBoost) || 0, li = pool.indexOf('loot');
    const forced = p > 0 && li >= 0 && R.next(state) < p;
    if (forced) pool.splice(li, 1);
    while (out.length < (forced ? 2 : 3) && pool.length) out.push(pool.splice(R.int(state, pool.length), 1)[0]);
    if (forced) out.splice(R.int(state, out.length + 1), 0, 'loot'); // 置く位置も散らす（いつも左だと目立つ）
    return out;
  }

  // 選んだ段階を適用し、新しい段階を返す
  function apply(state, id, cfg) {
    const u = cfg.upgrades.find((x) => x.id === id);
    if (!u || state.ranks[id] >= u.max) throw new Error('取れない段階: ' + id);
    return ++state.ranks[id];
  }

  const taken = (state) => Object.values(state.ranks).reduce((a, b) => a + b, 0);

  // カードの文字
  function card(cfg, id, rank) {
    const u = cfg.upgrades.find((x) => x.id === id);
    return { id, name: u.name, rank, desc: Array.isArray(u.desc) ? u.desc[rank] : u.desc };
  }

  Game.levelup = { initRanks, available, offer, apply, taken, card };
})();

<script>
// ランのルール。状態はただのデータ（structuredClone で写せる）。step は 1/60 秒進めて出来事の一覧を返す。
// 描画・音・DOM には触らない
(function () {
  const Game = (window.Game = window.Game || {});
  const RNG = Game.rng, LV = Game.levelup;

  // 速さ: 段階の速さに、おちついて（assist.speedCap、0 は上限なし）の上限をかける
  const capSpeed = (sp, cap) => (cap > 0 ? Math.min(sp, cap) : sp);
  // 走る速さの段階: 取った はやさ と、さいしょの はやさ（ranks.speedMin）の大きいほう
  const speedRank = (ranks) => Math.max(ranks.speed || 0, ranks.speedMin || 0);
  const speedAt = (ranks, cfg, cap) => capSpeed(cfg.speed[speedRank(ranks)], cap || 0);
  const speedOf = (s, cfg) => capSpeed(cfg.speed[speedRank(s.ranks)], s.assist.speedCap);
  const travel = (s, cfg, x) => (cfg.view.w - x) / speedOf(s, cfg); // 右端から x まで流れる時間
  // ジャンプの高さと空中の時間（よくばりでほっぺが重くなる）
  const jumpOf = (ranks, cfg) => { const j = (cfg.greedJump || [])[ranks.greed || 0]; return j ? { h: j.h, sec: j.sec } : { h: cfg.hamster.jumpH, sec: cfg.hamster.jumpSec }; };
  // わなの高さより上にいられる時間（秒）
  const trapClearSec = (ranks, cfg) => { const j = jumpOf(ranks, cfg); return j.sec * Math.sqrt(Math.max(0, 1 - cfg.obj.trap.h / j.h)); };
  // ながい わなの幅: 跳んで越えられる最大の長さ × longFrac（助けの jumpGrace は含めない）
  // cap: おちついての上限（遅いと跳んで越えられる長さも短い）
  const longTrapW = (ranks, cfg, cap) => Math.max(cfg.obj.trap.w, Math.floor((speedAt(ranks, cfg, cap) * trapClearSec(ranks, cfg) - cfg.hamster.trapBox) * cfg.obj.trap.longFrac));
  const TREASURE = { seed: 1, gem: 1, big: 1, statue: 1 }; // じしゃくが効く宝（③のこハムスターなどは含めない）
  const isThreat = (k) => k === 'trap' || k === 'block' || k === 'stal';
  const objW = (o, cfg) => o.w || (o.k === 'trap' ? cfg.obj.trap.w : o.k === 'block' ? cfg.obj.block.w : o.k === 'stal' ? cfg.obj.stal.w : cfg.obj.item.w);

  // runOptions: { seed, lives, pretaken, speedStart（さいしょの はやさ）, assist, noSpawn, ranks, rare（③: 'pup' | 'mimic' | 'fly' | { kind, floor } で必ず起こす。null で起こさない）, rareFloor }
  // assist（②の恒久強化の助け）: { warnPlus: 落石の影を何秒早く出すか, swapPlus: とおせんぼが何ドット早く入れ替わるか, preview: 窓に入る何秒前から右端に予告を出すか, jumpGrace: わなに対する当たり判定を何ドット小さくするか, xpMul: 経験値の係数（いせきの ちず）, rockMark: 落石の落ちる場所に ⊗ の印を出す,
  //   speedCap: 走る速さの上限（おちついて。0 は上限なし）, magnet: じしゃくの段階, lootBoost: 追いつきの p（3択におたからを入れる確率）,
  //   rockGap: いしの すきま（石と地面の物の ずれに足す秒。石の型の前後の すきま）, luck: こううん（型が丸ごと来ない確率） }
  function create(cfg, opt = {}) {
    const L = cfg.layout;
    const s = {
      rng: RNG.seedFrom(opt.seed == null ? 1 : opt.seed),
      seed: opt.seed == null ? 1 : opt.seed,
      t: 0, dist: 0, phase: 'run',
      floor: 1, level: 0,
      ranks: opt.ranks ? Object.assign({}, opt.ranks) : LV.initRanks(cfg, opt.pretaken),
      lives: opt.lives || 0, invuln: 0,
      score: 0, distFrac: 0, xp: 0, xpNeed: cfg.xpBase, timeBonus: 0,
      offer: null,
      h: { col: L.startCol, lane: L.startLane, x: L.colX[L.startCol], lp: L.startLane, mv: null, queued: null, z: 0, jt: -1, jbuf: 0 },
      objs: [], rocks: [],
      nextId: 1, nextSpawnT: 0.6, intro: [],
      floorAt: 0,        // 今の階に着いた時刻（③レアイベントを始めるまでの猶予）
      rows: {},
      noSpawn: !!opt.noSpawn,
      assist: Object.assign({ warnPlus: 0, swapPlus: 0, preview: 0, jumpGrace: 0, xpMul: 1, rockMark: false, speedCap: 0, magnet: 0, lootBoost: 0, rockGap: 0, luck: 0 }, opt.assist || {}),
      loot: 0,           // 拾った宝の値打ちの合計（持ち帰る通貨。meta.value）
      seedRun: 0, seedT: -9,
      rare: null,        // ③ランダムイベント（rare.js）: 今の予定
      luckR: { rng: (RNG.seedFrom(opt.seed == null ? 1 : opt.seed) ^ 0x6c75636b) | 0 }, // こううんの抽選の乱数（ランの乱数とは別の列）
      ghosts: [],        // こううんで来なかった物（画面の演出の時刻を出すだけ。当たり判定も点もない）: { k, lanes, wx, w } / { k: 'rock', col, lanes, tWarn }
      rareNext: [],      // あとの予定の並び（色の順）
      cleared: false,    // ④宝を手に入れたか（クリアの印）。エクストラで死んでも残る
      clearAt: null,     // クリアした時刻（s.t はエクストラの間も進むので）
      extra: null,       // ④脱出エクストラ: { on: 走っている間, n: 登る回数, left: 残りの登る回数, escaped, bonus }。入っていなければ null
    };
    if (opt.speedStart > 0) s.ranks.speedMin = opt.speedStart; // さいしょの はやさ（取った はやさ とは別に、速さの段階の下限）
    if (Game.rare) { const plans = Game.rare.fromOptions(opt, s.seed, cfg); s.rare = plans.shift() || null; s.rareNext = plans; }
    return s;
  }

  function setCell(s, col, lane, cfg = Game.config) {
    const h = s.h;
    h.col = col; h.lane = lane; h.x = cfg.layout.colX[col]; h.lp = lane; h.mv = null; h.queued = null;
  }

  // 型（具体化したもの）を置く。物は窓に入る spawn.lead 秒前に、窓の外で作る（予告の助けが先に見せられるように）
  function place(s, inst, cfg = Game.config) {
    const sp = speedOf(s, cfg), W = cfg.view.w, L = cfg.layout, lead = cfg.spawn.lead;
    const rowId = inst.items.some((x) => x.row) ? 'r' + s.nextId : null;
    for (const it of inst.items) {
      const id = s.nextId++;
      if (it.k === 'rock') {
        const tImpact = s.t + lead + it.at + travel(s, cfg, L.colX[it.col]);
        const warn = cfg.rockWarn[s.ranks.move] + s.assist.warnPlus;
        s.rocks.push({ id, col: it.col, lanes: it.lanes.slice(), tWarn: Math.max(s.t, tImpact - warn), tImpact });
      } else {
        const o = { id, k: it.k, wx: s.dist + W + (lead + it.at) * sp, lane: it.lane, minSep: 99, hit: false };
        if (it.k === 'block') { o.lanes = it.lanes.slice(); o.swapTo = it.swapTo ? it.swapTo.slice() : null; o.swapX = it.swapX ? it.swapX + s.assist.swapPlus : 0; delete o.lane; }
        if (it.h != null) o.h = it.h;
        if (it.w) o.w = it.w;
        if (it.row) { o.row = rowId; s.rows[rowId] = s.rows[rowId] || { n: 0, got: 0, miss: false }; s.rows[rowId].n++; }
        s.objs.push(o);
      }
    }
    // こううんで来なかった障害: 演出の時刻だけを出す（物は作らない）
    for (const it of inst.lucky || []) {
      if (it.k === 'rock') {
        const tImpact = s.t + lead + it.at + travel(s, cfg, L.colX[it.col]);
        s.ghosts.push({ k: 'rock', col: it.col, lanes: it.lanes.slice(), tWarn: Math.max(s.t, tImpact - cfg.rockWarn[s.ranks.move] - s.assist.warnPlus) });
      } else if (it.k === 'trap' || it.k === 'stal' || it.k === 'block') {
        s.ghosts.push({ k: it.k, lanes: it.lanes ? it.lanes.slice() : [it.lane], wx: s.dist + W + (lead + it.at) * sp, w: it.w || 0 });
      }
    }
  }

  // こううんで来なかった物が消える時: 地面の物は窓に入る時（さきみがあれば、予告に一瞬出たあと）、石は影が出るはずだった時。出来事 luck を出すだけ
  function updateGhosts(s, cfg, ev) {
    if (!s.ghosts.length) return;
    const W = cfg.view.w, pv = s.assist.preview, show = Math.min(cfg.luck.showMax, pv / 2), vx = W + Math.max(0, pv - show) * speedOf(s, cfg);
    s.ghosts = s.ghosts.filter((g) => {
      if (g.k === 'rock') {
        if (s.t < g.tWarn) return true;
        ev.push({ type: 'luck', t: s.t, k: 'rock', col: g.col, lanes: g.lanes, x: cfg.layout.colX[g.col] });
        return false;
      }
      const sx = g.wx - s.dist, half = (g.w || cfg.obj.trap.w) / 2;
      if (sx - half > vx) return true;
      ev.push({ type: 'luck', t: s.t, k: g.k, lanes: g.lanes, x: Math.min(W, sx), pv: pv > 0 });
      return false;
    });
  }

  const threatPts = (s, cfg, rank, near) => Math.round(cfg.score.threatBase * (1 + cfg.score.threatStep * rank)) * (near ? cfg.score.nearMul : 1);

  function addScore(s, cfg, pts, ev) {
    if (!pts) return;
    s.score += pts;
    s.xp += pts * cfg.xpMul[s.ranks.greed] * s.assist.xpMul;
  }

  // ---- ハムスターの動き ----
  function command(s, c, cfg) {
    const h = s.h;
    if (c === 'jump') {
      if (h.jt < 0) { h.jt = 0; return [{ type: 'jump', t: s.t, x: h.x, lane: h.lane }]; }
      h.jbuf = cfg.hamster.jumpBuffer;
      return [];
    }
    const isCol = c === 'fwd' || c === 'back';
    if (isCol && s.ranks.move < 1) return [];
    if (!isCol && (c === 'far' || c === 'near') && s.ranks.lane < 1) return [];
    if (h.mv) { h.queued = c; return []; }
    return startMove(s, c, cfg);
  }

  function startMove(s, c, cfg) {
    const h = s.h, L = cfg.layout;
    if (c === 'fwd' || c === 'back') {
      const to = h.col + (c === 'fwd' ? 1 : -1);
      if (to < 0 || to > 2) return [];
      h.mv = { k: 'col', from: h.x, to, t: 0 };
      h.col = to;
    } else {
      const to = h.lane + (c === 'far' ? -1 : 1);
      if (to < 0 || to > 2) return [];
      h.mv = { k: 'lane', from: h.lp, to, t: 0 };
      h.lane = to;
    }
    return [{ type: 'move', t: s.t, dir: c, x: h.x, lane: h.lane }];
  }

  function moveHamster(s, cfg, dt, ev) {
    const h = s.h, H = cfg.hamster, L = cfg.layout;
    if (h.mv) {
      h.mv.t += dt;
      const k = Math.min(1, h.mv.t / H.moveSec);
      if (h.mv.k === 'col') h.x = h.mv.from + (L.colX[h.mv.to] - h.mv.from) * k;
      else h.lp = h.mv.from + (h.mv.to - h.mv.from) * k;
      if (k >= 1) {
        h.mv = null;
        if (h.queued) { const q = h.queued; h.queued = null; ev.push(...startMove(s, q, cfg)); }
      }
    }
    if (h.jbuf > 0) h.jbuf = Math.max(0, h.jbuf - dt);
    if (h.jt >= 0) {
      h.jt += dt;
      const J = jumpOf(s.ranks, cfg), T = J.sec;
      if (h.jt >= T) {
        h.jt = -1; h.z = 0;
        ev.push({ type: 'land', t: s.t, x: h.x, lane: h.lane });
        if (h.jbuf > 0) { h.jbuf = 0; h.jt = 0; ev.push({ type: 'jump', t: s.t, x: h.x, lane: h.lane }); }
      } else {
        const u = h.jt / T;
        h.z = 4 * J.h * u * (1 - u);
      }
    }
  }

  // ---- 当たり ----
  // 物との隙間（負なら当たり）。x の隙間、レーンの隙間、高さの隙間のうち最大
  function sepGround(s, cfg, o, sx) {
    const h = s.h, half = (o.k === 'trap' ? cfg.hamster.trapBox - s.assist.jumpGrace : cfg.hamster.box) / 2;
    const w = objW(o, cfg);
    const xg = Math.abs(sx - h.x) - (half + w / 2);
    const lanes = o.lanes || [o.lane];
    let lg = 99;
    for (const l of lanes) lg = Math.min(lg, (Math.abs(h.lp - l) - 0.5) * 16);
    let zg = -1;
    if (o.k === 'trap') zg = h.z - cfg.obj.trap.h;
    else if (o.k === 'block') zg = h.z - cfg.obj.block.h;
    else if (o.k === 'stal') zg = cfg.obj.stal.bottom - (h.z + cfg.hamster.box); // 頭の上の隙間
    return Math.max(xg, lg, zg);
  }

  function hit(s, cfg, ev, what) {
    if (s.invuln > 0) return;
    const h = s.h;
    if (s.lives > 0) {
      s.lives--;
      s.invuln = cfg.lifeInvuln;
      s.objs = []; s.rocks = []; s.ghosts = [];
      if (Game.rare) Game.rare.cancel(s, ev);
      s.nextSpawnT = s.t + Math.max(0, cfg.lifeGrace - cfg.spawn.lead);
      ev.push({ type: 'hit', t: s.t, what, x: h.x, lane: h.lane, fatal: false }, { type: 'life_used', t: s.t, x: h.x, lane: h.lane, lives: s.lives });
    } else {
      s.phase = 'over';
      ev.push({ type: 'hit', t: s.t, what, x: h.x, lane: h.lane, fatal: true }, { type: 'game_over', t: s.t, score: s.score, floor: s.floor });
    }
  }

  function updateObjs(s, cfg, ev) {
    const h = s.h, half = cfg.hamster.box / 2;
    const laneEff = Math.round(h.lp);
    for (let i = 0; i < s.objs.length && s.phase === 'run'; i++) {
      const o = s.objs[i];
      const sx = o.wx - s.dist;
      if (o.k === 'block' && o.swapTo && sx <= o.swapX) {
        o.lanes = o.swapTo; o.swapTo = null;
        ev.push({ type: 'block_swap', t: s.t, x: sx, lanes: o.lanes.slice(), id: o.id });
      }
      if (o.done) continue;
      if (isThreat(o.k)) {
        if (sx < h.x + 40 && sx > h.x - 40) {
          const sep = sepGround(s, cfg, o, sx);
          if (sep < o.minSep) o.minSep = sep;
          if (sep < 0 && s.invuln <= 0) { o.done = true; hit(s, cfg, ev, o.k); continue; }
        }
        const w = objW(o, cfg);
        if (sx + w / 2 < h.x - half) {
          o.done = true;
          if (s.invuln > 0) continue;
          const near = o.minSep >= 0 && o.minSep <= cfg.score.nearGap;
          if ((o.k === 'trap' || o.k === 'stal') && o.lane === laneEff) {
            const pts = threatPts(s, cfg, s.ranks.trap, near);
            addScore(s, cfg, pts);
            ev.push({ type: 'pass_trap', t: s.t, x: h.x, lane: laneEff, points: pts, near, what: o.k, long: !!o.w });
            if (near) ev.push({ type: 'near_miss', t: s.t, x: h.x, lane: laneEff, what: o.k });
          } else if (o.k === 'block') {
            const pts = threatPts(s, cfg, s.ranks.lane, near);
            addScore(s, cfg, pts);
            ev.push({ type: 'pass_block', t: s.t, x: h.x, lane: laneEff, points: pts, near });
            if (near) ev.push({ type: 'near_miss', t: s.t, x: h.x, lane: laneEff, what: 'block' });
          }
        }
      } else {
        // 拾い物。じしゃく（assist.magnet）: 1 以上で x の幅と高さが広がる、2 で隣のレーンの宝も拾う（斜めの列はない。宝はどの列も通る）
        const mg = TREASURE[o.k] ? s.assist.magnet : 0, IM = cfg.obj.item.magnet;
        const mw = mg >= 1 ? IM.w : 0, mr = mg >= 1 ? IM.reach : 0;
        const dl = Math.abs(o.lane - laneEff), pulled = mg >= 2 && dl === 1;
        if ((dl === 0 || pulled) && Math.abs(sx - h.x) < half + cfg.obj.item.w / 2 + mw && Math.abs(h.z - (o.h || 0)) <= cfg.obj.item.reach + mr) {
          o.done = true; o.got = true;
          const pts = cfg.score.item[o.k] || 0; // こハムスター（③）は 0
          s.loot += (cfg.meta && cfg.meta.value[o.k]) || 0;
          addScore(s, cfg, pts);
          s.seedRun = o.k === 'seed' && s.t - s.seedT < cfg.audio.seedResetSec ? s.seedRun + 1 : (o.k === 'seed' ? 1 : s.seedRun);
          if (o.k === 'seed') s.seedT = s.t;
          ev.push({ type: 'pickup', t: s.t, k: o.k, x: sx, lane: o.lane, h: o.h || 0, points: pts, run: s.seedRun, pulled: dl === 1 });
          if (o.row) {
            const r = s.rows[o.row]; r.got++;
            if (r.got === r.n && !r.miss) { addScore(s, cfg, cfg.score.rowBonus); ev.push({ type: 'row_bonus', t: s.t, x: h.x, lane: laneEff, points: cfg.score.rowBonus }); }
          }
        } else if (sx < h.x - half - 8 - mw) {
          o.done = true;
          if (o.row) s.rows[o.row].miss = true;
        }
      }
    }
    s.objs = s.objs.filter((o) => !(o.done && o.wx - s.dist < -24));
  }

  function updateRocks(s, cfg, ev) {
    const h = s.h, L = cfg.layout;
    for (let i = 0; i < s.rocks.length && s.phase === 'run'; i++) {
      const r = s.rocks[i];
      if (s.t < r.tImpact) continue;
      r.done = true;
      const xg = Math.abs(L.colX[r.col] - h.x) - (cfg.hamster.box + cfg.obj.rock.w) / 2;
      let lg = 99;
      for (const l of r.lanes) lg = Math.min(lg, (Math.abs(h.lp - l) - 0.5) * 16);
      const sep = Math.max(xg, lg);
      ev.push({ type: 'rock_land', t: s.t, col: r.col, lanes: r.lanes.slice(), x: L.colX[r.col] });
      if (sep < 0) { if (s.invuln <= 0) hit(s, cfg, ev, 'rock'); continue; }
      if (s.invuln > 0) continue;
      const near = sep <= cfg.score.nearGap;
      const pts = threatPts(s, cfg, s.ranks.move, near);
      addScore(s, cfg, pts);
      ev.push({ type: 'dodge_rock', t: s.t, x: h.x, lane: Math.round(h.lp), points: pts, near });
      if (near) ev.push({ type: 'near_miss', t: s.t, x: h.x, lane: Math.round(h.lp), what: 'rock' });
    }
    s.rocks = s.rocks.filter((r) => !r.done);
  }

  // ---- レベルアップ ----
  // 物を消し、ハムスターを地面のマスに戻す（床が抜ける・よじ登る前）
  function settle(s, cfg, ev) {
    s.objs = []; s.rocks = []; s.ghosts = [];
    if (Game.rare) Game.rare.cancel(s, ev);
    const h = s.h;
    h.z = 0; h.jt = -1; h.jbuf = 0; h.queued = null;
    if (h.mv) { if (h.mv.k === 'col') h.x = cfg.layout.colX[h.mv.to]; else h.lp = h.mv.to; h.mv = null; }
  }

  function checkLevel(s, cfg, ev) {
    if (s.phase !== 'run' || s.xp < s.xpNeed) return;
    s.level++;
    if (s.extra && s.extra.on) return climb(s, cfg, ev);
    s.xpNeed += cfg.xpBase * Math.pow(cfg.xpGrowth, s.level);
    settle(s, cfg, ev);
    if (s.level >= cfg.clearLevel) {
      s.phase = 'clear';
      s.cleared = true; s.clearAt = s.t;
      // 早く着くほど加点（経験値にはしない）
      s.timeBonus = Math.max(0, Math.round((cfg.score.timeRefSec - s.t) * cfg.score.timePerSec));
      s.score += s.timeBonus;
      ev.push({ type: 'levelup_start', t: s.t, level: s.level, floor: s.floor, final: true }, { type: 'clear', t: s.t, score: s.score, bonus: s.timeBonus, floor: s.floor + 1 });
      s.floor++;
      return;
    }
    s.phase = 'choose';
    s.offer = LV.offer(s, cfg);
    ev.push({ type: 'levelup_start', t: s.t, level: s.level, floor: s.floor, offer: s.offer.slice() });
  }

  // ---- ④脱出エクストラ ----
  // ランの中の強化の、残りの段階の合計
  const ranksLeft = (s, cfg) => cfg.upgrades.reduce((n, u) => n + u.max - (s.ranks[u.id] || 0), 0);

  // 宝の間のあとで呼ぶ。入れないとき（前後かレーンが段階 0）は何もしない
  function startExtra(s, cfg = Game.config) {
    if (s.phase !== 'clear' || s.extra || !Game.meta.canEnterExtra(s.ranks)) return [];
    const n = ranksLeft(s, cfg) + 1;
    s.extra = { on: true, n, left: n, escaped: false, bonus: 0 };
    s.phase = 'run';
    s.objs = []; s.rocks = []; s.ghosts = [];
    s.nextSpawnT = s.t + Math.max(0, cfg.landGrace - cfg.spawn.lead);
    s.xp = 0; s.xpNeed = cfg.extra.xpPer;
    return [{ type: 'extra_start', t: s.t, left: n, x: s.h.x, lane: s.h.lane }];
  }

  // 経験値がたまった: 段階が残っていれば3択（よじ登る）、なければ脱出成功
  function climb(s, cfg, ev) {
    const E = s.extra;
    s.xpNeed += cfg.extra.xpPer;
    settle(s, cfg, ev);
    E.left--;
    if (LV.available(s, cfg).length) {
      s.phase = 'choose';
      s.offer = LV.offer(s, cfg);
      ev.push({ type: 'levelup_start', t: s.t, level: s.level, floor: s.floor, offer: s.offer.slice(), extra: true });
      return;
    }
    s.phase = 'escaped';
    E.on = false; E.escaped = true; E.bonus = cfg.extra.bonus;
    s.score += E.bonus;
    ev.push({ type: 'escape', t: s.t, score: s.score, bonus: E.bonus });
  }

  // 3択の i 番目を選ぶ
  function pick(s, i, cfg = Game.config) {
    if (s.phase !== 'choose' || !s.offer || !s.offer[i]) return [];
    const id = s.offer[i];
    const rank = LV.apply(s, id, cfg);
    const extra = !!(s.extra && s.extra.on);
    s.offer = null;
    s.floor += extra ? -1 : 1; // エクストラでは上の階へ登る
    s.floorAt = s.t;
    s.phase = 'run';
    s.nextSpawnT = s.t + Math.max(0, cfg.landGrace - cfg.spawn.lead); // 物は lead 秒前に作るので、そのぶん早めに
    s.intro.push(...Game.patterns.introducedBy(id, rank));
    const ev = [{ type: 'levelup_pick', t: s.t, id, rank }];
    if (ranksLeft(s, cfg) === 0) ev.push({ type: 'all_max', t: s.t });
    ev.push({ type: 'levelup_land', t: s.t, floor: s.floor, x: s.h.x, lane: s.h.lane, extra });
    return ev;
  }

  // ---- 1刻み ----
  function step(s, cmds, cfg = Game.config) {
    const ev = [];
    if (s.phase !== 'run') return ev;
    const dt = cfg.dt;
    for (const c of cmds || []) ev.push(...command(s, c, cfg));
    s.t += dt;
    if (s.invuln > 0) s.invuln = Math.max(0, s.invuln - dt);
    const sp = speedOf(s, cfg);
    s.dist += sp * dt;
    s.distFrac += (cfg.speed[speedRank(s.ranks)] * dt) / cfg.score.distPer; // 距離の点は上限の前の速さで数える（おちついてでもレベルアップのテンポは変えない）
    if (s.distFrac >= 1) { const p = Math.floor(s.distFrac); s.distFrac -= p; addScore(s, cfg, p); }
    moveHamster(s, cfg, dt, ev);
    if (!s.noSpawn && s.t >= s.nextSpawnT) {
      const inst = Game.patterns.choose(s, cfg);
      place(s, inst, cfg);
      const end = inst.items.concat(inst.lucky || []).reduce((m, x) => (x.filler ? m : Math.max(m, x.at)), 0); // 種の列は型の間を広げない。こううんで来なかった物の分の間は残す
      s.nextSpawnT = s.t + end + inst.gap;
      ev.push({ type: 'spawn', t: s.t, id: inst.id });
    }
    updateObjs(s, cfg, ev);
    if (s.phase === 'run') updateRocks(s, cfg, ev);
    if (s.phase === 'run') updateGhosts(s, cfg, ev);
    if (s.rare && Game.rare) Game.rare.update(s, cfg, ev);
    checkLevel(s, cfg, ev);
    return ev;
  }

  Game.rules = { create, setCell, place, step, pick, startExtra, ranksLeft, speedOf, speedAt, travel, jumpOf, trapClearSec, longTrapW, speedRank };
})();
</script>
<script>
// ボット: 見えている物だけを使い、反応の遅れのあとで、1手だけ先を読んで入力を選ぶ。
// 2手以上の先読みはしない（人がうまくなる伸びしろ）
(function () {
  const Game = (window.Game = window.Game || {});
  const RNG = Game.rng;
  const ITEM = { seed: 1, gem: 1, big: 1, statue: 1 };

  // opt: { reaction（秒）, rockJudge（秒。落石だけ、知るまでにさらに足す。⊗ の印があれば 0）, jitter（秒）, greed（0〜1。宝に釣られる割合）, strategy: 'random' | 'speed-first' | 'loot-first', seed }
  function create(cfg, opt = {}) {
    return {
      reaction: opt.reaction == null ? cfg.bot.near : opt.reaction,
      rockJudge: opt.rockJudge || 0,
      jitter: opt.jitter || 0,  // ジャンプを打つ時刻のぶれ（± 秒）。ボットが正確すぎないように
      greed: opt.greed || 0,    // あなたボット: 見えた宝ごとに、この割合で「釣られる」（危なくても取りに行く）
      lure: {},                 // id → 釣られたか
      strategy: opt.strategy || 'random',
      rng: RNG.seedFrom('bot' + (opt.seed == null ? 1 : opt.seed)),
      seen: {},          // id → 初めて見えた時刻
      pending: null,     // { cmd, at } 指を離すまで待っているジャンプ
      jit: null,         // 今の予約のぶれ（秒）
      path: [],          // 目的のマスまで、残りの移動
      frame: 0,
    };
  }

  function visible(s, cfg, o) {
    if (o.tWarn != null) return s.t >= o.tWarn;
    return o.wx - s.dist <= cfg.view.w + 8 + s.assist.preview * Game.rules.speedOf(s, cfg);
  }

  // 知っている物（見えてから reaction 秒たった物）だけにした写し。
  // 落石は、当たるかどうかの判断にさらに rockJudge 秒かかる（設計書② 6.3）。⊗ の印があれば見てすぐ分かる
  function knownCopy(b, s, cfg) {
    const c = structuredClone(s);
    const ok = (lag) => (o) => b.seen[o.id] != null && s.t - b.seen[o.id] >= lag;
    c.objs = c.objs.filter(ok(b.reaction));
    c.rocks = c.rocks.filter(ok(b.reaction + (s.assist.rockMark ? 0 : b.rockJudge)));
    c.noSpawn = true;
    c.lives = 0;
    c.rare = null; // ③ランダムイベントは気にしない（死なないので）
    return c;
  }

  // 写しを horizon 秒進める。手は { jump } か { path: [移動の命令…] }（目的のマスへ続けて動く＝1手）
  function rollout(c, cfg, hand, pending, frames) {
    const R = Game.rules;
    const lag = Math.round(cfg.bot.releaseLag / cfg.dt);
    const pend = pending ? { cmd: pending.cmd, f: Math.max(0, Math.round((pending.at - c.t) / cfg.dt)) } : null;
    const path = hand && hand.path ? hand.path.slice() : [];
    const s0 = c.score;
    // 手が終わって（着地して・移動し終えて）から afterSec までを見る。その先の物は次の手で対処する
    const after = Math.round(cfg.bot.afterSec / cfg.dt), jumpF = Math.round(Game.rules.jumpOf(c.ranks, cfg).sec / cfg.dt);
    let end = 0;
    if (hand && hand.jump) end = Math.max(end, lag + (hand.delayF || 0) + jumpF);
    if (pend) end = Math.max(end, pend.f + jumpF);
    if (path.length) end = Math.max(end, Math.ceil(path.length * cfg.hamster.moveSec / cfg.dt) + 1);
    if (end) frames = Math.min(frames, end + after);
    for (let f = 0; f < frames; f++) {
      const cmds = [];
      if (pend && pend.f === f) cmds.push(pend.cmd);
      if (hand && hand.jump && f === lag + (hand.delayF || 0)) cmds.push('jump');
      if (path.length && !c.h.mv) cmds.push(path.shift());
      R.step(c, cmds, cfg);
      if (c.phase === 'over') return { alive: false, until: f, gain: c.score - s0 };
      if (c.phase !== 'run') break;
      if ((f & 7) === 7 && !path.length && !c.h.mv && clearAhead(c, cfg)) break;
    }
    return { alive: true, until: frames, gain: c.score - s0 };
  }

  // 前に気にする物が残っていない（落石なし、地面の物はすべて済んだ）
  function clearAhead(c, cfg) {
    if (c.rocks.length) return false;
    for (const o of c.objs) if (!o.done) return false;
    return true;
  }

  // 1手の候補: ジャンプ、今いないマスへの移動（レーンを先に、列をあとに）、移動しながらのジャンプ
  function candidates(s) {
    const out = [{ jump: true }];
    const h = s.h;
    const cols = s.ranks.move >= 1 ? [0, 1, 2] : [h.col];
    const lanes = s.ranks.lane >= 1 ? [0, 1, 2] : [h.lane];
    for (const c of cols) for (const l of lanes) {
      if (c === h.col && l === h.lane) continue;
      const path = [];
      for (let k = h.lane; k !== l; k += l > h.lane ? 1 : -1) path.push(l > h.lane ? 'near' : 'far');
      for (let k = h.col; k !== c; k += c > h.col ? 1 : -1) path.push(c > h.col ? 'fwd' : 'back');
      out.push({ path });
    }
    return out;
  }

  // 1手を評価する。ジャンプを含む手は、跳ぶ時刻を少しずつずらして試し、生き残れる時間帯の幅を測る。
  // 幅のうち、両端からぶれの分だけ内側で、点がいちばん多い時刻（同じなら真ん中）を選ぶ。
  // 幅がぶれより狭い手は robust でない（つらら石の直前のような、一瞬しか成り立たないジャンプ）
  function evalHand(b, base, cfg, hand, frames, follow = true) {
    if (!hand.jump) {
      const c = structuredClone(base), r = rollout(c, cfg, hand, null, frames);
      r.robust = r.alive && (!follow || followUp(b, c, cfg));
      return { r, delayF: 0 };
    }
    const step = cfg.bot.scanStep, maxK = Math.round(cfg.bot.scanSec / cfg.dt);
    const rs = [];
    for (let k = 0; k <= maxK; k += step) rs.push({ k, r: rollout(structuredClone(base), cfg, Object.assign({}, hand, { delayF: k }), null, frames) });
    let run = null, cur = [];
    const flush = () => { if (cur.length && (!run || cur.length > run.length)) run = cur; cur = []; };
    for (const x of rs) { if (x.r.alive) cur.push(x); else flush(); }
    flush();
    if (!run) { const x = rs.reduce((a, y) => (y.r.until > a.r.until ? y : a)); x.r.robust = false; return { r: x.r, delayF: x.k }; }
    const jf = Math.ceil(b.jitter / cfg.dt / step);
    const m = Math.min(jf, Math.floor((run.length - 1) / 2));
    const inner = run.slice(m, run.length - m);
    let pick = inner[Math.floor(inner.length / 2)];
    for (const x of inner) if (x.r.gain > pick.r.gain) pick = x;
    pick.r.robust = run.length >= 2 * jf + 1;
    if (pick.r.robust && follow) {
      const c = structuredClone(base);
      rollout(c, cfg, Object.assign({}, hand, { delayF: pick.k }), null, frames);
      pick.r.robust = followUp(b, c, cfg);
    }
    return { r: pick.r, delayF: pick.k };
  }

  // 手を打ち終えた状態から、次の物を余裕をもって越えられるか（何もしないか、ぶれても大丈夫なジャンプ1回）。
  // これがないと、わなの手前で種を拾うためにレーンを行き来して、跳べる時間を使い切ってしまう
  function followUp(b, c, cfg) {
    if (c.phase !== 'run') return true;
    const frames = Math.round(cfg.bot.horizon / cfg.dt);
    if (rollout(structuredClone(c), cfg, null, null, frames).alive) return true;
    const e = evalHand(b, c, cfg, { jump: true }, frames, false);
    return e.r.alive && e.r.robust;
  }

  // このフレームの入力を返す
  function act(b, s, cfg) {
    for (const o of s.objs) if (b.seen[o.id] == null && visible(s, cfg, o)) {
      b.seen[o.id] = s.t;
      if (b.greed > 0 && ITEM[o.k]) b.lure[o.id] = RNG.next(b) < b.greed; // 0 のときは乱数を引かない（今のボットと同じ並び）
    }
    for (const r of s.rocks) if (b.seen[r.id] == null && visible(s, cfg, r)) b.seen[r.id] = s.t;
    const out = [];
    if (b.pending && s.t + 1e-9 >= b.pending.at) { out.push(b.pending.cmd); b.pending = null; b.jit = null; }
    if (b.path.length && !s.h.mv && !s.h.queued) out.push(b.path.shift());
    if (b.frame++ % cfg.bot.decide !== 0) return out;
    if (b.path.length || s.h.mv || s.h.queued) return out;
    // 予約したジャンプは、そのままで生き残れるうちは変えない。予約のあとで見えてきた物のせいで死ぬと分かったら組み直す。
    // 離すまでの遅れ（releaseLag）より近い予約は、指をもう押しているので変えない
    if (b.pending) {
      if (b.pending.at - s.t <= cfg.bot.releaseLag) return out;
      const keep = rollout(knownCopy(b, s, cfg), cfg, null, b.pending, Math.round(cfg.bot.horizon / cfg.dt));
      if (keep.alive) return out;
      b.pending = null;
    }
    const frames = Math.round(cfg.bot.horizon / cfg.dt);
    const base = knownCopy(b, s, cfg);
    const hasItem = base.objs.some((o) => !o.done && ITEM[o.k]);
    const lured = base.objs.some((o) => !o.done && b.lure[o.id]);
    const none = rollout(structuredClone(base), cfg, null, null, frames);
    if (none.alive && !hasItem) { b.pending = null; return out; }
    // 比べ方: 生き残る > ぶれても大丈夫（robust）> 点が多い > 長く生きる。
    // 釣られた宝が残っている間は 生き残る > 点が多い > ぶれても大丈夫（危なくても取りに行く。じしゃくで安全に拾えるなら点が同じなので、安全な手が勝つ）
    const better = lured
      ? (r, q) => (r.alive !== q.alive ? r.alive : !r.alive ? r.until > q.until : r.gain !== q.gain ? r.gain > q.gain : r.robust && !q.robust)
      : (r, q) => (r.alive !== q.alive ? r.alive : !r.alive ? r.until > q.until : r.robust !== q.robust ? r.robust : r.gain > q.gain);
    none.robust = true;
    let best = { hand: null, r: none, delayF: 0 };
    const cands = candidates(s);
    const consider = (hand) => {
      const e = evalHand(b, base, cfg, hand, frames);
      if (better(e.r, best.r)) best = { hand, r: e.r, delayF: e.delayF };
    };
    for (const hand of cands) consider(hand);
    if (!best.r.alive || !best.r.robust) for (const hand of cands) if (hand.path) consider({ path: hand.path, jump: true });
    // 今動いても助からないなら、次に考える機会まで待つほうがよいかを見る（移動は待てば間に合うことがある）
    if (!best.r.alive) {
      const later = structuredClone(base);
      const wait = cfg.bot.decide;
      let dead = false;
      for (let f = 0; f < wait && !dead; f++) { Game.rules.step(later, [], cfg); dead = later.phase === 'over'; }
      if (!dead) for (const hand of cands) if (evalHand(b, later, cfg, hand, frames - wait).r.alive) return out; // 待つ
    }
    if (!best.hand) { if (best.r.alive) b.pending = null; return out; }
    if (best.hand.jump) {
      // ぶれは予約ごとに1回だけ引く（見直すたびに引き直すと、ぶれが平均されて小さくなる）
      if (b.jit == null) b.jit = (RNG.next(b) * 2 - 1) * b.jitter;
      b.pending = { cmd: 'jump', at: s.t + best.delayF * cfg.dt + cfg.bot.releaseLag + b.jit };
    } else b.pending = null;
    if (best.hand.path) { b.path = best.hand.path.slice(); out.push(b.path.shift()); }
    return out;
  }

  // 3択の作戦
  function pick(b, s) {
    const offer = s.offer || [];
    const want = b.strategy === 'speed-first' ? 'speed' : b.strategy === 'loot-first' ? 'loot' : null;
    const i = want ? offer.indexOf(want) : -1;
    return i >= 0 ? i : RNG.int(b, offer.length);
  }

  Game.bot = { create, act, pick, evalHand, rollout, knownCopy };
})();
</script>
<script>
// ③実績: 記録データ（localStorage の hoppe-dive.records）、1回のランの数え（出来事から）、条件の判定。DOM に触らない。
// 設計書: docs/specs/2026-11-03-hoppe-dive-achievements-design.md
(function () {
  const Game = (window.Game = window.Game || {});

  const fresh = (cfg) => ({ v: cfg.achieve.version, got: {}, fresh: [] });
  const ids = (cfg) => cfg.achieve.list.map((a) => a.id);

  // 記録データの検め方。読めない・壊れている・版が違うときは最初の状態。知らない id は捨てる
  function parse(raw, cfg) {
    let d;
    try { d = typeof raw === 'string' ? JSON.parse(raw) : null; } catch (e) { return fresh(cfg); }
    if (!d || typeof d !== 'object' || Array.isArray(d) || d.v !== cfg.achieve.version || !d.got || typeof d.got !== 'object' || Array.isArray(d.got)) return fresh(cfg);
    const out = fresh(cfg), known = ids(cfg);
    for (const id of known) {
      const n = d.got[id];
      if (n == null) continue;
      if (!Number.isInteger(n) || n < 1) return fresh(cfg);
      out.got[id] = n;
    }
    if (Array.isArray(d.fresh)) for (const id of d.fresh) if (out.got[id] && !out.fresh.includes(id)) out.fresh.push(id);
    return out;
  }

  const count = (rec) => Object.keys(rec.got).length;

  // 取った印を付ける。初めてなら true
  function grant(rec, id) {
    if (rec.got[id]) return false;
    rec.got[id] = count(rec) + 1;
    rec.fresh.push(id);
    return true;
  }

  // 見た（実績のページを開いた）
  function seen(rec, list) {
    const before = rec.fresh.length;
    rec.fresh = rec.fresh.filter((id) => !list.includes(id));
    return rec.fresh.length !== before;
  }

  // 1回のランの数え
  const tracker = () => ({ near: 0, statue: 0, rows: 0, hits: 0, seedRun: 0, rare: {}, picked: {} });
  function observe(tr, events) {
    for (const e of events) {
      switch (e.type) {
        case 'near_miss': tr.near++; break;
        case 'pickup':
          tr.picked[e.k] = (tr.picked[e.k] || 0) + 1;
          if (e.k === 'statue') tr.statue++;
          if (e.k === 'seed') tr.seedRun = Math.max(tr.seedRun, e.run || 0);
          break;
        case 'row_bonus': tr.rows++; break;
        case 'hit': tr.hits++; break;
        case 'rare_end': if (e.ok) tr.rare[e.kind] = true; break;
      }
    }
  }

  // 条件。c: { s: ルールの状態, tr: 1回のランの数え, maxDiff: ランの始めに最大難易度だったか, final: 最後の点・gain: 持ち帰った宝（ランの終わりだけ）,
  //          save: ②の保存データ（キャンプ）, cfg }。ランの条件は s がないとき、キャンプの条件は save がないとき、満たさない
  const run = (f) => (c) => !!c.s && !!c.tr && f(c);
  const camp = (f) => (c) => !!c.save && f(c);
  const clear = run((c) => !!c.s.cleared);
  const escape = run((c) => !!(c.s.extra && c.s.extra.escaped));
  const COND = {
    firstMove: run((c) => c.s.ranks.move >= 1),
    firstLane: run((c) => c.s.ranks.lane >= 1),
    firstHome: (c) => c.gain != null && c.gain > 0,
    firstPerk: camp((c) => c.cfg.meta.perks.some((p) => c.save.alloc[p.id] > 0)),
    firstUnlock: camp((c) => c.cfg.meta.unlocks.some((u) => c.save.use[u.id])),
    perkAll: camp((c) => c.cfg.meta.perks.every((p) => c.save.alloc[p.id] >= p.max)),
    floor5: run((c) => c.s.floor >= 5),
    floor9: run((c) => c.s.floor >= 9),
    floor13: run((c) => c.s.floor >= 13),
    clear,
    noHit: (c) => clear(c) && c.tr.hits === 0,
    maxDiff: (c) => clear(c) && !!c.maxDiff,
    fast: (c) => clear(c) && c.s.clearAt <= c.cfg.achieve.th.fastSec,
    escape,
    escapeMax: (c) => escape(c) && !!c.maxDiff,
    allMax: run((c) => c.cfg.upgrades.every((u) => (c.s.ranks[u.id] || 0) >= u.max)),
    score1: (c) => c.final != null && c.final >= c.cfg.achieve.th.score[0],
    score2: (c) => c.final != null && c.final >= c.cfg.achieve.th.score[1],
    score3: (c) => c.final != null && c.final >= c.cfg.achieve.th.score[2],
    statue: run((c) => c.tr.statue >= c.cfg.achieve.th.statue),
    rows: run((c) => c.tr.rows >= c.cfg.achieve.th.rows),
    rich: run((c) => c.s.loot >= c.cfg.achieve.th.rich),
    near: run((c) => c.tr.near >= c.cfg.achieve.th.near),
    seeds: run((c) => c.tr.seedRun >= c.cfg.achieve.th.seeds),
    pup: run((c) => !!c.tr.rare.pup),
    mimic: run((c) => !!c.tr.rare.mimic),
    fly: run((c) => !!c.tr.rare.fly),
    bat: () => false, // 描画の側（main.js）が grant する
    platinum: (c) => !!c.rec && c.cfg.achieve.list.every((a) => a.id === 'platinum' || !!c.rec.got[a.id]), // ほかを全部取った
  };
  function met(a, c) {
    if (a.pick) return !!c.tr && !!c.tr.picked && (c.tr.picked[a.pick] || 0) > 0; // はじめての たね／ほうせき／…（種類ごとに初めて拾う）
    if (a.up) return !!c.s && (c.s.ranks[a.up] || 0) >= c.cfg.upgrades.find((u) => u.id === a.up).max;
    return COND[a.id] ? COND[a.id](c) : false;
  }

  // 今の状態で満たした実績のうち、まだ取っていないもの（記録には付けない）
  function check(rec, c, cfg) {
    c = Object.assign({ cfg, rec }, c);
    return cfg.achieve.list.filter((a) => !rec.got[a.id] && met(a, c)).map((a) => a.id);
  }

  // check して、取った印を付ける。新しく取った id を返す
  // ほかの実績を取ったことで満たすもの（でんせつの たんけんか）があるので、新しく取れなくなるまで繰り返す
  function update(rec, c, cfg) {
    const all = [];
    for (let got = check(rec, c, cfg); got.length; got = check(rec, c, cfg)) { for (const id of got) grant(rec, id); all.push(...got); }
    return all;
  }

  const info = (id, cfg) => cfg.achieve.list.find((a) => a.id === id);

  Game.achieve = { fresh, parse, count, grant, seen, tracker, observe, check, update, info, met };
})();
</script>
<script>
// きろく（端末の中のリーダーボード）: 最後の点の上位 size 件。ただのデータで、DOM・localStorage には触らない（読み書きは save.js）。
// 設計書: docs/specs/2026-11-03-hoppe-dive-board-design.md
// board: { v, list: [{ final, score, mult, cleared, escaped, floor, t, date, seed }, …]（最後の点の大きい順） }
(function () {
  const Game = (window.Game = window.Game || {});
  const C = (cfg) => (cfg || Game.config).board;

  const fresh = (cfg) => ({ v: C(cfg).version, list: [] });

  const num = (x) => typeof x === 'number' && Number.isFinite(x) && x >= 0;
  function valid(e) {
    return !!e && typeof e === 'object' && Number.isInteger(e.final) && e.final >= 0 && num(e.score) && num(e.mult) && num(e.floor) && num(e.t) &&
      typeof e.cleared === 'boolean' && typeof e.escaped === 'boolean' && typeof e.date === 'string' && e.date.length <= 10 && num(e.seed);
  }
  const pick = (e) => ({ final: e.final, score: e.score, mult: e.mult, cleared: e.cleared, escaped: e.escaped, floor: e.floor, t: e.t, date: e.date, seed: e.seed });

  // 保存データの検め方。読めない・壊れている・版が違うときは空。形の違う記録は捨て、並び直して size 件に切る
  function parse(raw, cfg) {
    let d;
    try { d = typeof raw === 'string' ? JSON.parse(raw) : null; } catch (e) { return fresh(cfg); }
    if (!d || typeof d !== 'object' || d.v !== C(cfg).version || !Array.isArray(d.list)) return fresh(cfg);
    const b = fresh(cfg);
    b.list = d.list.filter(valid).map(pick).sort((a, z) => z.final - a.final).slice(0, C(cfg).size); // sort は安定（同じ点は前からの順）
    return b;
  }

  // 記録を入れて順位（1〜size）を返す。入らなければ 0。同じ点が前からあれば、新しいほうを下にする
  function add(board, entry, cfg) {
    const e = pick(entry);
    let i = 0;
    while (i < board.list.length && board.list[i].final >= e.final) i++;
    if (i >= C(cfg).size) return 0;
    board.list.splice(i, 0, e);
    board.list.length = Math.min(board.list.length, C(cfg).size);
    return i + 1;
  }

  Game.board = { fresh, parse, add };
})();
</script>
