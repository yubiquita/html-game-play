<script>
// シード付きの乱数（mulberry32）。状態は整数1つで、ルールの状態の中に持つ（写しても同じ列になる）
(function () {
  const Game = (window.Game = window.Game || {});

  // o.rng（整数）を進めて [0,1) を返す
  function next(o) {
    let t = (o.rng = (o.rng + 0x6d2b79f5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const int = (o, n) => Math.floor(next(o) * n);
  const pick = (o, arr) => arr[int(o, arr.length)];
  // 重み付き。items: [{ weight }]
  function weighted(o, items) {
    let sum = 0;
    for (const it of items) sum += it.weight;
    let r = next(o) * sum;
    for (const it of items) { r -= it.weight; if (r < 0) return it; }
    return items[items.length - 1];
  }
  const seedFrom = (s) => (typeof s === 'number' ? s | 0 : [...String(s)].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619), 2166136261) | 0);

  Game.rng = { next, int, pick, weighted, seedFrom };
})();
</script>
<script>
// 時刻 t（5 分 = 1 の整数。0〜143 で 12 時間）と、針の位置・呼び名。DOM・Canvas・言語に触らない。
// 長針の位置は 12 か所（数字の位置）、短針の位置は 144 か所（数字と数字の間に 12 か所）。2 本は必ず連動する
(function () {
  const Game = (window.Game = window.Game || {});
  const DAY = 144;
  const wrap = (t) => ((t % DAY) + DAY) % DAY;

  const long = (t) => wrap(t) % 12;
  const short = (t) => wrap(t);
  // 呼び名: { h: 1〜12, m: 0〜55 }（文にするのは lang）
  const name = (t) => ({ h: Math.floor(wrap(t) / 12) || 12, m: (wrap(t) % 12) * 5 });
  const of = (h, m) => wrap((h % 12) * 12 + Math.round(m / 5));

  Game.clock = { DAY, wrap, long, short, name, of };
})();
</script>
<script>
// ステージの型。数字（宝の位置、始まりの時刻）は遊ぶたびに gen.js が決める。ここは型と、作れなかったときの一例の数字（sample）。
// 型: { id, area, door, cards, hints, gen: { start, in, inAt, span, out, outStep, lock, par: [少, 多] }, sample: { start, items, lock } }
//   start: 始まりの時刻の刻み（'sharp' ちょうど / 'half' 30 分ごと / 'quarter' 15 分ごと / 'any'）
//   in: 内の輪の宝の数、inAt: その刻み（'sharp' / 'half' = 少なくとも 1 つは「何時半」）、span: 始まりから何時間先までに置くか
//   out: 外の輪の宝の数、outStep: 始まりの長針から数えた刻み（3 = 15 分ごと）
//   lock: 扉の時刻の刻み（'half' = 何時半 / 'min' = ちょうどでも半でもない）
//   inAt 'between' = 数字の間の宝が 1 つは要る。trapOut / trapIn: 罠の数。wall: 壁あり。batch: 途中の位置に罠があり、まとめて並べないと par で取れない盤だけ
// できたステージ: { id, area, door, cards, hints, start, items: [{ ring: 'out' | 'in', pos, kind: 'gem' | 'trap' }], wall: null | 位置, lock: null | t, par, N, noonAt, seed, fallback }
//   par: いちばん少ない枚数。pulls: その枚数で取りきるときの、「すすめる」のいちばん少ない回数。N: 1 日に使える枚数（par + slack）。noonAt: ここまでなら昼（par + floor(slack / 2)）
(function () {
  const Game = (window.Game = window.Game || {});
  const K = Game.clock;
  const ALL = { nums: 'all', mins: true, zones: true, ticks: true, names: true };
  const H1 = { nums: 'all', zones: true, names: true };   // エリア 1: 数字、時ごとの色分け、時刻の名前
  const H2 = { nums: 'all', mins: true, names: true };    // エリア 2: 数字、分の数字、時刻の名前
  const H3 = { nums: 'all', ticks: true };                 // エリア 3: 数字、目盛り
  const H4 = { nums: 'quarter', ticks: true };             // エリア 4: 12・3・6・9、目盛り
  const H5a = { nums: 'none', ticks: true }, H5b = { nums: 'none' };   // エリア 5: 目盛りだけ → 何もなし

<script>
// ルール: 1 ステージの状態と操作。DOM・Canvas・言語に触らない。状態はただのデータ（structuredClone で写せる）。
// 操作は一瞬で進み、起きたことを出来事の列で返す（針が回る・夜になるの時間は main が演出として持つ）。
// 札は順に並べて、まとめて「すすめる」。宝・罠の判定は、最後に止まった所だけ。数えるのは使った札の枚数（弾かれたときも）。
// 札の出どころ（いつも手元にある・山札から引く）は知らない。並べている途中の列は main が持つ
(function () {
  const Game = (window.Game = window.Game || {});
  const K = Game.clock;
  const sum = (a) => a.reduce((x, y) => x + y, 0);

  function start(stage) {
    return {
      stage, t: stage.start,
      taken: stage.items.map(() => false),
      used: 0,                 // きょう使った札の枚数
      pulls: 0,                // きょう「すすめる」をした回数（レバー。弾かれたときも数える）
      nights: 0,               // 夜になった回数（このステージで）
      night: false,            // 夜になった（sleep で次の日へ行くまで、ほかの操作は受けない）
      helpOn: false, helpUsed: false,
      stuck: false,            // きょうの残りの枚数では取りきれない
      done: false, gems: 0,
    };
  }

  // 空: 'morning'（par まで）/ 'noon'（noonAt まで）/ 'evening'（N まで）
  const phaseAt = (stage, used) => (used <= stage.par ? 'morning' : used <= stage.noonAt ? 'noon' : 'evening');
  const phase = (s) => (s.night ? 'night' : phaseAt(s.stage, s.used));
  // 1 日の長さ: 編 1 は使った札の枚数、編 2（stage.limit === 'pulls'）はレバーの回数。extra: 「ひるね」で増えたぶん
  const byPulls = (s) => s.stage.limit === 'pulls';
  const left = (s) => s.stage.N + (s.extra || 0) - (byPulls(s) ? s.pulls : s.used);
  // いま、あと何枚並べられるか（すでに n 枚並べている）
  const room = (s, n, cfg = Game.config) => (s.done || s.night || left(s) <= 0 ? 0 : Math.max(0, (byPulls(s) ? cfg.queueMax : Math.min(cfg.queueMax, left(s))) - n));

  // 止まる時刻 t で、その輪の針が物 it の上にあるか
  const on = (it, t) => (it.ring === 'in' ? K.short(t) === it.pos : K.long(t) === it.pos);
  const cleared = (s) => (s.stage.lock != null ? s.t === s.stage.lock : s.stage.items.every((it, i) => it.kind !== 'gem' || s.taken[i]));

  // cards: 順に並んだ札（5 分 = 1 の数。編 2 は { n, jump } の形も: jump = その札の間、探検家が針をよける）
  // 探検家（stage.ham = 外の輪の位置）: 長針がそこに届く・通るたびに出来事 hit（よけたら dodge）。出ていくときは数えない。弾かれる手番でも、進んだぶんは数える
  // check: 取りきれるかを解き手で確かめる（ステージ作りのでたらめな試し遊びでは切る）
  function advance(s, cards, cfg = Game.config, check = true) {
    if (s.done || s.night || !cards.length || cards.length > room(s, 0, cfg)) return [];
    cards = cards.map((c) => (typeof c === 'number' ? { n: c } : c));
    const st = s.stage, ev = [], total = sum(cards.map((c) => c.n)), from = s.t;
    // 壁: 短針が届く・越えるなら、壁の手前まで進んで弾かれる
    const toWall = st.wall == null ? Infinity : K.wrap(st.wall - from) || K.DAY;
    const go = Math.min(total, toWall - 1);
    let at = from, done = 0;
    cards.forEach((c, i) => {
      const n = c.n;
      if (done >= go && total >= toWall) return;
      ev.push({ type: 'card', i, n, jump: !!c.jump });
      for (let k = 0; k < n && done < go; k++) {
        at = K.wrap(at + 1); done++;
        ev.push({ type: 'tick', t: at });
        if (st.ham != null && at % 12 === st.ham) { ev.push({ type: c.jump ? 'dodge' : 'hit', t: at, i }); if (!c.jump) s.hits = (s.hits || 0) + 1; }
        if (at % 12 === 0) ev.push({ type: 'hour', t: at });
      }
    });
    const before = phase(s);
    s.used += cards.length; s.pulls++;
    const trap = total < toWall ? st.items.findIndex((it) => it.kind === 'trap' && on(it, at)) : -1;
    if (total >= toWall) ev.push({ type: 'bounce', why: 'wall', back: from });
    else if (trap >= 0) ev.push({ type: 'bounce', why: 'trap', item: trap, back: from });
    else {
      s.t = at;
      st.items.forEach((it, i) => { if (it.kind === 'gem' && !s.taken[i] && on(it, at)) { s.taken[i] = true; ev.push({ type: 'take', item: i }); } });
    }
    if (cleared(s)) {
      s.done = true; s.stuck = false;
      s.gems = s.used <= st.par ? 3 : s.used <= st.noonAt ? 2 : 1;
      ev.push({ type: 'clear', gems: s.gems });
      return ev;
    }
    if (left(s) <= 0) { s.night = true; ev.push({ type: 'night' }); return ev; }
    if (phase(s) !== before) ev.push({ type: 'phase', phase: phase(s) });
    if (check && Game.solver) {
      const stuck = !Game.solver.canClear(s, cfg);
      if (stuck && !s.stuck) ev.push({ type: 'stuck' });
      s.stuck = stuck;
    }
    return ev;
  }

  // 次の日へ（夜になったあと、または自分から寝る）。同じ盤を最初から
  function sleep(s) {
    if (s.done) return [];
    s.t = s.stage.start; s.taken = s.stage.items.map(() => false);
    s.used = 0; s.pulls = 0; s.extra = 0; s.hits = 0; s.nights++; s.night = false; s.stuck = false;   // 助け舟（helpOn）は、そのステージの間ずっと続く
    return [{ type: 'day', nights: s.nights }];
  }

  const canHelp = (s, cfg = Game.config) => !s.done && s.nights >= cfg.help.nights;
  function help(s, cfg = Game.config) {
    if (!canHelp(s, cfg) || s.helpOn) return [];
    s.helpOn = true; s.helpUsed = true;
    return [{ type: 'help' }];
  }
  // ごほうび 3 つ、足あと、星
  // 星: いちばん少ない枚数で、しかも「すすめる」の回数もいちばん少ない（stage.pulls。先まで読んで、まとめて並べた）
  const star = (s) => s.done && s.stage.pulls != null && s.used <= s.stage.par && s.pulls <= s.stage.pulls;
  const result = (s) => ({ gems: [s.gems >= 1, s.gems >= 2, s.gems >= 3], stamp: s.done && !s.helpUsed, star: star(s) });

  Game.rules = { start, advance, sleep, help, canHelp, phase, phaseAt, left, room, cleared, result };
})();

<script>
// 解き手: いちばん少ない札の枚数（par）と、今の状態から取りきれるか。DOM・Canvas・言語に触らない。
// いちばん少ない枚数の道のうち、「すすめる」（レバー）の回数がいちばん少ないものを返す（枚数 → 回数の順に比べる）。
// 状態は（時刻 t、取った宝の組）。1 回の「すすめる」は、合計 d だけ進む手で、かかる枚数は「d を作るいちばん少ない札の枚数」。
// 止まった所だけで判定するので、罠に止まる手・壁に届く手は弾かれるだけ（枚数を使って何も変わらない）→ 探さない
(function () {
  const Game = (window.Game = window.Game || {});
  const K = Game.clock;

  // 合計 d（1〜）を作るいちばん少ない札の列。queueMax 枚で作れないものは入らない。返り値: { d: [札…] }
  const tables = {};
  function sums(cards, max) {
    const key = cards.join() + '/' + max;
    if (tables[key]) return tables[key];
    const best = { 0: [] };
    let layer = [0];
    for (let n = 1; n <= max; n++) {
      const next = [];
      for (const d of layer) for (const c of cards) if (best[d + c] == null) { best[d + c] = best[d].concat(c); next.push(d + c); }
      layer = next;
    }
    delete best[0];
    return (tables[key] = best);
  }

  // from: { t, taken }（省くと始まりから）。budget: 使える枚数（これを超える道は探さない）
  // 返り値: { cost: 枚数, pulls: 「すすめる」の回数, moves: [[札…]…] } か null（取りきれない）
  function solve(stage, from, budget = Infinity, cfg = Game.config) {
    const items = stage.items, gems = [];
    items.forEach((it, i) => { if (it.kind === 'gem') gems.push(i); });
    const t0 = from ? from.t : stage.start;
    let m0 = 0;
    gems.forEach((gi, b) => { if (from && from.taken[gi]) m0 |= 1 << b; });
    const full = (1 << gems.length) - 1;
    const goal = (t, m) => (stage.lock != null ? t === stage.lock : m === full);
    if (stage.lock == null && m0 === full) return { cost: 0, pulls: 0, moves: [] };  // 鍵は、止まって初めて開く（始まりが合っていても 0 枚にはならない）
    const S = sums(stage.cards, cfg.queueMax);
    const ds = Object.keys(S).map(Number).sort((a, b) => a - b), cost = ds.map((d) => S[d].length);
    // 時刻ごとの表: 罠に止まるか、止まると取れる宝の組
    const trapAt = new Uint8Array(K.DAY), gemAt = new Uint8Array(K.DAY);
    for (let t = 0; t < K.DAY; t++) {
      for (const it of items) if (it.kind === 'trap' && (it.ring === 'in' ? t === it.pos : t % 12 === it.pos)) trapAt[t] = 1;
      gems.forEach((gi, b) => { const it = items[gi]; if (it.ring === 'in' ? t === it.pos : t % 12 === it.pos) gemAt[t] |= 1 << b; });
    }
    const P = 64, W = full + 1, dist = new Int32Array(K.DAY * W).fill(-1), prevK = new Int32Array(K.DAY * W).fill(-1), prevD = new Uint8Array(K.DAY * W);
    dist[t0 * W + m0] = 0;
    // 道の重さ = 枚数 × P + 回数（枚数が少ないほうが先、同じなら回数が少ないほう）。重さごとの列を順に見ていく
    const buckets = [[t0 * W + m0]];
    for (let c = 0; c < buckets.length && c <= budget * P + P - 1; c++) {
      for (const k0 of buckets[c] || []) {
        if (dist[k0] !== c) continue;
        const t = (k0 / W) | 0, m = k0 % W;
        if (c > 0 && goal(t, m)) {
          const moves = [];
          for (let k = k0, n = c % P; n > 0; k = prevK[k], n--) moves.unshift(S[prevD[k]]);
          return { cost: (c / P) | 0, pulls: c % P, moves };
        }
        const toWall = stage.wall == null ? Infinity : K.wrap(stage.wall - t) || K.DAY;
        for (let i = 0; i < ds.length; i++) {
          const d = ds[i];
          if (d >= toWall) break;
          const nc = c + cost[i] * P + 1;
          if (cost[i] + ((c / P) | 0) > budget || nc % P === 0) continue;
          const nt = (t + d) % K.DAY;
          if (trapAt[nt]) continue;
          const k = nt * W + (m | gemAt[nt]);
          if (dist[k] >= 0 && dist[k] <= nc) continue;
          dist[k] = nc; prevK[k] = k0; prevD[k] = d;
          (buckets[nc] = buckets[nc] || []).push(k);
        }
      }
    }
    return null;
  }

  // いちばん少ない枚数（解けないときは Infinity）
  const par = (stage, cfg = Game.config, budget = Infinity) => { const r = solve(stage, null, budget, cfg); return r ? r.cost : Infinity; };
  // きょうの残りの枚数で取りきれるか
  const canClear = (s, cfg = Game.config) => s.done || !!solve(s.stage, { t: s.t, taken: s.taken }, s.stage.N - s.used, cfg);

  Game.solver = { sums, solve, par, canClear };
})();

<script>
// ステージを作る: 型（stages.js）と種から、1 回ぶんの数字を決める（設計書 3.4）。DOM・Canvas・言語に触らない。
//   make(def, seed, prevSeed) → できたステージ（形は stages.js の頭）
// 数字を乱数で決め、解き手で par を出し、型の決める範囲に入るか確かめる。だめなら決め直し、config.gen.tries 回でだめなら一例の数字（fallback: true）。
// prevSeed を渡すと、その種で作ったステージと同じ数字にはしない
(function () {
  const Game = (window.Game = window.Game || {});
  const K = Game.clock;
  const GRAIN = { sharp: 12, half: 6, quarter: 3, any: 1, between: 1 };

  // 数字を 1 回決める。だめなら null（決め直し）
  function roll(def, o, cfg) {
    const R = Game.rng, G = def.gen;
    const g0 = GRAIN[G.start], start = R.int(o, K.DAY / g0) * g0, items = [];
    const span = (G.span || 3) * 12;
    let lock = null, wall = null, far = 0;          // far: 短針が行く必要のある、いちばん先（始まりからの数）
    const inOffs = [];                               // 内の輪の物（宝・罠）の、始まりからの数
    const inner = (kind, g) => {
      const off = (1 + R.int(o, span / g)) * g;
      if (inOffs.some((d) => Math.abs(d - off) < cfg.gen.inGap)) return false;
      // 罠の対の印（赤）を、宝の対の印（黄）と同じ「何分」に置かない
      if (kind === 'trap' && items.some((it) => it.ring === 'in' && it.pos % 12 === K.wrap(start + off) % 12)) return false;
      inOffs.push(off);
      if (kind === 'gem') far = Math.max(far, off);
      items.push({ ring: 'in', pos: K.wrap(start + off), kind });
      return true;
    };
    for (let i = 0; i < (G.in || 0); i++) if (!inner('gem', GRAIN[G.inAt || 'any'])) return null;
    if (G.inAt === 'half' && !items.some((it) => it.pos % 12 === 6)) return null;   // 「何時半」が 1 つは要る
    if (G.inAt === 'between' && !items.some((it) => it.pos % 12 !== 0)) return null; // 数字の間の宝が 1 つは要る
    for (let i = 0; i < (G.trapIn || 0); i++) if (!inner('trap', 1)) return null;
    if (G.lock) {
      const off = 1 + R.int(o, span);
      lock = K.wrap(start + off); far = off;
      const m = lock % 12;
      if (G.lock === 'half' ? m !== 6 : m === 0 || m === 6) return null;
    }
    // 外の輪: 始まりの長針の位置、対の印の位置、ほかの物の位置を避ける（鍵の時刻の「何分」に罠を置かない）
    const taken = new Set([K.long(start)]);
    for (const it of items) taken.add(it.pos % 12);
    if (lock != null) taken.add(lock % 12);
    const outer = (kind, step) => {
      const pos = (K.long(start) + (1 + R.int(o, 12 / step - 1)) * step) % 12;
      if (taken.has(pos)) return false;
      taken.add(pos); items.push({ ring: 'out', pos, kind });
      return true;
    };
    for (let i = 0; i < (G.out || 0); i++) if (!outer('gem', G.outStep || 1)) return null;
    for (let i = 0; i < (G.trapOut || 0); i++) if (!outer('trap', 1)) return null;
    // 壁: 短針が行く必要のある所より先。罠の帯と重ならない
    if (G.wall) {
      const off = Math.max(far, 3) + 1 + R.int(o, 18);
      if (inOffs.some((d) => d >= off - 2 && d <= off + 12)) return null;
      wall = K.wrap(start + off);
    }
    // 宝は「取る順」ではなく、輪と位置の順に並べる（同じ盤は同じ形になる）
    items.sort((x, y) => (x.kind === y.kind ? (x.ring === y.ring ? x.pos - y.pos : x.ring < y.ring ? -1 : 1) : x.kind === 'gem' ? -1 : 1));
    return { start, items, lock, wall };
  }

  // でたらめに札を並べて（枚数もでたらめ）、1 日のうちにクリアできる割合
  function luck(st, o, cfg) {
    const R = Game.rng, RU = Game.rules, n = cfg.gen.luckRuns;
    let ok = 0;
    for (let i = 0; i < n; i++) {
      const s = RU.start(st);
      while (!s.done && !s.night) {
        const k = 1 + R.int(o, RU.room(s, 0, cfg)), cards = [];
        for (let j = 0; j < k; j++) cards.push(R.pick(o, st.cards));
        RU.advance(s, cards, cfg, false);
      }
      if (s.done) ok++;
    }
    return ok / n;
  }
  // 壁が効いているか: 針は戻れないので、壁は「進める合計」の上限になる。
  // いちばん少ない道の合計から壁までの残りが 1 時間より短ければ、行きすぎたときに長針をもう 1 周させられない（先読みが要る）
  function wallMatters(st, cfg) {
    const r = Game.solver.solve(st, null, st.par, cfg);
    const total = r.moves.reduce((a, m) => a + m.reduce((x, y) => x + y, 0), 0);
    return (K.wrap(st.wall - st.start) || K.DAY) - total <= cfg.gen.wallRoom;
  }

  function build(def, raw, cfg) {
    const st = { id: def.id, area: def.area, door: !!def.door, cards: def.cards, hints: def.hints, start: raw.start, items: raw.items, wall: raw.wall == null ? null : raw.wall, lock: raw.lock == null ? null : raw.lock };
    const best = Game.solver.solve(st, null, def.gen.par[1], cfg);
    st.par = best ? best.cost : Infinity; st.pulls = best ? best.pulls : null;   // 型の範囲より多い枚数は探さない（解けない盤も Infinity）
    const slack = cfg.gen.slack[def.area];
    st.N = st.par + slack; st.noonAt = st.par + Math.floor(slack / 2);
    return st;
  }
  const same = (a, b) => JSON.stringify([a.start, a.items, a.lock, a.wall]) === JSON.stringify([b.start, b.items, b.lock, b.wall]);

  function make(def, seed, prevSeed, cfg = Game.config) {
    const prev = prevSeed == null || prevSeed === seed ? null : make(def, prevSeed, null, cfg);
    const o = { rng: seed | 0 };
    for (let i = 0; i < cfg.gen.tries; i++) {
      const raw = roll(def, o, cfg);
      if (!raw) continue;
      const st = build(def, raw, cfg);
      if (st.par < def.gen.par[0] || st.par > def.gen.par[1]) continue;
      if (prev && same(prev, st)) continue;
      if (st.wall != null && !wallMatters(st, cfg)) continue;
      // batch: 1 枚ずつ「すすめる」だけでは par で取れない盤（途中の位置に罠があり、まとめて並べる必要がある）
      if (def.gen.batch && Game.solver.par(st, Object.assign({}, cfg, { queueMax: 1 }), st.par) <= st.par) continue;
      // エリア 3 から先: 当てずっぽうで通れる盤は出さない
      if (def.area >= cfg.gen.luckFrom && luck(st, { rng: (seed ^ 0x5bd1e995) + i }, cfg) > cfg.gen.luckMax) continue;
      return Object.assign(st, { seed, fallback: false });
    }
    return Object.assign(build(def, def.sample, cfg), { seed, fallback: true });
  }
  // 型を書くときの道具: 一例の数字を作る（stages.js の sample に写す）
  function sample(def, seed, cfg = Game.config) {
    const st = make(Object.assign({}, def, { sample: { start: 0, items: [] } }), seed, null, cfg);
    return st.fallback ? null : { start: st.start, items: st.items, lock: st.lock, wall: st.wall };
  }

  Game.gen = { make, sample, luck };
})();

<script>
// 編 2「ぼうけん」の札。DOM・Canvas・言語に触らない（名前と文は text.js）。
//   kind: 'time'（長さの決まった時間の札）/ 'to'（長針が次の 12・6 に来るまで進む）/ 'jump' / 'x2' / 'draw2' / 'swap' / 'nap'
//   2 ばい: 次の時間の札を 2 倍にし、その札の間は探検家が針をよける（ジャンプと組にしなくてよい）
//   n: time の長さ（5 分 = 1）、to: 行き先の長針の位置（0 = ちょうど、6 = はん）、draw: 並べると引く枚数、once: 使うとランから消える
// 進む札 = time と to。置ける条件は canPlace（決まりを覚えなくても、置けないことで分かるようにする）
(function () {
  const Game = (window.Game = window.Game || {});
  // 30 ぷん以上の札は、並べると 2 枚引く（長い札ほど探検家をまたぎやすいぶんの見返り。引いた中にジャンプがあれば助かる）
  const T = (n) => ({ kind: 'time', n, draw: n >= 6 ? 2 : 1 });
  const all = {
    t12: T(12), t6: T(6), t3: T(3), t2: T(2), t1: T(1), t4: T(4), t9: T(9),
    sharp: { kind: 'to', to: 0, draw: 1 }, half: { kind: 'to', to: 6, draw: 1 },
    jump: { kind: 'jump', draw: 0 },
    x2: { kind: 'x2', draw: 0 },
    draw2: { kind: 'draw2', draw: 2 },
    swap: { kind: 'swap', draw: 0 },
    nap: { kind: 'nap', draw: 0, once: true },
  };
  for (const id in all) all[id].id = id;
  const of = (id) => all[id];
  const moves = (id) => all[id].kind === 'time' || all[id].kind === 'to';

  // 手札の i 枚めを、いま並べられるか。run: { hand, queue, s, phase }
  function canPlace(run, i, cfg = Game.config) {
    const c = all[run.hand[i]], q = run.queue, last = q.length ? all[q[q.length - 1]] : null;
    if (!c || run.phase !== 'play' || Game.rules.room(run.s, 0, cfg) <= 0 || q.length >= cfg.queueMax) return false;
    if (last && last.kind === 'x2') return c.kind === 'time';                       // 2 ばいのあとは、時間の札だけ
    if (c.kind === 'jump') return !!last && moves(last.id);                         // ジャンプは、進む札のすぐあとだけ
    if (c.kind === 'x2') return q.length <= cfg.queueMax - 2 && run.hand.some((id) => all[id].kind === 'time');   // 続きの時間の札を置ける
    return true;
  }

  function resolve(queue, t) {
    const K = Game.clock, list = [];
    let mult = 1, at = t;
    queue.forEach((id, from) => {
      const c = all[id];
      if (c.kind === 'x2') mult = 2;
      else if (c.kind === 'jump') { if (list.length) list[list.length - 1].jump = true; }
      else if (moves(id)) {
        const n = c.kind === 'time' ? c.n * mult : (c.to - K.long(at) + 12) % 12 || 12;
        list.push({ n, jump: mult === 2, from });   // 2 ばいにした札は、その針もよける
        mult = 1; at += n;
      }
    });
    return list;
  }

  Game.cards = { all, of, moves, canPlace, resolve };
})();

<script>
// 編 2「ぼうけん」: ランの状態と操作。DOM・Canvas・言語に触らない。状態はただのデータ（そのまま保存できる）。
// 操作は一瞬で進み、起きたことを出来事の列で返す（main が時間をかけて映す）。
//   run = { v, seed, rng, board（0 始まり）, stage, s（rules の状態）, deck, hand, discard, queue（どれも札 id の列）, fires, days,
//           phase: 'play' | 'pick' | 'rest' | 'over' | 'clear', picks: [札 id ×3] | null }
// 1 日 = レバー cfg.run.pulls 回。手番の始めに手札を補充し、進む札は並べるとすぐ 1 枚引く。並べたら取り消せない
(function () {
  const Game = (window.Game = window.Game || {});
  const K = Game.clock, RU = Game.rules, C = Game.cards, RNG = Game.rng;

  function shuffle(run, a) { for (let i = a.length - 1; i > 0; i--) { const j = RNG.int(run, i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  // この面の盤を作る: 型から数字を決め（レバー maxPulls 回以内で取りきれるもの）、探検家の位置を決める
  function makeStage(run, cfg) {
    const def = Game.runStages[run.board];
    let st = null;
    for (let i = 0; i < 40; i++) {
      st = Game.gen.make(def, (RNG.next(run) * 0x7fffffff) | 0, null, cfg);
      if (st.pulls != null && st.pulls <= (def.maxPulls || cfg.run.maxPulls)) break;
    }
    // 探検家: 始まりの長針から hamGap 以上先。外の輪の物、対の印、鍵の「何分」と重ねない
    const taken = new Set(st.items.map((it) => it.pos % 12));
    if (st.lock != null) taken.add(st.lock % 12);
    const spots = [];
    for (let d = cfg.run.hamGap; d < 12; d++) { const p = (K.long(st.start) + d) % 12; if (!taken.has(p)) spots.push(p); }
    return Object.assign(st, { ham: RNG.pick(run, spots), limit: 'pulls', N: cfg.run.pulls });
  }

  const pool = (run) => run.deck.concat(run.hand, run.discard, run.queue);
  // 山札から 1 枚引く。尽きたら捨て札を切り直す。引けなければ false
  function draw1(run, ev) {
    if (!run.deck.length) {
      if (!run.discard.length) return false;
      run.deck = shuffle(run, run.discard); run.discard = [];
      ev.push({ type: 'shuffle' });
    }
    const id = run.deck.pop();
    run.hand.push(id); ev.push({ type: 'draw', id });
    return true;
  }
  const anyPlace = (run, cfg) => run.hand.some((_, i) => C.canPlace(run, i, cfg));
  // 手番の始め: 手札を補充する。1 枚も並べられない手札（ジャンプだけ、など）は、捨てて引き直す
  function refill(run, ev, cfg) {
    for (let k = 0; k < 4; k++) {
      while (run.hand.length < cfg.run.hand && draw1(run, ev));
      if (anyPlace(run, cfg) || k === 3) return;
      ev.push({ type: 'mulligan' });
      run.discard.push(...run.hand); run.hand = [];
    }
  }
  // 朝: 全部の札をまとめて切り直し、手札を引く
  function morning(run, ev, cfg) {
    run.deck = shuffle(run, pool(run).sort()); run.hand = []; run.discard = []; run.queue = [];
    refill(run, ev, cfg);
  }
  function enter(run, ev, cfg) {
    run.stage = makeStage(run, cfg); run.s = RU.start(run.stage); run.phase = 'play'; run.picks = null;
    ev.push({ type: 'board', board: run.board });
    morning(run, ev, cfg);
  }

  // board: 確かめ用（その面から、最初の山札で）
  function start(seed, cfg = Game.config, board = 0) {
    const run = { v: 1, seed, rng: seed | 0, board, stage: null, s: null, deck: cfg.run.deck.slice(), hand: [], discard: [], queue: [], fires: cfg.run.fires, days: 1, phase: 'play', picks: null };
    enter(run, [], cfg);
    return run;
  }

  // 手札の i 枚めを並べる
  function place(run, i, cfg = Game.config) {
    if (!C.canPlace(run, i, cfg)) return [{ type: 'deny', i }];
    const id = run.hand.splice(i, 1)[0], c = C.of(id), ev = [{ type: 'place', id, at: run.queue.length }];
    run.queue.push(id);
    if (c.kind === 'swap') { const n = run.hand.length; run.discard.push(...run.hand); run.hand = []; ev.push({ type: 'swap' }); for (let k = 0; k < n; k++) draw1(run, ev); }
    if (c.kind === 'nap') { run.s.extra = (run.s.extra || 0) + 1; ev.push({ type: 'nap' }); }

  // 並べた札を手札へ戻せるか: 引かない札（ジャンプ・2 ばい・ひるね）で、並びのいちばん右のものだけ。
  // 取り消せないのは「引いた札を見てから、やめる」を防ぐため。引かない札は、戻しても何も分からない
  function canTake(run) {
    if (run.phase !== 'play' || !run.queue.length) return false;
    const c = C.of(run.queue[run.queue.length - 1]);
    return c.kind === 'jump' || c.kind === 'x2' || c.kind === 'nap';
  }
  function take(run) {
    if (!canTake(run)) return [];
    const id = run.queue.pop();
    run.hand.push(id);
    if (C.of(id).kind === 'nap') run.s.extra = Math.max(0, (run.s.extra || 0) - 1);
    return [{ type: 'takeback', id }];
  }
  // レバーを引けるか: 1 枚は並べてあり、2 ばいの続きを待っていない
  const canPull = (run) => run.phase === 'play' && run.queue.length > 0 && C.of(run.queue[run.queue.length - 1]).kind !== 'x2';

  // 夜（回数を使いきった・自分から寝た）: 火が 1 つ消え、残っていれば同じ盤を朝から
  function night(run, ev, cfg) {
    run.fires--; ev.push({ type: 'night', fires: run.fires });
    if (run.fires <= 0) { run.phase = 'over'; ev.push({ type: 'over' }); return; }
    RU.sleep(run.s); run.days++;
    ev.push({ type: 'day' });
    morning(run, ev, cfg);
  }
  function pull(run, cfg = Game.config) {
    if (!canPull(run)) return [];
    const s = run.s, list = C.resolve(run.queue, s.t), ev = [{ type: 'pull', list }];
    const fires0 = run.fires;
    if (list.length) ev.push(...RU.advance(s, list, cfg, false));
    else { s.pulls++; if (RU.left(s) <= 0) { s.night = true; ev.push({ type: 'night' }); } }   // 進む札がない: 回数だけ使う
    for (const e of ev) if (e.type === 'hit') run.fires--;
    // 使った札は捨て札へ（「ひるね」はランから消える）
    for (const id of run.queue) if (!C.of(id).once) run.discard.push(id);
    run.queue = [];
    const i = ev.findIndex((e) => e.type === 'night');
    if (i >= 0) ev.splice(i, 1);                       // 夜は、火を数えてからここで出す
    if (run.fires <= 0) { run.phase = 'over'; ev.push({ type: 'over', hit: run.fires < fires0 }); return ev; }
    if (s.done) {
      run.deck = pool(run).sort(); run.hand = []; run.discard = [];
      if (run.board >= cfg.run.boards - 1) { run.phase = 'clear'; ev.push({ type: 'win', days: run.days }); return ev; }
      run.phase = 'pick'; run.picks = offer(run, cfg);
      ev.push({ type: 'pick', picks: run.picks });
      return ev;
    }
    if (s.night) { night(run, ev, cfg); return ev; }
    refill(run, ev, cfg);
    return ev;
  }
  // 自分から寝る
  function sleep(run, cfg = Game.config) {
    if (run.phase !== 'play') return [];
    const ev = [];
    run.discard.push(...run.queue.filter((id) => !C.of(id).once)); run.queue = [];
    night(run, ev, cfg);
    return ev;
  }

  // 札を選ぶ 3 枚（重ならない。出やすさは cfg.run.weights）
  function offer(run, cfg) {
    const items = Object.keys(cfg.run.weights).map((id) => ({ id, weight: cfg.run.weights[id] })), out = [];
    while (out.length < 3) { const it = RNG.weighted(run, items); out.push(it.id); items.splice(items.indexOf(it), 1); }
    return out;
  }
  function next(run, ev, cfg) { run.board++; run.days++; enter(run, ev, cfg); }
  // i: 選ぶ札（0〜2）。null なら、えらばない
  function pick(run, i, cfg = Game.config) {
    if (run.phase !== 'pick') return [];
    const ev = [];
    if (i != null && run.picks[i]) { run.deck.push(run.picks[i]); ev.push({ type: 'add', id: run.picks[i] }); }
    run.picks = null;
    if (cfg.run.restAfter.includes(run.board)) { run.phase = 'rest'; ev.push({ type: 'rest' }); return ev; }
    next(run, ev, cfg);
    return ev;
  }
  const canFire = (run, cfg = Game.config) => run.fires < cfg.run.fires;
  // やすみば: what = 'fire'（火を 1 つともす）か 'remove'（山札の i 枚めを抜く。deck はまとめて並べてある）
  function rest(run, what, i, cfg = Game.config) {
    if (run.phase !== 'rest') return [];
    const ev = [];
    if (what === 'fire') { if (!canFire(run, cfg)) return []; run.fires++; ev.push({ type: 'fire', fires: run.fires }); }
    else { if (!(i >= 0 && i < run.deck.length)) return []; ev.push({ type: 'remove', id: run.deck.splice(i, 1)[0] }); }
    next(run, ev, cfg);
    return ev;
  }

  // 途中のランの保存（状態はただのデータ）。読めないものは null
  const toSave = (run) => JSON.parse(JSON.stringify(run));
  function fromSave(d, cfg = Game.config) {
    try {
      if (!d || d.v !== 1 || !d.stage || !d.s || !['play', 'pick', 'rest'].includes(d.phase)) return null;
      for (const k of ['deck', 'hand', 'discard', 'queue']) if (!Array.isArray(d[k]) || d[k].some((id) => !C.of(id))) return null;
      if (!(d.board >= 0 && d.board < cfg.run.boards) || !(d.fires > 0)) return null;
      const run = JSON.parse(JSON.stringify(d));
      run.s.stage = run.stage;
      return run;
    } catch (e) { return null; }
  }

  Game.run = { start, place, canTake, take, canPull, pull, sleep, pick, rest, canFire, pool, toSave, fromSave };
})();
</script>
<script>
// 記録: 開いたステージ、ステージごとのごほうび（3 つ）と足あと、前に遊んだ種。DOM・Canvas・言語に触らない。
// 保存の形: { v, stages: { '1-1': { gems: [bool, bool, bool], stamp: bool, star: bool, seed: 整数 } } }
// 前に取ったごほうびと足あとは消えない（遊び直して、取れていない分だけを足せる）
(function () {
  const Game = (window.Game = window.Game || {});

  // run: 編 2「ぼうけん」の記録 { best: いちばん先まで進んだ面の数（0〜8）, days: クリアしたときのいちばん少ない日数（まだなら null） }
  const fresh = (cfg = Game.config) => ({ v: cfg.save.version, stages: {}, run: { best: 0, days: null } });
  const blank = () => ({ gems: [false, false, false], stamp: false, star: false, seed: null });
  const of = (p, id) => p.stages[id] || blank();

  // 壊れたデータは、読めるところだけ使う。だめなら最初から
  function parse(raw, cfg = Game.config, defs = Game.stages) {
    let d = null;
    try { if (typeof raw === 'string') d = JSON.parse(raw); } catch (e) { return fresh(cfg); }
    const p = fresh(cfg);
    if (!d || d.v !== cfg.save.version || !d.stages || typeof d.stages !== 'object') return p;
    if (d.run && typeof d.run === 'object') {
      if (Number.isInteger(d.run.best) && d.run.best >= 0 && d.run.best <= cfg.run.boards) p.run.best = d.run.best;
      if (Number.isInteger(d.run.days) && d.run.days > 0 && p.run.best === cfg.run.boards) p.run.days = d.run.days;
    }
    for (const def of defs) {
      const s = d.stages[def.id];
      if (!s || typeof s !== 'object') continue;
      const e = blank();
      if (Array.isArray(s.gems)) for (let i = 0; i < 3; i++) e.gems[i] = s.gems[i] === true;
      e.stamp = s.stamp === true; e.star = s.star === true;
      if (Number.isInteger(s.seed)) e.seed = s.seed;
      p.stages[def.id] = e;
    }
    return p;
  }

  // クリアしたか（1 つめのごほうび）
  const cleared = (p, id) => of(p, id).gems[0];
  // 開いているか: エリアは最初から全部選べる。エリアの中は順番（最初のステージか、同じエリアの 1 つ前をクリアしている）
  function open(p, id, defs = Game.stages) {
    const i = defs.findIndex((d) => d.id === id);
    if (i < 0) return false;
    return i === 0 || defs[i - 1].area !== defs[i].area || cleared(p, defs[i - 1].id);
  }
  // 同じエリアの次のステージ（なければ null）
  function next(id, defs = Game.stages) {
    const i = defs.findIndex((d) => d.id === id);
    return i >= 0 && defs[i + 1] && defs[i + 1].area === defs[i].area ? defs[i + 1].id : null;
  }
  // ステージに入るときの種を覚える（次に入るとき、同じ数字にしないため）
  function enter(p, id, seed) {
    const e = (p.stages[id] = of(p, id));
    const prev = e.seed;
    e.seed = seed;
    return prev;
  }
  // 結果を足す。返り値: 今回はじめて取れたもの { gems: [bool×3], stamp }
  function record(p, id, outcome) {
    const e = (p.stages[id] = of(p, id));
    const got = { gems: [false, false, false], stamp: false, star: false };
    for (let i = 0; i < 3; i++) if (outcome.gems[i] && !e.gems[i]) { e.gems[i] = true; got.gems[i] = true; }
    if (outcome.stamp && !e.stamp) { e.stamp = true; got.stamp = true; }
    if (outcome.star && !e.star) { e.star = true; got.star = true; }
    return got;
  }
  // エリアの合計 { gems, stamps, stages }
  function total(p, area, defs = Game.stages) {
    const t = { gems: 0, stamps: 0, stars: 0, stages: 0 };
    for (const d of defs) if (d.area === area) { const e = of(p, d.id); t.stages++; t.gems += e.gems.filter(Boolean).length; if (e.stamp) t.stamps++; if (e.star) t.stars++; }
    return t;
  }

  // ランの結果を足す。boards: クリアした面の数、days: かかった日数、won: 最後の扉を開けた。返り値: 記録を更新したか
  function recordRun(p, boards, days, won) {
    let up = false;
    if (boards > p.run.best) { p.run.best = boards; up = true; }
    if (won && (p.run.days == null || days < p.run.days)) { p.run.days = days; up = true; }
    return up;
  }

  Game.progress = { recordRun, fresh, parse, of, cleared, open, next, enter, record, total };
})();
</script>
<script>
// 導入: どのヒントを出すかを決める所。DOM・Canvas・言語に触らない。設計書: docs/specs/2026-11-15-hoppe-clock-intro-design.md
// 見たか（seen）は main が持ち、save が hoppe-clock.tips に書く
(function () {
  const Game = (window.Game = window.Game || {});

  // 記録がまっさら（ごほうび 0、ぼうけんの記録なし）→ 1 本めのおはなしを流す
  const fresh = (p) => p.run.best === 0 && !Object.values(p.stages).some((e) => e.gems.some(Boolean));

  // 盤の始まりに出すヒント（まだ見ていないものを、決まった順に）。「その盤に、そのものがあるか」で決める（ステージの番号では決めない）
  function atStart(stage, seen, isRun) {
    const has = (f) => stage.items.some(f), ids = [];
    if (isRun) ids.push('hit', 'jump');
    else {
      if (has((it) => it.kind === 'gem')) ids.push('goal');
      if (has((it) => it.kind === 'gem' && it.ring === 'out')) ids.push('outer');
      // 対の印: 数字の間にある内の輪の宝（長い針で合わせる札がある盤だけ。エリア 1 の「はん」は短い針だけで読む）
      if (has((it) => it.kind === 'gem' && it.ring === 'in' && it.pos % 12 !== 0) && stage.cards.some((n) => n < 6)) ids.push('pair');
      if (has((it) => it.kind === 'trap')) ids.push('trap');
      if (stage.wall != null) ids.push('wall');
      if (stage.lock != null) ids.push('lock');
    }
    return ids.filter((id) => !seen[id]);
  }

  // 出来事で出すヒント（夕方、クリア、札を並べた、レバーのあと、札を選ぶ、やすみば）。見ていれば null
  const EVENTS = ['dusk', 'reward', 'draw', 'day', 'pick', 'rest'];
  const on = (name, seen) => (EVENTS.includes(name) && !seen[name] ? name : null);

  // 保存で拾う id（指の手本、ヒント、2 本めのおはなしを見た印）
  const ids = (cfg = Game.config) => cfg.tips.concat(cfg.guide.tips, 'story2');

  Game.guide = { fresh, atStart, on, ids };
})();
</script>
<script>
// 保存データの読み書き（localStorage）。記録（hoppe-clock.progress、検め方は progress.parse）、設定（hoppe-clock.settings）、手本を見たか（hoppe-clock.tips）。
// 読めない・壊れているときは最初の状態から始める。書けない（容量・プライベートモード）ときは黙って続ける
(function () {
  const Game = (window.Game = window.Game || {});

  function read(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function write(key, data) { try { localStorage.setItem(key, JSON.stringify(data)); return true; } catch (e) { return false; } }
  const json = (raw) => { try { return typeof raw === 'string' ? JSON.parse(raw) : null; } catch (e) { return null; } };

  // 設定 { sound: bool, haptics: bool }（前の保存に haptics が無ければオン）
  function parseSettings(raw) { const d = json(raw); return { sound: !(d && d.sound === false), haptics: !(d && d.haptics === false) }; }
  // 手本とヒント { seen: { put: true, goal: true, story2: true, … } }（見たものだけ。知らない id は捨てる）
  function parseTips(raw, cfg = Game.config) {
    const d = json(raw), t = { seen: {} };
    if (d && d.seen && typeof d.seen === 'object') for (const id of Game.guide.ids(cfg)) if (d.seen[id] === true) t.seen[id] = true;
    return t;
  }

  Game.save = {
    parseSettings, parseTips,
    loadProgress: (cfg = Game.config) => Game.progress.parse(read(cfg.save.progress), cfg),
    storeProgress: (p, cfg = Game.config) => write(cfg.save.progress, p),
    loadSettings: (cfg = Game.config) => parseSettings(read(cfg.save.settings)),
    storeSettings: (s, cfg = Game.config) => write(cfg.save.settings, s),
    // 途中のラン（編 2）。読めないものは null（検めは run.fromSave）
    loadRun: (cfg = Game.config) => Game.run.fromSave(json(read(cfg.save.run)), cfg),
    storeRun: (run, cfg = Game.config) => write(cfg.save.run, Game.run.toSave(run)),
    clearRun: (cfg = Game.config) => { try { localStorage.removeItem(cfg.save.run); } catch (e) { /* 書けない端末 */ } },
    loadTips: (cfg = Game.config) => parseTips(read(cfg.save.tips), cfg),
    storeTips: (t, cfg = Game.config) => write(cfg.save.tips, t),
  };
})();
</script>

<script>
// 文の表（text.js）を引く t。最初の版は日本語だけ（表の形は HOPPE DIVE と同じなので、あとで言語を足せる）
(function () {
  const Game = (window.Game = window.Game || {});

  const L = {
    cur: 'ja',
    // 'a.b.c' の道をたどる。vars があれば {x} を埋める。ないときは '?'
    t(path, vars, lang = L.cur) {
      let v = Game.text[lang];
      for (const k of path.split('.')) { if (v == null) break; v = v[k]; }
      if (v == null) return '?';
      if (vars && typeof v === 'string') v = v.replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? String(vars[k]) : m));
      return v;
    },
    // 時刻 t の呼び名（「9じ 50ぷん」）
    time(t) {
      const n = Game.clock.name(t);
      if (n.m === 0) return L.t('time.sharp', n);
      if (n.m === 30) return L.t('time.half', n);
      return L.t('time.min', { h: n.h, m: n.m, u: L.t('time.unit.' + n.m) });
    },
  };

  Game.lang = L;
})();
</script>
