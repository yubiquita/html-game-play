    },

    // ---- ステージ選び ----
    // エリアごとに 1 行。返り値: [{ id, area, door, n, open, x, y, w, h }]
    tiles(app) {
      const S = Game.config.layout.select, P = Game.progress, out = [], areas = [];
      for (const d of Game.stages) if (!areas.includes(d.area)) areas.push(d.area);
      for (const d of Game.stages) {
        const row = areas.indexOf(d.area), n = Game.stages.filter((e) => e.area === d.area).indexOf(d);
        out.push({ id: d.id, area: d.area, door: !!d.door, n: n + 1, first: n === 0, open: P.open(app.progress, d.id), x: S.x + n * (S.tile.w + S.tile.gap), y: S.top + row * S.rowH + 13, w: S.tile.w, h: S.tile.h });
      }
      return out;
    },
    select(g, app) {
      const C = Game.config, V = C.view, S = C.layout.select, P = Game.progress, A = B.all();
      g.fillStyle = '#193c3e'; g.fillRect(0, 0, V.w, V.h);
      for (const t of R.tiles(app)) {
        if (t.first) {
          const tot = P.total(app.progress, t.area), name = t.area + ' ' + lt('area.' + t.area), cnt = tot.gems + '/' + tot.stages * 3;
          B.text(g, name, S.x, t.y - 11, '#ffffff');
          B.text(g, cnt, V.w - S.x - B.textW(cnt), t.y - 11, '#2ce8f5');
        }
        const e = P.of(app.progress, t.id);
        g.fillStyle = INK; g.fillRect(t.x, t.y, t.w, t.h);
        g.fillStyle = t.open ? (e.gems[0] ? CARD.paper : '#c0cbdc') : '#262b44'; g.fillRect(t.x + 1, t.y + 1, t.w - 2, t.h - 2);
        const ink = t.open ? INK : '#3a4466';
        if (t.door) {
          // 扉: 小さな石の門
          g.fillStyle = ink; g.fillRect(t.x + 4, t.y + 4, 9, 10); g.fillRect(t.x + 5, t.y + 3, 7, 1);
          g.fillStyle = t.open ? (e.gems[0] ? '#feae34' : '#8b9bb4') : '#262b44'; g.fillRect(t.x + 6, t.y + 6, 5, 8);
        } else { const str = String(t.n); B.text(g, str, t.x + Math.round((t.w - B.textW(str)) / 2), t.y + 5, ink); }
        // ごほうび 3 つ（小さなひし形）と、足あと
        for (let i = 0; i < 3; i++) {
          const x = t.x + 3 + i * 4, y = t.y + 17;
          g.fillStyle = e.gems[i] ? '#0099db' : t.open ? '#8b9bb4' : '#3a4466';
          g.fillRect(x + 1, y, 1, 3); g.fillRect(x, y + 1, 3, 1);
          if (e.gems[i]) { g.fillStyle = '#2ce8f5'; g.fillRect(x + 1, y + 1, 1, 1); }
        }
        if (e.star) { g.fillStyle = INK; g.fillRect(t.x + 1, t.y + 1, 5, 5); g.fillStyle = '#fee761'; g.fillRect(t.x + 3, t.y + 2, 1, 3); g.fillRect(t.x + 2, t.y + 3, 3, 1); }
        if (e.stamp) { g.fillStyle = '#f77622'; g.fillRect(t.x + t.w - 5, t.y + 2, 3, 3); g.fillStyle = '#feae34'; g.fillRect(t.x + t.w - 4, t.y + 3, 1, 1); }
      }
      g.drawImage(app.settings.sound ? A.spkOn : A.spkOff, S.sound.x + 2, S.sound.y + 3);
      // 振動の入り切り（ふるえる端末の絵）
      { const h = S.haptics, on = app.settings.haptics, c = on ? '#ffffff' : '#5a6988'; g.fillStyle = c; g.fillRect(h.x + 4, h.y + 2, 5, 9); g.fillStyle = '#193c3e'; g.fillRect(h.x + 5, h.y + 3, 3, 6); g.fillStyle = c; if (on) { g.fillRect(h.x + 1, h.y + 4, 1, 5); g.fillRect(h.x + 11, h.y + 4, 1, 5); g.fillRect(h.x + 2, h.y + 5, 1, 3); g.fillRect(h.x + 10, h.y + 5, 1, 3); } else { g.fillStyle = '#e43b44'; g.fillRect(h.x + 10, h.y + 5, 1, 1); g.fillRect(h.x + 11, h.y + 6, 1, 1); g.fillRect(h.x + 11, h.y + 4, 1, 1); g.fillRect(h.x + 9, h.y + 4, 1, 1); g.fillRect(h.x + 9, h.y + 6, 1, 1); } }
      R.textBtn(g, C.layout.runBtn, lt('run.name'));
      R.textBtn(g, C.layout.howBtn, lt('how.name'));
      // ぼうけんの記録（クリアしていれば日数、まだなら進んだ面）
      const rec = app.progress.run;
      if (rec.best > 0) B.text(g, rec.days != null ? lt('run.bestDays', { d: rec.days }) : lt('run.bestAt', { b: rec.best }), C.layout.runBtn.x + C.layout.runBtn.w + 3, C.layout.runBtn.y + 5, '#fee761');
      // 途中のランがあるとき: つづきから／あたらしく
      if (app.runAsk) { R.dim(g, 0.7); for (const b of R.askBtns()) R.textBtn(g, b, lt('run.' + b.id)); }
    },

    // app: main.js の app
    draw(app) {
      const g = R.g, C = Game.config, V = C.view, L = C.layout;
      g.imageSmoothingEnabled = false;   // 拡大して描く字（タイトル、擬音）をぼかさない
      g.fillStyle = INK; g.fillRect(0, 0, R.canvas.width, R.canvas.height);
      g.save();
      g.translate(R.fx, R.fy);
      g.beginPath(); g.rect(0, 0, V.w, V.h); g.clip();
      if (app.story) Game.story.draw(g, app);
      else {
        if (app.screen === 'title') R.title(g, app);
        else if (app.screen === 'select') R.select(g, app);
        else if (app.screen === 'how') Game.story.how(g, app);
        else R.play(g, app);
        if (Game.story.tipOn(app)) Game.story.tipCard(g, app);
      }
      g.restore();
    },
    play(g, app) {
      const C = Game.config, V = C.view, L = C.layout, s = app.rules, st = s.stage, vis = app.vis, A = B.all();
      const slow = 0.5 - 0.5 * Math.cos((app.time * 2 * Math.PI) / 1.8);   // ゆっくりした明るさのゆれ
      // 地面・空と木々・日時計・床
      const dayN = st.N + (app.run ? s.extra || 0 : 0);   // 編 2 は「ひるね」で 1 日が延びる
      if (app.run) { g.drawImage(R.ruinGround(), 0, 0); R.ruinTop(g, Math.min(1, vis.used / dayN)); }   // 編 2 は遺跡の中
      else { g.drawImage(R.ground(), 0, 0); R.top(g, Math.min(1, vis.used / dayN)); }
      R.sundial(g, app.run ? { N: dayN, par: dayN, noonAt: dayN, marks: Array.from({ length: dayN - 1 }, (_, i) => i + 1) } : st, vis.used);   // 編 2: レバー 1 回ごとの刻み
      if (st.lock != null) R.door(g, st.lock, app.doorOpen);
      const hints = s.helpOn ? { nums: 'all', mins: true, zones: true, ticks: true, names: true } : st.hints;
      // 助け舟: 並べている間、その並びで針が止まる所に、2 本の針のうすい影を見せる
      const pre = s.helpOn && app.queue.length && !app.anim && app.mode === 'play';
      Game.dial.draw(g, { t: vis.t, hints, items: st.items, taken: vis.taken, wall: st.wall, ghostT: pre ? Game.clock.wrap(s.t + app.queue.reduce((a, b) => a + b, 0)) : null, ghostA: 0.5 + 0.25 * slow });
      // 探検家（夜は横になって寝る。お化けが出た夜は、目を回して気絶）
      const ham = A.hamG[0];
      // お化けの夜は、お化けが出てから 1 拍おいて倒れる（app.fainted）
      if (app.run) R.runHam(g, app);
      else if (app.ghost ? app.fainted : vis.night > 0.5) g.drawImage(ham.down.n, L.ham.x, L.ham.y + 2); else g.drawImage(ham.hold.n, L.ham.x, L.ham.y);
      R.leverArt(g, app.leverPull, app.queue.length > 0 && !app.anim);
      // 夜: 世界を暗くする（札は暗くしない）
      if (vis.night > 0) { g.globalAlpha = vis.night * C.sky.nightDim; g.fillStyle = C.sky.night; g.fillRect(0, 0, V.w, L.queue.y - 3); g.globalAlpha = 1; }
      if (app.ghost && vis.night > 0.3) { g.globalAlpha = Math.min(1, (vis.night - 0.3) * 3); R.ghost(g, L.ham.x + 13, L.ham.y - 20 + Math.round(2 * Math.sin(app.time * 3)), app.time); g.globalAlpha = 1; }
      // 小さなボタン
      R.btnArt(g, L.btn.menu, 'menu', true, 0);
      if (app.mode === 'play') R.btnArt(g, L.btn.sleep, 'sleep', app.run ? true : s.used > 0, s.stuck ? slow : 0);
      if (app.run) R.runTop(g, app);
      if (!app.run && app.mode === 'play' && Game.rules.canHelp(s) && !s.helpOn) R.btnArt(g, L.btn.help, 'help', true, slow);

      // 止まったあとの時刻の名前
      if (st.lock == null && app.nameT > 0 && hints.names && app.mode === 'play') B.text(g, Game.lang.time(s.t), L.sign.x + 1, L.sign.y + 3, '#ffffff', INK);
      // 並べる所と手元
      g.fillStyle = INK; g.fillRect(0, L.queue.y - 3, V.w, V.h - L.queue.y + 3);
      // 針が回っている間: いま使っている札（左から順に消える）の右に、次のぶんを並べられる
      const run = app.running.length, room = run + app.queue.length + Game.rules.room(s, app.queue.length);
      for (let i = 0; i < C.queueMax; i++) {
        const x = L.queue.x + i * (L.queue.w + L.queue.gap);
        g.fillStyle = i < room ? CARD.slot : '#262b44'; g.fillRect(x, L.queue.y, L.queue.w, L.queue.h);
      }
      for (const q of R.queue(app.running.concat(app.queue)).slice(0, C.queueMax)) R.card(g, q.n, q.x, q.y - (q.i < run ? 2 : 0), q.w, q.h, true);
      for (const h of app.run ? R.runHand(app.vHand) : R.hand(st)) R.card(g, h.n, h.x, h.y, h.w, h.h, false);
      if (app.drag) { const H = L.hand; R.card(g, app.drag.n, Math.round(app.drag.x - H.w / 2), Math.round(app.drag.y - H.h / 2 - L.dragLift), H.w, H.h, false); }
      // きょうの残りの枚数では取りきれない: 寝るのをすすめる札（さわると寝る。ほかの所をさわると消える）
      if (app.helpTip && !app.stuckTip && !app.anim && app.mode === 'play' && !s.helpOn) R.noticeArt(g, lt('help'), 1, mix('#2ce8f5', '#ffffff', slow));
      if (app.stuckTip && !app.anim && app.mode === 'play') R.noticeArt(g, lt('stuck'), 1, mix('#fee761', '#ffffff', slow));
      R.demo(g, app);
      app.fx.draw(g);
      if (app.run) R.runPanels(g, app);
      // クリア
      if (app.mode === 'clear' && app.clearT > app.clearWait) {
        const P = L.clear, x = P.x, y = P.y;
        g.fillStyle = INK; g.fillRect(x, y, P.w, P.h);
        g.fillStyle = CARD.paper; g.fillRect(x + 1, y + 1, P.w - 2, P.h - 2);
        const title = lt('clear.title'); B.text(g, title, x + Math.round((P.w - B.textW(title)) / 2), y + 7, INK);
        for (let i = 0; i < 3; i++) g.drawImage(i < app.gemsShown ? A.gem : A.gemOff, x + 22 + i * 14, y + 21);
        const res = Game.rules.result(s);
        if (st.pulls != null) R.star(g, x + 22 + 3 * 14 + 4, y + 21, app.gemsShown >= s.gems && res.star);
        // 足あと（「てがかりを だす」を使わずにクリア）
        if (app.gemsShown >= s.gems && res.stamp) g.drawImage(A.foot, x + 45, y + 34);
        if (app.gemsShown >= s.gems) for (const b of R.clearBtns(app)) R.textBtn(g, b, lt('clear.' + b.id));
      }
    },
  };

  Game.render = R;
})();
</script>
<script>
// 導入の絵: おはなし（紙芝居）とヒントの札。演出だけ（ルールの状態を書き換えない）。設計書: docs/specs/2026-11-15-hoppe-clock-intro-design.md
// 何を出すかは guide.js と main.js が決める。ここは描くだけ。置き場所は config.guide
(function () {
  const Game = (window.Game = window.Game || {});
  const B = Game.bake, R = Game.render;
  const lt = (path, vars) => Game.lang.t(path, vars);
  const INK = '#181425', PAPER = '#ead4aa', GOLD = '#feae34';

  // ---- おはなしの絵（id: 1 | 2、i: 何枚め 0〜3、t: その枚が出てからの秒） ----
  function page(g, id, i, t) {
    const V = Game.config.view, H = Game.config.guide.story.artH, f = PAGES[id + '-' + (i + 1)];
    g.save(); g.beginPath(); g.rect(0, 0, V.w, H); g.clip();
    if (f) f(g, t);
    else { g.fillStyle = '#193c3e'; g.fillRect(0, 0, V.w, H); R.center(g, id + '-' + (i + 1), 70, '#5a6988'); }
    g.restore();
  }

  // ---- 絵の道具 ----
  const clamp01 = (x) => Math.max(0, Math.min(1, x));
  const seg = (u, a, b) => { const x = clamp01((u - a) / (b - a)); return x * x * (3 - 2 * x); };   // u が a〜b の間に 0 → 1（なめらかに）
  const loop = (t, sec) => (t % sec) / sec;
  const whole = (v) => (Math.abs(v - Math.round(v)) < 1e-6 ? Math.round(v) : v);   // 止まっているときは、表の座標（整数）で描く
  const HINTS = { nums: 'all', ticks: true };
  const tmps = {};
  function tmp(w, h) {
    const k = w + 'x' + h, c = tmps[k] || (tmps[k] = B.mk(w, h)), g = c.getContext('2d');
    g.clearRect(0, 0, w, h); g.imageSmoothingEnabled = false;
    return [c, g];
  }
  // 見本の盤: 遊ぶ窓と同じ座標で描いてから、床のまわり（r の大きさ）を切り出して貼る。dy: 切り出す窓を上へずらす（床の上の探検家や扉を入れる）
  function board(g, r, dy, draw, ruin) {
    const V = Game.config.view, D = Game.config.dial, [c, sg] = tmp(V.w, V.h);
    sg.drawImage(ruin ? R.ruinGround() : R.ground(), 0, 0);   // ruin: 編 2 の盤（遺跡の中）
    draw(sg);
    g.drawImage(c, D.cx - (r.w >> 1), D.cy - (r.h >> 1) - dy, r.w, r.h, r.x, r.y, r.w, r.h);
  }
  const dial = (sg, t, items, taken, wall) => Game.dial.draw(sg, { t: whole(t), hints: HINTS, items, taken: taken || [], wall: wall == null ? null : wall });
  // 取れたときのきらきら（k: 0 → 1 で広がって消える）
  function burst(g, p, k) {
    if (k <= 0 || k >= 1) return;
    for (let i = 0; i < 6; i++) { const a = (i / 6) * 2 * Math.PI + 0.4, d = 3 + 9 * k; R.sparkle(g, p.x + Math.round(d * Math.cos(a)), p.y + Math.round(d * Math.sin(a)), 1 - k); }
  }
  // 目を引く枠（ゆっくり明るくなる）
  function ring(g, p, n, a) { g.globalAlpha = a; g.fillStyle = '#ffffff'; g.fillRect(p.x - n, p.y - n, 2 * n + 1, 1); g.fillRect(p.x - n, p.y + n, 2 * n + 1, 1); g.fillRect(p.x - n, p.y - n, 1, 2 * n + 1); g.fillRect(p.x + n, p.y - n, 1, 2 * n + 1); g.globalAlpha = 1; }
  // 文字盤の上の探検家（up: 跳んでいる高さ、hit: 目を回す）
  function ham(sg, pos, up, hit, t) {
    const A = B.all().hamG[0], p = Game.dial.at(Game.config.run.hamR, pos / 12);
    sg.fillStyle = 'rgba(24,20,37,0.35)'; sg.fillRect(p.x - 5, p.y + 2, 10, 2);
    sg.drawImage(hit ? A.hit.n : A.hold.n, p.x - 8 + (hit ? (Math.floor(t * 30) % 2 ? 1 : -1) : 0), p.y - 13 - Math.round(up));
  }
  const fires = (g, x, y, n, t) => { for (let i = 0; i < 3; i++) R.flame(g, x + i * 9, y, i < n, t); };
  // k 倍に大きくして描く（小さな絵を、見本の枠で見やすく）
  function big(g, w, h, k, x, y, draw) { const [c, cg] = tmp(w, h); draw(cg); g.drawImage(c, x, y, w * k, h * k); }
  // 山札（裏向きの札の重なり）
  function pile(g, x, y) {
    for (let i = 2; i >= 0; i--) { g.fillStyle = INK; g.fillRect(x + i * 2, y - i * 2, 25, 28); g.fillStyle = '#3a4466'; g.fillRect(x + i * 2 + 1, y - i * 2 + 1, 23, 26); g.fillStyle = '#5a6988'; g.fillRect(x + i * 2 + 1, y - i * 2 + 1, 23, 1); }
    g.fillStyle = '#5a6988'; g.fillRect(x + 8, y + 9, 9, 9); g.fillStyle = '#3a4466'; g.fillRect(x + 10, y + 11, 5, 5);
  }
  const lerp = (a, b, k) => Math.round(a + (b - a) * k);
  const HC = { w: 25, h: 28 }, QC = { w: 17, h: 15 };

  // ---- ヒントの見本（r: 枠、t: 出てからの秒。くり返す） ----
  const ARTS = {
    // 短い針が宝へ進んで止まり、宝が光る（1 じかんの札 2 枚ぶん）
    goal(g, t, r) {
      const u = loop(t, 4), tt = 36 + 12 * seg(u, 0.12, 0.36) + 12 * seg(u, 0.42, 0.66), got = u >= 0.66, it = [{ ring: 'in', pos: 60, kind: 'gem' }];
      board(g, r, 0, (sg) => { dial(sg, tt, it, [got]); burst(sg, Game.dial.pts().in[60], (u - 0.66) / 0.25); });
    },
    // 長い針が外の宝で止まる
    outer(g, t, r) {
      const u = loop(t, 3.6), tt = 48 + 3 * seg(u, 0.2, 0.55), got = u >= 0.55, it = [{ ring: 'out', pos: 3, kind: 'gem' }];
      board(g, r, 0, (sg) => { dial(sg, tt, it, [got]); burst(sg, Game.dial.pts().out[3], (u - 0.55) / 0.3); });
    },
    // 内の宝と対の印: 長い針が印に、短い針が宝に重なって取れる
    pair(g, t, r) {
      const u = loop(t, 4.4), tt = 48 + 4 * seg(u, 0.4, 0.68), got = u >= 0.68, it = [{ ring: 'in', pos: 52, kind: 'gem' }], D = Game.config.dial;
      board(g, r, 0, (sg) => {
        dial(sg, tt, it, [got]);
        if (u < 0.4) { const a = 0.5 - 0.5 * Math.cos((u / 0.4) * 4 * Math.PI); ring(sg, Game.dial.at(D.pairR, 4 / 12), 3, a); ring(sg, Game.dial.pts().in[52], 4, a); }
        burst(sg, Game.dial.pts().in[52], (u - 0.68) / 0.25);
      });
    },
    // 罠: 止まると弾かれる。通りすぎるのは平気
    trap(g, t, r) {
      const u = loop(t, 6), tt = 48 + 3 * seg(u, 0.06, 0.2) - 3 * seg(u, 0.3, 0.4) + 6 * seg(u, 0.55, 0.8), it = [{ ring: 'out', pos: 3, kind: 'trap' }];
      board(g, r, 0, (sg) => {
        dial(sg, tt, it);
        if (u >= 0.2 && u < 0.32) { const p = Game.dial.pts().out[3], str = lt('fx.bounce'); B.text(sg, str, p.x - B.textW(str) + 4, p.y - 16, '#ffffff', INK); }
      });
    },
    // 壁: 短い針は越えられない
    wall(g, t, r) {
      const u = loop(t, 4.4), tt = 44 + 15.4 * seg(u, 0.12, 0.42) - 15.4 * seg(u, 0.55, 0.7);
      board(g, r, 0, (sg) => {
        dial(sg, tt, [], [], 60);
        if (u >= 0.42 && u < 0.56) { const p = Game.dial.pts().in[60], str = lt('fx.bounce'); B.text(sg, str, p.x - 6, p.y - 14, '#ffffff', INK); }
      });
    },
    // 扉: 彫ってある時刻に針を合わせると開く
    lock(g, t, r) {
      const u = loop(t, 5), tt = 15 * seg(u, 0.15, 0.5), open = seg(u, 0.56, 0.86), D = Game.config.dial, L = Game.config.layout.door, dy = 30;
      board(g, r, dy, (sg) => {
        dial(sg, tt, []);
        sg.save(); sg.translate(D.cx - (r.w >> 1) + 5 - L.x, D.cy - (r.h >> 1) - dy + 5 - L.y); R.door(sg, 15, open); sg.restore();
      });
    },
    // 長い針が探検家に当たり、火が消える
    hit(g, t, r) {
      const u = loop(t, 4.4), k = seg(u, 0.15, 0.6), hitNow = k >= 0.5, dizzy = hitNow && u < 0.85;
      board(g, r, 22, (sg) => { dial(sg, 117 + 6 * k, []); ham(sg, 0, 0, dizzy, t); if (hitNow && u < 0.75) { const p = Game.dial.at(Game.config.run.hamR, 0), str = lt('fx.hit'); B.text(sg, str, p.x + 10, p.y - 8, '#ffffff', INK); } }, true);
      fires(g, r.x + 4, r.y + 4, hitNow ? 2 : 3, t);
    },
    // 「15 ふん」のあとに「ジャンプ」: その札の針を跳びこえる
    jump(g, t, r) {
      const u = loop(t, 4.4), k = clamp01((u - 0.3) / 0.4), e = seg(u, 0.3, 0.7), put1 = u >= 0.06, put2 = u >= 0.16;
      board(g, r, 22, (sg) => { dial(sg, 118 + 3 * e, []); ham(sg, 0, Game.config.run.jumpH * Math.sin(Math.PI * k), false, t); }, true);
      fires(g, r.x + 4, r.y + 4, 3, t);
      const y = r.y + r.h - QC.h - 3;
      if (put1 && u < 0.72) R.card(g, 't3', r.x + 3, y, QC.w, QC.h, true);
      if (put2 && u < 0.72) R.card(g, 'jump', r.x + 4 + QC.w, y, QC.w, QC.h, true);
    },
    // 日時計の影が進み、空が夕方から夜へ（札を 1 枚使うごとに）
    dusk(g, t, r) {
      const N = 6, u = loop(t, 6), used = Math.min(N, Math.floor(u * (N + 1.5))), p = used / N, night = seg(u, 0.84, 0.94), st = { N, par: 2, noonAt: 4 };
      g.save(); g.translate(r.x - 16, r.y + 14); R.top(g, p); R.sundial(g, st, used); g.restore();
      g.fillStyle = '#265c42'; g.fillRect(r.x, r.y + 14 + Game.config.layout.topH, r.w, r.h);
      g.fillStyle = '#193c3e'; g.fillRect(r.x, r.y, r.w, 14);
      for (let i = used; i < N; i++) R.card(g, 12, r.x + 3 + i * (QC.w + 2), r.y + 80, QC.w, QC.h, true);
      if (night > 0) { g.globalAlpha = night * 0.7; g.fillStyle = Game.config.sky.night; g.fillRect(r.x, r.y, r.w, r.h); g.globalAlpha = 1; }
    },
    // ごほうび 3 つと星が、順に光る
    reward(g, t, r) {
      const u = loop(t, 4), A = B.all(), n = u < 0.12 ? 0 : u < 0.3 ? 1 : u < 0.48 ? 2 : 3, star = u >= 0.66, k = 3, gw = A.gem.width, gh = A.gem.height, step = gw * k + 5;
      const x0 = r.x + Math.round((r.w - (3 * step + 7 * k)) / 2), y0 = r.y + Math.round((r.h - gh * k) / 2);
      for (let i = 0; i < 3; i++) g.drawImage(i < n ? A.gem : A.gemOff, x0 + i * step, y0, gw * k, gh * k);
      big(g, 7, 7, k, x0 + 3 * step, y0 + Math.round((gh - 7) * k / 2), (cg) => R.star(cg, 0, 0, star));
      if (star) burst(g, { x: x0 + 3 * step + 10, y: y0 + Math.round(gh * k / 2) }, (u - 0.66) / 0.3);
    },
    // 札を並べると、山から 1 枚来る
    draw(g, t, r) {
      const u = loop(t, 4.4), a = seg(u, 0.12, 0.38), b = seg(u, 0.5, 0.8), hy = r.y + 80, hx = (i) => r.x + 5 + i * (HC.w + 2), qx = r.x + 8, qy = r.y + 20, px = r.x + r.w - HC.w - 9;
      for (let i = 0; i < 4; i++) { g.fillStyle = '#262b44'; g.fillRect(qx + i * (QC.w + 1), qy, QC.w, QC.h); }
      pile(g, px, hy);
      R.card(g, 't2', hx(1), hy, HC.w, HC.h, false); R.card(g, 'jump', hx(2), hy, HC.w, HC.h, false);
      if (a < 0.6) R.card(g, 't3', lerp(hx(0), qx, a), lerp(hy, qy, a), HC.w, HC.h, false);
      else R.card(g, 't3', lerp(hx(0), qx, a), lerp(hy, qy, a), QC.w, QC.h, true);
      if (b > 0) R.card(g, 't1', lerp(px, hx(0), b), hy, HC.w, HC.h, false);
    },
    // 5 つに区切った日時計がレバー 1 回ごとに進み、使いきると夜になって火が 1 つ消える
    day(g, t, r) {
      const N = 5, u = loop(t, 6), used = Math.min(N, Math.floor(u * (N + 2.2))), night = seg(u, 0.72, 0.82), S = Game.config.layout.sundial, k = 3, w = 2 * S.r + 4;
      big(g, w, w + 2, k, r.x + Math.round((r.w - w * k) / 2), r.y + 4, (cg) => { cg.translate(S.r + 2 - S.cx, S.r + 2 - S.cy); R.sundial(cg, { N, par: N, noonAt: N, marks: [1, 2, 3, 4] }, used); cg.setTransform(1, 0, 0, 1, 0, 0); });
      if (night > 0) { g.globalAlpha = night * 0.6; g.fillStyle = Game.config.sky.night; g.fillRect(r.x, r.y, r.w, r.h); g.globalAlpha = 1; }
      for (let i = 0; i < 3; i++) big(g, 9, 9, 2, r.x + 31 + i * 20, r.y + 98, (cg) => R.flame(cg, 2, 2, i < (night > 0.5 ? 2 : 3), t));
    },
    // 札 3 枚のうち 1 枚が山へ入る
    pick(g, t, r) {
      const u = loop(t, 4.4), lift = seg(u, 0.15, 0.3), go = seg(u, 0.36, 0.72), ids = ['t4', 'jump', 'half'], y = r.y + 22, hx = (i) => r.x + 14 + i * (HC.w + 8), px = r.x + Math.round((r.w - HC.w) / 2) - 2, py = r.y + 84;
      pile(g, px, py);
      ids.forEach((id, i) => { if (i !== 1) R.card(g, id, hx(i), y, HC.w, HC.h, false); });
      if (go < 1) R.card(g, ids[1], lerp(hx(1), px + 4, go), lerp(y - 4 * lift, py - 4, go), HC.w, HC.h, false);
    },
    // やすみば: 山から札が 1 枚抜ける。火が 1 つともる
    rest(g, t, r) {
      const u = loop(t, 5), out = seg(u, 0.1, 0.4), lit = u >= 0.62, px = r.x + 16, py = r.y + 56;
      pile(g, px, py);
      if (out > 0 && out < 1) { g.globalAlpha = 1 - out; R.card(g, 't1', px + 4, lerp(py - 4, py - 44, out), HC.w, HC.h, false); g.globalAlpha = 1; }
      big(g, 9, 9, 4, r.x + 72, r.y + 46, (cg) => R.flame(cg, 2, 2, lit, t));
      if (lit) burst(g, { x: r.x + 72 + 18, y: r.y + 46 + 18 }, (u - 0.62) / 0.3);
    },
  };
  function tipArt(g, id, t, r) {
    g.fillStyle = INK; g.fillRect(r.x - 1, r.y - 1, r.w + 2, r.h + 2);
    g.fillStyle = '#193c3e'; g.fillRect(r.x, r.y, r.w, r.h);
    g.save(); g.beginPath(); g.rect(r.x, r.y, r.w, r.h); g.clip();
    if (ARTS[id]) ARTS[id](g, t, r);
    g.restore();
  }

  // ---- おはなしの場面 ----
  // 遊ぶ窓と同じ座標で場面を描いてから、縦に y0 から絵の高さぶんを切り出して貼る
  function scene(g, y0, draw) {
    const V = Game.config.view, H = Game.config.guide.story.artH, [c, sg] = tmp(V.w, V.h);
    draw(sg);
    g.drawImage(c, 0, y0, V.w, H, 0, 0, V.w, H);
  }
  const world = (sg, p) => { sg.drawImage(R.ground(), 0, 0); R.top(sg, p); };
  // 大きな探検家（2 倍）
  const bigHam = (g, img, x, y) => g.drawImage(img, Math.round(x), Math.round(y), img.width * 2, img.height * 2);
  // 遺跡の奥: 暗い石の壁と床、上のまん中に入口。open（0〜1）: 入口の石の板の開き具合
  function ruin(sg, open, t) {
    const V = Game.config.view;
    sg.fillStyle = '#262b44'; sg.fillRect(0, 0, V.w, V.h);
    for (let y = 0, k = 0; y < 60; y += 8, k++) {
      sg.fillStyle = '#3a4466'; sg.fillRect(0, y, V.w, 7);
      sg.fillStyle = '#4a5578'; sg.fillRect(0, y, V.w, 1);
      sg.fillStyle = '#262b44'; for (let x = (k % 2) * 9 + 3; x < V.w; x += 18) sg.fillRect(x, y, 1, 7);
    }
    sg.fillStyle = '#2e3550'; sg.fillRect(0, 60, V.w, V.h - 60);
    sg.fillStyle = '#3a4466'; for (let i = 0; i < 70; i++) sg.fillRect((i * 53) % V.w, 62 + ((i * 37) % 130), 3 + (i % 3), 1);
    sg.fillStyle = '#3e8948'; for (let i = 0; i < 16; i++) sg.fillRect((i * 29 + 5) % V.w, 58 + (i % 3), 2, 2);
    // 入口
    const x = 52, y = 27, w = 30, h = 26, slab = Math.round(h * (1 - open));
    sg.fillStyle = INK; sg.fillRect(x - 4, y - 4, w + 8, h + 4);
    sg.fillStyle = '#5a6988'; sg.fillRect(x - 3, y - 3, w + 6, h + 3);
    sg.fillStyle = '#8b9bb4'; sg.fillRect(x - 3, y - 3, w + 6, 1);
    sg.fillStyle = '#a5dcf7'; sg.fillRect(x, y, w, h);
    sg.fillStyle = '#3e8948'; sg.fillRect(x, y + 13, w, h - 13);
    sg.fillStyle = '#63c74d'; for (let i = 0; i < 6; i++) sg.fillRect(x + i * 5, y + 11 + (i % 2) * 2, 5, 2);
    if (slab > 0) {
      sg.fillStyle = '#8b9bb4'; sg.fillRect(x, y, w, slab);
      sg.fillStyle = '#c0cbdc'; sg.fillRect(x, y, 1, slab);
      sg.fillStyle = '#5a6988'; for (let i = 0; i < 7; i++) { const yy = y + ((i * 7 + 3) % h); if (yy < y + slab) sg.fillRect(x + 2 + ((i * 11) % (w - 6)), yy, 3, 1); }
      sg.fillStyle = INK; sg.fillRect(x, y + slab - 1, w, 1);
    }
    // 壁のたいまつ
    for (const tx of [16, 104]) big(sg, 9, 9, 2, tx, 38, (cg) => R.flame(cg, 2, 2, true, t + tx));   // 「とばす」の下
  }
  const T0 = 6.5;   // 場面がくり返す秒（音は最初の 1 回だけ）
  const PAGES = {
    // ジャングルの奥の、苔むした円い石の床。手前に大きな探検家が歩いてくる
    '1-1'(g, t) {
      const A = B.all().hamG[0], V = Game.config.view, D = Game.config.dial;
      scene(g, 14, (sg) => {
        world(sg, 0.1);
        sg.drawImage(Game.dial.floor({ nums: 'none' }), 0, 0);
        sg.fillStyle = '#3e8948'; for (let i = 0; i < 60; i++) { const p = Game.dial.at(12 + ((i * 17) % 44), (i * 0.171) % 1); sg.fillRect(p.x, p.y, 2 + (i % 2), 1); }
        sg.fillStyle = '#265c42'; for (let i = 0; i < 24; i++) { const p = Game.dial.at(50 + (i % 7), (i * 0.093) % 1); sg.fillRect(p.x - 1, p.y, 3, 2); }
        const k = (t % 3) / 3; if (k < 0.5) R.sparkle(sg, D.cx + 18, D.cy - 22, Math.sin(Math.PI * k * 2));
      });
      const go = seg(t, 0.3, 1.9), x = -40 + 50 * go, y = Game.config.guide.story.artH - 36;
      bigHam(g, go < 1 ? A.run[Math.floor(t * 9) % A.run.length].n : A.hold.n, x, y + (go < 1 ? 0 : Math.round(Math.sin(t * 2.5))));
      if (t > 2.1) R.big(g, '!', x + 46, y - 4 - Math.round(2 * Math.max(0, 1 - (t - 2.1) * 4)), 2, '#fee761');
    },
    // 札が 2 枚並び、レバーが倒れて、針が回る
    '1-2'(g, t) {
      const C = Game.config, L = C.layout, V = C.view, A = B.all().hamG[0], n = Math.floor(t / T0), u = t % T0, Q = L.queue;
      const tt = 36 + 18 * n + 12 * seg(u, 2.0, 2.9) + 6 * seg(u, 2.95, 3.4), pull = seg(u, 1.6, 1.75) - seg(u, 3.5, 3.8);
      scene(g, 55, (sg) => {
        world(sg, 0.1); dial(sg, tt % 144, []);
        sg.drawImage(A.hold.n, L.ham.x, L.ham.y);
        R.leverArt(sg, pull, u >= 0.5 && u < 1.6);
        sg.fillStyle = INK; sg.fillRect(0, Q.y - 3, V.w, V.h);
        for (let i = 0; i < C.queueMax; i++) { sg.fillStyle = '#193c3e'; sg.fillRect(Q.x + i * (Q.w + Q.gap), Q.y, Q.w, Q.h); }
        if (u >= 0.5 && u < 2.9) R.card(sg, 12, Q.x, Q.y - (u >= 2.0 ? 2 : 0), Q.w, Q.h, true);
        if (u >= 1.0 && u < 3.4) R.card(sg, 6, Q.x + Q.w + Q.gap, Q.y - (u >= 2.0 ? 2 : 0), Q.w, Q.h, true);
      });
    },
    // 長い針が宝の上で止まり、宝が光って探検家へ飛ぶ
    '1-3'(g, t) {
      const L = Game.config.layout, A = B.all(), u = t % T0, tt = 94 + 4 * seg(u, 0.8, 2.0), got = u >= 2.0, p = Game.dial.pts().out[2], fly = seg(u, 2.2, 3.0);
      scene(g, 36, (sg) => {
        world(sg, 0.1); dial(sg, tt, [{ ring: 'out', pos: 2, kind: 'gem' }], [got]);
        sg.drawImage(A.hamG[got && fly >= 1 ? 2 : 0].hold.n, L.ham.x, L.ham.y);
        burst(sg, p, (u - 2.0) / 0.5);
        if (got) {
          const hx = L.ham.x + 6, hy = L.ham.y - 9 + (fly >= 1 ? Math.round(Math.sin(t * 3)) : 0);
          sg.drawImage(A.gem, lerp(p.x - 4, hx, fly), lerp(p.y - 4, hy, fly) - Math.round(14 * Math.sin(Math.PI * fly)));
        }
      });
    },
    // 夕方の空と日時計。奥に石の扉。宝を持った探検家
    '1-4'(g, t) {
      const A = B.all(), u = t % (T0 + 2), p = 0.1 + 0.8 * seg(u, 0.5, 6), N = 8, H = Game.config.guide.story.artH, D = Game.config.layout.door;
      scene(g, 0, (sg) => {
        world(sg, p); R.sundial(sg, { N, par: 3, noonAt: 5 }, N * p);
        dial(sg, 30, []);
        R.door(sg, 42, 0);
        ring(sg, { x: D.x + (D.w >> 1), y: D.y + (D.h >> 1) - 1 }, (D.w >> 1) + 4, 0.25 + 0.35 * (0.5 - 0.5 * Math.cos(t * 2)));
      });
      const y = H - 36 + Math.round(Math.sin(t * 2.5));
      bigHam(g, A.hamG[2].hold.n, 8, y);
      g.drawImage(A.gem, 46, y - 8, A.gem.width * 2, A.gem.height * 2);
    },
    // 暗い遺跡の中の文字盤。縁に探検家
    '2-1'(g, t) {
      const A = B.all().hamG[0], go = seg(t, 0.3, 1.6);
      scene(g, 22, (sg) => {
        ruin(sg, 1, t); dial(sg, 0, []);
        sg.drawImage(go < 1 ? A.run[Math.floor(t * 9) % A.run.length].n : A.hold.n, lerp(-18, 0, go), 121);   // 床の左の縁の外
      });
    },
    // 文字盤の上の探検家。うしろで入口が閉じる
    '2-2'(g, t) {
      const close = clamp01((t - 0.4) / 1.38), slam = t >= 1.78, shake = slam && t < 2.1 ? (Math.floor(t * 30) % 2 ? 1 : -1) : 0;
      g.save(); g.translate(0, shake);
      scene(g, 22, (sg) => {
        ruin(sg, 1 - close, t); dial(sg, 0, []);
        ham(sg, 9, slam && t < 2.0 ? 4 : 0, slam && t < 2.6, t);
        if (slam && t < 3) { const p = Game.dial.at(Game.config.run.hamR, 9 / 12); R.big(sg, '!', p.x + 4, p.y - 34, 2, '#fee761'); }
      });
      g.restore();
    },
    // 長い針が探検家へ迫る: 1 回めは当たって火が消え、2 回めは跳んでよける
    '2-3'(g, t) {
      const P = 2.6, u = t % (2 * P), lap = u < P ? 0 : 1, k = (u % P) / P, tt = 3 + 12 * k + 12 * lap, at9 = 0.5;   // 長針は 3 から 1 周。半分で探検家（9）に届く
      const hitNow = lap === 0 && k >= at9, jump = lap === 1 ? clamp01((k - at9 + 0.16) / 0.32) : 0;
      scene(g, 22, (sg) => {
        ruin(sg, 0, t); dial(sg, tt, []);
        ham(sg, 9, jump > 0 && jump < 1 ? Game.config.run.jumpH * Math.sin(Math.PI * jump) : 0, hitNow && k < at9 + 0.3, t);
        const p = Game.dial.at(Game.config.run.hamR, 9 / 12);
        if (hitNow && k < at9 + 0.25) { const str = lt('fx.hit'); B.text(sg, str, p.x + 8, p.y - 24, '#ffffff', INK); }
        if (jump > 0 && jump < 1) { const str = lt('fx.jump'); B.text(sg, str, p.x + 8, p.y - 34, '#ffffff', INK); }
      });
      for (let i = 0; i < 3; i++) big(g, 9, 9, 2, 4 + i * 16, Game.config.guide.story.artH - 22, (cg) => R.flame(cg, 2, 2, i < (hitNow || lap === 1 ? 2 : 3), t));
    },
    // 扉が 8 つ奥へ並び、いちばん奥で金の懐中時計が光る
    '2-4'(g, t) {
      const V = Game.config.view, H = Game.config.guide.story.artH, A = B.all().hamG[0], cx = V.w >> 1, cy = 68;
      g.fillStyle = '#181425'; g.fillRect(0, 0, V.w, H);
      for (let i = 0; i < 8; i++) {
        const k = Math.pow(0.8, i), w = Math.round(132 * k), h = Math.round(140 * k), x = cx - (w >> 1), y = cy - Math.round(h * 0.48), b = Math.max(2, Math.round(9 * k));
        g.fillStyle = INK; g.fillRect(x - 1, y - 1, w + 2, h + 2);
        g.fillStyle = ['#8b9bb4', '#7a89a6', '#6a7896', '#5a6988', '#4d5a7a', '#424c6c', '#3a4466', '#30385a'][i]; g.fillRect(x, y, w, h);
        g.fillStyle = 'rgba(255,255,255,0.18)'; g.fillRect(x, y, w, 1); g.fillRect(x, y, 1, h);
        g.fillStyle = i === 7 ? '#3e2731' : '#181425'; g.fillRect(x + b, y + b, w - 2 * b, h - b);
      }
      // いちばん奥の光と、時計の形の宝
      const glow = 0.5 - 0.5 * Math.cos(t * 2.2);
      for (let r = 14; r >= 6; r -= 4) { g.globalAlpha = 0.12 + 0.1 * glow; g.fillStyle = '#fee761'; g.fillRect(cx - r, cy - r + 2, 2 * r + 1, 2 * r + 1); }
      g.globalAlpha = 1;
      R.watch(g, cx, cy + 4, t);
      for (let i = 0; i < 5; i++) { const a = t * 0.8 + i * 1.257, k = 0.5 + 0.5 * Math.sin(t * 3 + i * 2); R.sparkle(g, cx + Math.round(15 * Math.cos(a)), cy + 3 + Math.round(13 * Math.sin(a)), k); }
      bigHam(g, A.hold.n, 6, H - 36 + Math.round(Math.sin(t * 2.5)));
    },
  };
  // 場面の音（その枚が出てからの秒, 出来事）。最初の 1 回だけ鳴らす。擬音の字は出さない
  const CUES = {
    '1-2': [[0.5, { type: 'put', n: 12 }], [1.0, { type: 'put', n: 6 }], [1.6, { type: 'lever' }]].concat([0, 1, 2, 3, 4, 5].map((i) => [2.0 + i * 0.23, { type: 'tick', k: i }])),
    '1-3': [0, 1, 2, 3].map((i) => [0.8 + i * 0.3, { type: 'tick', k: i }]).concat([[2.0, { type: 'take' }]]),
    '2-2': [[0.4, { type: 'door' }]],
    '2-3': [[1.3, { type: 'hit' }], [2.6 + 0.9, { type: 'jump' }]],
    '2-4': [[0.5, { type: 'gem', i: 2 }], [0.75, { type: 'gem', i: 4 }]],
  };

  const S = {
    PAGES, ARTS, page, tipArt,
    cues(id, i) { return CUES[id + '-' + (i + 1)] || []; },
    // ヒントが出ているか（札やレバーをつまんでいる間は、離すまで待つ）
    tipOn(app) { return app.tipQ.length > 0 && !app.drag && !app.leverDrag; },
    // おはなしの 1 枚の字数
    len(id, i) { return lt('story.' + id)[i].reduce((n, s) => n + [...s].length, 0); },
    pages(id) { return lt('story.' + id).length; },
    skipBtn() { return Game.config.guide.story.skip; },

    // おはなし: 上に絵、下に暗い帯と白い文（1 字ずつ）。右上に「とばす」、右下に丸とめくれる印
    draw(g, app) {
      const C = Game.config, V = C.view, G = C.guide, L = G.story, s = app.story;
      g.fillStyle = INK; g.fillRect(0, 0, V.w, V.h);
      page(g, s.id, s.page, s.age);
      g.fillStyle = INK; g.fillRect(0, L.artH, V.w, V.h - L.artH);
      g.fillStyle = '#3a4466'; g.fillRect(0, L.artH, V.w, 1);
      const lines = lt('story.' + s.id)[s.page];
      let left = Math.floor(s.t / G.charSec);
      lines.forEach((str, j) => {
        const chars = [...str], n = Math.max(0, Math.min(chars.length, left));
        left -= chars.length;
        if (n > 0) B.text(g, chars.slice(0, n).join(''), L.textX, L.textY + j * L.lineH, '#ffffff');
      });
      // 何枚めかの丸
      const total = lines.length ? S.pages(s.id) : 0;
      for (let k = 0; k < total; k++) { g.fillStyle = k === s.page ? '#ffffff' : '#5a6988'; g.fillRect(V.w - 22 - (total - 1 - k) * 6, V.h - 11, 3, 3); }
      // めくれる印（文が出終わったら、ゆっくり上下する）
      if (left >= 0) {
        const y = V.h - 13 + Math.round(1.5 * Math.sin(app.time * 4));
        g.fillStyle = '#fee761'; g.fillRect(V.w - 13, y, 7, 1); g.fillRect(V.w - 12, y + 1, 5, 1); g.fillRect(V.w - 11, y + 2, 3, 1); g.fillRect(V.w - 10, y + 3, 1, 1);
      }
      // とばす
      const k = S.skipBtn(), str = lt('story.skip');
      g.fillStyle = 'rgba(24,20,37,0.6)'; g.fillRect(k.x, k.y, k.w, k.h);
      B.text(g, str, k.x + Math.round((k.w - B.textW(str)) / 2), k.y + 3, '#c0cbdc');
      // めくるときの短い暗転
      if (s.fade > 0) R.dim(g, Math.min(1, s.fade / G.fadeSec));
    },

    // ---- あそびかた（見直し）: おはなし 2 本と、ヒントのます。まだ見ていないヒントは「?」 ----
    // 返り値: [{ kind: 'story' | 'tip', id, seen, x, y, w, h }]。main の当たりにも使う
    howCells(app) {
      const G = Game.config.guide, W = G.how, out = [];
      for (const id of [1, 2]) out.push({ kind: 'story', id, seen: true, x: W.x, y: W.storyY + (id - 1) * W.rowH, w: W.w, h: 16 });
      G.tips.forEach((id, i) => out.push({ kind: 'tip', id, seen: !!app.tips.seen[id], x: W.x + (i % 2) * (W.cellW + 3), y: W.tipY + Math.floor(i / 2) * (W.cellH + W.cellGap), w: W.cellW, h: W.cellH }));
      return out;
    },
    how(g, app) {
      const V = Game.config.view, W = Game.config.guide.how;
      g.fillStyle = '#193c3e'; g.fillRect(0, 0, V.w, V.h);
      B.text(g, lt('how.name'), Math.round((V.w - B.textW(lt('how.name'))) / 2), 5, GOLD, INK);
      B.text(g, lt('how.story'), W.x, W.storyY - 11, '#ffffff');
      B.text(g, lt('how.tips'), W.x, W.tipY - 11, '#ffffff');
      for (const c of S.howCells(app)) {
        if (c.kind === 'story') { R.textBtn(g, c, lt('story.name.' + c.id)); continue; }
        g.fillStyle = INK; g.fillRect(c.x, c.y, c.w, c.h);
        g.fillStyle = c.seen ? PAPER : '#262b44'; g.fillRect(c.x + 1, c.y + 1, c.w - 2, c.h - 2);
        const str = c.seen ? lt('tip.' + c.id + '.head') : '?';
        B.text(g, str, c.x + Math.round((c.w - B.textW(str)) / 2), c.y + 4, c.seen ? INK : '#5a6988');
      }
      R.textBtn(g, R.backBtn(), lt('how.back'));
    },

    // ヒントの札: 遊びを暗くして、見出し・見本・文・「タップで つづける」
    tipCard(g, app) {
      const C = Game.config, G = C.guide, P = G.tip, id = app.tipQ[0], T = lt('tip.' + id);
      R.dim(g, 0.6);
      R.panel(g, P.x, P.y, P.w, P.h);
      B.text(g, T.head, P.x + Math.round((P.w - B.textW(T.head)) / 2), P.y + 7, GOLD, INK);
      tipArt(g, id, app.tipAge, { x: P.x + P.art.x, y: P.y + P.art.y, w: P.art.w, h: P.art.h });
      T.lines.forEach((str, j) => B.text(g, str, P.x + Math.round((P.w - B.textW(str)) / 2), P.y + P.textY + j * P.lineH, INK));
      if (app.tipAge >= G.holdSec) {
        const tap = lt('tip.tap');
        g.globalAlpha = 0.55 + 0.45 * (0.5 - 0.5 * Math.cos((app.time * 2 * Math.PI) / 1.8));
        B.text(g, tap, P.x + P.w - 5 - B.textW(tap), P.y + P.h - 12, '#733e39');
        g.globalAlpha = 1;
      }
    },
  };

  Game.story = S;
})();
</script>
<script>
// つなぎ: 指の動きをルールの操作にし、ルールが返す出来事を演出（針が回る・擬音・音）に配る。
// ルールは一瞬で進む。画面に見せる途中の姿（針の位置・取った宝・空の進み）は app.vis が持ち、出来事を 1 つずつ時間をかけて映す。
// 確かめ用の URL: ?stage=1-3 / ?stage=t2（その盤から）、?seed=123（数字を決める種）、?nosave=1（保存しない）、?notips=1（おはなしとヒントを出さない）
(function () {
  const Game = (window.Game = window.Game || {});
  const cfg = Game.config, RU = Game.rules, K = Game.clock;
  const q = new URLSearchParams(location.search);

  const app = {
    screen: 'title',    // 'title' | 'select' | 'how'（あそびかた）| 'play'
    time: 0,
    progress: null, settings: null, tips: null,
    def: null,          // 遊んでいるステージの型（確かめ用の盤では null）
    got: null,          // 今回はじめて取れたもの { gems, stamp }
    stuckTip: false,    // 「きょうは もう ねよう」の札を出している
    helpTip: false,     // 「てがかりを だす」の札を出している（2 回夜になった朝）
    ghost: false,       // この夜はお化けが出た（見た目だけ）
    fainted: false,     // お化けを見て倒れた（出てから 1 拍あと）
    demoCard: null,     // 手本の指が運ぶ札（解き手の道の最初の 1 枚）
    run: null,          // 編 2「ぼうけん」のラン（遊んでいる間）。ルールの状態は run.s（app.rules も同じものを指す）
    vHand: [],          // 編 2: 画面に見せている手札（針が回っている間は、レバーを引く前の姿）
    pulled: [],         // 編 2: レバーを引いたときの並び
    hamHit: 0,          // 編 2: 当たって目を回している残りの秒
    rules: null,
    vis: null,          // { t（小数あり）, taken, used（空と日時計の進み。小数あり）, usedTo, night（0〜1）, nightTo }
    queue: [],          // 並べた札（左から）。針が回っている間も、次のぶんを並べられる
    running: [],        // いま使っている札（レバーを倒したぶん。左から順に消える）
    drag: null,         // つまんでいる札 { n, x, y, from: 'hand' | 'queue', j }
    leverDrag: null, leverPull: 0,
    anim: null,         // 出来事を順に映している間 { ev, i, wait, move, k, cards }
    mode: 'play', clearT: 0, clearWait: 0, gemsShown: 0, nameT: 0,
    doorOpen: 0,        // 扉の開き具合（0〜1。鍵のステージ）
    story: null,        // おはなし（紙芝居）を流している間 { id, page, t（字を出す秒）, age（絵の秒）, fade, then }
    tipQ: [],           // 出すヒントの列（先頭を見せている）。出ている間は遊びが止まる
    tipAge: 0,          // いまのヒントが出てからの秒
    tipReview: false,   // あそびかたからの見直し（閉じても「見た」を書かない）
    fx: null, audio: null, manual: false,
  };
  Game.app = app;

  const nosave = q.get('nosave') === '1';
  const notips = q.get('notips') === '1';   // おはなしもヒントも出さない（確かめ用・通しテスト）
  const store = (what) => { if (nosave) return; if (what === 'progress') Game.save.storeProgress(app.progress); else if (what === 'tips') Game.save.storeTips(app.tips); else Game.save.storeSettings(app.settings); };

  // ---- 導入: ヒントとおはなし ----
  function pushTips(ids) {
    if (notips) return;
    for (const id of [].concat(ids)) if (id && !app.tips.seen[id] && !app.tipQ.includes(id)) { if (!app.tipQ.length) app.tipAge = 0; app.tipQ.push(id); }
  }
  const tipEvent = (name) => pushTips(Game.guide.on(name, app.tips.seen));
  function closeTip() {
    const id = app.tipQ.shift();
    app.tipAge = 0;
    emit({ type: 'put', n: 3 });
    if (app.tipReview) { app.tipReview = false; return; }
    app.tips.seen[id] = true; store('tips');
  }
  // then: 終わった（最後までめくった・とばした）あとにすること
  function startStory(id, then) {
    if (notips) { then(); return; }
    app.story = { id, page: 0, t: 0, age: 0, fade: 0, then, cue: 0 };
  }
  function endStory() { const s = app.story; app.story = null; s.then(); }
  function storyInput(e) {
    if (e.type !== 'down') return;
    const s = app.story, G = cfg.guide;
    if (inRect(Game.story.skipBtn(), e.x, e.y, 3)) { emit({ type: 'put', n: 3 }); endStory(); return; }
    if (s.fade > 0) return;
    const full = Game.story.len(s.id, s.page) * G.charSec;
    if (s.t < full) { s.t = full; return; }   // 文が出ている途中: 全部出す
    emit({ type: 'put', n: 2 });
    if (s.page + 1 >= Game.story.pages(s.id)) { endStory(); return; }
    s.page++; s.t = 0; s.age = 0; s.cue = 0; s.fade = G.fadeSec;
  }
  // 「ぼうけん」を新しく始める。まだなら、先に 2 本めのおはなし
  function newRun() {
    if (app.tips.seen.story2) { startRun(0); return; }
    app.tips.seen.story2 = true; store('tips');
    startStory(2, () => startRun(0));
  }

  // ステージに入る。型のあるステージは、入るたびに数字を決める（?seed= があればその種）
  function enter(id) {
    const def = Game.stages.find((d) => d.id === id);
    let stage;
    if (def) {
      const fixed = q.has('seed');
      const seed = fixed ? Game.rng.seedFrom(/^-?\d+$/.test(q.get('seed')) ? +q.get('seed') : q.get('seed')) : (Math.random() * 0x7fffffff) | 0;
      const prev = Game.progress.enter(app.progress, id, seed);
      store('progress');
      stage = Game.gen.make(def, seed, fixed ? null : prev);
    } else stage = Game.testStages.find((d) => d.id === id) || Game.testStages[0];
    app.def = def || null;
    begin(stage);
  }
  function begin(stage, isRun) {
    app.run = null; app.tipQ = []; app.tipReview = false;
    const s = (app.rules = RU.start(stage));
    app.screen = 'play';
    app.vis = { t: s.t, taken: s.taken.slice(), used: 0, usedTo: 0, night: 0, nightTo: 0 };
    app.queue = []; app.running = []; app.drag = null; app.leverDrag = null; app.leverPull = 0; app.anim = null;
    app.mode = 'play'; app.clearT = 0; app.gemsShown = 0; app.nameT = 0; app.got = null;
    app.stuckTip = false; app.helpTip = false; app.ghost = false; app.fainted = false;
    const best = app.tips.seen.put ? null : Game.solver.solve(stage);
    app.demoCard = best && best.moves.length ? best.moves[0][0] : null;
    app.doorOpen = 0;
    if (app.fx) app.fx.clear();
    if (!isRun && app.def) pushTips(Game.guide.atStart(stage, app.tips.seen, false));   // 確かめ用の盤では出さない
  }
  // クリアのあとの「つぎへ」: 同じエリアの次（確かめ用の盤は順に回る）。なければ null
  function nextId() {
    const id = app.rules.stage.id;
    if (app.def) return Game.progress.next(id);
    const T = Game.testStages; return T[(T.findIndex((d) => d.id === id) + 1) % T.length].id;
  }

  // ---- 編 2「ぼうけん」 ----
  function beginRun(run) {
    begin(run.stage, true);
    app.run = run; app.def = null; app.rules = run.s;
    app.vis.fires = run.fires; app.vis.t = run.s.t; app.vis.taken = run.s.taken.slice(); app.vis.used = app.vis.usedTo = run.s.pulls;
    app.vHand = run.hand.slice(); app.queue = run.queue.slice(); app.pulled = []; app.hamHit = 0;
  }
  // ランの段階に合ったヒント（盤の始まり、札を選ぶ、やすみば）
  function runTips() {
    const run = app.run;
    if (app.mode === 'play') pushTips(Game.guide.atStart(run.stage, app.tips.seen, true));
    else if (app.mode === 'pick' || app.mode === 'rest') tipEvent(app.mode);
  }
  const saveRun = () => { if (nosave || !app.run) return; if (['play', 'pick', 'rest'].includes(app.run.phase)) Game.save.storeRun(app.run); else Game.save.clearRun(); };
  // ランの段階に合わせて画面を切り替える（札を選ぶ・やすみば・次の面）
  function syncRun() {
    const run = app.run;
    beginRun(run);
    app.mode = run.phase === 'pick' ? 'pick' : run.phase === 'rest' ? 'rest' : 'play';
    saveRun(); runTips();
  }
  function resumeRun(run) { app.run = run; app.runBoard = 0; syncRun(); }
  function startRun(board = 0) {
    const seed = q.has('seed') ? Game.rng.seedFrom(/^-?\d+$/.test(q.get('seed')) ? +q.get('seed') : q.get('seed')) : (Math.random() * 0x7fffffff) | 0;
    app.runBoard = board;
    beginRun(Game.run.start(seed, cfg, board));
    saveRun(); runTips();
  }
  // ランが終わった: 記録を足して、途中のランを消す
  function endRun(won) {
    const run = app.run;
    if (!nosave) { Game.progress.recordRun(app.progress, won ? cfg.run.boards : run.board, run.days, won); store('progress'); Game.save.clearRun(); }
    else Game.progress.recordRun(app.progress, won ? cfg.run.boards : run.board, run.days, won);
  }
  // ルールの出来事を、札 1 枚ぶんを 1 つの動きにまとめた列にする（針は、進む長さに関係なく同じ時間で回る）
  function runAnim(ev) {
    const out = [];
    let cur = null, list = [];
    for (const e of ev) {
      if (e.type === 'pull') list = e.list;
      else if (e.type === 'card') { cur = { type: '_card', n: e.n, jump: e.jump, from: list[e.i] ? list[e.i].from : 0, steps: 0, marks: [] }; out.push(cur); }
      else if (e.type === 'tick') cur.steps++;
      else if (e.type === 'hour' || e.type === 'hit' || e.type === 'dodge') cur.marks.push({ k: cur.steps, type: e.type });
      else if (!['draw', 'shuffle', 'mulligan', 'clear', 'board'].includes(e.type)) out.push(e);
    }
    return out;
  }
  function runPull() {
    const run = app.run;
    if (!Game.run.canPull(run)) { emit({ type: 'full' }); return; }
    const L = cfg.layout.lever;
    app.pulled = run.queue.slice(); app.running = app.pulled.slice(); app.queue = [];
    const ev = Game.run.pull(run);
    emit({ type: 'lever', x: L.x + 8, y: L.y - 4 });
    if (!app.tips.seen.lever) { app.tips.seen.lever = true; store('tips'); }
    app.vis.usedTo = run.s.pulls;
    saveRun();
    play(runAnim(ev), cfg.anim.leverWait);
  }
  function runInput(e) {
    const R = Game.render, run = app.run, L = cfg.layout;
    if (e.type === 'down') {
      if (inRect(L.btn.menu, e.x, e.y, 2)) { app.keptRun = ['play', 'pick', 'rest'].includes(run.phase) ? Game.run.fromSave(Game.run.toSave(run)) : null; app.anim = null; app.drag = null; app.run = null; app.screen = 'select'; app.fx.clear(); return; }   // keptRun: 保存しない設定（確かめ用）のときの「つづきから」
      if (app.anim) return;
      if (app.mode === 'over' || app.mode === 'win') {
        if (app.mode === 'win' && app.clearT <= cfg.anim.door + cfg.run.watchSec + 0.8) return;
        app.run = null; app.screen = 'select'; app.fx.clear(); return;
      }
      if (app.mode === 'pick') {
        if (inRect(R.deckBtn(), e.x, e.y, 2)) { app.mode = 'deck'; app.deckBack = 'pick'; return; }   // 選ぶ前に、いまの山札を見られる
        const r = R.pickRows().find((c) => inRect(c, e.x, e.y));
        if (!r) return;
        emit({ type: 'put', n: r.i == null ? 1 : 3 });
        Game.run.pick(run, r.i); syncRun(); return;
      }
      if (app.mode === 'rest') {
        const b = R.restBtns().find((c) => inRect(c, e.x, e.y));
        if (!b) return;
        if (b.id === 'remove') { app.mode = 'remove'; emit({ type: 'put', n: 2 }); return; }
        if (!Game.run.canFire(run)) { emit({ type: 'full' }); return; }
        emit({ type: 'take' }); Game.run.rest(run, 'fire'); syncRun(); return;
      }
      if (app.mode === 'remove') {
        if (inRect(R.backBtn(), e.x, e.y, 1)) { app.mode = 'rest'; return; }
        const c = R.cells(run.deck, 34).find((c) => inRect(c, e.x, e.y));
        if (!c) return;
        emit({ type: 'unput', n: 2 }); Game.run.rest(run, 'remove', c.i); syncRun(); return;
      }
      if (app.mode === 'deck') { app.mode = app.deckBack || 'play'; app.deckBack = null; return; }
      // 山札の残り枚数をさわると、山札と捨て札の中身の一覧（順番は見せない）
      if (inRect({ x: L.fires.x - 2, y: L.fires.y + 8, w: 40, h: 22 }, e.x, e.y)) { app.mode = 'deck'; return; }
      if (inRect(L.btn.sleep, e.x, e.y, 2)) { app.running = []; app.queue = []; const ev = Game.run.sleep(run); saveRun(); play(runAnim(ev)); return; }
      if (inRect(R.lever(), e.x, e.y)) { app.leverDrag = { x0: e.x, y0: e.y }; return; }
      // 並びのいちばん右が引かない札（ジャンプなど）なら、つまんで手札へ戻せる
      const lastQ = R.queue(app.queue).pop();
      if (lastQ && Game.run.canTake(run) && inRect(lastQ, e.x, e.y, 1)) { app.queue.pop(); app.drag = { n: lastQ.n, x: e.x, y: e.y, from: 'queue' }; return; }
      const hs = R.runHand(app.vHand);
      for (let k = hs.length - 1; k >= 0; k--) if (inRect(hs[k], e.x, e.y)) { app.drag = { n: hs[k].n, i: k, x: e.x, y: e.y, from: 'hand' }; return; }   // 重なったときは、上（右）の札
    } else if (e.type === 'move') {
      if (app.drag) { app.drag.x = e.x; app.drag.y = e.y; }
      if (app.leverDrag) {
        app.leverPull = Math.max(0, Math.min(1, Math.max(e.y - app.leverDrag.y0, e.x - app.leverDrag.x0) / L.lever.pull));
        if (app.leverPull >= 1) { app.leverDrag = null; runPull(); }
      }
    } else {
      app.leverDrag = null;
      const d = app.drag;
      if (!d) return;
      app.drag = null;
      if (d.from === 'queue') {
        if (e.type === 'up' && d.y - L.dragLift >= L.hand.y - 6) { Game.run.take(run); emit({ type: 'unput', n: 2 }); saveRun(); }
        app.queue = run.queue.slice(); app.vHand = run.hand.slice();
        return;
      }
      if (e.type !== 'up' || app.anim || !R.onDrop(d.x, d.y - L.dragLift)) return;
      // 並べる（取り消せない）。置けない札は手札へ戻る
      const ev = Game.run.place(run, d.i);
      if (ev[0].type === 'deny') { emit({ type: 'full' }); return; }
      app.queue = run.queue.slice(); app.vHand = run.hand.slice();
      saveRun();
      const Q = L.queue, c = Game.cards.of(d.n);
      emit({ type: 'put', n: c.kind === 'time' ? Math.min(12, c.n) : 2, x: Q.x + (app.queue.length - 1) * (Q.w + Q.gap) + Q.w / 2, y: Q.y - 2 });
      if (!app.tips.seen.put) { app.tips.seen.put = true; store('tips'); }
      tipEvent('draw');
    }
  }

  // 演出の出来事を、擬音と音に配る
  function emit(e) { app.fx.on(e); app.audio.on(e); if (app.haptics) app.haptics.on(e); }

  // ---- 出来事を順に映す ----
  // wait: 最初の出来事までの間（レバーを倒してから 1 拍おいて、針が動き出す）
  function play(ev, wait = 0) { app.anim = { ev: ev.slice(), i: 0, wait, move: null, k: 0, cards: 0 }; }
  function moveTo(from, steps, dur) { app.anim.move = { from, steps, dur, t: 0 }; app.anim.wait = dur; }
  function step(e) {
    const A = cfg.anim, R = Game.render, s = app.rules, vis = app.vis, an = app.anim;
    switch (e.type) {
      case 'card': {
        if (an.cards++ > 0) app.running.shift();   // 前の札を使い終えた
        an.fast = e.n === 12; an.k = 0; vis.usedTo++;
        const p = R.longTip(vis.t); emit({ type: 'card', x: p.x, y: p.y - 10 });
        break;
      }
      case 'tick': emit({ type: 'tick', k: an.k++ }); moveTo(Math.round(vis.t), 1, an.fast ? A.tickHour : A.tick); break;
      case 'hour': emit({ type: 'hour' }); break;   // 音だけ（やわらかい合図）。擬音は出さない: 長針が何かに当たったように見えるため
      case 'take': {
        vis.taken[e.item] = true;
        const p = R.itemAt(s.stage.items[e.item]); emit({ type: 'take', x: p.x, y: p.y - 10 });
        an.wait = A.take; break;
      }
      case 'bounce': {
        app.running = []; vis.usedTo = s.used;
        const p = e.why === 'wall' ? R.shortTip(s.stage.wall) : R.itemAt(s.stage.items[e.item]);
        emit({ type: 'bounce', x: p.x, y: p.y - 10 });
        an.ev.splice(an.i, 0, { type: '_back', back: e.back });
        an.wait = A.bounceWait; break;
      }
      case '_back': emit({ type: 'back' }); moveTo(Math.round(vis.t), -K.wrap(Math.round(vis.t) - e.back), A.back); break;
      // ---- 編 2 ----
      case '_card': {
        // いま効いている札から右を見せる（使い終えた札は消える）
        app.running = app.pulled.slice(e.from);
        const m = { from: Math.round(vis.t), steps: e.steps, dur: cfg.run.cardSec, t: 0, jump: e.jump, marks: e.marks.slice() };
        // 刻む音は間引く（大きい札でも 6 回まで）
        const n = Math.min(e.steps, 6);
        for (let k = 0; k < n; k++) m.marks.push({ k: (k * e.steps) / n, type: 'tick', j: k });
        m.marks.sort((a, b) => a.k - b.k);
        an.move = m; an.wait = m.dur;
        if (e.jump) { const p = R.hamSpot(s.stage); emit({ type: 'jump', x: p.x, y: p.y - 26 }); }
        break;
      }
      case 'day': vis.t = s.t; vis.taken = s.taken.slice(); vis.used = 0; vis.usedTo = 0; vis.nightTo = 0; app.vHand = app.run.hand.slice(); emit({ type: 'day', x: cfg.view.w / 2, y: 60 }); an.wait = A.dusk; break;
      case 'over': app.mode = 'over'; vis.nightTo = 1; vis.fires = 0; emit({ type: 'over' }); endRun(false); an.wait = A.dusk; break;
      case 'pick': app.mode = 'pick'; emit({ type: 'clear' }); an.wait = 0.5; break;
      // 最後の扉: 石の板がゆっくり開き、時計の形の宝が出てくる
      case 'win': { app.mode = 'win'; app.clearT = 0; const D = cfg.layout.door; emit({ type: 'door', x: D.x + D.w + 18, y: D.y + 14 }); emit({ type: 'clear', delay: A.door + cfg.run.watchSec }); endRun(true); break; }
      case 'night': {
        if (app.run) { app.queue = []; app.running = []; vis.nightTo = 1; vis.fires = Math.max(0, e.fires); const p = R.hamSpot(s.stage); emit({ type: 'night', x: p.x, y: p.y - 24 }); an.wait = A.night; break; }
        app.queue = []; app.running = []; vis.nightTo = 1; app.stuckTip = false;
        // ときどきお化けが出て、気絶する（見た目だけの違い）
        app.ghost = app.forceGhost != null ? app.forceGhost : Math.random() * cfg.ghostEvery < 1;
        app.fainted = false;
        an.ev.splice(an.i, 0, { type: '_day' });
        // お化け: 暗くなってお化けが出て、1 拍おいてから「ひゃあ」と倒れる
        if (app.ghost) { an.ev.splice(an.i, 0, { type: '_faint' }); an.wait = A.ghostWait; break; }
        emit({ type: 'night', x: cfg.layout.ham.x + 26, y: cfg.layout.ham.y - 6 });
        an.wait = A.night; break;
      }
      case '_faint': app.fainted = true; emit({ type: 'ghost', x: cfg.layout.ham.x + 30, y: cfg.layout.ham.y - 36 }); an.wait = A.night; break;   // 字はお化けの上に出す（お化けを隠さない）
      case '_day': {
        RU.sleep(s); app.ghost = false; app.fainted = false;
        vis.t = s.t; vis.taken = s.taken.slice(); vis.used = 0; vis.usedTo = 0; vis.nightTo = 0;
        emit({ type: 'day', x: cfg.view.w / 2, y: 60 });
        if (RU.canHelp(s) && !s.helpOn) app.helpTip = true;   // 2 回夜になった: 助け舟をすすめる
        an.wait = A.dusk; break;
      }
      case 'clear': {
        app.queue = []; app.running = []; vis.usedTo = s.used; app.mode = 'clear'; app.clearT = 0; app.gemsShown = 0; app.stuckTip = false;
        if (app.def) { app.got = Game.progress.record(app.progress, s.stage.id, RU.result(s)); store('progress'); }
        // 鍵のステージ: 先に石の扉がゆっくり開く。クリアの札と音はそのあと
        const lock = s.stage.lock != null, D = cfg.layout.door;
        app.clearWait = A.clearWait + (lock ? A.door : 0);
        if (lock) emit({ type: 'door', x: D.x + D.w + 18, y: D.y + 14 });
        emit({ type: 'clear', delay: lock ? A.door : 0 });
        break;
      }
      case 'stuck': app.stuckTip = true; break;   // きょうの残りの枚数では取りきれない → 「きょうは もう ねよう」をすすめる
    }
  }
  function tickAnim(dt) {
    const an = app.anim, vis = app.vis;
    if (an.move) {
      const m = an.move;
      m.t = Math.min(m.dur, m.t + dt);
      // 編 2: 札の途中で起きること（刻む音、1 周の合図、探検家への当たり）
      while (m.marks && m.marks.length && (m.marks[0].k / Math.max(1, m.steps)) * m.dur <= m.t) {
        const k = m.marks.shift();
        if (k.type === 'tick') emit({ type: 'tick', k: k.j });
        else if (k.type === 'hour') emit({ type: 'hour' });
        else if (k.type === 'hit') { vis.fires--; app.hamHit = 0.7; const p = Game.render.hamSpot(app.rules.stage); emit({ type: 'hit', x: p.x, y: p.y - 24 }); }
      }
      vis.t = K.wrap(m.from + m.steps * (m.t / m.dur));
      if (m.t >= m.dur) { vis.t = K.wrap(m.from + m.steps); an.move = null; }
    }
    an.wait -= dt;
    while (an.wait <= 0 && !an.move && an.i < an.ev.length) step(an.ev[an.i++]);
    if (an.wait <= 0 && !an.move && an.i >= an.ev.length) {
      app.anim = null; app.running = []; vis.t = app.rules.t; vis.usedTo = app.run ? app.rules.pulls : app.rules.used;
      if (app.run) { app.vHand = app.run.hand.slice(); app.queue = app.run.queue.slice(); vis.fires = app.run.fires; vis.taken = app.rules.taken.slice(); }
      if (app.mode === 'play') app.nameT = cfg.anim.name;
      // 針が止まってから出すヒント
      if (app.run) { if (app.mode === 'play') tipEvent('day'); else if (app.mode === 'pick') tipEvent('pick'); }
      else if (app.def && app.mode === 'play' && app.rules.used / app.rules.stage.N >= cfg.guide.duskAt) tipEvent('dusk');
    }
  }

  // ---- 指 ----
  const inRect = (r, x, y, m = 0) => x >= r.x - m && x < r.x + r.w + m && y >= r.y - m && y < r.y + r.h + m;
  function pull() {
    const ev = RU.advance(app.rules, app.queue.slice());
    if (!ev.length) { emit({ type: 'full' }); return; }
    const L = cfg.layout.lever;
    emit({ type: 'lever', x: L.x + 8, y: L.y - 4 });
    app.nameT = 0; app.stuckTip = false;
    app.running = app.queue; app.queue = [];
    if (!app.tips.seen.lever) { app.tips.seen.lever = true; store('tips'); }
    play(ev, cfg.anim.leverWait);
  }
  // 自分から寝る（次の日へ。同じ盤を朝から）
  function goSleep() {
    if (app.anim || app.mode !== 'play') return;
    app.queue = []; app.running = []; app.nameT = 0;
    play([{ type: 'night' }]);
  }
  function onInput(e) {
    const R = Game.render, s = app.rules, L = cfg.layout;
    if (app.story) { storyInput(e); return; }
    if (Game.story.tipOn(app)) { if (e.type === 'down' && app.tipAge >= cfg.guide.holdSec) closeTip(); return; }
    if (app.screen === 'title') {
      if (e.type !== 'down') return;
      // 記録がまっさらなら、1 本めのおはなしから
      if (Game.guide.fresh(app.progress)) startStory(1, () => { app.screen = 'select'; }); else app.screen = 'select';
      return;
    }
    if (app.screen === 'how') {
      if (e.type !== 'down') return;
      if (inRect(R.backBtn(), e.x, e.y, 1)) { emit({ type: 'put', n: 3 }); app.screen = 'select'; return; }
      const c = Game.story.howCells(app).find((c) => inRect(c, e.x, e.y));
      if (!c) return;
      if (!c.seen) { emit({ type: 'full' }); return; }
      emit({ type: 'put', n: 2 });
      if (c.kind === 'story') { app.story = { id: c.id, page: 0, t: 0, age: 0, fade: 0, then: () => { app.screen = 'how'; }, cue: 0 }; return; }
      app.tipQ = [c.id]; app.tipAge = 0; app.tipReview = true;   // 見直し: 閉じても「見た」を書き換えない
      return;
    }
    if (app.screen === 'select') {
      if (e.type !== 'down') return;
      if (app.runAsk) {
        const b = R.askBtns().find((c) => inRect(c, e.x, e.y));
        const saved = app.runAsk; app.runAsk = null;
        if (!b) return;
        emit({ type: 'put', n: 2 });
        if (b.id === 'cont') resumeRun(saved); else newRun();
        return;
      }
      if (inRect(L.runBtn, e.x, e.y, 1)) {
        emit({ type: 'put', n: 2 });
        const saved = nosave ? app.keptRun : Game.save.loadRun();
        if (saved) app.runAsk = saved; else newRun();
        return;
      }
      if (inRect(L.howBtn, e.x, e.y, 1)) { emit({ type: 'put', n: 2 }); app.screen = 'how'; return; }
      if (inRect(L.select.haptics, e.x, e.y, 1)) { app.settings.haptics = !app.settings.haptics; app.haptics.setEnabled(app.settings.haptics); store('settings'); if (app.settings.haptics) app.haptics.play('place'); emit({ type: 'put', n: 3 }); return; }
      if (inRect(L.select.sound, e.x, e.y, 2)) { app.settings.sound = !app.settings.sound; cfg.audio.enabled = app.settings.sound; store('settings'); emit({ type: 'put', n: 3 }); return; }
      const tile = R.tiles(app).find((c) => inRect(c, e.x, e.y));
      if (tile && tile.open) { emit({ type: 'put', n: 2 }); enter(tile.id); } else if (tile) emit({ type: 'full' });
      return;
    }
    if (app.run) { runInput(e); return; }
    if (e.type === 'down') {
      if (inRect(L.btn.menu, e.x, e.y, 2)) { app.anim = null; app.drag = null; app.screen = 'select'; app.fx.clear(); return; }
      if (app.mode === 'clear') {
        if (app.anim || app.gemsShown < s.gems || app.clearT <= app.clearWait + 0.3) return;
        const b = R.clearBtns(app).find((c) => inRect(c, e.x, e.y, 1));
        if (!b) return;
        emit({ type: 'put', n: 2 });
        if (b.id === 'next') enter(nextId()); else if (b.id === 'again') enter(s.stage.id); else { app.screen = 'select'; app.fx.clear(); }
        return;
      }
      // 針が回っている間: レバーと寝るボタンは受けない。札は、次のぶんとして並べられる（テンポよく続けられる）
      if (!app.anim) {
        const canHelp = RU.canHelp(s) && !s.helpOn;
        if (canHelp && (inRect(L.btn.help, e.x, e.y, 2) || (app.helpTip && inRect(R.notice(Game.lang.t('help')), e.x, e.y, 2)))) { RU.help(s); app.helpTip = false; emit({ type: 'take' }); return; }
        app.helpTip = false;
        if (app.stuckTip) { const hit = inRect(R.notice(Game.lang.t('stuck')), e.x, e.y, 2); app.stuckTip = false; if (hit) { goSleep(); return; } }
        if (inRect(L.btn.sleep, e.x, e.y, 2)) { if (s.used > 0) goSleep(); else emit({ type: 'full' }); return; }
        if (inRect(R.lever(), e.x, e.y)) { app.leverDrag = { x0: e.x, y0: e.y }; return; }
      }
      const qc = R.queue(app.queue, app.running.length).find((c) => inRect(c, e.x, e.y, 1));
      if (qc) { app.queue.splice(qc.i, 1); app.drag = { n: qc.n, x: e.x, y: e.y, from: 'queue', j: qc.i }; return; }
      const hc = R.hand(s.stage).find((c) => inRect(c, e.x, e.y));
      if (hc) app.drag = { n: hc.n, x: e.x, y: e.y, from: 'hand' };
    } else if (e.type === 'move') {
      if (app.drag) { app.drag.x = e.x; app.drag.y = e.y; }
      if (app.leverDrag) {
        app.leverPull = Math.max(0, Math.min(1, Math.max(e.y - app.leverDrag.y0, e.x - app.leverDrag.x0) / L.lever.pull));
        if (app.leverPull >= 1) { app.leverDrag = null; if (app.queue.length) pull(); }
      }
    } else if (e.type === 'up' || e.type === 'cancel') {
      app.leverDrag = null;
      const d = app.drag;
      if (!d) return;
      app.drag = null;
      const slot = (i) => { const Q = L.queue; return { x: Q.x + (i + app.running.length) * (Q.w + Q.gap) + Q.w / 2, y: Q.y - 2 }; };
      if (d.from === 'hand') {
        if (e.type !== 'up' || !R.onDrop(d.x, d.y - L.dragLift)) return;
        if (app.mode !== 'play') return;
        if (RU.room(s, app.queue.length) <= 0) { if (!app.anim || !(s.done || s.night)) emit({ type: 'full' }); return; }   // 回っている間は、結果（クリア・夜）を音で先に知らせない
        app.queue.push(d.n);
        if (!app.tips.seen.put) { app.tips.seen.put = true; store('tips'); }
        emit(Object.assign({ type: 'put', n: d.n }, slot(app.queue.length - 1)));
      } else if (e.type === 'up' && d.y - L.dragLift >= L.hand.y - 6) emit({ type: 'unput', n: d.n }); // 手元で離した: 取り消す
      else if (app.mode === 'play' && !s.night) app.queue.splice(Math.min(d.j, app.queue.length), 0, d.n);                                                             // それ以外: 元の所へ戻す
    }
  }

  function update(dt) {
    const vis = app.vis, A = cfg.anim;
    app.time += dt;
    if (app.story) {
      const s = app.story, cues = Game.story.cues(s.id, s.page);
      if (s.fade > 0) s.fade -= dt; else { s.t += dt; s.age += dt; }
      // 場面の音（最初の 1 回だけ）
      while (s.cue < cues.length && cues[s.cue][0] <= s.age) { const e = cues[s.cue++][1]; app.audio.on(e); if (app.haptics) app.haptics.on(e); }
      app.fx.update(dt); return;
    }
    if (Game.story.tipOn(app)) { app.tipAge += dt; app.fx.update(dt); return; }   // ヒントが出ている間、遊びは止まる
    if (app.screen !== 'play') { app.fx.update(dt); return; }
    if (app.anim) tickAnim(dt);
    else if (!app.leverDrag && app.leverPull > 0) app.leverPull = Math.max(0, app.leverPull - dt / A.leverBack);
    if (vis.used < vis.usedTo) vis.used = Math.min(vis.usedTo, vis.used + dt * 4);
    if (vis.night !== vis.nightTo) vis.night += Math.sign(vis.nightTo - vis.night) * Math.min(Math.abs(vis.nightTo - vis.night), dt / A.dusk);
    if (app.nameT > 0) app.nameT -= dt;
    if (app.hamHit > 0) app.hamHit -= dt;
    if (app.mode === 'win') { app.clearT += dt; app.doorOpen = Math.min(1, app.clearT / A.door); }
    if (app.mode === 'clear') {
      app.clearT += dt;
      if (app.rules.stage.lock != null) app.doorOpen = Math.min(1, app.clearT / A.door);
      const n = Math.min(app.rules.gems, Math.floor((app.clearT - app.clearWait) / A.gemEvery) + 1);
      if (app.clearT > app.clearWait && n > app.gemsShown) {
        app.gemsShown = n; emit({ type: 'gem', i: n - 1 });
        if (n >= app.rules.gems && RU.result(app.rules).star) { emit({ type: 'gem', i: 4 }); emit({ type: 'gem', i: 7 }); }   // 星: 高い音を重ねる
      }
      if (app.def && app.gemsShown >= app.rules.gems && app.clearT > app.clearWait + A.gemEvery * app.rules.gems + 0.5) tipEvent('reward');
    }
    app.fx.update(dt);
  }

  // うっかり閉じない: 画面の端から札をなぞると「戻る」になる端末がある。履歴に 1 つ積んでおき、遊んでいる間の「戻る」は積み直して受け流す
  // （タイトルでは積み直さないので、もう 1 回「戻る」で出られる）
  function guard() {
    try { if (!(history.state && history.state.hoppeClock)) history.pushState({ hoppeClock: 1 }, ''); } catch (e) { /* 履歴が使えない */ }
  }
  // 画面を消さない（Wake Lock）: 考えている間に暗くならないように。タイトルと、隠れている間は持たない。隠れると外れるので、戻ったら取り直す
  let wakeLock = null, wakeBusy = false;
  function wake() {
    const want = () => !document.hidden && app.screen !== 'title';
    if (!want()) { if (wakeLock) { const l = wakeLock; wakeLock = null; l.release().catch(() => {}); } return; }
    if (wakeLock || wakeBusy || !navigator.wakeLock) return;
    wakeBusy = true;
    navigator.wakeLock.request('screen').then((l) => {
      wakeBusy = false;
      if (!want()) { l.release().catch(() => {}); return; }
      wakeLock = l;
      l.addEventListener('release', () => { if (wakeLock === l) wakeLock = null; });
    }, () => { wakeBusy = false; });   // 断られたら（電池が少ない、など）次に触ったときにまた試す
  }
  function boot() {
    const canvas = document.getElementById('c');
    Game.render.init(canvas);
    app.progress = nosave ? Game.progress.fresh() : Game.save.loadProgress();
    app.settings = nosave ? { sound: true, haptics: true } : Game.save.loadSettings();
    app.haptics = Game.haptics.create(cfg);
    app.haptics.setEnabled(app.settings.haptics);
    app.tips = nosave ? { seen: {} } : Game.save.loadTips();
    cfg.audio.enabled = app.settings.sound;
    app.audio = Game.audio.create(cfg);
    app.fx = Game.fx.create(cfg);
    Game.input.create(canvas, onInput);
    // 音の再開。タッチは指を離したときに初めて許されるので、置いたとき・離したときの両方で試す
    for (const ev of ['pointerdown', 'pointerup', 'touchend', 'keydown']) document.addEventListener(ev, () => { if (!app.audio.running()) app.audio.unlock(); }, true);
    document.addEventListener('visibilitychange', () => { app.audio.setHidden(document.hidden); app.haptics.setHidden(document.hidden); wake(); });
    // 触るたびに: 「戻る」の備えを積み直し、画面を消さない約束を取り直す
    document.addEventListener('pointerdown', () => { guard(); wake(); }, true);
    document.addEventListener('pointerup', () => setTimeout(wake, 0), true);   // 離したあとに画面が変わる（タイトル → ステージ選び）ので、そのあとで
    addEventListener('popstate', () => { if (app.screen !== 'title') guard(); });
    if (q.has('stage')) enter(q.get('stage'));
    else if (q.has('run')) startRun(+q.get('board') || 0);
    let last = performance.now();
    const frame = (now) => {
      const dt = Math.max(0, Math.min(0.1, (now - last) / 1000));
      last = now;
      if (!app.manual) update(dt);
      Game.render.draw(app);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }

  // テスト用: 実時間に関係なく進める
  Game.debug = {
    step(sec) { app.manual = true; for (let i = 0; i < Math.round(sec * 60); i++) update(1 / 60); Game.render.draw(app); },
    enter, startRun, input: onInput, wake: () => !!wakeLock,
  };

  boot();
})();
</script>
</body>
</html>
