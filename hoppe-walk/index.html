        drawScene(g, LA, d, t, x0, w, top, bottom, 'ground'); overlay('ground', soilEdge || sandEdge, sandEdge ? L.skyH : L.groundY);
      }
      // 砂浜とほかの土地の境: 砂でない側に、草や落ち葉のふち（ところどころ株や葉が砂へはみ出す）
      if (sandEdge) {
        const land = sandy(LB) ? LA : LB, dir = sandy(LB) ? 1 : -1, C = land.colors;
        const bits = land.scratch === 'leaves' ? [PAL.j, PAL.k, PAL.a] : [col(C.blade || C.groundLine)];
        for (let y = L.skyH + 1; y < (soilEdge ? L.groundY : bottom); y++) { // 水辺の側（なぞる地面）は白い泡のふち
          const fx = shore(y), Y = y + Math.floor(d / 3);
          if (fx < x0 - 3 || fx > x0 + w + 3) continue;
          g.fillStyle = col(C.groundLine); g.fillRect(fx - (dir > 0 ? 1 : 0), y, 1, 1);
          if (hash(Y * 7) < 0.3) { g.fillStyle = bits[Math.floor(hash(Y * 3) * bits.length)]; g.fillRect(fx + dir * (1 + Math.floor(hash(Y) * 2)), y, 2, 1); }
          if (hash(Y * 11) < 0.12) { g.fillStyle = col(C.groundLine); g.fillRect(fx + dir, y - 1, 1, 2); g.fillRect(fx + dir * 3, y - 1, 1, 2); g.fillRect(fx + dir * 2, y, 1, 2); }
        }
      }
      // 岸の白い泡（水の側に。ゆっくり寄せては返す）
      if (soilEdge) {
        const side = wet(LB) ? 0 : -1, dir = wet(LB) ? 1 : -1;
        g.fillStyle = PAL[6];
        for (let y = L.groundY + 1; y < bottom; y++) {
          const fx = shore(y) + side + (Math.sin(t * 1.8 + y * 0.35) > 0.3 ? dir : 0);
          if (fx >= x0 && fx < x0 + w) g.fillRect(fx, y, 1, 1);
        }
      }
    },

    draw(app) {
      const g = R.g, cfg = Game.config, L = cfg.layout, V = cfg.view, s = app.walk, t = app.time;
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.imageSmoothingEnabled = false;
      g.save();
      g.translate(R.fx, R.fy);
      const x0 = -R.fx, w = R.Lw + 4, top = -R.fy, bottom = R.Lh;
      const d = Math.round(s.d);
      R.drawLands(g, d, t, x0, w, top, bottom);
      app.fx.drawGround(g, d);
      // 景色の驚き（虹・流れ星・くじらは景色の上、鯉は水の上）
      Game.sight.sky(g, s, t, x0, w, top);
      Game.sight.water(g, s, t);
      const nestX = s.nest - d, nestOn = nestX > x0 - 30 && nestX < x0 + w + 30;
      if (nestOn) { drawNest(g, nestX, L.footY, false); drawPile(g, nestX, L.footY, s.stash); }

      // 夜の濃さ（0〜1）: おやすみで暗くなり、眠っている間は夜、起きると明るくなる。夜の間は土地の物を消す（巣と身なりだけ）
      const night = nightLevel(s);
      // 物とハムスターを、足元の y の順に描く（奥から）
      // 組み合わせで動かした側（飛んでいる・跳んでいる）は、同じ高さの相手より手前に
      const list = night >= 1 ? [] : Game.walk.visible(s, cfg).map((o) => ({ y: o.y + (s.meet && s.meet.keyA === o.key ? 0.5 : 0), o }));
      list.push({ y: L.footY, ham: true });
      if (s.sight && s.sight.kind === 'squirrel') list.push({ y: L.footY + 2, pal: true }); // りす（ハムスターの隣）
      list.sort((a, b) => a.y - b.y);
      for (const it of list) {
        if (it.ham) { R.drawHam(g, s, t, nestOn && nestX === L.hamX); continue; }
        if (it.pal) { Game.sight.pal(g, s, t); continue; }
        const o = it.o;
        // 右から入ってくる物はふわっと出て、左の端の手前でふわっと消える（速い点滅はしない）
        const inR = (V.w - L.edge - o.r - o.x) / 8, inL = (o.x - o.r - L.edge) / 8;
        g.globalAlpha = Math.max(0, Math.min(1, inR, inL)) * (1 - night);
        drawObj(g, o, s, t);
        g.globalAlpha = 1;
      }
      // 組み合わせのうち、ハムスターより手前に描くもの
      if (night < 1) Game.props.front(g, s, t);
      // 一緒に触ったときの絵（ハートの橋・虹の橋・頭の上のハート）
      if (night < 1) Game.togart.draw(g, s, t);
      // 運んでいるごはん: 指より上に、白い縁つきで。口のまわりに、ここへ という輪が脈打つ（贈り物は体のまわりに大きな輪）
      if (s.carry) {
        const gift = s.carry.kind === 'gift', pulse = (Math.sin(t * 8) + 1) / 2;
        const mx = gift ? L.hamX + 2 : L.hamX + 15, my = gift ? L.footY - 18 : L.footY - 19, r = (gift ? 20 : 6) + Math.round(pulse * 2);
        g.fillStyle = PAL.l; g.globalAlpha = 0.5 + pulse * 0.5; ring(g, mx, my, r); g.globalAlpha = 1;
        // りすが隣にいたら、りすの口のまわりにも輪（りすにもあげられる）
        const sg = s.sight;
        if (!gift && sg && sg.kind === 'squirrel' && sg.until - s.t > 1.2) {
          const pp = Game.walk.sightPos(s);
          g.globalAlpha = 0.5 + pulse * 0.5; ring(g, pp.x + 6, pp.y - 12, 6 + Math.round(pulse * 2)); g.globalAlpha = 1;
        }
        if (gift) g.drawImage(giftImg(s.carry.item, true), Math.round(s.carry.x) - 17, Math.round(s.carry.y) - cfg.feed.lift - 15);
        else g.drawImage(foodImg(s.carry.kind, true), Math.round(s.carry.x) - 14, Math.round(s.carry.y) - cfg.feed.lift - 14);
      }

      drawNight(g, night, t, x0, w, top, bottom);
      // 集めた身なりは夜の上に（宝物のように明るく）
      if (nestOn && ['sleep', 'bed', 'wake'].includes(s.ham.act)) drawCollection(g, s, nestX, L.footY);

      app.fx.draw(g);
      drawParent(g, app);
      g.restore();
    },

    drawHam(g, s, t, inNest) {
      const L = Game.config.layout, p = hamPose(s, t), sink = inNest ? p.sink || 0 : 0;
      // 影
      const lift = p.lift || 0; // 体ごと持ち上げる（ぽよん）。影は地面に残して小さく
      if (!sink) { g.globalAlpha = 0.25; g.fillStyle = PAL[0]; ell(g, L.hamX, L.footY, Math.max(10, 15 - Math.round(lift * 0.7)), 2); g.globalAlpha = 1; }
      const img = hamFrame(Object.assign({}, p, { rot: 0, flip: false, sink: 0, lift: 0 }));
      g.save();
      g.translate(L.hamX, L.footY - 17 + sink - lift);
      if (p.rot) g.rotate((p.rot * Math.PI) / 2);
      if (p.flip) g.scale(-1, 1);
      g.drawImage(img, -HC.ox, -HC.oy + 17);
      g.restore();
      if (sink) drawNest(g, L.hamX, L.footY, true);
      // 眠っている間: 鼻ちょうちん
      if (s.ham.act === 'sleep') {
        const r = 1 + Math.round(((Math.sin(t * 1.6) + 1) / 2) * 3);
        g.fillStyle = PAL[6]; g.globalAlpha = 0.8; ring(g, L.hamX + 21, L.footY - 21 + sink - r, r); g.globalAlpha = 1;
      }
    },
  };

  Game.render = R;
})();
</script>
<script>
// ループと、出来事を演出に配るつなぎ役。指の出来事（touch.js）を walk に渡し、返ってきた出来事を音・振動・絵に配る。
// 段階 3: 旅。5 つの土地と混ざる区間、曲 5 つの入れ替え、なぞる地面 4 種、保存、巣で眠っている所から始まる。
// URL（確かめ用）:
//   ?land=2（その土地の始まりから）/ ?d=1234（その距離から）/ ?seed=123（景色の種）/ ?nosave=1（読みも書きもしない）/
//   ?fast=1（歩く分を 10 倍）/ ?awake=1（巣で眠らずに始める）/
//   ?rare=gift（まれな驚きの贈り物を、少し歩くたびに出す）/ ?rare=tophat（雪だるまの帽子が必ずシルクハットとして残る）/
//   ?got=all（身なりを全部集めて、ごはんを 60 ためこんだ旅）/ ?rare=sight（景色の驚きを、終わって少し歩くたびに出す）/ ?rare=rainbow|koi|whale|squirrel|star（その驚きだけを。場所の指定がなければ、その土地から）
//   ?meet=<id>（その組み合わせがすぐ起きる場面から。lands.js の MEET。保存しない）/
//   ?tog=<id>（一緒に触る hug|banzai|pair|skybow がすぐ起こせる場面から。保存しない）
//   季節ごとの版（dev/build-lands.mjs）は window.HOPPE_WALK_URL に '?land=2&nosave=1' などを埋めてあり、URL の代わりに読む
(function () {
  const Game = (window.Game = window.Game || {});
  const cfg = Game.config, L = cfg.layout, H = cfg.haptics, PAL = Game.sprites.PAL;
  const q = new URLSearchParams(window.HOPPE_WALK_URL || location.search);
  const lt = (path) => Game.lang.t(path);

  if (q.get('fast') === '1') for (const k of Object.keys(cfg.walk.credit)) cfg.walk.credit[k] *= 10;
  const meetId = Game.lands.MEET[q.get('meet')] ? q.get('meet') : null;
  const togId = Game.together.IDS.includes(q.get('tog')) ? q.get('tog') : null;
  const nosave = q.get('nosave') === '1' || !!meetId || !!togId;
  if (q.get('rare') === 'gift') Object.assign(cfg.rare, { every: 40, p: 1, minGap: 0, gift: 1 });
  if (q.get('rare') === 'tophat') cfg.rare.tophat = 1;
  if (q.get('rare') === 'sight') Object.assign(cfg.rare, { every: 40, p: 1, minGap: 0, gift: 0 });
  const forceSight = Game.lands.SIGHT[q.get('rare')] ? q.get('rare') : null;
  if (forceSight) Object.assign(cfg.rare, { every: 40, p: 1, minGap: 0, force: forceSight });

  // 旅の続き（保存がなければ新しい旅）。URL で場所を指すときは、保存した種とほっぺはそのまま使う
  const trip = (!nosave && Game.save.loadTrip(cfg)) || { seed: (Math.random() * 0x7fffffff) | 0, d: 0, cheeks: 0, stash: 0, got: [] };
  if (q.has('seed')) trip.seed = +q.get('seed') | 0;
  if (q.has('land')) trip.d = Math.max(0, (+q.get('land') | 0) * cfg.land.len);
  if (q.has('d')) trip.d = Math.max(0, +q.get('d') || 0);
  // 確かめ用: 身なりを全部集めて、ごはんをたくさんためこんだ旅（巣の山と並んだ身なりを見る）
  if (q.get('got') === 'all') { trip.got = Object.keys(Game.lands.GIFT); trip.stash = Math.max(trip.stash, 60); }
  if (forceSight && !q.has('land') && !q.has('d')) trip.d = Game.lands.LANDS.findIndex((l) => l.rare.includes(forceSight)) * cfg.land.len;
  const settings = nosave ? Game.save.parseSettings(null) : Game.save.loadSettings(cfg);

  const app = (Game.app = {
    time: 0, manual: false,
    T: Game.touch.create(),
    walk: Game.walk.create(trip.seed, trip.d, cfg, { cheeks: trip.cheeks, stash: trip.stash, got: trip.got, sleep: q.get('awake') !== '1' }),
    settings,
    feel: {},      // 指ごとの手触りの刻み: id → { acc（跡の粒）, scr（手応え）, rus（音）, wat（水の波紋） }
    lastPurr: -1, digT: 0, foot: 0,
    saved: { d: -1, t: 0 }, wasBlend: false, waveUp: false, wavePh: 0,
    audio: null, fx: null, haptics: null, picker: null,
    parent: Game.parent.create(), // 親の操作（右上の印を押し続ける → 左下の「おとな」→ 親の画面）
    log: [],       // 確かめ用: 起きた出来事（通しテストが読む）
    later: [],     // 少しあとに鳴らす・出す演出 { t, fn }（組み合わせの動きに合わせる）
  });
  if (meetId) Game.meet.stage(app.walk, meetId, cfg);
  if (togId) Game.together.stage(app.walk, togId, cfg);
  const note = (e) => { app.log.push(e); if (app.log.length > 300) app.log.shift(); };
  const mix = () => Game.world.mixAt(Game.walk.hamWx(app.walk, cfg), cfg);
  const key = () => Game.walk.landHere(app.walk, cfg).key;
  const hz = (shift = 0) => Game.music.midiHz(app.picker.next(key(), performance.now()) + shift);
  const hamTop = () => L.footY - cfg.ham.h;
  const mouth = () => ({ x: L.hamX + 15, y: L.footY - 19 }); // 口（ham.js の絵に合わせる）
  const word = (k, color, x, y, tier = 'M') => app.fx.word(lt('fx.' + k), color, x, y, tier);
  const feelOf = (id) => app.feel[id] || (app.feel[id] = { acc: 0, scr: 0, rus: 0, wat: 0, star: 0, note: 0, cloud: 0, hue: 0 });
  const SKYC = ['#e43b44', '#feae34', '#fee761', '#63c74d', '#2ce8f5', '#b55088']; // 空をこすった星の色（順に）

  // 保存（設計書 5.6）
  function save(why) {
    if (nosave) return;
    Game.save.storeTrip(app.walk, cfg);
    app.saved = { d: Math.floor(app.walk.d), t: app.time, why };
  }

  // はらった物が飛ぶ粒の色
  const BLOW = { puff: '#ffffff', weed: PAL.m, foam: '#ffffff', leaf: PAL.j, flake: '#ffffff' };
  // なぞる地面の跡: [溝の色, 縁の色, 消えるまでの秒]（水面は跡を残さず、波紋にする）
  const MARK = { grass: [PAL.o, PAL.p, cfg.fx.scratchLife], leaves: [PAL.g, PAL.e, cfg.fx.scratchLife], sand: [PAL.y, PAL.c, cfg.fx.sandLife], snow: [PAL[4], PAL[6], cfg.fx.snowLife] };
  const BITS = { grass: [PAL.m], leaves: [PAL.j, PAL.k, PAL.a], sand: [PAL.c], snow: [PAL[6]], water: [PAL.s, PAL[6]] };
  const RUSTLE = { grass: 'rustle', leaves: 'rustle', sand: 'sand', snow: 'crunch' };

  // 出来事 → 音・振動・絵
  function show(e) {
    const A = app.audio, F = app.fx, HP = app.haptics, s = app.walk;
    note(e);
    switch (e.type) {
      case 'tap':
        F.ripple(e.x, e.y, e.ground ? '#ead4aa' : '#ffffff');
        A.play('ripple', { hz: hz() });
        break;
      case 'hit': {
        const def = Game.lands.OBJ[e.kind];
        HP.play('hit');
        switch (e.react) {
          case 'bloom': A.play('bloom', { hz: hz(12) }); word('bloom', '#fee761', e.x, e.y - 14); F.burstDots(e.x, e.y, '#f6757a'); break;
          case 'sway': A.play(e.kind === 'flower' ? 'bloom' : 'boing', { hz: hz(12), gain: 0.5 }); F.spray(e.x, e.y, e.kind === 'flower' ? '#f6757a' : '#ffffff', 3, 30); break;
          case 'fly': A.play('buzz'); word('buzz', '#e43b44', e.x + 20, e.y - 26); break;
          case 'hop': A.play('hop'); word('hop', '#63c74d', e.x + 14, e.y - 20); break;
          // かえる（飛び去るときは 2 回跳んで池へ飛びこむ）
          case 'jump': A.play('croak'); if (e.away) A.play('splash', { delay: 0.85, gain: 0.6 }); word('kero', '#63c74d', e.x + 14, e.y - 22); break;
          case 'pop': A.play('pop'); word('pachin', '#2ce8f5', e.x, e.y - 12); F.burstDots(e.x, e.y, '#ffffff'); break;
          case 'open': case 'close': A.play('clam'); word('paka', '#f6757a', e.x, e.y - 16); if (e.react === 'open') F.spray(e.x, e.y - 4, '#ffffff', 4, 30); break;
          case 'scuttle': A.play('scuttle'); word('kasa', '#e43b44', e.x + 10, e.y - 16); break;
          case 'boing': A.play('boing'); word('poyon', '#e43b44', e.x, e.y - 16); break;
          case 'shake':
            A.play('shake'); word('yusa', '#63c74d', e.x, e.y - 18); F.spray(e.x, e.y - 4, PAL.m, 5, 40);
            if (e.spawn) { A.play('drop', { delay: 0.3 }); }
            break;
          case 'hat':
            A.play('hat'); word('pon', '#ffffff', e.x + 12, e.y - 22); F.spray(e.x, e.y - 10, '#ffffff', 6, 40);
            // 帽子が消えずに残った（シルクハットの贈り物）
            if (e.spawn) { HP.play('rare'); A.play('gift', { hz: hz(), delay: 0.35 }); word('kira', '#fee761', e.spawn.x, e.spawn.y - 30, 'L'); }
            break;
          case 'blow': blowFx(e, 0.05, -0.35); break;
          default: A.play(def.sfx);
        }
        break;
      }
      case 'grab': HP.play('hit'); A.play('grab', { hz: hz(12) }); word('grab', '#feae34', e.x, e.y - 26, 'S'); break;
      case 'carry': break;
      case 'feed':
        HP.play('hit'); A.play('munch'); A.play('cheek', { hz: Game.music.midiHz(Game.music.degree(cfg.music.keys[key()], 4 + e.cheeks * 2)) });
        word('munch', '#feae34', L.hamX + 14, hamTop() - 6);
        F.burstDots(mouth().x, mouth().y, '#fee761');
        break;
      case 'drop': A.play('drop'); break;
      // まれな驚き: 贈り物が空からふわっと落ちてくる
      case 'gift':
        HP.play('rare'); A.play('gift', { hz: hz() });
        word('kira', '#fee761', e.x, 40, 'L');
        F.burstDots(e.x, 30, '#fee761');
        break;
      // 贈り物を身につけた: くるっと回って「ジャーン」
      case 'wear': {
        HP.play('rare'); A.play('wear', { hz: hz() });
        word('jaan', '#fee761', L.hamX + 26, hamTop() - 12, 'L');
        F.burstDots(L.hamX, L.footY - 24, '#fee761'); F.burstDots(L.hamX, L.footY - 24, '#ffffff');
        F.ripple(L.hamX, L.footY - 18, '#fee761', 26, 0.6);
        save('wear');
        break;
      }
      // 景色の驚き（lands.js の SIGHT）
      case 'sight': sightFx(e); break;
      case 'sightHit': sightHitFx(e); break;
      // りすにごはんをあげた: もぐもぐして、チュッと喜ぶ
      case 'palFeed':
        HP.play('hit'); A.play('munch'); A.play('squeak', { delay: 0.7 });
        word('munch', '#feae34', e.x, e.y - 22, 'S'); F.burstDots(e.x + 4, e.y, '#fee761');
        break;
      case 'back': break;
      case 'beg': {
        // ごはんの所から口まで、光の粒が順に灯る（ここへ運んで、を見せる）
        const m = mouth();
        A.play('beg', { hz: hz() }); word('aan', '#fee761', L.hamX + 4, hamTop() - 8, 'S');
        F.guide(e.x, e.y, m.x, m.y);
        break;
      }
      case 'poke': HP.play('hit'); A.play('poke'); word('poke', '#f6757a', L.hamX + 10, hamTop() - 6, 'S'); break;
      case 'petStart': word('pet', '#f6757a', L.hamX, hamTop() - 8, 'S'); break;
      case 'pet': {
        const now = performance.now();
        if (now - app.lastPurr >= H.purrEvery) { app.lastPurr = now; HP.play('purr'); A.play('pet', { hz: hz() }); }
        break;
      }
      case 'roll': A.play('roll'); word('roll', '#feae34', L.hamX, hamTop() - 10); HP.play('hit'); break;
      case 'scratch': {
        const f = feelOf(e.id), gnd = e.ground;
        if (gnd === 'water') {
          // 水面: なぞった所から小さな波紋が広がる
          f.wat += e.d;
          if (f.wat >= cfg.fx.waterEvery) { f.wat %= cfg.fx.waterEvery; F.ripple(e.x, e.y, PAL.s, 9, 0.9); A.play('plip', { hz: hz(), gain: 0.7 + Math.random() * 0.4 }); }
          if (Math.random() < 0.2) F.spray(e.x, e.y, BITS.water[(Math.random() * 2) | 0], 1, 30);
        } else {
          const [c, lip, life] = MARK[gnd];
          F.mark(e.px + s.d, e.py, e.x + s.d, e.y, c, lip, life);
          const bits = BITS[gnd];
          if (Math.random() < (gnd === 'leaves' ? 0.4 : 0.25)) F.spray(e.x, e.y, bits[(Math.random() * bits.length) | 0], gnd === 'leaves' ? 2 : 1, 30);
        }
        f.scr += e.d; f.rus += e.d;
        if (f.scr >= H.strokeEvery) { f.scr %= H.strokeEvery; HP.play('stroke'); if (gnd !== 'water') A.play('scratch'); }
        if (f.rus >= 18) { f.rus %= 18; if (RUSTLE[gnd]) A.play(RUSTLE[gnd], { gain: 0.8 + Math.random() * 0.4 }); }
        break;
      }
      case 'find':
        A.play('find', { hz: hz(12) }); HP.play('hit');
        word('find', '#ffffff', e.x, e.y - 18, 'S'); F.spray(e.x, e.fromY, PAL.m, 6, 50);
        break;
      case 'trail': {
        const f = feelOf(e.id);
        if (e.y < L.skyH) {
          // 空をこする: 虹色の星が指を追い、音階の音が上がっていき、ときどき小さな雲がふわっと出る
          const SK = cfg.fx.sky;
          f.star += e.d; f.note += e.d; f.cloud += e.d;
          while (f.star >= SK.star) { f.star -= SK.star; F.star(e.x, e.y, SKYC[f.hue++ % SKYC.length]); }
          if (f.note >= SK.note) { f.note %= SK.note; A.play('twinkle', { hz: hz(12), gain: 0.55 }); }
          if (f.cloud >= SK.cloud) { f.cloud %= SK.cloud; F.cloud(e.x, Math.min(e.y, L.skyH - 10)); A.play('fwoosh', { gain: 0.7 }); word('fuwa', '#ffffff', e.x, e.y - 12, 'S'); }
          break;
        }
        f.acc += e.d;
        while (f.acc >= cfg.fx.trail.every) { f.acc -= cfg.fx.trail.every; F.trail(e.x + (Math.random() - 0.5) * 2, e.y + (Math.random() - 0.5) * 2); }
        break;
      }
      case 'flick': {
        const gnd = e.y >= L.groundY ? Game.lands.LANDS[Game.world.landAt(e.x + s.d, cfg)].scratch : null;
        F.flick(e.x, e.y, e.vx, e.vy, gnd ? BITS[gnd][0] : '#ffffff');
        A.play('swish', { gain: Math.min(1.4, 0.6 + Math.hypot(e.vx, e.vy)) });
        break;
      }
      // はらった物が組み合わせの相手へ飛ぶときは、普段の飛ぶ粒を出さない（組み合わせの絵が描く）
      case 'blow': if (e.met) { HP.play('hit'); A.play('fwoosh'); } else blowFx(e, e.vx, e.vy); break;
      case 'meet': meetFx(e); break;
      case 'together': togetherFx(e); break;
      case 'step':
        A.play('step');
        // 雪には足あと
        if (e.ground === 'snow') { app.foot ^= 1; F.mark(s.d + L.hamX - 6, L.footY + app.foot * 2, s.d + L.hamX - 5, L.footY + app.foot * 2, PAL[5], null, cfg.fx.snowLife); }
        break;
      case 'idle': if (e.kind === 'yawn') A.play('yawn'); break;
      case 'dig': word('dig', '#c28569', L.hamX + 20, hamTop() + 4); app.digT = 0; break;
      case 'stash': HP.play('hit'); A.play('stash'); word('stash', '#feae34', L.hamX + 18, hamTop() - 4); F.spray(L.hamX + 18, L.footY, PAL.e, 6, 50); save('stash'); break;
      case 'wake': {
        // 鼻ちょうちんがパチンとはじけて、目を覚ます
        const bx = L.hamX + 21, by = L.footY - 24;
        HP.play('hit'); A.play('pop'); word('pachin', '#2ce8f5', bx + 4, by - 10, 'S');
        F.burstDots(bx, by, '#ffffff'); F.ripple(bx, by, '#ffffff', 10, 0.35);
        A.musicPlay(true);
        break;
      }
      // おやすみ: 曲がゆっくり消えて、その場に巣を掘ってもぐりこむ
      case 'bed': A.musicPlay(false); A.play('yawn'); word('dig', '#c28569', L.hamX + 20, hamTop() + 4, 'S'); break;
      case 'asleep': save('sleep'); break;
      case 'awake': A.play('wake', { hz: hz() }); word('hello', '#fee761', L.hamX + 8, hamTop() - 6); F.spray(L.hamX, L.footY, PAL.e, 8, 50); break;
    }
  }
  // 景色の驚きが始まった: 大きな音、擬音 L、振動「驚き」
  function sightFx(e) {
    const A = app.audio, F = app.fx, V = cfg.view;
    Game.sight.on(e, app.time);
    app.haptics.play('rare');
    switch (e.kind) {
      case 'rainbow': A.play('rainbow', { hz: hz() }); word('niji', '#fee761', 68, 24, 'L'); break;
      case 'koi':
        A.play('splash'); A.play('splash', { delay: 0.9, gain: 0.7 });
        word('pasha', '#2ce8f5', e.x, L.groundY - 30, 'L'); F.spray(e.x - 16, L.groundY + 36, PAL[6], 6, 50);
        break;
      case 'whale': A.play('whale'); word('zabun', '#2ce8f5', 50, 30, 'L'); break;
      case 'squirrel': A.play('scuttle'); A.play('squeak', { delay: 0.9 }); word('choro', '#feae34', V.w - 30, L.footY - 30, 'M'); break;
      case 'star': A.play('shoot', { hz: hz() }); word('kiran', '#fee761', 40, 56, 'L'); break;
    }
  }
  // 景色の驚きの 2 段め（触った・触らなくても時々）
  const RAINBOW = [PAL.i, PAL.j, PAL.l, PAL.m, PAL.r, PAL.u];
  function sightHitFx(e) {
    const A = app.audio, F = app.fx;
    Game.sight.on(e, app.time);
    if (!e.auto) app.haptics.play('hit');
    switch (e.kind) {
      case 'rainbow':
        A.play('twinkle', { hz: hz(12) }); word('kira', '#fee761', e.x, e.y - 12, 'S');
        for (const c of RAINBOW) F.spray(e.x, e.y, c, 1, 40);
        F.burstDots(e.x, e.y, '#ffffff');
        break;
      case 'koi':
        A.play('splash'); A.play('splash', { delay: 0.9, gain: 0.7 });
        word('pasha', '#2ce8f5', e.x, L.groundY - 14, e.auto ? 'S' : 'M'); F.spray(e.x - 16, L.groundY + 36, PAL[6], 6, 50);
        break;
      case 'whale': A.play('spout'); word('pushu', '#ffffff', e.x - 18, L.skyH - 40, e.auto ? 'S' : 'M'); break;
      case 'squirrel':
        A.play('squeak'); word('chu', '#feae34', e.x, L.footY - 34, 'S');
        if (e.spawn) { A.play('drop', { delay: 0.3 }); word('poto', '#feae34', e.spawn.x + 6, e.spawn.y - 22, 'S'); }
        break;
      case 'star':
        A.play('shoot', { hz: hz(), gain: e.auto ? 0.5 : 1 });
        if (!e.auto) { word('kira', '#fee761', e.x, e.y - 10, 'S'); F.burstDots(e.x, e.y, '#fee761'); }
        break;
    }
  }
  // 組み合わせ（lands.js の MEET）: 普段の反応と同じ大きさ（擬音は S か M）。指で起こしたときだけ振動
  //   [秒, 音, 音の追加, 擬音, 擬音の色, 擬音の大きさ, 擬音の位置（'b' 相手の上 / 'h' ハムスターの頭）]
  const MEETFX = {
    bugFlower:     [[0.5, 'bloom', { gain: 0.5, up: 12 }, 'chon', '#e43b44', 'S', 'b']],
    seedFlower:    [[0, 'pop'], [0.35, 'bloom', { up: 12 }, 'paa', '#fee761', 'M', 'b']],
    puffHam:       [[0.5, 'achoo', null, 'hakushon', '#ffffff', 'M', 'h']],
    crownFlower:   [[0.15, 'bloom', { gain: 0.5, up: 7 }, 'pekori', '#f6757a', 'S', 'b']],
    frogBubble:    [[0.45, 'pop', null, 'paku', '#63c74d', 'M', 'b']],
    frogWeed:      [[0.4, 'swish', null, 'rustle', '#63c74d', 'S', 'b']],
    frogFoot:      [[0, 'hop', null, 'pyoon', '#63c74d', 'M', 'h'], [0.75, 'plip', { gain: 0.6 }]],
    packFrog:      [[0, 'croak'], [0.35, 'croak', { gain: 0.8 }, 'kerokero', '#63c74d', 'M', 'b']],
    foamCrab:      [[0.4, 'plip', null, 'bukubuku', '#2ce8f5', 'M', 'b'], [0.6, 'plip', { gain: 0.7 }], [0.8, 'plip', { gain: 0.5 }]],
    foamShell:     [[0.35, 'clam'], [0.6, 'pop', { gain: 0.6 }, 'puu', '#ffffff', 'S', 'b']],
    crabFoot:      [[0, 'scuttle'], [0.15, 'poke', null, 'chon', '#e43b44', 'S', 'h']],
    strawShell:    [[0.1, 'clam'], [0.45, 'twinkle', { up: 12 }, 'kirari', '#fee761', 'S', 'b']],
    leafShroom:    [[0.4, 'boing', null, 'poyon', '#e43b44', 'M', 'b']],
    appleTree:     [[0.3, 'pop', null, 'stash', '#e43b44', 'S', 'b'], [0.4, 'shake', { gain: 0.5 }]],
    shroomFoot:    [[0, 'boing', null, 'poyon', '#e43b44', 'M', 'h']],
    capeLeaf:      [[0, 'fwoosh', { gain: 0.7 }, 'hirahira', '#feae34', 'S', 'h']],
    nutSnowman:    [[0.3, 'pop', null, 'pita', '#ffffff', 'S', 'b']],
    flakeSnowman:  [[0.35, 'achoo', null, 'hakushon', '#ffffff', 'M', 'b']],
    tophatSnowman: [[0.3, 'hat', { gain: 0.4 }, 'kyoro', '#ffffff', 'S', 'b']],
    scarfSnowman:  [[0.3, 'bloom', { gain: 0.4, up: 7 }, 'po', '#f6757a', 'S', 'b']],
  };
  function meetFx(e) {
    if (e.finger) app.haptics.play('hit');
    for (const [sec, snd, opt, w, color, tier, where] of MEETFX[e.id] || []) {
      app.later.push({ t: app.time + sec, fn: () => {
        if (snd) app.audio.play(snd, Object.assign({}, opt && opt.gain != null ? { gain: opt.gain } : {}, opt && opt.up != null ? { hz: hz(opt.up) } : {}));
        if (w) where === 'h' ? word(w, color, L.hamX + 14, hamTop() - 6, tier) : word(w, color, e.x, e.y - 18, tier);
      } });
    }
  }
  // 一緒に触った: 共通の合図（触れている指の所に金色の輪が同時に、和音、2 回の短い振動）と、それぞれの擬音と音。大きさは普段の反応と同じ
  function togetherFx(e) {
    const A = app.audio, F = app.fx, later = (sec, fn) => app.later.push({ t: app.time + sec, fn });
    app.haptics.play('together');
    A.play('together', { hz: hz() });
    for (const p of e.pts) F.ripple(p.x, p.y, '#fee761', 14, 0.5);
    switch (e.id) {
      case 'hug': later(0.2, () => { A.play('pet', { hz: hz(12) }); word('gyu', '#f6757a', L.hamX + 16, hamTop() - 4, 'M'); }); break;
      case 'banzai':
        later(0.12, () => { A.play('hop'); word('banzai', '#fee761', L.hamX + 18, hamTop() - 14, 'M'); });
        later(0.62, () => A.play('drop', { gain: 0.7 }));
        break;
      case 'pair': later(0.4, () => { A.play('bloom', { hz: hz(12), gain: 0.6 }); word('nakayoshi', '#f6757a', e.x, e.y - 30, 'S'); }); break;
      case 'skybow': later(0.5, () => { A.play('twinkle', { hz: hz(12) }); word('niji', '#fee761', e.x, Math.max(10, e.y - 30), 'S'); }); break;
    }
  }
  function blowFx(e, vx, vy) {
    const A = app.audio, F = app.fx;
    app.haptics.play('hit');
    if (e.kind === 'weed') { A.play('swish', { gain: 1.2 }); word('yura', '#63c74d', e.x, e.y - 16); F.spray(e.x, e.y, PAL.s, 4, 30); return; }
    const w = { puff: 'fuwa', foam: 'fuwa', leaf: 'hira', flake: 'kira' }[e.kind] || 'fuwa';
    A.play('fwoosh'); word(w, BLOW[e.kind] === '#ffffff' ? '#ffffff' : '#feae34', e.x, e.y - 14);
    F.flick(e.x, e.y, vx, vy, BLOW[e.kind] || '#ffffff');
  }

  // 親の操作の出来事
  function parentFx(e) {
    const A = app.audio;
    switch (e.type) {
      case 'armed': A.play('grab', { hz: hz(12) }); break;
      case 'open': {
        // 旅の指はすべて取り消す（開いている間は、指は親の画面のもの）
        for (const id of Object.keys(app.T.fingers)) for (const te of Game.touch.feed(app.T, { type: 'cancel', id: +id }, cfg)) for (const e2 of Game.walk.touch(app.walk, te, cfg)) show(e2);
        app.feel = {};
        A.play('pop');
        break;
      }
      case 'menu':
        if (e.act === 'sleep') for (const e2 of Game.walk.bedtime(app.walk, cfg)) show(e2);
        else if (e.act === 'volume') { settings.volume = e.v; A.setVolume(cfg.audio.levels[e.v]); A.play('ripple', { hz: hz() }); }
        else if (e.act === 'haptics') { settings.haptics = e.v; app.haptics.setEnabled(e.v); if (e.v) app.haptics.play('hit'); }
        else A.play('grab', { hz: hz() });
        if ((e.act === 'volume' || e.act === 'haptics') && !nosave) Game.save.storeSettings(settings, cfg);
        break;
    }
    note(e);
  }

  function onInput(ev) {
    const r = Game.parent.input(app.parent, ev, app.time * 1000, cfg);
    for (const e of r.events) parentFx(e);
    if (r.use) return;
    for (const te of Game.touch.feed(app.T, ev, cfg)) {
      if (te.type === 'release' || te.type === 'cancel') delete app.feel[te.id];
      for (const e of Game.walk.touch(app.walk, te, cfg)) show(Object.assign({ id: te.id }, e));
    }
  }

  function update(dt) {
    app.time += dt;
    const s = app.walk;
    for (const e of Game.parent.tick(app.parent, app.time * 1000, cfg)) parentFx(e);
    // 親の画面が開いている間は、旅は止まる
    if (app.parent.phase === 'open') { app.fx.update(dt); app.audio.tick(); return; }
    for (const e of Game.walk.step(s, dt, cfg)) show(e);
    // 少しあとの演出（組み合わせ）
    if (app.later.length) { const due = app.later.filter((x) => x.t <= app.time); app.later = app.later.filter((x) => x.t > app.time); for (const x of due) x.fn(); }
    // 掘っている間: 土が飛び、ザッザッと鳴る
    if (s.ham.act === 'dig') {
      app.digT += dt;
      if (app.digT >= 0.4) { app.digT -= 0.4; app.audio.play('dig'); app.fx.spray(L.hamX + 20, L.footY - 1, PAL.e, 4, 45); }
    }
    // 曲: いまの土地と次の土地を、混ざり具合で入れ替える
    const m = mix();
    app.audio.music(m.a, m.b, m.u);
    app.audio.tick();
    // はまの波: 上がってくる間、跡を消す。上がり始めに波の音（はまの強さで大きさを変える。眠っている間は鳴らさない）
    const ph = app.time % cfg.fx.wave.every;
    if (ph < app.wavePh && s.ham.act !== 'sleep') {
      const hama = (m.a === 2 ? 1 - m.u : 0) + (m.b === 2 ? m.u : 0);
      if (hama > 0.02) { app.audio.wave(cfg.fx.wave.every, hama); note({ type: 'wave', gain: +hama.toFixed(2) }); }
    }
    app.wavePh = ph;
    const wy = Game.render.waveY(app.time);
    if (wy < cfg.view.h) app.fx.wash(wy);
    app.fx.update(dt);
    // 保存: 混ざる区間に入ったとき / 変化があったら everyMs ごと
    const blend = m.u > 0;
    if (blend && !app.wasBlend) save('blend');
    app.wasBlend = blend;
    if (Math.floor(s.d) !== app.saved.d && app.time - app.saved.t >= cfg.save.everyMs / 1000) save('every');
  }

  function boot() {
    const canvas = document.getElementById('c');
    Game.render.init(canvas);
    app.audio = Game.audio.create(cfg);
    app.audio.setVolume(cfg.audio.levels[settings.volume]);
    app.fx = Game.fx.create(cfg);
    app.haptics = Game.haptics.create(cfg);
    app.haptics.setEnabled(settings.haptics);
    app.picker = Game.music.picker(cfg);
    app.wasBlend = mix().u > 0;
    app.saved.d = Math.floor(app.walk.d);
    if (app.walk.ham.act !== 'sleep') app.audio.musicPlay(true);
    Game.input.create(canvas, onInput);
    // 音の再開。タッチは指を離したときに初めて許されるので、置いたとき・離したときの両方で試す
    for (const ev of ['pointerdown', 'pointerup', 'touchend', 'keydown']) document.addEventListener(ev, () => { if (!app.audio.running()) app.audio.unlock(); }, true);
    // 全画面（設計書 6.5）: アドレスバーを隠す。指を離したとき（全画面に入れる操作）に、全画面でなければ入る。
    //   「戻る」などで抜けても、次に触ったときにまた入る。入ったら縦向きに固定する
    const fullscreen = () => {
      const el = document.documentElement;
      if (!cfg.screen.fullscreen || document.fullscreenElement || !el.requestFullscreen) return;
      try {
        el.requestFullscreen({ navigationUI: 'hide' }).then(() => {
          note({ type: 'fullscreen' });
          try { screen.orientation.lock('portrait').catch(() => {}); } catch (e) { /* 固定できない端末 */ }
        }).catch(() => {});
      } catch (e) { /* 全画面にできない */ }
    };
    document.addEventListener('pointerup', fullscreen, true);
    // 閉じないための工夫（設計書 6.5）: 最初のタッチのあと履歴を 1 つ積み、「戻る」が来たら積み直す
    let guarded = false;
    document.addEventListener('pointerdown', () => {
      if (guarded) return;
      guarded = true;
      try { history.pushState({ hoppeWalk: 1 }, ''); addEventListener('popstate', () => { try { history.pushState({ hoppeWalk: 1 }, ''); } catch (e) { /* 何もしない */ } note({ type: 'popstate' }); }); } catch (e) { /* 履歴が使えない */ }
    }, true);
    document.addEventListener('visibilitychange', () => { app.audio.setHidden(document.hidden); if (document.hidden) save('hidden'); });
    addEventListener('pagehide', () => save('hidden'));
    let last = performance.now();
    const frame = (now) => {
      const dt = Math.max(0, Math.min(0.1, (now - last) / 1000));
      last = now;
      if (!app.manual) update(dt);
      Game.render.draw(app);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }

  // テスト用: 実時間に関係なく進める
  Game.debug = {
    step(sec) { app.manual = true; for (let i = 0; i < Math.round(sec * 60); i++) update(1 / 60); Game.render.draw(app); },
    input: onInput,
    save,
  };

  boot();
})();
</script>
</body>
</html>
