<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0099db">
<title>HOPPE WALK</title>
<style>
html, body { margin: 0; height: 100%; background: #0099db; overflow: hidden; }
body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
canvas { display: block; width: 100vw; height: 100dvh; image-rendering: pixelated; } /* 大きさは render.js が 1 ドット＝k 画素に合わせて書き換える */
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// 数字は全部ここ。設計書: docs/specs/2026-11-14-hoppe-walk-design.md
(function () {
  const Game = (window.Game = window.Game || {});

  Game.config = {
    view: { w: 135, h: 240 },   // 遊ぶ窓（ドット）。縦持ち専用

    // 置き場所（窓の中のドット）。上から 空と遠景 → 地面の帯 → なぞる地面
    layout: {
      skyH: 80,        // 空と遠景の帯の下の端
      groundY: 170,    // 地面の帯の下の端（＝なぞる地面の上の端）
      edge: 8,         // 左右の端の帯。触ってほしい物を置かない（端からなぞると「戻る」になる）
      hamX: 34,        // ハムスターの体の真ん中の x
      footY: 150,      // ハムスターと物が立つ地面の線
    },

    // 指
    touch: {
      max: 5,          // 同時に扱う指の数
      pad: 6,          // 当たりを絵より広げる量（ドット）
      slop: 4,         // ここまでの動きは「なぞった」にしない（ドット）
      flickMs: 90,     // 離す直前のこの間の速さで「はらった」を決める（ミリ秒）
      flickSpeed: 0.25, // はらった と言える速さ（ドット/ミリ秒）
    },

    // 振動（navigator.vibrate の並び。ミリ秒）。dev/haptics.html で実機の手触りを決めて写す
    haptics: {
      enabled: true,
      hit: [18],              // 物やハムスターに当てた
      purr: [8, 40, 8],       // なでている間（purrEvery ミリ秒ごとに繰り返す）
      purrEvery: 260,
      stroke: [6],            // なぞる地面をなぞっている間（strokeEvery ドットごと）
      strokeEvery: 10,
      rare: [30, 60, 30, 60, 60], // まれな驚き
      together: [14, 50, 14],     // 一緒に触った（2 回の短い震え。いつもの hit は 1 回）
      minGap: 40,             // 前の振動からこの間（ミリ秒）は次を出さない（rare は打ち切って出す）
    },

    // 音。dev/sounds.html で聞いて数字を決める
    audio: {
      enabled: true, volume: 0.5,
      levels: [0.25, 0.5, 0.85],          // 親の設定の音の 3 段階（hoppe-walk.settings の volume 0〜2）
      voices: 8,                          // 同時に鳴る効果音の上限（超えたら古いものを止める）
      keepAlive: { hz: 40, vol: 0.004 },  // 出力を休ませないための、聞こえない低い音
      // はまの波の音（audio.wave）。コモンズの波打ち際の録音 5 例を調べた特徴を大げさにしたもの:
      //   崩れる前に一瞬静か → 低い寄せがふくらむ（swell）→ 低い「ドッ」（thump）が先で、明るい「ザバッ」（crash）が後 →
      //   引くときは低い音から消えて高い「シュワワ」（hiss）が残る → 2 秒ほどあとに引き波のふくらみ（back）、泡のはじける粒（bubbles 個）
      // vol は全体（効果音より小さく、曲と同じくらい）。画面の波（fx.wave）が上がり始めるときに 1 回ずつ鳴らす
      wave: { vol: 0.5, swell: 0.35, thump: 0.5, crash: 0.14, hiss: 0.05, back: 0.67, bubbles: 8 }, // 実機で決めた数字（引き波は控えめに）
      // 音ごとの大きさの倍率
      level: { ripple: 1, pop: 1, swish: 1, rustle: 1, scratch: 2.2, bloom: 1, buzz: 1, fwoosh: 1, hop: 1, grab: 1, drop: 1, munch: 1, cheek: 1, poke: 1, pet: 1, roll: 1, step: 1, dig: 1, stash: 1, find: 1, yawn: 1,
        beg: 1, croak: 1, clam: 1, scuttle: 1, boing: 1, shake: 1, hat: 1, plip: 1, sand: 1, crunch: 1, wake: 1, snore: 1, gift: 1, wear: 1,
        rainbow: 1, twinkle: 1, splash: 1, whale: 1, spout: 1, squeak: 1, shoot: 1, achoo: 1, together: 1 },
      sfx: {
        // ポロン（何もない所に触れた。高さは曲の音階から vars.hz）
        ripple: [{ k: 'chime', mul: 1, type: 'triangle', vol: 0.16, a: 0.004, dec: 0.45 }, { k: 'chime', mul: 2, type: 'sine', vol: 0.04, a: 0.002, dec: 0.25 }],
        // ポンッ（物がはじける）
        pop: [{ k: 'tone', f: 520, type: 'sine', vol: 0.22, a: 0.002, dec: 0.12, slide: 1.9 }, { k: 'noise', f: 1800, q: 1.2, vol: 0.1, dec: 0.04 }, { k: 'chime', mul: 2, type: 'triangle', vol: 0.08, dec: 0.3, delay: 0.05 }],
        // ヒュッ（はらう）
        swish: [{ k: 'noise', f: 900, q: 1.4, vol: 0.18, a: 0.03, dec: 0.18, sweep: 2.2 }],
        // サッ（なぞる地面をなぞる。一定の距離ごと）
        rustle: [{ k: 'noise', f: 2600, q: 0.9, vol: 0.06, a: 0.005, dec: 0.06 }],
        // カリッ（なぞる地面に手応え。振動と同じ刻み）
        scratch: [{ k: 'noise', f: 1200, q: 2, vol: 0.05, dec: 0.025 }],
        // ---- 段階 2 ----
        // パッ（花が咲く。音階の 2 音）
        bloom: [{ k: 'chime', mul: 1, type: 'triangle', vol: 0.14, dec: 0.3 }, { k: 'chime', mul: 1.5, type: 'triangle', vol: 0.12, dec: 0.4, delay: 0.07 }],
        // ブーン（てんとう虫が飛ぶ）
        buzz: [{ k: 'noise', f: 380, q: 6, vol: 0.18, a: 0.02, dec: 0.3 }, { k: 'tone', f: 210, type: 'sawtooth', vol: 0.025, a: 0.02, dec: 0.3, slide: 1.4 }],
        // フワッ（綿毛が飛ぶ）
        fwoosh: [{ k: 'noise', f: 1500, q: 0.7, vol: 0.14, a: 0.06, dec: 0.4, sweep: 2 }, { k: 'chime', mul: 2, type: 'sine', vol: 0.05, a: 0.05, dec: 0.5 }],
        // ピョン（バッタが跳ぶ）
        hop: [{ k: 'tone', f: 380, type: 'triangle', vol: 0.15, dec: 0.12, slide: 2.4 }],
        // ヒョイ（ごはんをつまむ。音階）
        grab: [{ k: 'chime', mul: 2, type: 'triangle', vol: 0.12, dec: 0.12 }],
        // ポテッ（ごはんが落ちる）
        drop: [{ k: 'tone', f: 300, type: 'sine', vol: 0.12, dec: 0.12, slide: 0.5 }],
        // モグモグ（食べる）
        munch: [{ k: 'tone', f: 262, type: 'square', vol: 0.07, dec: 0.05 }, { k: 'tone', f: 196, type: 'square', vol: 0.07, dec: 0.06, delay: 0.1 }, { k: 'tone', f: 262, type: 'square', vol: 0.07, dec: 0.05, delay: 0.22 }, { k: 'tone', f: 196, type: 'square', vol: 0.07, dec: 0.06, delay: 0.32 }],
        // ぷくっ（ほっぺがふくらむ。音階で上がる）
        cheek: [{ k: 'chime', mul: 1, type: 'sine', vol: 0.18, dec: 0.25, slide: 1.5, delay: 0.42 }],
        // ムニッ（つつく）
        poke: [{ k: 'tone', f: 640, type: 'sine', vol: 0.16, dec: 0.15, slide: 0.45 }],
        // なでる（やわらかい音階の音）
        pet: [{ k: 'chime', mul: 2, type: 'sine', vol: 0.06, a: 0.01, dec: 0.4 }],
        // ゴロン（転がる）
        roll: [{ k: 'tone', f: 300, type: 'triangle', vol: 0.15, dec: 0.45, slide: 0.4 }, { k: 'tone', f: 450, type: 'triangle', vol: 0.12, dec: 0.2, slide: 1.6, delay: 0.55 }],
        // 足音（ごく小さく）
        step: [{ k: 'noise', f: 700, q: 1, vol: 0.035, dec: 0.03 }],
        // ザッ（穴を掘る。dig の間くり返す）
        dig: [{ k: 'noise', f: 900, q: 0.8, vol: 0.12, dec: 0.08 }, { k: 'noise', f: 700, q: 0.8, vol: 0.1, dec: 0.08, delay: 0.18 }],
        // ポンッ（ためこんだ）
        stash: [{ k: 'tone', f: 520, type: 'sine', vol: 0.2, dec: 0.12, slide: 1.9 }, { k: 'chime', mul: 2, type: 'triangle', vol: 0.1, dec: 0.4, delay: 0.08 }],
        // ピョコッ（なぞる地面から物が出る）
        find: [{ k: 'tone', f: 500, type: 'triangle', vol: 0.12, dec: 0.1, slide: 2 }, { k: 'chime', mul: 2, type: 'triangle', vol: 0.08, dec: 0.3, delay: 0.06 }],
        // ふわあ（あくび）
        yawn: [{ k: 'tone', f: 520, type: 'sine', vol: 0.06, a: 0.25, dec: 0.6, slide: 0.6 }],
        // ちょうだい（ごはんの所から口まで光が飛ぶ。音階の 3 音で上がる）
        beg: [{ k: 'chime', mul: 1, type: 'sine', vol: 0.08, dec: 0.15 }, { k: 'chime', mul: 1.25, type: 'sine', vol: 0.08, dec: 0.15, delay: 0.1 }, { k: 'chime', mul: 1.5, type: 'sine', vol: 0.09, dec: 0.3, delay: 0.2 }],
        // ---- 段階 3（土地の物） ----
        // ケロッ（かえるが跳ぶ）
        croak: [{ k: 'tone', f: 180, type: 'square', vol: 0.06, dec: 0.06, slide: 1.6 }, { k: 'tone', f: 240, type: 'square', vol: 0.06, dec: 0.08, slide: 1.4, delay: 0.09 }, { k: 'tone', f: 420, type: 'triangle', vol: 0.1, dec: 0.12, slide: 2, delay: 0.15 }],
        // パカッ（貝が開く・閉じる）
        clam: [{ k: 'noise', f: 1400, q: 3, vol: 0.12, dec: 0.03 }, { k: 'tone', f: 700, type: 'triangle', vol: 0.1, dec: 0.08, slide: 1.3 }],
        // カサカサ（かにの横歩き）
        scuttle: [0, 0.07, 0.14, 0.21].map((delay) => ({ k: 'noise', f: 2200, q: 2, vol: 0.06, dec: 0.025, delay })),
        // ポヨン（きのこが跳ねる）
        boing: [{ k: 'tone', f: 220, type: 'sine', vol: 0.2, dec: 0.25, slide: 2.2 }, { k: 'tone', f: 330, type: 'triangle', vol: 0.06, dec: 0.2, slide: 1.8, delay: 0.02 }],
        // ユサユサ（木をゆらす）
        shake: [{ k: 'noise', f: 1800, q: 0.8, vol: 0.1, a: 0.03, dec: 0.12 }, { k: 'noise', f: 1600, q: 0.8, vol: 0.09, a: 0.03, dec: 0.12, delay: 0.16 }],
        // ポーン（雪だるまの帽子が飛ぶ）
        hat: [{ k: 'tone', f: 400, type: 'triangle', vol: 0.15, dec: 0.3, slide: 2.5 }, { k: 'chime', mul: 2, type: 'sine', vol: 0.06, dec: 0.4, delay: 0.1 }],
        // チャプ（水面をなぞる。音階の高い音を短く）
        plip: [{ k: 'chime', mul: 2, type: 'sine', vol: 0.07, dec: 0.08, slide: 1.6 }],
        // ハクション（組み合わせ: 綿毛が鼻に・雪だるまに雪）: 吸って上がる声と、はじける息
        achoo: [{ k: 'tone', f: 520, type: 'triangle', vol: 0.09, dec: 0.22, slide: 1.5 }, { k: 'noise', f: 2400, q: 0.8, vol: 0.14, dec: 0.16, delay: 0.24 },
          { k: 'tone', f: 760, type: 'triangle', vol: 0.1, dec: 0.12, slide: 0.55, delay: 0.24 }],
        // 一緒に触った合図: 音階の 2 音を同時に（和音）、少しあとに上の音
        together: [{ k: 'chime', mul: 1, type: 'triangle', vol: 0.12, dec: 0.7 }, { k: 'chime', mul: 1.25, type: 'triangle', vol: 0.11, dec: 0.7 },
          { k: 'chime', mul: 2, type: 'sine', vol: 0.07, dec: 0.6, delay: 0.12 }],
        // サラッ（砂をなぞる）
        sand: [{ k: 'noise', f: 3200, q: 0.6, vol: 0.05, a: 0.01, dec: 0.08 }],
        // キュッ（雪をなぞる）
        crunch: [{ k: 'noise', f: 1700, q: 4, vol: 0.06, dec: 0.04 }],
        // ふあ（目を覚ます）
        wake: [{ k: 'chime', mul: 1, type: 'sine', vol: 0.1, a: 0.08, dec: 0.4 }, { k: 'chime', mul: 1.5, type: 'sine', vol: 0.08, a: 0.05, dec: 0.5, delay: 0.25 }],
        // すぴー（眠っている寝息。まだ音は出せないので、起きたあとの巣のためだけ）
        snore: [{ k: 'noise', f: 600, q: 1, vol: 0.03, a: 0.4, dec: 0.6 }],
        // ---- 段階 4（贈り物） ----
        // キラキラ（贈り物が空から落ちてくる。音階を高いほうへ 5 つ）
        gift: [1, 1.25, 1.5, 2, 2.5].map((mul, i) => ({ k: 'chime', mul, type: 'sine', vol: 0.09, a: 0.005, dec: 0.5, delay: i * 0.08 })),
        // ジャーン（身につけた。和音を順に重ねて長く鳴らす）
        wear: [{ k: 'chime', mul: 1, type: 'triangle', vol: 0.12, dec: 1.2 }, { k: 'chime', mul: 1.25, type: 'triangle', vol: 0.1, dec: 1.2, delay: 0.06 },
          { k: 'chime', mul: 1.5, type: 'triangle', vol: 0.1, dec: 1.2, delay: 0.12 }, { k: 'chime', mul: 2, type: 'sine', vol: 0.1, dec: 1.4, delay: 0.18 },
          { k: 'tone', f: 260, type: 'triangle', vol: 0.12, dec: 0.25, slide: 2.5 }],
        // ---- 段階 4（景色の驚き） ----
        // 虹がかかる（音階を高いほうへ 8 つ、やわらかい下の音を添えて）
        rainbow: [1, 1.125, 1.25, 1.5, 1.667, 2, 2.25, 2.5].map((mul, i) => ({ k: 'chime', mul, type: 'triangle', vol: 0.08, a: 0.005, dec: 0.8, delay: i * 0.09 }))
          .concat([{ k: 'chime', mul: 0.5, type: 'sine', vol: 0.07, a: 0.3, dec: 1.6 }]),
        // キラッ（虹や空をたたいた。音階の高い 2 音）
        twinkle: [{ k: 'chime', mul: 1, type: 'sine', vol: 0.12, dec: 0.5 }, { k: 'chime', mul: 1.5, type: 'sine', vol: 0.05, dec: 0.35, delay: 0.04 }],
        // パシャッ（鯉がはねる・水に戻る）
        splash: [{ k: 'noise', f: 1400, q: 0.7, vol: 0.2, a: 0.004, dec: 0.28 }, { k: 'tone', f: 520, type: 'sine', vol: 0.12, dec: 0.12, slide: 0.45 },
          { k: 'noise', f: 3200, q: 2, vol: 0.06, dec: 0.03, delay: 0.12 }, { k: 'noise', f: 2800, q: 2, vol: 0.05, dec: 0.03, delay: 0.21 }],
        // ボォー（くじらの背中が出る。低くやわらかく）
        whale: [{ k: 'tone', f: 150, type: 'triangle', vol: 0.14, a: 0.3, dec: 1.1, slide: 0.8 }, { k: 'tone', f: 225, type: 'sine', vol: 0.05, a: 0.35, dec: 0.9, slide: 0.85 },
          { k: 'noise', f: 500, q: 0.6, vol: 0.08, a: 0.2, dec: 0.6 }],
        // プシュー（潮を吹く）
        spout: [{ k: 'noise', f: 800, q: 0.6, vol: 0.2, a: 0.08, dec: 1.0, sweep: 2.5 }, { k: 'chime', mul: 2, type: 'sine', vol: 0.05, a: 0.1, dec: 0.6, delay: 0.25 }],
        // チュッ（りす）
        squeak: [{ k: 'tone', f: 1700, type: 'sine', vol: 0.1, dec: 0.05, slide: 1.3 }, { k: 'tone', f: 1950, type: 'sine', vol: 0.09, dec: 0.06, slide: 1.25, delay: 0.09 }],
        // キラーン（流れ星。高い音がすっと下りて、音階の 2 音が残る）
        shoot: [{ k: 'tone', f: 2600, type: 'sine', vol: 0.06, a: 0.01, dec: 0.7, slide: 0.5 }, { k: 'chime', mul: 2, type: 'sine', vol: 0.08, dec: 0.8, delay: 0.15 },
          { k: 'chime', mul: 3, type: 'sine', vol: 0.05, dec: 0.9, delay: 0.3 }],
      },
    },

    // 曲の音階（土地ごとの調）。音の高さがある効果音は、いまの調の五音音階から選ぶ
    music: {
      keys: [
        { root: 72, scale: 'major' },  // はらっぱ: ハ長調（C5 から）
        { root: 74, scale: 'major' },  // いけ: ニ長調
        { root: 69, scale: 'major' },  // はま: イ長調
        { root: 69, scale: 'minor' },  // もり: イ短調（五音）
        { root: 71, scale: 'major' },  // ゆきのおか: ロ長調（高く澄んだ）
      ],
      span: 8,      // 五音音階の何段まで使うか（0〜span-1。約 1.5 オクターブ）
      climb: 0.7,   // 続けて鳴らしたとき 1 段上がる割合（残りは近くへ散らばる）
      resetMs: 1200, // これだけ間があいたら、低いところから始め直す
      // 曲（中身は music.js の SONGS）。vol: 曲全体の大きさ（効果音より小さく）、
      // fade: 混ざる区間の混ざり具合 u がこの間で 2 曲の大きさを入れ替える（ほかの所では片方だけ鳴る。調がぶつかる時間を短く）
      vol: 0.35, fade: [0.35, 0.65], fadeIn: 3, lookahead: 0.15,
    },

    // ハムスター（体の大きさは仮の絵に合わせる。足は layout.footY に立つ）
    ham: { w: 34, h: 38 },

    // 歩く: 触ると「歩く分」が貯まり、ある間は一定の速さで歩く。上限があるので連打しても速くならない
    walk: {
      credit: { tap: 6, hit: 10, stroke: 0.25, feed: 20 }, // 何をしたら何ドット分貯まるか（stroke は 1 ドットあたり）
      max: 48,          // 貯められる上限（ドット）
      speed: 14,        // 歩く速さ（ドット/秒）
      stepEvery: 9,     // 足音の間隔（ドット）
    },
    idle: { sitMs: 4000, everyMs: 3500 }, // 何も触らずにこれだけたつと座る / 待つしぐさの間隔
    pet: { rollMs: 3000, gapMs: 250 },    // 続けてなでるとこれだけで転がる / なでる指がこれだけ止まったら「続けて」を切る
    // ごはん: 口の当たりを体より広げる量 / もぐもぐの長さ / つまむ当たりをほかの物よりさらに広げる量 /
    //   運んでいるごはんを指のどれだけ上に出すか（指で隠れないように）/ ちょうだい（口を開けて待つ）の長さ
    feed: { pad: 14, eatMs: 700, grabPad: 6, lift: 14, begMs: 1200 },
    dig: { ms: 2000 },                    // 穴を掘ってためこむ長さ
    poke: { ms: 450 },                    // つつかれた顔の長さ
    roll: { ms: 900 },                    // 転がって起き上がるまで
    find: { every: 40, p: 0.35 },         // なぞる地面をこれだけ（ドット）なぞるごとに、この確率で物が出る
    blow: { r: 30 },                      // はらったとき、指からこの距離（ドット）の「はらう物」が飛ぶ
    // 組み合わせ（meet.js）: foot … 足元とみなす、物の立つ高さと足元の線の差（ドット）/ blowLen … はらった物が進むとみなす距離 /
    //   landPad … 跳んだ先の当たりを、相手の r + pad よりさらに広げる量 / hamR … 飛んできた物が当たる、ハムスターの丸の半径 /
    //   passX・footX … 身なり・足元で出会う所（hamX から前へのドット。真ん中まで来ると体に隠れるので、少し前で起こす）
    meet: { foot: 6, blowLen: 60, landPad: 4, hamR: 14, passX: 34, footX: 26 },
    // 一緒に触る（together.js）: win … 「同時」とみなす間（秒）/ gap … 終わってから次を起こさない間（秒）/ banzaiGap … ばんざいどうしの間（秒）/
    //   ms … 反応の長さ / skyMin … 空をこすったとみなす、指ごとの距離（ドット）/ skyWin … 2 本の指が「同じころ」こすっている間（秒）
    together: { win: 0.35, gap: 2, banzaiGap: 8, ms: { hug: 1300, banzai: 1300, pair: 1600, skybow: 2600 }, skyMin: 12, skyWin: 0.3 },
    wake: { ms: 1600 },                   // 巣で目を覚まして出てくるまで
    bed: { ms: 2400 },                    // おやすみ: その場に巣を掘って、もぐりこんで眠るまで
    // 夜（おやすみのあと・巣で眠っている間）: 画面を暗くする濃さ、暗くなるまでの秒、明るくなるまでの秒
    night: { alpha: 0.6, inS: 2.4, outS: 1.2 },
    // 巣: ためこんだごはんの山の段（stash がこの数以上で 1 段ずつ大きく）、
    //   集めた身なりの並べ方（巣の右上の地面に cols 列。最初の物の真ん中が巣から x, y。間 dx・dy）

<script>
// シード付きの乱数（mulberry32）。状態は整数1つで、ルールの状態の中に持つ（写しても同じ列になる）
(function () {
  const Game = (window.Game = window.Game || {});

  // o.rng（整数）を進めて [0,1) を返す
  function next(o) {
    let t = (o.rng = (o.rng + 0x6d2b79f5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const int = (o, n) => Math.floor(next(o) * n);
  const pick = (o, arr) => arr[int(o, arr.length)];
  // 重み付き。items: [{ weight }]
  function weighted(o, items) {
    let sum = 0;
    for (const it of items) sum += it.weight;
    let r = next(o) * sum;
    for (const it of items) { r -= it.weight; if (r < 0) return it; }
    return items[items.length - 1];
  }
  const seedFrom = (s) => (typeof s === 'number' ? s | 0 : [...String(s)].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619), 2166136261) | 0);

  Game.rng = { next, int, pick, weighted, seedFrom };
})();

<script>
// 指 1 本ずつの記録から、置いた・なぞった・はらった・離した を決める（ルール側。DOM に触らない）。
// 入るもの: { id, x, y, t }（ドット、ミリ秒）。出すもの（出来事の列）:
//   press   { id, x, y }            … 指が触れた瞬間
//   stroke  { id, x, y, px, py, d } … slop を超えて動いたあと、動くたび（px,py: 前の位置、d: その間の距離）
//   flick   { id, x, y, vx, vy }    … 離す直前の flickMs の間の速さが flickSpeed 以上（release の前に出す）
//   release { id, x, y, moved }     … 指が離れた
//   cancel  { id }                  … 指が取り消された（ブラウザに奪われたなど）
// 押しっぱなし（動かさずに置いたまま）は、press のあと何も出さない。
(function () {
  const Game = (window.Game = window.Game || {});

  const create = () => ({ fingers: {} });
  const count = (T) => Object.keys(T.fingers).length;

  function down(T, ev, cfg = Game.config) {
    if (T.fingers[ev.id] || count(T) >= cfg.touch.max) return [];
    T.fingers[ev.id] = { id: ev.id, x0: ev.x, y0: ev.y, x: ev.x, y: ev.y, t0: ev.t, moved: false, path: [{ x: ev.x, y: ev.y, t: ev.t }] };
    return [{ type: 'press', id: ev.id, x: ev.x, y: ev.y }];
  }

  function move(T, ev, cfg = Game.config) {
    const f = T.fingers[ev.id];
    if (!f) return [];
    const out = [];
    if (!f.moved && Math.hypot(ev.x - f.x0, ev.y - f.y0) >= cfg.touch.slop) f.moved = true;
    if (f.moved && (ev.x !== f.x || ev.y !== f.y)) out.push({ type: 'stroke', id: f.id, x: ev.x, y: ev.y, px: f.x, py: f.y, d: Math.hypot(ev.x - f.x, ev.y - f.y) });
    f.x = ev.x; f.y = ev.y;
    // はらった を決めるための、最近の位置（flickMs より古いものは 1 つだけ残す）
    f.path.push({ x: ev.x, y: ev.y, t: ev.t });
    while (f.path.length > 2 && ev.t - f.path[1].t >= cfg.touch.flickMs) f.path.shift();
    return out;
  }

  function up(T, ev, cfg = Game.config) {
    const f = T.fingers[ev.id];
    if (!f) return [];
    const out = move(T, ev, cfg);
    delete T.fingers[ev.id];
    if (f.moved) {
      const a = f.path[0], dt = Math.max(1, ev.t - a.t);
      const vx = (ev.x - a.x) / dt, vy = (ev.y - a.y) / dt;
      if (Math.hypot(vx, vy) >= cfg.touch.flickSpeed) out.push({ type: 'flick', id: f.id, x: ev.x, y: ev.y, vx, vy });
    }
    out.push({ type: 'release', id: f.id, x: ev.x, y: ev.y, moved: f.moved });
    return out;
  }

  function cancel(T, ev) {
    if (!T.fingers[ev.id]) return [];
    delete T.fingers[ev.id];
    return [{ type: 'cancel', id: ev.id }];
  }

  // 入力 { type: 'down'|'move'|'up'|'cancel', id, x, y, t } をまとめて受ける
  function feed(T, ev, cfg = Game.config) {
    switch (ev.type) {
      case 'down': return down(T, ev, cfg);
      case 'move': return move(T, ev, cfg);
      case 'up': return up(T, ev, cfg);
      case 'cancel': return cancel(T, ev);
    }
    return [];
  }

  Game.touch = { create, down, move, up, cancel, feed, count };
})();
</script>
<script>
// 曲の音階（ルール側の純粋な計算。音は鳴らさない）。
// 音の高さがある効果音（波紋・ほっぺ・なでる）は、いまの土地の調の五音音階から選ぶ。五音音階はどう重ねても濁らない。
// 続けて鳴らすと少しずつ上がり、ときどき近くへ散らばる。間があくと低いところから始め直す。
// 曲（SONGS）: 土地ごとに 1 曲。audio.js が少し先まで予約して鳴らし、混ざる区間では 2 曲の大きさを入れ替える。
//   1 文字 = 8 分音符。lead の数字は いまの調の五音音階の段（0 = 主音）、'-' はのばす、'.' は休み。
//   bar: 1 小節の 8 分音符の数（8 = 4 拍子、6 = 3 拍子）。
//   chords は 1 小節ごとの低音の段。bass は 1 小節の中の低音の型（R = その段、O = その 3 段上、'.' は休み）。
//   inst: 旋律の楽器（audio.js が音色を作る）: flute（ふわっと入ってビブラート）/ drop（しずく。上から落ちる短い音）/
//         steel（スチールドラム。倍音のある明るい短い音）/ wood（木琴。のばす所は細かく打ち直す）/ box（オルゴール）
//   perc: 打楽器の型（何小節分でもよい。1 文字 = 8 分音符）: h（シェーカー）H（強いシェーカー）b（やわらかい太鼓）
//         t（木魚のような木の音）d（水のしずく）j（鈴）'.' は休み
//   oct: 旋律を何半音ずらすか、echo: 3 つあとに小さく繰り返す、bell: 2 小節ごとの高い鈴
//   はじめは 5 曲とも同じ楽器・同じ 4 拍子で「雪以外は違いが分からない」と言われたので、楽器・拍子・打楽器で分けた
(function () {
  const Game = (window.Game = window.Game || {});

  const SCALES = { major: [0, 2, 4, 7, 9], minor: [0, 3, 5, 7, 10] };
  const midiHz = (m) => 440 * Math.pow(2, (m - 69) / 12);

  // 調 key（{ root, scale }）の d 段目（0 から）の音（MIDI の番号）
  function degree(key, d) {
    const sc = SCALES[key.scale], n = sc.length, o = Math.floor(d / n), i = ((d % n) + n) % n;
    return key.root + sc[i] + 12 * o;
  }
  // その調の音か
  function inKey(key, midi) {
    const pc = (((midi - key.root) % 12) + 12) % 12;
    return SCALES[key.scale].includes(pc);
  }

  // 続けて鳴らす音を選ぶもの。rnd: [0,1) を返す関数（テストで差し替える）
  function picker(cfg = Game.config, rnd = Math.random) {
    const M = cfg.music;
    let step = 0, lastT = -Infinity;
    // keyIndex: 土地の番号、t: ミリ秒。MIDI の番号を返す
    function next(keyIndex, t) {
      if (t - lastT > M.resetMs) step = Math.floor(rnd() * 2);
      else if (rnd() < M.climb) step = step + 1 >= M.span ? Math.max(0, M.span - 4) : step + 1;
      else step = Math.max(0, Math.min(M.span - 1, step + [-2, -1, 1, 2][Math.floor(rnd() * 4)]));
      lastT = t;
      return degree(M.keys[keyIndex], step);
    }
    return { next, get step() { return step; } };
  }

  const SONGS = [
    { // はらっぱ（春）: 笛のワルツ（3 拍子。ズン・チャッ・チャッ）
      tempo: 132, bar: 6, inst: 'flute', oct: 0, leadVol: 0.09, bassWave: 'sine', bassVol: 0.1,
      lead: '0-2-4- 5---4- 3-2-1- 2----- 1-2-3- 4---5- 4-3-1- 0-----',
      chords: [0, 4, 3, 1, 0, 4, 3, 0], bass: 'R.O.O.', perc: '......',
    },
    { // いけ（初夏）: しずくの音と、こだま。ときどき水の音
      tempo: 84, bar: 8, inst: 'drop', oct: 0, leadVol: 0.12, echo: true, bassWave: 'triangle', bassVol: 0.07,
      lead: '4.2.3.0. 1.2.4... 5.4.2.3. 2....... 4.5.7.5. 4.2.3... 2.1.2.4. 0.......',
      chords: [0, 1, 3, 0, 4, 3, 1, 0], bass: 'R...R...', perc: '........ ...d.... ........ ......d.',
    },
    { // はま（夏）: スチールドラムと、はずむ低音（3・3・2）、シェーカー
      tempo: 116, bar: 8, inst: 'steel', oct: 0, leadVol: 0.07, bassWave: 'triangle', bassVol: 0.1,
      lead: '0.2.3.4- 3.2.0... 1.3.4.5- 4.3.1... 5.4.3.4. 3.2.1.2. 3.2.1.0. 0--.....',
      chords: [0, 0, 1, 1, 3, 3, 4, 0], bass: 'R..O..R.', perc: 'b.hHb.hH',
    },
    { // もり（秋）: 木琴、短調の五音。コツコツと木の音
      tempo: 92, bar: 8, inst: 'wood', oct: 0, leadVol: 0.1, bassWave: 'triangle', bassVol: 0.09,
      lead: '0-2-3-4- 3---2--- 1-0-1-2- 0------- 4-5-4-3- 2---3--- 1-2-1-0- 0-------',
      chords: [0, 1, 3, 0, 4, 1, 3, 0], bass: 'R...R.O.', perc: 't...t.t.',
    },
    { // ゆきのおか（冬）: オルゴールのような、まばらな音と鈴
      tempo: 72, bar: 8, inst: 'box', oct: 0, leadVol: 0.1, bell: true, bassWave: 'sine', bassVol: 0.08,
      lead: '4...3... 2...0... 1...2... 3....... 5...4... 3...4... 2...1... 0.......',
      chords: [0, 3, 4, 1, 0, 3, 1, 0], bass: 'R.......', perc: '........ ........ ....j... ........',
    },
  ];
  for (const S of SONGS) { S.leadP = S.lead.replace(/ /g, ''); S.bassP = S.bass; S.percP = (S.perc || '.').replace(/ /g, ''); }

  // 混ざり具合 u（0〜1）から、2 曲の大きさ（等しい力で入れ替える。fade の外では片方だけ）
  function fadeGains(u, cfg = Game.config) {
    const [f0, f1] = cfg.music.fade, v = Math.max(0, Math.min(1, (u - f0) / (f1 - f0)));
    return [Math.cos((v * Math.PI) / 2), Math.sin((v * Math.PI) / 2)];
  }

  Game.music = { SCALES, midiHz, degree, inKey, picker, SONGS, fadeGains };
})();

<script>

//
// 物の型 OBJ[kind]:

(function () {

<script>
// 景色の組み立て（ルール側の純粋な関数）。旅の位置は歩いた距離 d（ドット）だけで決まる。
// 物は区切り（config.world.chunk ドット）ごとに、種と区切りの番号から決める。同じ種と区切りなら、いつも同じ並び。
// 物の位置は「世界の x」（wx）。画面の x は wx - d（ハムスターは画面の決まった所に立ち、景色が流れる）。
// 土地: 世界の x を config.land.len ごとに区切り、5 つの土地を順に巡る。土地の終わりの config.land.blend は「混ざる区間」で、
// 次の土地への混ざり具合 u が 0 → 1 へなめらかに上がる。景色はこれを画面の列ごとに使うので、次の土地は右から少しずつ近づいてくる
(function () {
  const Game = (window.Game = window.Game || {});
  const RNG = Game.rng;

  // 区切り i の乱数の種（seed と i から、よく混ざった整数）
  function chunkRng(seed, i) {
    const o = { rng: (seed ^ Math.imul(i + 1, 0x9e3779b1)) | 0 };
    RNG.next(o); RNG.next(o);
    return o;
  }

  // 世界の x の所の土地 a と、次の土地 b、b への混ざり具合 u（0〜1。区間の両端でなめらかに 0 と 1 になる）
  function mixAt(wx, cfg = Game.config) {
    const N = Game.lands.LANDS.length, { len, blend } = cfg.land;
    const i = Math.floor(wx / len), within = wx - i * len;
    const a = ((i % N) + N) % N, b = (a + 1) % N;
    const v = Math.max(0, Math.min(1, (within - (len - blend)) / blend));
    return { a, b, u: v * v * (3 - 2 * v) };
  }
  // 世界の x の所でいちばん強い土地の番号
  function landAt(wx, cfg = Game.config) {
    const m = mixAt(wx, cfg);
    return m.u < 0.5 ? m.a : m.b;
  }
  // 混ざる区間では、u の割合で次の土地を選ぶ（r は 0〜1 の乱数）
  function pickLand(wx, r, cfg = Game.config) {
    const m = mixAt(wx, cfg);
    return r < m.u ? m.b : m.a;
  }

  // 区切り i の物: [{ key, kind, wx, y }]
  function chunk(seed, i, cfg = Game.config) {
    const W = cfg.world, o = chunkRng(seed, i);
    const n = W.perChunk[0] + RNG.int(o, W.perChunk[1] - W.perChunk[0] + 1);
    const out = [];
    for (let j = 0; j < n; j++) {
      // 前の物と近すぎたら置き直す（数回だけ。だめなら置かない）
      for (let tries = 0; tries < 6; tries++) {
        const wx = i * W.chunk + Math.round(RNG.next(o) * (W.chunk - 1));
        const y = W.yMin + Math.round(RNG.next(o) * (W.yMax - W.yMin));
        const land = Game.lands.LANDS[pickLand(wx, RNG.next(o), cfg)];
        const kind = RNG.weighted(o, land.spawn).kind;
        if (out.some((p) => Math.abs(p.wx - wx) < W.gapMin)) continue;
        out.push({ key: i + ':' + j, kind, wx, y });
        break;
      }
    }
    return out;
  }

  // 世界の x が [x0, x1) に入る区切りの物、全部
  function objectsIn(seed, x0, x1, cfg = Game.config) {
    const W = cfg.world, out = [];
    for (let i = Math.floor(x0 / W.chunk); i * W.chunk < x1; i++) for (const p of chunk(seed, i, cfg)) if (p.wx >= x0 && p.wx < x1) out.push(p);
    return out;
  }

  Game.world = { chunk, objectsIn, mixAt, landAt, pickLand, chunkRng };
})();
</script>
<script>
// 旅の状態と、指の出来事・時間から起きること（ルールの中心。DOM・音・振動に触らない）。設計書 4・5 章。
// 入口: create(seed, d, cfg, { cheeks, stash, got, sleep }) / touch(s, e)（e は touch.js の出来事）/ step(s, dt)。どれも出来事の列を返す。
// 画面の座標はドット。物の位置は世界の x（wx）で持ち、画面の x は wx - d。ハムスターは画面の決まった所（layout.hamX）に立つ。
//
// 出来事:
//   tap { x, y, ground } … 何もない所に置いた（1 段め）
//   hit { key, kind, x, y, react, spawn?, away?, gone? } … 物に置いた（react は lands.js の tap と、bloom→sway / open→close / hat→sway / blow）
//     spawn { key, kind, x, y0, y } … 木からごはんが落ちた
//   grab { key, kind, x, y } … ごはんをつまんだ / carry { x, y } … 運んでいる
//   feed { kind, cheeks, x, y } … 食べた（口の当たりに入った瞬間。離さなくても食べる）
//   drop { key, kind, x, y, y1 } … 外で離した / back { key, kind } … 動かさずに離した（元の所に戻る）
//   beg { x, y } … ハムスターが口を開けて「ちょうだい」（ごはんの所から口まで光が飛ぶ）
//   poke … ハムスターをつついた / petStart / pet { d } / petEnd / roll … なでて転がった
//   scratch { x, y, px, py, d, ground } … なぞる地面をなぞった（ground: 指の下の なぞる地面の種類）
//   find { key, kind, x, y, fromY } … なぞる地面から物が出た
//   trail { x, y, d } … 何もない所をなぞった / flick { x, y, vx, vy } / blow { key, kind, x, y, vx, vy, gone } … はらって飛んだ
//   walk / stop / step { ground } … 歩き出した・止まった・足音 / sit / idle { kind } / dig / stash { n, stash }
//   wake … 巣で目を覚ました / awake … 巣から出た
//   bed … おやすみ（その場に巣を掘ってもぐりこむ）/ asleep … 眠った（設計書 5.5）
//   gift { key, item, x, y, y0 } … まれな驚きで、贈り物が空から落ちてきた（設計書 5.3）
//   wear { item, slot, first, auto } … 贈り物を身につけた（first: はじめて集めた、auto: 運ばれずに流れてきたのを自分で拾った）
//   sight { kind, x, y } … まれな驚きで、景色の驚きが始まった（lands.js の SIGHT）/ sightEnd { kind } … 終わった
//   sightHit { kind, n, x, y, auto?, spawn? } … 景色の驚きの 2 段めの反応（触った・触らなくても時々。spawn はりすが落としたどんぐり）
//   palFeed { kind, x, y } … りすにごはんを渡した（りすが食べる）
//   meet / meetEnd … 組み合わせ（meet.js）/ together / togetherEnd … 一緒に触った（together.js）
(function () {
  const Game = (window.Game = window.Game || {});
  const RNG = Game.rng, W = () => Game.world;
  const OBJ = () => Game.lands.OBJ;

  function create(seed, d = 0, cfg = Game.config, o = {}) {
    return {
      seed: seed | 0, rng: (seed ^ 0x5bd1e995) | 0,
      d, credit: 0, t: 0,
      cheeks: o.cheeks || 0, stash: o.stash || 0,
      nest: Math.round(d) + cfg.layout.hamX, // 巣の世界の x（眠っていた所）
      objs: {},          // 区切りの物の反応の状態: key → { st, t, dx, n }
      free: [],          // 落とした・なぞる地面から出た・木から落ちた物 { key, kind, wx, y, t }
      nextFree: 1,
      fingers: {},       // 指 → { on: 'empty' | 'ground' | 'obj' | 'ham' | 'carry' | 'fed', key, acc }
      carry: null,       // { id, kind, x, y, from: { wx, y } }（x, y は指の画面の座標。from は つまんだ所）
      pet: null,         // { id, ms, lastT }
      // act: sleep | wake | stand | walk | sit | idle | poke | roll | eat | dig | beg
      ham: { act: o.sleep ? 'sleep' : 'stand', t0: 0, until: 0, kind: null },
      // 身なり: 巣から出発するときは、いつも探検帽だけ（着ている物は保存しない）。got は集めた身なり（保存する）
      wear: { head: 'explorer', neck: null }, got: (o.got || []).slice(),
      rareNext: d + cfg.rare.every, rareLast: d, // 次にまれな驚きを抽選する距離 / 前の驚きの距離
      sight: null,       // 景色の驚き { kind, t0, until, sx0, d0, n, t1, hx, hy }（保存しない）
      lastTouch: 0, idleNext: 0, stepAcc: 0,
    };
  }

  // ---- 置き場所 ----
  const hamBox = (cfg, pad = 0) => {
    const L = cfg.layout, H = cfg.ham;
    return { x0: L.hamX - H.w / 2 - pad, x1: L.hamX + H.w / 2 + pad, y0: L.footY - H.h - pad, y1: L.footY + pad };
  };
  const inBox = (b, x, y) => x >= b.x0 && x <= b.x1 && y >= b.y0 && y <= b.y1;
  const hamWx = (s, cfg) => s.d + cfg.layout.hamX; // ハムスターの立つ所の世界の x（いまの土地はここで決める）
  const landHere = (s, cfg) => Game.lands.LANDS[W().landAt(hamWx(s, cfg), cfg)];
  const hidden = (st) => st && (st.st === 'taken' || st.st === 'gone');
  // 飛び去った物（飛び去る動きが終わったら消える）
  const flewAway = (s, def, st) => def.away && st && st.st === 'away' && s.t - st.t >= def.away;
  // 反応の動きの途中か（触っても反応しない）
  const locked = (s, def, st) => !!(def.lock && st && st.st && s.t - st.t < def.lock);

  // いま画面に見えている物（触れる物）: [{ key, kind, x, y（足元）, cy（当たりの真ん中）, r, st, free, t }]。左右の端の帯には出さない
  function visible(s, cfg = Game.config) {
    const V = cfg.view, E = cfg.layout.edge, out = [];
    const add = (p, st, free) => {
      const def = OBJ()[p.kind], x = Math.round(p.wx + (st && st.dx ? st.dx : 0) - s.d);
      if (x - def.r < E || x + def.r > V.w - E) return;
      out.push({ key: p.key, kind: p.kind, item: p.item, wx: p.wx, x, y: p.y, cy: p.y + (def.cy || 0), r: def.r, st: st || null, free, t: p.t, y0: p.y0 });
    };
    for (const p of W().objectsIn(s.seed, s.d - 64, s.d + V.w + 64, cfg)) {
      if (s.bareTo && p.wx < s.bareTo) continue; // 確かめ用の場面（meet.stage）: 置いた物だけ
      const st = s.objs[p.key];
      if (!hidden(st) && !flewAway(s, OBJ()[p.kind], st)) add(p, st, false);
    }
    for (const p of s.free) if (!hidden(s.objs[p.key]) && !flewAway(s, OBJ()[p.kind], s.objs[p.key])) add(p, s.objs[p.key], true);
    return out;
  }
  // 指の下の物（いちばん近いもの。当たりは r + pad。ごはんはさらに grabPad 広い）
  function objAt(s, x, y, cfg) {
    let best = null, bd = Infinity;
    for (const o of visible(s, cfg)) {
      const def = OBJ()[o.kind];
      if (o.st && o.st.st && !def.again && def.act !== 'carry') continue; // 1 度きりの物は反応したら触れない
      if (o.st && (o.st.st === 'away' || o.st.st === 'meet')) continue;   // 飛び去っている途中・組み合わせの反応の途中
      const dd = Math.hypot(x - o.x, y - o.cy);
      const reach = o.r + cfg.touch.pad + (def.food ? cfg.feed.grabPad : 0);
      if (dd <= reach && dd < bd) { best = o; bd = dd; }
    }
    return best;
  }

  const addCredit = (s, n, cfg) => { s.credit = Math.min(cfg.walk.max, s.credit + n); };
  const BUSY = ['dig', 'eat', 'roll', 'poke', 'beg', 'sleep', 'wake', 'wear', 'bed', 'sneeze', 'bounce', 'hug', 'banzai'];
  const M = () => Game.meet; // 組み合わせ（meet.js）
  const TG = () => Game.together; // 一緒に触る（together.js）
  // 身なりの組み合わせの間は、立ち止まって見る（歩き続けると、物がハムスターの体の後ろへ流れて見えなくなる）
  const watching = (s) => !!(s.meet && Game.lands.MEET[s.meet.id].how === 'pass');
  const busy = (s, cfg) => !!s.carry || (s.pet && s.t - s.pet.lastT <= cfg.pet.gapMs / 1000) || BUSY.includes(s.ham.act) || watching(s);
  const setAct = (s, act, sec = 0, kind = null) => { s.ham.act = act; s.ham.t0 = s.t; s.ham.until = sec ? s.t + sec : 0; s.ham.kind = kind; };
  const canEat = (s) => !['dig', 'sleep', 'wake', 'bed'].includes(s.ham.act);
  const stOf = (s, key) => s.objs[key] || (s.objs[key] = { st: null, t: 0, dx: 0, n: 0 });
  // y0: 絵の上で、どの高さから落ちてくるか（落とした・木から落ちた・なぞる地面から出た）
  const addFree = (s, kind, wx, y, y0, item) => {
    const p = { key: 'f' + s.nextFree++, kind, wx: Math.round(wx), y: Math.round(y), t: s.t };
    if (y0 != null) p.y0 = Math.round(y0);
    if (item) p.item = item;
    s.free.push(p); return p;
  };
  // 贈り物が画面にあるか（運んでいるのも）。1 つずつしか出さない
  const giftOut = (s) => s.free.some((p) => p.kind === 'gift') || (s.carry && s.carry.kind === 'gift');
  const blownSt = (def) => (def.gone === 'stem' ? 'blown' : def.gone ? 'gone' : 'sway');

  // 物の反応（置いたとき）。{ react, spawn, away, meets } を返す（meets: 跳んだ先で起きた組み合わせの出来事）
  function react(s, o, cfg) {
    const def = OBJ()[o.kind], st = stOf(s, o.key), meets = [];
    let r = def.act === 'blow' ? 'blow' : def.tap, spawn = null, away = false;
    st.t = s.t;
    switch (r) {
      case 'bloom': r = st.st === 'bloom' ? 'sway' : 'bloom'; st.st = 'bloom'; break;
      case 'fly': case 'hop': case 'jump':
        // 何度かは少し先へ跳んで止まる。hops 回跳んだあとか、次に跳ぶと画面の前の端を越えるときは、飛び去る（def.away 秒で消える）
        st.n++;
        if (st.n > def.hops || o.x + def.dx + def.r > cfg.view.w - cfg.layout.edge) { st.st = 'away'; away = true; }
        else { st.dx += def.dx; st.st = r; M().tryLand(s, o, cfg, meets); }
        break;
      case 'pop': st.st = 'gone'; break;
      case 'open': st.st = st.st === 'open' ? null : 'open'; r = st.st ? 'open' : 'close'; break;
      case 'hat':
        r = st.st === 'hat' ? 'sway' : 'hat';
        // 帽子が飛んだとき、まれに消えずに地面に残って、シルクハットの贈り物になる
        if (r === 'hat' && !giftOut(s) && RNG.next(s) < cfg.rare.tophat) {
          const x = Math.min(cfg.view.w - cfg.layout.edge - 12, o.x + 20), y0 = o.y - 30, y1 = Math.min(cfg.world.yMax, o.y + 4);
          const p = addFree(s, 'gift', x + s.d, y1, y0, 'tophat');
          spawn = { key: p.key, kind: 'gift', item: 'tophat', x, y0, y: y1 };
          st.gift = true;
        }
        st.st = 'hat';
        break;
      case 'shake':
        st.st = 'shake';
        if (st.n < def.drops) {
          st.n++;
          const x = o.x + (st.n % 2 ? -6 : 7), y0 = o.y - 26, y1 = Math.min(cfg.world.yMax, o.y + 8);
          const p = addFree(s, def.drop, x + s.d, y1, y0);
          spawn = { key: p.key, kind: def.drop, x, y0, y: y1 };
        }
        break;
      case 'blow': st.st = blownSt(def); break;
      default: st.st = r; break; // scuttle, boing: その場の動き（時間 st.t で描く）
    }
    return { react: r, spawn, away, meets };
  }

  // 食べる（口の当たりに入った）
  function feed(s, kind, x, y, cfg, out) {
    s.carry = null;
    s.cheeks = Math.min(3, s.cheeks + 1);
    addCredit(s, cfg.walk.credit.feed, cfg);
    setAct(s, 'eat', cfg.feed.eatMs / 1000);
    out.push({ type: 'feed', kind, cheeks: s.cheeks, x, y });
  }
  // 身につける（頭の物は探検帽と入れ替え、首・背中の物は重ねる）
  function wear(s, item, cfg, out, auto = false) {
    const slot = Game.lands.GIFT[item].slot, first = !s.got.includes(item);
    s.wear[slot] = item;
    if (first) s.got.push(item);
    addCredit(s, cfg.walk.credit.feed, cfg);
    setAct(s, 'wear', cfg.rare.wearMs / 1000, auto ? 'auto' : null);
    out.push({ type: 'wear', item, slot, first, auto });
  }
  const canWear = (s) => !['sleep', 'wake', 'bed'].includes(s.ham.act);
  // 運んだ物を体に渡す（ごはんは食べる、贈り物は身につける）。渡せたら true
  function give(s, c, x, y, cfg, out) {
    if (c.kind === 'gift') { if (!canWear(s)) return false; s.carry = null; wear(s, c.item, cfg, out); return true; }
    if (!canEat(s)) return false;
    feed(s, c.kind, x, y, cfg, out);
    return true;
  }
  // ---- 景色の驚き（設計書 5.3）----
  const SIGHT = () => Game.lands.SIGHT;
  // いまの画面の位置（足元か真ん中）。render もこれで描く
  function sightPos(s, cfg = Game.config) {
    const st = s.sight; if (!st) return null;
    const L = cfg.layout, V = cfg.view, def = SIGHT()[st.kind];
    switch (def.area) {
      case 'water': return { x: Math.round(st.sx0 - (s.d - st.d0)), y: L.groundY };
      case 'far': return { x: Math.round(st.sx0 - (s.d - st.d0) * def.par), y: L.skyH - 4 };
      case 'pal': {
        // 右から走ってきて隣に並び、終わりにまた右へ走っていく
        const home = L.hamX + 40, out = V.w + 12, u = s.t - st.t0, left = st.until - s.t, run = 1.2;
        const k = u < run ? 1 - u / run : left < run ? 1 - left / run : 0;
        return { x: Math.round(home + (out - home) * k * k), y: L.footY + 2 };
      }
      default: return { x: Math.round(V.w / 2), y: Math.round(L.skyH / 2) };
    }
  }
  // 指の下が景色の驚きか
  function sightAt(s, x, y, cfg) {
    const st = s.sight; if (!st) return false;
    const L = cfg.layout, pad = cfg.touch.pad, def = SIGHT()[st.kind], p = sightPos(s, cfg);
    switch (def.area) {
      case 'sky': return y < L.skyH;
      case 'water': return Math.abs(x - p.x) <= def.w && y >= L.groundY - 30;
      case 'far': return Math.abs(x - p.x) <= def.w && y >= L.skyH - 30 && y <= L.skyH + 6;
      case 'pal': return Math.abs(x - p.x) <= def.w + pad && y >= p.y - 22 - pad && y <= p.y + 4 + pad;
    }
    return false;
  }
  function startSight(s, kind, cfg, out) {
    const def = SIGHT()[kind];
    const sx0 = def.area === 'water' ? 66 + Math.round(RNG.next(s) * 40) : def.area === 'far' ? 84 + Math.round(RNG.next(s) * 30) : 0;
    // くじらは少しおいてから吹く。鯉は出たときにはねる
    s.sight = { kind, t0: s.t, until: s.t + def.ms / 1000, sx0, d0: s.d, n: 0, t1: def.every && def.area === 'far' ? s.t - def.every + 0.6 : s.t, hx: 0, hy: 0 };
    const p = sightPos(s, cfg);
    out.push({ type: 'sight', kind, x: p.x, y: p.y });
  }
  function hitSight(s, x, y, cfg, out) {
    const st = s.sight, def = SIGHT()[st.kind], L = cfg.layout;
    st.n++; st.t1 = s.t; st.hx = Math.round(x); st.hy = Math.round(y);
    if (def.extend) st.until = Math.max(st.until, s.t + def.extend);
    // 鯉は触った所からはねる
    if (def.area === 'water') st.sx0 = Math.max(L.edge + 16, Math.min(cfg.view.w - L.edge - 16, Math.round(x))) + (s.d - st.d0);
    const e = { type: 'sightHit', kind: st.kind, n: st.n, x: st.hx, y: st.hy };
    // りすは 1 度めにどんぐりを落とす（運べるごはん。りすの前へ転がして、りすをつつく指がどんぐりをつままないように）
    if (def.drop && st.n === 1) {
      const p0 = sightPos(s, cfg), x1 = Math.min(cfg.view.w - L.edge - 10, p0.x + 24), y0 = p0.y - 16, y1 = Math.min(cfg.world.yMax, p0.y + 6); // りすを隠さない所へ
      const f = addFree(s, def.drop, x1 + s.d, y1, y0);
      e.spawn = { key: f.key, kind: def.drop, x: x1, y0, y: y1 };
    }
    out.push(e);
  }

  // まれな驚き（step から）。画面に 1 つの土地だけが見えていて、その土地に景色の驚きがあれば、割合 gift で贈り物、残りで景色の驚き
  //   cfg.rare.force（確かめ用）があれば、いつもその景色の驚き
  function rare(s, cfg, out) {
    if (cfg.rare.force && SIGHT()[cfg.rare.force]) { startSight(s, cfg.rare.force, cfg, out); return; }
    const m0 = W().mixAt(s.d, cfg), m1 = W().mixAt(s.d + cfg.view.w, cfg), here = Game.lands.LANDS[m0.a];
    if (m0.u === 0 && m1.u === 0 && m0.a === m1.a && here.rare.length && RNG.next(s) >= cfg.rare.gift) { startSight(s, RNG.pick(s, here.rare), cfg, out); return; }
    const land = Game.lands.LANDS[W().pickLand(hamWx(s, cfg) + 60, RNG.next(s), cfg)];
    // その土地の 2 つから。まだ持っていない物を先に、どちらも持っていたら着ていない物を先に
    const fresh = land.gifts.filter((it) => !s.got.includes(it)), unworn = land.gifts.filter((it) => s.wear[Game.lands.GIFT[it].slot] !== it);
    const item = RNG.pick(s, fresh.length ? fresh : unworn.length ? unworn : land.gifts);
    const L = cfg.layout, x = cfg.view.w - L.edge - 26 - Math.round(RNG.next(s) * 20);
    const y = cfg.world.yMin + 10 + Math.round(RNG.next(s) * (cfg.world.yMax - cfg.world.yMin - 10));
    const p = addFree(s, 'gift', x + s.d, y, -16, item);
    out.push({ type: 'gift', key: p.key, item, x, y, y0: -16 });
  }

  // 口を開けて待つ（ごはんの所から口まで光が飛ぶ）
  function beg(s, x, y, cfg, out) {
    if (!canEat(s) || ['eat', 'roll'].includes(s.ham.act)) return;
    setAct(s, 'beg', cfg.feed.begMs / 1000);
    out.push({ type: 'beg', x, y });
  }
  // 口の当たり: 指の所か、指の上に出しているごはんの所が入ったら
  const mouthHit = (x, y, cfg) => { const b = hamBox(cfg, cfg.feed.pad); return inBox(b, x, y) || inBox(b, x, y - cfg.feed.lift); };
  // りすの口の当たり（隣にいる間。ハムスターの口より近いときだけ）
  function palHit(s, x, y, cfg) {
    const st = s.sight;
    if (!st || SIGHT()[st.kind].area !== 'pal' || st.until - s.t < 1.2) return false;
    const p = sightPos(s, cfg), pad = cfg.feed.pad / 2, L = cfg.layout;
    const box = { x0: p.x - 10 - pad, x1: p.x + 10 + pad, y0: p.y - 24 - pad, y1: p.y + 4 + pad };
    if (!inBox(box, x, y) && !inBox(box, x, y - cfg.feed.lift)) return false;
    return Math.abs(x - p.x) < Math.abs(x - (L.hamX + 15));
  }
  // りすがごはんを食べる（もぐもぐして、少し長くいてくれる）
  function feedPal(s, c, cfg, out) {
    const st = s.sight, p = sightPos(s, cfg);
    s.carry = null;
    st.ate = s.t; st.food = c.kind; st.fed = (st.fed || 0) + 1;
    st.until = Math.min(st.until + SIGHT()[st.kind].stay, s.t + 30);
    addCredit(s, cfg.walk.credit.feed, cfg);
    out.push({ type: 'palFeed', kind: c.kind, x: p.x, y: p.y - 12 });
  }
  // 運んだ物を渡す: ごはんは、りすの口かハムスターの口へ。贈り物はハムスターへ
  function handOver(s, c, x, y, cfg, out) {
    if (c.kind !== 'gift' && palHit(s, x, y, cfg)) { feedPal(s, c, cfg, out); return true; }
    return mouthHit(x, y, cfg) && give(s, c, x, y, cfg, out);
  }

  function touch(s, e, cfg = Game.config) {
    const out = [], L = cfg.layout, C = cfg.walk.credit;
    const f = s.fingers[e.id];
    switch (e.type) {
      case 'press': {
        if (s.ham.act === 'bed') break; // もぐりこんでいる間は、何もしない
        s.lastTouch = s.t;
        // 眠っているときの最初のタッチは、起こすだけ（夜の間は見えていない物に当てない）
        if (s.ham.act === 'sleep') { setAct(s, 'wake', cfg.wake.ms / 1000); out.push({ type: 'wake' }); s.fingers[e.id] = { on: 'empty', acc: 0 }; addCredit(s, C.tap, cfg); break; }
        if (s.ham.act === 'sit' || s.ham.act === 'idle') setAct(s, 'stand');
        const o = objAt(s, e.x, e.y, cfg);
        if (o && OBJ()[o.kind].act === 'carry' && !s.carry) {
          stOf(s, o.key).st = 'taken';
          const fp = o.free && s.free.find((p) => p.key === o.key);
          const from = fp ? { wx: fp.wx, y: fp.y } : { wx: o.x + s.d, y: o.y };
          s.free = s.free.filter((p) => p.key !== o.key);
          s.carry = { id: e.id, kind: o.kind, item: o.item, x: e.x, y: e.y, from };
          s.fingers[e.id] = { on: 'carry', key: o.key, acc: 0 };
          addCredit(s, C.hit, cfg);
          out.push({ type: 'grab', key: o.key, kind: o.kind, item: o.item, x: e.x, y: e.y });
        } else if (o && locked(s, OBJ()[o.kind], o.st)) {
          // 反応の動きの途中: 何もしない（動きを途中からやり直させない）
          s.fingers[e.id] = { on: 'obj', key: o.key, acc: 0 };
        } else if (o && OBJ()[o.kind].act !== 'carry') {
          const { react: r, spawn, away, meets } = react(s, o, cfg);
          s.fingers[e.id] = { on: 'obj', key: o.key, acc: 0 };
          addCredit(s, C.hit, cfg);
          const def = OBJ()[o.kind];
          out.push({ type: 'hit', key: o.key, kind: o.kind, x: o.x, y: o.cy, react: r, spawn, away, gone: def.act === 'blow' ? def.gone : undefined, met: meets.length ? meets[0].id : undefined });
          out.push(...meets);
          TG().hit(s, e.id, o, cfg, out);
        } else if (sightAt(s, e.x, e.y, cfg)) {
          // 景色の驚きの 2 段め（なぞる地面の上なら、そのままなぞれる）
          s.fingers[e.id] = { on: 'sight', acc: 0 };
          // 2 段めの動き（はねる・潮を吹く・跳ねる）の途中は反応しない
          const sd = SIGHT()[s.sight.kind], eating = s.sight.ate != null && s.t - s.sight.ate < sd.eatMs / 1000;
          if (!(sd.lock && s.t - s.sight.t1 < sd.lock) && !eating) { addCredit(s, C.hit, cfg); hitSight(s, e.x, e.y, cfg, out); }
        } else if (inBox(hamBox(cfg, cfg.touch.pad), e.x, e.y)) {
          addCredit(s, C.hit, cfg);
          // ほかの指もハムスターに触れていたら、ぎゅっ（つつく代わり）
          if (!TG().hug(s, e, cfg, out)) {
            if (!['dig', 'roll', 'eat', 'wake'].includes(s.ham.act)) setAct(s, 'poke', cfg.poke.ms / 1000);
            out.push({ type: 'poke', x: e.x, y: e.y });
          }
          s.fingers[e.id] = { on: 'ham', acc: 0, x: e.x, y: e.y };
        } else {
          const ground = e.y >= L.groundY;
          s.fingers[e.id] = { on: ground ? 'ground' : 'empty', acc: 0 };
          addCredit(s, C.tap, cfg);
          out.push({ type: 'tap', x: e.x, y: e.y, ground });
        }
        // 3 本めの指が続けて触れたら、ばんざい
        TG().press(s, e, cfg, out);
        break;
      }
      case 'stroke': {
        if (!f) break;
        s.lastTouch = s.t;
        if (f.on === 'fed') break;
        if (f.on === 'carry') {
          if (s.carry && s.carry.id === e.id) {
            s.carry.x = e.x; s.carry.y = e.y;
            out.push({ type: 'carry', x: e.x, y: e.y });
            // 口（贈り物は体）に届いたら、離さなくても渡す（離す所を間違えて「持てていない」と思わせない）
            if (handOver(s, s.carry, e.x, e.y, cfg, out)) f.on = 'fed';
          }
        } else if (f.on === 'ham') {
          addCredit(s, C.stroke * e.d, cfg);
          if (s.ham.act === 'sleep' || s.ham.act === 'wake') break;
          if (!s.pet) { s.pet = { id: e.id, ms: 0, lastT: s.t }; if (s.ham.act === 'poke') setAct(s, 'stand'); out.push({ type: 'petStart' }); }
          if (s.pet.id === e.id) { s.pet.lastT = s.t; out.push({ type: 'pet', d: e.d, x: e.x, y: e.y }); }
        } else if (e.y >= L.groundY && e.py >= L.groundY) {
          addCredit(s, C.stroke * e.d, cfg);
          const ground = Game.lands.LANDS[W().landAt(e.x + s.d, cfg)].scratch;
          out.push({ type: 'scratch', x: e.x, y: e.y, px: e.px, py: e.py, d: e.d, ground });
          f.acc += e.d;
          while (f.acc >= cfg.find.every) {
            f.acc -= cfg.find.every;
            if (RNG.next(s) < cfg.find.p) {
              const land = Game.lands.LANDS[W().pickLand(e.x + s.d, RNG.next(s), cfg)];
              const kind = RNG.weighted(s, land.find).kind;
              const x = Math.max(L.edge + 10, Math.min(cfg.view.w - L.edge - 10, Math.round(e.x)));
              // 出る所は地面の帯のどこか（手前だけに並ばないように）。奥へ跳ねるほど高く飛ぶ
              const y = cfg.world.yMin + Math.round(RNG.next(s) * (cfg.world.yMax - cfg.world.yMin));
              const p = addFree(s, kind, x + s.d, y, e.y);
              out.push({ type: 'find', key: p.key, kind, x, y: p.y, fromY: Math.round(e.y) });
            }
          }
        } else if (f.on !== 'obj') {
          addCredit(s, C.stroke * e.d, cfg);
          out.push({ type: 'trail', x: e.x, y: e.y, d: e.d });
          if (e.y < L.skyH) TG().sky(s, e, cfg, out); // 2 本の指で空をこすると、そらのにじ
        }
        break;
      }
      case 'flick': {
        if (!f || f.on === 'carry' || f.on === 'fed' || f.on === 'ham') break;
        out.push({ type: 'flick', x: e.x, y: e.y, vx: e.vx, vy: e.vy });
        // 指の近くの「はらう物」が飛ぶ
        for (const o of visible(s, cfg)) {
          const def = OBJ()[o.kind];
          if (def.act !== 'blow' || (o.st && o.st.st && (!def.again || o.st.st === 'meet')) || locked(s, def, o.st)) continue;
          if (Math.hypot(o.x - e.x, o.cy - e.y) > cfg.blow.r) continue;
          // 通り道に相手がいれば組み合わせ（飛んだあとの状態は組み合わせの終わりに決まる）
          const meets = [], met = M().tryBlow(s, o, e.vx, e.vy, cfg, meets);
          if (!met) { const st = stOf(s, o.key); st.st = blownSt(def); st.t = s.t; }
          addCredit(s, C.hit, cfg);
          out.push({ type: 'blow', key: o.key, kind: o.kind, x: o.x, y: o.cy, vx: e.vx, vy: e.vy, gone: def.gone, met: met || undefined });
          out.push(...meets);
        }
        break;
      }
      case 'release':
      case 'cancel': {
        if (!f) break;
        delete s.fingers[e.id];
        TG().release(s, e.id);
        if (f.on === 'carry' && s.carry && s.carry.id === e.id) {
          const c = s.carry;
          s.carry = null;
          const x = e.type === 'release' ? e.x : c.x, y = e.type === 'release' ? e.y : c.y;
          if (e.type === 'release' && handOver(s, c, x, y, cfg, out)) {
            // 渡せた
          } else if (e.type === 'release' && !e.moved) {
            // 動かさずに離した: 元の所に戻り、ハムスターが「ちょうだい」をする（どこへ運べばいいかを見せる）
            const p = addFree(s, c.kind, c.from.wx, c.from.y, null, c.item);
            out.push({ type: 'back', key: p.key, kind: c.kind, item: c.item });
            beg(s, p.wx - s.d, p.y + (OBJ()[c.kind].cy || 0), cfg, out);
          } else if (e.type === 'release' && M().tryCarry(s, c, x, y, cfg, out)) {
            // 相手の上で離した: 組み合わせ（相手が受け取って、ごはんはなくなる）
            addCredit(s, C.hit, cfg);
          } else {
            const W2 = cfg.world;
            const wx = Math.max(s.d + L.edge + 10, Math.min(s.d + cfg.view.w - L.edge - 10, Math.round(x) + s.d));
            const p = addFree(s, c.kind, wx, Math.max(W2.yMin, Math.min(W2.yMax, Math.round(y))), y - cfg.feed.lift - (OBJ()[c.kind].cy || 0), c.item);
            out.push({ type: 'drop', key: p.key, kind: c.kind, item: c.item, x: p.wx - s.d, y: Math.round(y - cfg.feed.lift), y1: p.y });
            if (e.type === 'release') beg(s, p.wx - s.d, p.y + (OBJ()[c.kind].cy || 0), cfg, out);
          }
        }
        if (s.pet && s.pet.id === e.id) { s.pet = null; out.push({ type: 'petEnd' }); }
        break;
      }
    }
    return out;
  }

  function step(s, dt, cfg = Game.config) {
    const out = [];
    s.t += dt;
    const h = s.ham;
    // しぐさの時間切れ
    if (h.until && s.t >= h.until) {
      if (h.act === 'eat' && s.cheeks >= 3) { setAct(s, 'dig', cfg.dig.ms / 1000); out.push({ type: 'dig' }); }
      else if (h.act === 'dig') { s.stash += s.cheeks; const n = s.cheeks; s.cheeks = 0; setAct(s, 'stand'); out.push({ type: 'stash', n, stash: s.stash }); }
      else if (h.act === 'wake') { setAct(s, 'stand'); out.push({ type: 'awake' }); }
      else if (h.act === 'bed') { setAct(s, 'sleep'); out.push({ type: 'asleep' }); }
      else if (['eat', 'poke', 'roll', 'idle', 'beg', 'wear', 'sneeze', 'bounce', 'hug', 'banzai'].includes(h.act)) setAct(s, h.act === 'idle' ? 'sit' : 'stand');
    }
    // 組み合わせの反応の終わり
    M().step(s, cfg, out);
    TG().step(s, cfg, out); // 一緒に触った反応の終わり
    // なでる: 続けてなでていると転がる
    if (s.pet && s.t - s.pet.lastT <= cfg.pet.gapMs / 1000 && !['roll', 'dig', 'eat', 'hug', 'banzai'].includes(h.act)) {
      s.pet.ms += dt * 1000;
      if (s.pet.ms >= cfg.pet.rollMs) { s.pet.ms = 0; setAct(s, 'roll', cfg.roll.ms / 1000); out.push({ type: 'roll' }); }
    }
    // 歩く
    if (!busy(s, cfg) && s.credit > 0) {
      const mv = Math.min(s.credit, cfg.walk.speed * dt), d0 = s.d;
      s.d += mv; s.credit -= mv; s.stepAcc += mv;
      if (h.act !== 'walk') { setAct(s, 'walk'); out.push({ type: 'walk' }); }
      while (s.stepAcc >= cfg.walk.stepEvery) { s.stepAcc -= cfg.walk.stepEvery; out.push({ type: 'step', ground: landHere(s, cfg).scratch }); }
      // 通りすぎた物と、身なり・足元で出会う
      M().passBy(s, d0, cfg, out);
    } else if (h.act === 'walk') { setAct(s, 'stand'); out.push({ type: 'stop' }); }
    // 何もしないと座る。座っている間は、ときどき待つしぐさ
    if (h.act === 'stand' && !s.carry && !s.pet && s.t - s.lastTouch >= cfg.idle.sitMs / 1000) {
      setAct(s, 'sit'); s.idleNext = s.t + cfg.idle.everyMs / 1000; out.push({ type: 'sit' });
    } else if (h.act === 'sit' && s.t >= s.idleNext) {
      const kind = RNG.pick(s, ['yawn', 'groom', 'look']);
      setAct(s, 'idle', 1.6, kind); s.idleNext = s.t + 1.6 + cfg.idle.everyMs / 1000;
      out.push({ type: 'idle', kind });
    }
    // 景色の驚き: 触らなくても時々 2 段めの動きをする。時間が来たら終わる
    const sg = s.sight;
    if (sg) {
      const def = SIGHT()[sg.kind];
      if (s.t >= sg.until) { s.sight = null; out.push({ type: 'sightEnd', kind: sg.kind }); }
      else if (def.every && s.t - sg.t1 >= def.every && sg.until - s.t > 1.2) {
        sg.t1 = s.t; const p = sightPos(s, cfg);
        out.push({ type: 'sightHit', kind: sg.kind, n: sg.n, x: p.x, y: p.y, auto: true });
      }
    }
    // まれな驚き: 歩いた距離で抽選する（連打しても早まらない）。贈り物や景色の驚きが出ている間は出さない
    if (s.d >= s.rareNext) {
      s.rareNext = s.d + cfg.rare.every;
      if (s.d - s.rareLast >= cfg.rare.minGap && !giftOut(s) && !s.sight && RNG.next(s) < cfg.rare.p) { s.rareLast = s.d; rare(s, cfg, out); }
    }
    // 運ばれないまま、贈り物がハムスターの所まで流れてきたら、振り返って自分で拾って身につける（贈り物はなくならない）
    if (canWear(s) && h.act !== 'wear') {
      const p = s.free.find((q) => q.kind === 'gift' && q.wx - s.d <= cfg.layout.hamX + 4);
      if (p) { s.free = s.free.filter((q) => q !== p); wear(s, p.item, cfg, out, true); }
    }
    // 後ろへ去った物の記録を捨てる
    const C = cfg.world.chunk, gone = Math.floor((s.d - 2 * C) / C);
    for (const k of Object.keys(s.objs)) { const i = parseInt(k, 10); if (k[0] !== 'f' && i < gone) delete s.objs[k]; }
    s.free = s.free.filter((p) => p.wx > s.d - 32);
    for (const k of Object.keys(s.objs)) if (k[0] === 'f' && !s.free.some((p) => p.key === k)) delete s.objs[k];
    return out;
  }

  // おやすみ（親の画面から）: 運んでいる物は元の所へ戻し、景色の驚きは終わらせて、その場に巣を掘ってもぐりこむ
  function bedtime(s, cfg = Game.config) {
    if (['sleep', 'bed', 'wake'].includes(s.ham.act)) return [];
    if (s.carry) { const c = s.carry; s.carry = null; addFree(s, c.kind, c.from.wx, c.from.y, null, c.item); }
    s.pet = null; s.fingers = {}; s.sight = null; s.credit = 0;
    if (s.meet) { s.meet.until = s.t; M().step(s, cfg, []); } // 組み合わせの反応は、すぐ終わらせる
    s.tog = null; s.recent = null;
    s.nest = Math.round(s.d) + cfg.layout.hamX;
    setAct(s, 'bed', cfg.bed.ms / 1000);
    return [{ type: 'bed' }];
  }

  Game.walk = { create, touch, step, bedtime, visible, hamBox, busy, landHere, hamWx, sightPos, sightAt, addFree, stOf, locked, setAct };
})();
</script>
<script>
// 組み合わせ（ルール側の純粋な関数。DOM・音・絵に触らない）。設計書 2026-11-20-hoppe-walk-meet-design.md。
// 物と物、身なりと物、物とハムスターが出会うと、いつもと違う動きが起きる。表は lands.js の MEET。
// walk.js が、きっかけの所で呼ぶ:
//   tryCarry … 運んだごはんを離したとき（口・りすに渡せなかったあと）/ tryLand … 跳んで止まった直後 /
//   tryBlow … はらって飛ばす前 / passBy … 歩いた直後（身なり・足元）/ step … 反応の終わり
// 状態: s.meet = { id, t0, until, keyA, keyB }（1 つまで。保存しない）。物の st.met … 起きた組み合わせ（同じ物とは 1 回だけ）。
//   反応中の物は st.st = 'meet'（st.prev に前の状態、st.t は始まった時刻）。残る印は st.keep。
// 出来事: meet { id, how, keyA, keyB, kindA, kindB, x, y, finger } / meetEnd { id }
(function () {
  const Game = (window.Game = window.Game || {});
  const T = () => Game.lands.MEET;
  const OBJ = () => Game.lands.OBJ;
  const Wk = () => Game.walk;

  const rowsFor = (how, a) => Object.keys(T()).filter((id) => T()[id].how === how && T()[id].a === a);
  // 相手になれる物か（見えていて、反応の途中でなく、その組み合わせがまだ起きていない）
  function free(s, o, id, cfg) {
    const st = o.st, def = OBJ()[o.kind];
    if (!st) return true;
    if (st.st === 'meet' || st.st === 'away' || st.st === 'gone' || st.st === 'taken') return false;
    if (st.met && st.met.includes(id)) return false;
    return !Wk().locked(s, def, st);
  }
  // ハムスターが相手になれるか（歩いているか立っていて、運んでいる物もなでている指もない）
  const hamFree = (s) => ['walk', 'stand'].includes(s.ham.act) && !s.carry && !s.pet;

  function begin(s, id, oa, ob, x, y, finger, cfg, out, kindA) {
    if (s.meet) return false;
    const row = T()[id];
    s.meet = { id, t0: s.t, until: s.t + row.ms / 1000, keyA: oa ? oa.key : null, keyB: ob ? ob.key : null };
    for (const o of [oa, ob]) {
      if (!o) continue;
      const st = Wk().stOf(s, o.key);
      st.prev = { st: st.st, t: st.t };
      st.st = 'meet'; st.t = s.t; st.meet = id;
      (st.met || (st.met = [])).push(id);
    }
    if (row.ham) Wk().setAct(s, row.ham, row.ms / 1000);
    out.push({ type: 'meet', id, how: row.how, keyA: s.meet.keyA, keyB: s.meet.keyB, kindA: kindA || (oa ? oa.kind : row.a), kindB: ob ? ob.kind : row.b, x: Math.round(x), y: Math.round(y), finger });
    return true;
  }

  // 運んだごはんを相手の上で離した。起きたら true（ごはんはなくなる）
  function tryCarry(s, c, x, y, cfg, out) {
    if (s.meet) return false;
    const ids = rowsFor('carry', c.kind);
    if (!ids.length) return false;
    const pad = cfg.touch.pad, lift = cfg.feed.lift;
    let best = null, bd = Infinity;
    for (const o of Wk().visible(s, cfg)) {
      const id = ids.find((k) => T()[k].b === o.kind);
      if (!id || !free(s, o, id, cfg)) continue;
      const dd = Math.min(Math.hypot(x - o.x, y - o.cy), Math.hypot(x - o.x, y - lift - o.cy));
      if (dd <= o.r + pad && dd < bd) { best = { id, o }; bd = dd; }
    }
    if (!best) return false;
    return begin(s, best.id, null, best.o, best.o.x, best.o.cy, true, cfg, out, c.kind);
  }

  // 跳んで止まった直後（o は跳ぶ前の見えている物。st.dx はもう足してある）。起きたら true
  function tryLand(s, o, cfg, out) {
    if (s.meet) return false;
    const ids = rowsFor('land', o.kind);
    if (!ids.length) return false;
    const nx = o.x + OBJ()[o.kind].dx, pad = cfg.touch.pad + cfg.meet.landPad;
    let best = null, bd = Infinity;
    for (const t of Wk().visible(s, cfg)) {
      if (t.key === o.key) continue;
      const id = ids.find((k) => T()[k].b === t.kind);
      if (!id || !free(s, t, id, cfg)) continue;
      const dd = Math.hypot(nx - t.x, o.y - t.y);
      if (dd <= t.r + pad && dd < bd) { best = { id, t }; bd = dd; }
    }
    if (!best) return false;
    return begin(s, best.id, o, best.t, best.t.x, best.t.cy, true, cfg, out);
  }

  // 点 (px, py) から線分 (x0, y0)-(x0 + ux L, y0 + uy L) への距離と、線分の上の進み（0〜L）
  function seg(px, py, x0, y0, ux, uy, L) {
    const u = Math.max(0, Math.min(L, (px - x0) * ux + (py - y0) * uy));
    return { d: Math.hypot(px - (x0 + ux * u), py - (y0 + uy * u)), u };
  }
  // はらって飛ばす物 o の通り道に相手がいれば起こす。起きた組み合わせの id を返す（なければ null）
  function tryBlow(s, o, vx, vy, cfg, out) {
    if (s.meet) return null;
    const ids = rowsFor('blow', o.kind), v = Math.hypot(vx, vy);
    if (!ids.length || !v) return null;
    const ux = vx / v, uy = vy / v, L = cfg.meet.blowLen, pad = cfg.touch.pad;
    let best = null;
    const toHam = ids.find((k) => T()[k].b === 'ham');
    if (toHam && hamFree(s)) {
      const c = { x: cfg.layout.hamX, y: cfg.layout.footY - cfg.meet.hamR };
      const r = seg(c.x, c.y, o.x, o.cy, ux, uy, L);
      if (r.d <= cfg.meet.hamR && r.u > 0) best = { id: toHam, t: null, u: r.u, x: c.x, y: c.y };
    }
    for (const t of Wk().visible(s, cfg)) {
      if (t.key === o.key) continue;
      const id = ids.find((k) => T()[k].b === t.kind);
      if (!id || !free(s, t, id, cfg)) continue;
      const r = seg(t.x, t.cy, o.x, o.cy, ux, uy, L);
      if (r.d <= t.r + pad && r.u > 0 && (!best || r.u < best.u)) best = { id, t, u: r.u, x: t.x, y: t.cy };
    }
    if (!best) return null;
    return begin(s, best.id, o, best.t, best.x, best.y, true, cfg, out) ? best.id : null;
  }

  // 歩いた直後: 画面の x が、ハムスターの前の所（身なりは meet.passX、足元は meet.footX。hamX から前へのドット）をまたいだ物と出会う
  //   （ハムスターの真ん中まで来ると体に隠れるので、その少し前で起こす）。d0 は歩く前の距離
  function passBy(s, d0, cfg, out) {
    if (s.meet || s.d === d0) return;
    const hx = cfg.layout.hamX, foot = cfg.layout.footY, M = cfg.meet;
    const crossed = (o, at) => o.x + (s.d - d0) > hx + at && o.x <= hx + at;
    for (const o of Wk().visible(s, cfg)) {
      // 身なりを先に（passX は footX より前なので、両方に当てはまる物は身なりが先に起きる）
      if (crossed(o, M.passX)) for (const slot of ['head', 'neck']) {
        const item = s.wear[slot];
        const id = item && rowsFor('pass', item).find((k) => T()[k].b === o.kind);
        if (id && free(s, o, id, cfg) && begin(s, id, null, o, o.x, o.cy, false, cfg, out)) return;
      }
      if (!crossed(o, M.footX)) continue;
      const id = rowsFor('foot', 'ham').find((k) => T()[k].b === o.kind);
      if (id && Math.abs(o.y - foot) <= M.foot && hamFree(s) && free(s, o, id, cfg) && begin(s, id, null, o, o.x, o.cy, false, cfg, out)) return;
    }
  }

  // 反応の終わり
  function step(s, cfg, out) {
    const m = s.meet;
    if (!m || s.t < m.until) return;
    const row = T()[m.id];
    const end = (key, st1) => {
      const st = key && s.objs[key];
      if (!st) return null;
      if (st1) { st.st = st1; st.t = s.t; } else if (st.prev) { st.st = st.prev.st; st.t = st.prev.t; }
      delete st.prev;
      return st;
    };
    end(m.keyA, row.endA);
    // 帽子がもう飛んでいった雪だるまは、もう一度飛ばさない
    const pb = m.keyB && s.objs[m.keyB] && s.objs[m.keyB].prev;
    const b = end(m.keyB, row.endB === 'hat' && pb && pb.st === 'hat' ? null : row.endB);
    if (b) {
      if (row.keepB) b.keep = row.keepB;
      if (row.dxB) b.dx = (b.dx || 0) + row.dxB;
      if (row.regrow) b.n = Math.max(0, (b.n || 0) - 1);
    }
    s.meet = null;
    out.push({ type: 'meetEnd', id: m.id });
  }

  // ---- 確かめ用（?meet=<id>・dev/meets.html・テスト）----
  // 距離 d の所で、置いた物だけの場面にする（区切りの物は出さない。ハムスターは起きて立つ）。一緒に触る（together.js）の場面も使う
  function clear(s, d, cfg = Game.config) {
    s.d = d; s.nest = s.d - 600;
    s.objs = {}; s.free = []; s.meet = null; s.carry = null; s.pet = null; s.fingers = {}; s.credit = 0; s.sight = null;
    s.rareNext = s.d + cfg.rare.every; s.rareLast = s.d;
    s.bareTo = s.d + cfg.view.w + 80;
    Wk().setAct(s, 'stand');
  }
  // その組み合わせがすぐ起きる場面を作る。{ a, b }（置いた物の key。ないほうは null）と、きっかけに使う画面の点を返す
  function stage(s, id, cfg = Game.config) {
    const row = T()[id], LANDS = Game.lands.LANDS, L = cfg.layout;
    const kindB = row.b === 'ham' ? row.a : row.b;
    const has = (l, k) => l.spawn.concat(l.find).some((e) => e.kind === k) || l.spawn.some((e) => OBJ()[e.kind].drop === k);
    clear(s, Math.max(0, LANDS.findIndex((l) => has(l, kindB))) * cfg.land.len + 300, cfg);
    if (row.how === 'pass') { const slot = Game.lands.GIFT[row.a].slot; s.wear[slot] = row.a; if (!s.got.includes(row.a)) s.got.push(row.a); }
    const put = (kind, x, y) => (kind === 'ham' ? null : Wk().addFree(s, kind, x + s.d, y).key);
    const cy = (k) => OBJ()[k].cy || 0;
    switch (row.how) {
      case 'carry': {
        const b = put(row.b, 90, 136);
        if (row.regrow) Wk().stOf(s, b).n = 1; // 木は実を 1 つ落としたあと（りんごを返す枝がある）
        return { a: put(row.a, 116, 162), b, from: { x: 116, y: 162 + cy(row.a) }, to: { x: 90, y: 136 + cy(row.b) } };
      }
      case 'land': { const ax = 56; return { a: put(row.a, ax, 140), b: put(row.b, ax + OBJ()[row.a].dx, 140), from: { x: ax, y: 140 + cy(row.a) } }; }
      // 指は物の少し上に置いて（置いただけでは飛ばない所）、そこからはらう
      case 'blow':
        if (row.b === 'ham') return { a: put(row.a, 78, 146), b: null, from: { x: 78, y: 146 + cy(row.a) - 18 }, v: { x: -0.5, y: 0 } };
        return { a: put(row.a, 60, 140), b: put(row.b, 100, 140), from: { x: 60, y: 140 + cy(row.a) - 18 }, v: { x: 0.5, y: 0 } };
      case 'pass': return { a: null, b: put(row.b, L.hamX + cfg.meet.passX + 16, 130) };
      case 'foot': return { a: null, b: put(row.b, L.hamX + cfg.meet.footX + 16, L.footY) };
    }
    return { a: null, b: null };
  }
  // stage の場面で、きっかけを指の出来事として起こす（carry / land / blow）。pass と foot は歩く分を渡すだけ（呼ぶ側が step で進める）
  //   出来事の列を返す
  function kick(s, id, at, cfg = Game.config, fid = 900) {
    const row = T()[id], W = Wk(), out = [];
    const tc = (e) => out.push(...W.touch(s, e, cfg));
    switch (row.how) {
      case 'carry':
        tc({ type: 'press', id: fid, x: at.from.x, y: at.from.y });
        tc({ type: 'stroke', id: fid, x: at.to.x, y: at.to.y, px: at.from.x, py: at.from.y, d: Math.hypot(at.to.x - at.from.x, at.to.y - at.from.y) });
        tc({ type: 'release', id: fid, x: at.to.x, y: at.to.y, moved: true });
        break;
      case 'land': tc({ type: 'press', id: fid, x: at.from.x, y: at.from.y }); tc({ type: 'release', id: fid, x: at.from.x, y: at.from.y, moved: false }); break;
      case 'blow':
        tc({ type: 'press', id: fid, x: at.from.x, y: at.from.y });
        tc({ type: 'flick', id: fid, x: at.from.x, y: at.from.y, vx: at.v.x, vy: at.v.y });
        tc({ type: 'release', id: fid, x: at.from.x, y: at.from.y, moved: true });
        break;
      default: s.credit = Math.max(s.credit, 40);
    }
    return out;
  }

  Game.meet = { tryCarry, tryLand, tryBlow, passBy, step, stage, kick, hamFree, clear };
})();
</script>
<script>
// 一緒に触る（ルール側の純粋な関数。DOM・音・絵に触らない）。設計書 2026-11-20-hoppe-walk-together-design.md。
// 2 本・3 本の指が同じころに触ると、普段の反応の上に、いつもと違う動きが足される:
//   hug    … ハムスターに指が触れている間に、別の指もハムスターに触れる → ぎゅっ（縮こまって、ハートが出る）
//   banzai … 3 本以上の指が win 秒のうちに続けて触れる（どこでも）→ ハムスターがばんざいして跳ぶ
//   pair   … 2 本の指が win 秒のうちに、同じ種類の物を 1 つずつ触る → 2 つのあいだにハートの橋
//   skybow … 2 本の指が同じころに空をこすっている → 2 本の指のあいだに小さな虹の橋
// walk.js が呼ぶ: hug（ハムスターに触れた）/ press（触れた。ばんざいを数える）/ hit（物に触れた）/ sky（空をこすった）/
//   release（指が離れた）/ step（終わり）
// 状態: s.tog = { id, t0, until, pts, a?, b? }（1 つまで。保存しない）。s.togNext / s.togBanzai … 次に起こせる時刻。
//   s.recent … 最近の指 { press: [{ id, t, x, y }], hit: [{ id, key, kind, t, wx, y }], sky: { id: { t, x, y, acc } } }
// 出来事: together { id, x, y, pts: [{ x, y }] }（pts は合図の金色の輪を出す、画面の点）/ togetherEnd { id }
(function () {
  const Game = (window.Game = window.Game || {});
  const Wk = () => Game.walk;

  const recent = (s) => s.recent || (s.recent = { press: [], hit: [], sky: {} });
  const ready = (s) => !s.tog && s.t >= (s.togNext || 0);
  // ハムスターが相手になれるか（組み合わせ・食べる・掘る・眠るなどの途中でなく、ごはんを運んでいない）
  const hamOk = (s) => ['walk', 'stand', 'sit', 'idle', 'poke'].includes(s.ham.act) && !s.carry && !s.meet;
  const pt = (x, y) => ({ x: Math.round(x), y: Math.round(y) });

  function begin(s, id, x, y, pts, cfg, out, extra = {}) {
    const ms = cfg.together.ms[id];
    s.tog = Object.assign({ id, t0: s.t, until: s.t + ms / 1000, pts }, extra);
    if (id === 'hug' || id === 'banzai') Wk().setAct(s, id, ms / 1000);
    if (id === 'banzai') s.togBanzai = s.t + cfg.together.banzaiGap;
    out.push({ type: 'together', id, x: Math.round(x), y: Math.round(y), pts });
    return true;
  }

  // ハムスターに触れた指 e。ほかの指がもうハムスターに触れていたら、ぎゅっ。起きたら true（いつもの「つつく」の代わり）
  function hug(s, e, cfg, out) {
    if (!ready(s) || !hamOk(s)) return false;
    const other = Object.keys(s.fingers).find((k) => +k !== e.id && s.fingers[k].on === 'ham');
    if (other == null) return false;
    const f = s.fingers[other], L = cfg.layout;
    return begin(s, 'hug', L.hamX, L.footY - cfg.ham.h, [pt(f.x, f.y), pt(e.x, e.y)], cfg, out);
  }

  // 触れた（どこでも）。win 秒のうちに 3 本めの指が触れたら、ばんざい
  function press(s, e, cfg, out) {
    const R = recent(s), T = cfg.together;
    R.press = R.press.filter((p) => s.t - p.t <= T.win && p.id !== e.id);
    R.press.push({ id: e.id, t: s.t, x: e.x, y: e.y });
    if (R.press.length < 3 || !ready(s) || !hamOk(s) || s.t < (s.togBanzai || 0)) return false;
    const pts = R.press.map((p) => pt(p.x, p.y)), L = cfg.layout;
    R.press = [];
    return begin(s, 'banzai', L.hamX, L.footY - cfg.ham.h, pts, cfg, out);
  }

  // 物 o に触れて反応した（指 fid）。win 秒のうちに、別の指が同じ種類の別の物に触れていたら、なかよし
  function hit(s, fid, o, cfg, out) {
    const R = recent(s), T = cfg.together;
    R.hit = R.hit.filter((h) => s.t - h.t <= T.win && h.key !== o.key);
    const me = { id: fid, key: o.key, kind: o.kind, t: s.t, wx: o.x + s.d, y: o.cy - o.r };
    const mate = R.hit.find((h) => h.id !== fid && h.kind === o.kind);
    R.hit.push(me);
    if (!mate || !ready(s)) return false;
    R.hit = R.hit.filter((h) => h !== mate && h !== me);
    const a = { wx: mate.wx, y: mate.y }, b = { wx: me.wx, y: me.y };
    return begin(s, 'pair', (a.wx + b.wx) / 2 - s.d, Math.min(a.y, b.y), [pt(a.wx - s.d, a.y), pt(b.wx - s.d, b.y)], cfg, out, { a, b, kind: o.kind });
  }

  // 空をこすった（trail のうち空の帯）。2 本の指が同じころに、それぞれ skyMin 以上こすっていたら、そらのにじ
  function sky(s, e, cfg, out) {
    const R = recent(s), T = cfg.together;
    const me = R.sky[e.id] || (R.sky[e.id] = { acc: 0 });
    me.acc += e.d; me.t = s.t; me.x = e.x; me.y = e.y;
    if (me.acc < T.skyMin || !ready(s) || s.sight) return false;
    const k = Object.keys(R.sky).find((id) => +id !== e.id && R.sky[id].acc >= T.skyMin && s.t - R.sky[id].t <= T.skyWin);
    if (k == null) return false;
    const o = R.sky[k];
    me.acc = 0; o.acc = 0;
    return begin(s, 'skybow', (o.x + me.x) / 2, Math.min(o.y, me.y), [pt(o.x, o.y), pt(me.x, me.y)], cfg, out);
  }

  function release(s, id) { if (s.recent) delete s.recent.sky[id]; }

  // 終わり
  function step(s, cfg, out) {
    const g = s.tog;
    if (!g || s.t < g.until) return;
    s.tog = null;
    s.togNext = s.t + cfg.together.gap;
    out.push({ type: 'togetherEnd', id: g.id });
  }

  // ---- 確かめ用（?tog=<id>・dev/meets.html・テスト）----
  const IDS = ['hug', 'banzai', 'pair', 'skybow'];
  // すぐ起こせる場面（はらっぱ。なかよしは花を 2 つ置く）。きっかけに使う画面の点を返す
  function stage(s, id, cfg = Game.config) {
    Game.meet.clear(s, 300, cfg);
    s.tog = null; s.togNext = 0; s.togBanzai = 0; s.recent = null;
    const L = cfg.layout, OBJ = Game.lands.OBJ;
    if (id === 'pair') {
      const a = Wk().addFree(s, 'flower', 66 + s.d, 128), b = Wk().addFree(s, 'flower', 104 + s.d, 146);
      return { pts: [{ x: 66, y: 128 + OBJ.flower.cy }, { x: 104, y: 146 + OBJ.flower.cy }], keys: [a.key, b.key] };
    }
    if (id === 'hug') return { pts: [{ x: L.hamX - 6, y: L.footY - 14 }, { x: L.hamX + 8, y: L.footY - 24 }] };
    if (id === 'banzai') return { pts: [{ x: 40, y: 30 }, { x: 70, y: 40 }, { x: 100, y: 30 }] };
    return { pts: [{ x: 30, y: 30 }, { x: 100, y: 26 }] }; // skybow
  }
  // stage の場面で、きっかけを指の出来事として起こす。出来事の列を返す（指は離す。ぎゅっ だけは置いたまま）
  function kick(s, id, at, cfg = Game.config, fid = 910) {
    const W = Wk(), out = [];
    const tc = (e) => out.push(...W.touch(s, e, cfg));
    const ids = at.pts.map((_, i) => fid + i);
    at.pts.forEach((p, i) => tc({ type: 'press', id: ids[i], x: p.x, y: p.y }));
    if (id === 'skybow') {
      // 2 本の指で、交互に少しずつこする
      const pos = at.pts.map((p) => ({ x: p.x, y: p.y }));
      for (let n = 0; n < 6; n++) at.pts.forEach((_, i) => {
        const q = pos[i], nx = q.x + (n % 2 ? -4 : 4);
        tc({ type: 'stroke', id: ids[i], x: nx, y: q.y, px: q.x, py: q.y, d: 4 }); q.x = nx;
      });
    }
    if (id !== 'hug') ids.forEach((k, i) => tc({ type: 'release', id: k, x: at.pts[i].x, y: at.pts[i].y, moved: id === 'skybow' }));
    return out;
  }

  Game.together = { hug, press, hit, sky, release, step, stage, kick, IDS };
})();
</script>
<script>
// 保存データの読み書き（localStorage。ルール側: 中身を確かめる parse は純粋な関数）。設計書 5.6。
//   hoppe-walk.trip     { v, seed, d, cheeks, stash, got } … 旅の続き（got は集めた身なり。着ている物は保存しない）
//   hoppe-walk.settings { v, volume: 0〜2, haptics }  … 親の設定（音の 3 段階は config.audio.levels）
// 読めない・壊れているときは新しい旅（d = 0、新しい種）にする。書けない（容量・プライベートモード）ときは黙って続ける。
// 形は HOPPE BRIDGE の save.js から写したもの
(function () {
  const Game = (window.Game = window.Game || {});
  const V = 1;

  function read(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function write(key, data) { try { localStorage.setItem(key, JSON.stringify(data)); return true; } catch (e) { return false; } }
  const json = (raw) => { try { return typeof raw === 'string' ? JSON.parse(raw) : null; } catch (e) { return null; } };
  const int = (n, lo, hi) => Number.isInteger(n) && n >= lo && n <= hi;

  // 旅。壊れていたら null（呼ぶ側が新しい旅を作る）
  function parseTrip(raw) {
    const t = json(raw);
    if (!t || t.v !== V) return null;
    if (!int(t.seed, -0x80000000, 0x7fffffff) || !(typeof t.d === 'number' && isFinite(t.d) && t.d >= 0 && t.d < 1e9)) return null;
    if (!int(t.cheeks, 0, 3) || !int(t.stash, 0, 1e7)) return null;
    return { v: V, seed: t.seed, d: t.d, cheeks: t.cheeks, stash: t.stash, got: parseGot(t.got) };
  }
  // 集めた身なり（前の版の保存には無いので空にする。知らない名前と重なりは捨てる）
  function parseGot(a) {
    if (!Array.isArray(a)) return [];
    const known = Game.lands && Game.lands.GIFT;
    return a.filter((it, i) => typeof it === 'string' && (!known || known[it]) && a.indexOf(it) === i).slice(0, 32);
  }
  const tripOf = (s) => ({ v: V, seed: s.seed, d: Math.floor(s.d), cheeks: s.cheeks, stash: s.stash, got: s.got.slice() });

  // 設定。足りない所は初めの値
  function parseSettings(raw) {
    const t = json(raw) || {};
    return { v: V, volume: int(t.volume, 0, 2) ? t.volume : 1, haptics: t.haptics !== false };
  }

  Game.save = {
    parseTrip, tripOf, parseSettings,
    loadTrip: (cfg = Game.config) => parseTrip(read(cfg.save.trip)),
    storeTrip: (s, cfg = Game.config) => write(cfg.save.trip, tripOf(s)),
    loadSettings: (cfg = Game.config) => parseSettings(read(cfg.save.settings)),
    storeSettings: (st, cfg = Game.config) => write(cfg.save.settings, st),
  };
})();
</script>
<script>
// 親の操作（ルール側の純粋な状態。DOM・音・絵に触らない）。設計書 6.4。
//   1. 右上の小さな印に、指を holdMs 置いたままにする（slop 以上動いたら・離したら取り消す）→ armed
//   2. 左下に「おとな」のボタンが出る。confirmMs 以内に押すと開く（open）。押さなければ消える
//      同時に左上に目立たない「おやすみ」の所が出る。そこを押すと、親の画面を開かずにすぐおやすみ（menu の sleep と同じ出来事）
//   3. 開いている間は、指はすべて親の画面のもの（旅には渡さない）
// 印に置いている指は、ほかの指と同じく旅にも渡る（1 段めの反応）。子どもが偶然 2 秒押しても、左下をもう一度押さない限り開かない。
// 入口: create() / input(P, ev, now, cfg) → { use, events } / tick(P, now, cfg) → events / menu(cfg) → ボタンの並び
//   ev は input.js の { type: 'down'|'move'|'up'|'cancel', id, x, y }。now はミリ秒（呼ぶ側の時計）
//   events: { type: 'armed' } / { type: 'disarm' } / { type: 'open' } / { type: 'menu', act, v }
//     act: 'sleep'（おやすみ）| 'volume'（v: 0〜2）| 'haptics'（v: true/false）| 'back'（もどる）
(function () {
  const Game = (window.Game = window.Game || {});

  const create = () => ({ phase: 'idle', id: null, x0: 0, y0: 0, t0: 0, t1: 0 });
  const inRect = (r, x, y) => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h;
  const onMark = (cfg, x, y) => { const m = cfg.parent.mark; return Math.hypot(x - m.x, y - m.y) <= m.r + cfg.touch.pad; };

  // 親の画面のボタン（render も同じ並びで描く）。label は text.js の parent のキー
  function menu(cfg = Game.config) {
    const V = cfg.view, x0 = 10, w = V.w - 20, out = [];
    out.push({ act: 'sleep', label: 'sleep', x: x0, y: 48, w, h: 26 });
    const third = Math.floor((w - 4) / 3);
    for (let v = 0; v < 3; v++) out.push({ act: 'volume', v, label: 'vol' + v, x: x0 + v * (third + 2), y: 104, w: third, h: 20 });
    const half = Math.floor((w - 2) / 2);
    out.push({ act: 'haptics', v: true, label: 'on', x: x0, y: 150, w: half, h: 20 });
    out.push({ act: 'haptics', v: false, label: 'off', x: x0 + half + 2, y: 150, w: half, h: 20 });
    out.push({ act: 'back', label: 'back', x: x0, y: 196, w, h: 22 });
    return out;
  }

  function input(P, ev, now, cfg = Game.config) {
    const out = { use: false, events: [] };
    if (P.phase === 'open') {
      out.use = true;
      if (ev.type === 'down') {
        const b = menu(cfg).find((r) => inRect(r, ev.x, ev.y));
        if (b) {
          out.events.push({ type: 'menu', act: b.act, v: b.v });
          if (b.act === 'sleep' || b.act === 'back') P.phase = 'idle';
        }
      }
      return out;
    }
    if (ev.type === 'down') {
      if (P.phase === 'armed' && inRect(cfg.parent.button, ev.x, ev.y)) {
        P.phase = 'open'; out.use = true; out.events.push({ type: 'open' });
      } else if (P.phase === 'armed' && inRect(cfg.parent.sleep, ev.x, ev.y)) {
        P.phase = 'idle'; out.use = true; out.events.push({ type: 'menu', act: 'sleep' });
      } else if (P.phase === 'idle' && onMark(cfg, ev.x, ev.y)) {
        Object.assign(P, { phase: 'holding', id: ev.id, x0: ev.x, y0: ev.y, t0: now });
      }
    } else if (P.phase === 'holding' && ev.id === P.id) {
      if (ev.type === 'move' && Math.hypot(ev.x - P.x0, ev.y - P.y0) >= cfg.touch.slop) P.phase = 'idle';
      else if (ev.type === 'up' || ev.type === 'cancel') P.phase = 'idle';
    }
    return out;
  }

  function tick(P, now, cfg = Game.config) {
    const C = cfg.parent;
    if (P.phase === 'holding' && now - P.t0 >= C.holdMs) { P.phase = 'armed'; P.t1 = now; return [{ type: 'armed' }]; }
    if (P.phase === 'armed' && now - P.t1 >= C.confirmMs) { P.phase = 'idle'; return [{ type: 'disarm' }]; }
    return [];
  }

  // 印を押している進み具合（0〜1。描く用）
  const holdProgress = (P, now, cfg = Game.config) => (P.phase === 'holding' ? Math.min(1, (now - P.t0) / cfg.parent.holdMs) : 0);

  Game.parent = { create, input, tick, menu, holdProgress, inRect };
})();
</script>
