<script>
// 数字は全部ここ。設計書: docs/specs/2026-11-11-hoppe-bridge-design.md
(function () {
  const Game = (window.Game = window.Game || {});

  Game.config = {
    view: { w: 135, h: 240 },   // 遊ぶ窓（ドット）。縦持ち専用
    unit: 120,                  // 板 1 枚の長さ（ドット）＝「1」。長さは 1/120 を単位にした整数
    cuts: [2, 3, 4, 5, 6, 8, 10, 12], // 切れる数（どれも unit を割り切る）
    maxGap: 110,                // 谷の長さの上限（11/12）
    // lineGap: かさねて測るステージでは、谷の分母より粗い切り方の線が、谷の右の端からこれだけ（ドット）離れている谷だけを出す。
    //   1/12（10）は 10 に切った線（12）と、5/12（50）は 5 に切った線（48）と 2 ドットしか違わず、粗いほうから試すと先にそろって見えるため。
    //   出さないのは 1/12・5/12・7/12・11/12。細かい側が近いだけの 1/10・2/5・3/5・9/10 は出す
    // ステージの数字を決め直す回数の上限。テスト: 確かめる種の数、一例の数字に逃げてよい割合、でたらめな解き方が落ちずに渡りきれる割合の上限（1-3 から）
    gen: { lineGap: 3, tries: 60, testSeeds: 40, fallbackMax: 0.02, randomMax: 0.2 },
    save: { progress: 'hoppe-bridge.progress', settings: 'hoppe-bridge.settings', tips: 'hoppe-bridge.tips', version: 1 },
    tips: ['count', 'cut', 'carry', 'go'], // 手本（指の絵）: 切る数をなぞる・切る・運ぶ・わたる。一度できたら出さない
    help: { falls: 3 },         // 同じ谷でこの回数落ちると「かさねて みる」が出る

    // 置き場所（窓の中のドット）。render と input の当たりが同じものを使う
    layout: {
      gapX: 15,                 // 谷の左端（左に残った踏み板の幅）
      deckY: 94, deckH: 9, deckFront: 3, // 橋の踏み板: 上の面の奥の端の y、上の面の高さ（奥行き）、手前の厚み。少し上から見下ろした形
      footDy: 5,                // 探検家の足は、上の面のこれだけ手前（奥行きの真ん中）
      signY: 52,                // 立て札の上の端（かさねて測れないとき、谷の真ん中の上に吊るす）
      hoverY: 60,               // かざした板の上の面（かさねて測る）。探検家の前をあけるため、橋から離して点線でつなぐ
      boardH: 8, boardFront: 3, // 手持ちの板・切れはしの高さ（上の面＋手前の厚み）と、そのうちの手前の厚み
      trayY: 128,               // 手持ちの場所の上の端（ここより上で離すと橋へ運ぶ）
      boardX: 7, boardY: 148,   // 手持ちの板（手元で切るとき）
      countBelow: 24,           // 板の下これだけの範囲をなぞっても、切る数が変わる（指で線を隠さずに選べる）。かざしているときは橋の手前まで。探検家の前（わたる の引き始め）は除く
      cutStep: 9,               // 板の上を横にこれだけなぞるごとに、切る数が 1 段変わる（左へ＝細かく）
      pieces: { x: 7, y: 176, w: 120, rowH: 16 }, // 切れはしの置き場
      btn: { retry: { x: 70, y: 2, w: 49, h: 11 }, menu: { x: 121, y: 2, w: 12, h: 11 }, help: { x: 30, y: 224, w: 75, h: 13 } },
      mapY: 17,                 // 道の地図（残りの谷の小さな絵）
      select: { x: 6, y: 44, w: 59, h: 44, gapX: 5, gapY: 6, cols: 2, sound: { x: 119, y: 2, w: 14, h: 13 } }, // ステージ選びの札の並び
      dragLift: 14,             // つまんだ切れはしを、指よりこれだけ上に描く
      slash: { reach: 20, min: 6, slop: 3 }, // 上から下へ板を横切るスワイプ: 板の上これだけの範囲から始められる／これだけ下へ動いて板の下へ抜けたら切る／縦か横かを決めるまでの遊び
      ham: { w: 50, h: 20, pull: 9 }, // わたる の引き始めを受ける範囲（画面の左端から探検家の前まで。端のジェスチャーを避けて前から引ける）と、右へこれだけ引いたら わたる
    },

    // 背景: 空と山。y は橋の踏み板（deckY）から上へ／下へのドット
    back: {
      sky: '#3fa2e0', skyBands: 7, skyFade: 0.55,   // 空の上の色、帯の数、山ぎわでの白さ
      clouds: [[8, 56, 26], [84, 68, 34], [150, 50, 22], [-60, 64, 30]], // [x, 橋から上へ, 幅]
      // 遠い順。base: 稜線のいちばん低いところ（橋から下へ＋）、a1/p1/ph1・a2/p2/ph2: 山形の高さ・幅・ずれ、mist: ふもとのかすみ
      ridges: [
        { color: '#a9c8e6', edge: '#c4dcf0', base: -12, a1: 24, p1: 62, ph1: 9, a2: 7, p2: 23, ph2: 3, mist: 0.18 },
        { color: '#7da2c8', edge: '#93b6d8', base: -2, a1: 17, p1: 44, ph1: 30, a2: 6, p2: 17, ph2: 5, mist: 0.22 },
        { color: '#4f8a6b', edge: '#63a07c', base: 24, a1: 9, p1: 71, ph1: 40, a2: 3, p2: 13, ph2: 2 },
      ],
      shadeFrom: 16, shade: 0.4,                    // 谷の底の暗さ（橋のこれだけ下から、いちばん下でこの濃さ）
    },

    // 音。効果音は部品（k: tone / noise / click / knock / rasp / creak）の重ね。数字は dev/sounds.html で聞いて決める
    audio: {
      enabled: true, volume: 0.5,
      keepAlive: { hz: 40, vol: 0.004 }, // 出力を休ませないための、聞こえない低い音（曲がまだないので、無音が続くと短い音の頭が欠ける）
      // 音ごとの大きさの倍率。聞こえる大きさを測ってそろえたもの（小さいスピーカーで、0.1 秒の窓のいちばん大きいところ）。
      // ねらい: 節目の音（がっしり・キュウ・クリアなど）＞ ふつうの音（のこぎり・コトン・ギシギシなど）＞ 何度も鳴る小さい音（カチ・もぐっ）
      level: { click: 1.45, saw: 1.75, knock: 0.65, creak: 1.65, fit: 1.1, sturdy: 1.85, wonder: 1.95, miss: 0.95, trip: 2, kyu: 0.6, back: 0.65, munch: 1.85, pon: 1.7, clear: 1, deny: 3.2, gem: 1.1 },
      sfx: {
        // カチ（切る数が 1 段変わる。段が上がるほど高い）
        click: [{ k: 'click', noiseHz: 3200, q: 1.2, noiseMs: 8, noiseVol: 0.6, toneHz: 1300, toneMs: 20, toneVol: 0.14, stepUp: 1.08 }],
        // ザクッ（のこぎり）
        saw: [{ k: 'rasp', ms: 765, strokes: 4, hz: 2100, hzTo: 800, q: 0.8, rough: 0.6, roughHz: 45, back: 0.6, vol: 0.14, alt: 0.7, gap: 0.25, buzzHz: 330, buzzVol: 0.04 }],
        // コトン（切れはしを置く）・トン（踏む）。短い切れはしほど高い
        knock: [{ k: 'knock', baseHz: 400, pitchPow: 0.45, r2: 2.76, r3: 5.4, dec: 0.09, vol: 0.4, noiseHz: 1800, noiseMs: 12, noiseVol: 0.3 }],
        // ギシギシ（つなぎ目が多い橋）
        creak: [{ k: 'creak', ms: 190, pulseHz: 30, pulseTo: 95, wobble: 0.12, f1: 680, f2: 1260, q: 9, vol: 0.35, hissVol: 0.07, hissHz: 3200, hissMs: 70 }],
        // ピタッ（ぴったり）
        fit: [{ k: 'tone', f: 1568, type: 'triangle', vol: 0.14, dec: 0.09 }, { k: 'tone', f: 2093, type: 'triangle', vol: 0.12, dec: 0.16, delay: 0.05 }, { k: 'noise', f: 5000, vol: 0.06, dec: 0.03 }],
        // がっしり！
        sturdy: [{ k: 'noise', f: 180, type: 'lowpass', vol: 0.35, dec: 0.16 }, { k: 'tone', f: 98, type: 'triangle', vol: 0.3, dec: 0.2, slide: 0.6 }, { k: 'tone', f: 523, type: 'square', vol: 0.06, dec: 0.12, delay: 0.06 }, { k: 'tone', f: 784, type: 'square', vol: 0.06, dec: 0.2, delay: 0.14 }],
        // あれ？
        wonder: [{ k: 'tone', f: 440, type: 'triangle', vol: 0.1, dec: 0.08 }, { k: 'tone', f: 587, type: 'triangle', vol: 0.1, dec: 0.14, delay: 0.1 }],
        // スカッ（穴に落ちる）
        miss: [{ k: 'noise', f: 2400, q: 0.7, vol: 0.14, dec: 0.12, sweep: 0.3 }, { k: 'tone', f: 880, type: 'triangle', vol: 0.1, a: 0.01, dec: 0.55, slide: 0.2, delay: 0.12 }],
        // ガッ（つまずく）
        trip: [{ k: 'noise', f: 900, q: 1, vol: 0.5, dec: 0.07 }, { k: 'tone', f: 160, type: 'square', vol: 0.2, dec: 0.09, slide: 0.6 }],
        // キュウ
        kyu: [{ k: 'tone', f: 1175, type: 'sine', vol: 0.2, a: 0.02, dec: 0.3, slide: 0.55 }],
        // スッ（しれっと戻る。風のようにふわっと入り、高くなりながら消える。細い笛のような音を重ねてまんがらしく）
        back: [{ k: 'noise', f: 1279, q: 2.2, vol: 0.4, a: 0.1, dec: 0.41, sweep: 1.5 }, { k: 'noise', f: 2379, q: 0.6, vol: 0.04, a: 0.2, dec: 0.5 }, { k: 'tone', f: 620, type: 'triangle', vol: 0.05, a: 0.08, dec: 0.22, slide: 2.2 }],
        // もぐっ（たねをほっぺに）
        munch: [{ k: 'tone', f: 262, type: 'square', vol: 0.09, dec: 0.05, delay: 0.25 }, { k: 'tone', f: 196, type: 'square', vol: 0.09, dec: 0.07, delay: 0.33 }],
        // ポンッ（たねを吐き出す）
        pon: [{ k: 'tone', f: 520, type: 'sine', vol: 0.25, a: 0.002, dec: 0.12, slide: 0.35 }, { k: 'noise', f: 1200, vol: 0.1, dec: 0.03 }],
        // クリア
        clear: [0, 4, 7, 12, 16].map((n, i) => ({ k: 'tone', f: 523.25 * Math.pow(2, n / 12), type: 'triangle', vol: 0.11, dec: 0.22, delay: 0.25 + i * 0.09 })),
        // 宝石を 1 つ数える（数えるごとに高く）
        gem: [{ k: 'tone', f: 1319, type: 'triangle', vol: 0.13, dec: 0.1, up: 1.122 }, { k: 'tone', f: 1976, type: 'triangle', vol: 0.1, dec: 0.2, delay: 0.06, up: 1.122 }],
        // これ以上置けない
        deny: [{ k: 'tone', f: 196, type: 'square', vol: 0.12, dec: 0.06 }],
      },
    },

    // 演出の秒数（ルールは一瞬で進む。歩く・落ちるは main が持つ）
    anim: {
      walk: 60,                 // 歩く速さ（ドット/秒）
      stepSec: 0.12,            // 走りのコマ送り（6 コマで一回り。0・3 コマ目で体が沈む）
      wonder: 0.6,              // あれ？
      fall: 0.8,                // 落ちる
      trip: 0.6, tripAir: 0.55, // つまずいて前にこける（長いとき。谷には落ちない）。そのうち宙にいる割合（残りは横倒しで止まる）
      skull: 0.6,               // キュウ とドクロ
      slash: 0.12,              // 切った線が光る
      cutHop: 0.16, cutDrop: 0.2, // 切れはしが離れて跳ねる秒、手持ちの山へ落ちる秒
      sink: 0.08,               // 置いた切れはしが 1 ドット沈む秒
      seedFly: 0.3,             // たねがほっぺへ飛ぶ秒
      clearWait: 0.7, gemEvery: 0.35, // クリア: たねを吐き出してから札が出るまで、宝石を 1 つ数える間
      back: 0.35,               // しれっと戻る
      fit: 0.35,                // ピタッ で止まる
      verdict: 0.45,            // がっしり！／ギシギシ が出る間
      creakEvery: 3,            // ギシギシ は走りの何コマごとにきしむか（3 コマ＝体が沈むたび）
      next: 0.5,                // 次の谷へ
    },
  };
})();
</script>
<script>
// シード付きの乱数（mulberry32）。状態は整数1つで、ルールの状態の中に持つ（写しても同じ列になる）
(function () {
  const Game = (window.Game = window.Game || {});

  // o.rng（整数）を進めて [0,1) を返す
  function next(o) {
    let t = (o.rng = (o.rng + 0x6d2b79f5) | 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const int = (o, n) => Math.floor(next(o) * n);
  const pick = (o, arr) => arr[int(o, arr.length)];
  // 重み付き。items: [{ weight }]
  function weighted(o, items) {
    let sum = 0;
    for (const it of items) sum += it.weight;
    let r = next(o) * sum;
    for (const it of items) { r -= it.weight; if (r < 0) return it; }
    return items[items.length - 1];
  }
  const seedFrom = (s) => (typeof s === 'number' ? s | 0 : [...String(s)].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619), 2166136261) | 0);

  Game.rng = { next, int, pick, weighted, seedFrom };
})();
</script>
<script>
// 解き手: ステージを総当たりで解く。DOM・Canvas・言語に触らない。
//   canClear(hand, gi, stage)  … その手持ちで gi 番目の谷から最後まで渡りきれるか
//   analyze(stage)             … { ok, pars: [谷ごとの par], keep: 全部がっしりで残せる板の最大（できないときは -1） }
//     par: その谷を「同じ長さの切れはしだけ」で埋めるときの最少枚数（最後まで渡りきれる解き方の中で）。3/4 なら 1/4 が 3 枚で、par は 3。
//          長さの違う切れはしを混ぜる埋め方（1/2 と 1/4 で 2 枚）は par を決めるのには使わない（混ぜて par 以下の枚数で渡れば、それも がっしり）。
//          同じ長さだけでは埋められない谷は、混ぜた埋め方の最少枚数
// 手持ち hand = { boards, pieces: [長さ…] }。谷を 1 つ渡るときにできること: 手つかずの板を好きな数に切る（何枚でも）→ 切れはしを選んで、合計をちょうど谷の長さにする。
// 板はどの谷で切っても同じなので、「その谷で切って、その谷で選ぶ」だけを調べれば足りる
(function () {
  const Game = (window.Game = window.Game || {});
  const keyOf = (boards, pieces) => boards + '|' + pieces.join(',');

  // 1 つの谷の渡り方を全部: 渡ったあとの手持ちごとに、使った枚数の最少 k と、同じ長さだけで埋めたときの最少 ku（なければ Infinity）。Map<key, { boards, pieces, k, ku }>
  function crossings(hand, len, cfg) {
    const out = new Map(), seen = new Set();
    const pick = (boards, pieces) => {
      // 同じ長さをまとめて、長さごとに何枚使うかを決める
      const lens = [...new Set(pieces)], cnt = lens.map((l) => pieces.filter((p) => p === l).length), use = lens.map(() => 0);
      const rec = (i, rem, k) => {
        if (rem === 0) {
          const rest = [];
          lens.forEach((l, j) => { for (let c = cnt[j] - use[j]; c > 0; c--) rest.push(l); });
          const key = keyOf(boards, rest), old = out.get(key), ku = use.filter((c) => c > 0).length === 1 ? k : Infinity;
          if (!old) out.set(key, { boards, pieces: rest, k, ku });
          else { if (k < old.k) old.k = k; if (ku < old.ku) old.ku = ku; }
          return;
        }
        if (i >= lens.length) return;
        for (let c = Math.min(cnt[i], Math.floor(rem / lens[i])); c >= 0; c--) { use[i] = c; rec(i + 1, rem - c * lens[i], k + c); }
        use[i] = 0;
      };
      rec(0, len, 0);
    };
    // 板の切り方（切る数の小さい順に決めて、同じ組み合わせを二度調べない）
    const cutRec = (boards, pieces, minI) => {
      const key = keyOf(boards, pieces);
      if (seen.has(key)) return;
      seen.add(key);
      pick(boards, pieces);
      if (boards < 1) return;
      for (let i = minI; i < cfg.cuts.length; i++) {
        const n = cfg.cuts[i], next = pieces.slice();
        for (let c = 0; c < n; c++) next.push(cfg.unit / n);
        next.sort((a, b) => b - a);
        cutRec(boards - 1, next, i);
      }
    };
    cutRec(hand.boards, hand.pieces.slice().sort((a, b) => b - a), 0);
    return out;
  }

  // 覚え書きつきの道具一式（ステージ 1 つぶん）
  function solverFor(stage, cfg) {
    const lens = stage.gaps.map((g) => g.len), memoX = new Map(), memoC = new Map();
    const cross = (hand, gi) => {
      const key = gi + '#' + keyOf(hand.boards, hand.pieces);
      let v = memoX.get(key);
      if (!v) { v = [...crossings(hand, lens[gi], cfg).values()]; memoX.set(key, v); }
      return v;
    };
    const can = (hand, gi) => {
      if (gi >= lens.length) return true;
      const key = gi + '#' + keyOf(hand.boards, hand.pieces);
      if (memoC.has(key)) return memoC.get(key);
      const v = cross(hand, gi).some((r) => can(r, gi + 1));
      memoC.set(key, v);
      return v;
    };
    return { cross, can, lens };
  }

  const norm = (hand) => ({ boards: hand.boards, pieces: hand.pieces.slice().sort((a, b) => b - a) });

  function canClear(hand, gi, stage, cfg = Game.config) {
    return solverFor(stage, cfg).can(norm(hand), gi);
  }

  function analyze(stage, cfg = Game.config) {
    const S = solverFor(stage, cfg), n = S.lens.length;
    const start = norm({ boards: stage.boards, pieces: stage.pieces || [] });
    if (!S.can(start, 0)) return { ok: false, pars: [], keep: -1 };
    const pars = [];
    let reach = new Map([[keyOf(start.boards, start.pieces), start]]);
    for (let gi = 0; gi < n; gi++) {
      const next = new Map();
      let par = Infinity, any = Infinity;
      for (const h of reach.values()) for (const r of S.cross(h, gi)) {
        if (!S.can(r, gi + 1)) continue;
        if (r.ku < par) par = r.ku;
        if (r.k < any) any = r.k;
        next.set(keyOf(r.boards, r.pieces), r);
      }
      pars.push(par === Infinity ? any : par);
      reach = next;
    }
    // keep: 全部の谷を par 以下の枚数で渡る（全部がっしり）解き方の中で、残せる板の最大
    const memo = new Map();
    const best = (h, gi) => {
      if (gi >= n) return h.boards;
      const key = gi + '#' + keyOf(h.boards, h.pieces);
      if (memo.has(key)) return memo.get(key);
      let b = -1;
      for (const r of S.cross(h, gi)) if (r.k <= pars[gi]) b = Math.max(b, best(r, gi + 1));
      memo.set(key, b);
      return b;
    };
    return { ok: true, pars, keep: best(start, 0) };
  }

  Game.solver = { crossings, canClear, analyze };
})();
</script>
<script>
// ステージの型。数字は遊ぶたびに gen.js が決める（設計書 3.5）。ここに書くのは、段階（mode）、部品の候補（cands）、一例の数字（example）。
//   cands: [{ part, …部品ごとの範囲 }]。部品の中身は gen.js の PARTS
//   fixed: true のステージは、いつも example の数字（操作を覚えるステージ）
//   example: { boards, pieces, gaps: [長さ…] }。長さは 1/120 単位
(function () {
  const Game = (window.Game = window.Game || {});

  Game.stages = [
    // ---- エリア 1: かさねて測る ----
    { id: '1-1', area: 1, mode: 'overlay', fixed: true, example: { boards: 1, pieces: [], gaps: [60] } },           // 切る・運ぶ・わたる
    { id: '1-2', area: 1, mode: 'overlay', fixed: true, example: { boards: 1, pieces: [], gaps: [40] } },           // 切る数を変える
    // 1/n のいくつ分: 分母の違う谷が 2 つ。谷ごとに別の板が要る
    { id: '1-3', area: 1, mode: 'overlay', example: { boards: 2, pieces: [], gaps: [80, 90] },
      cands: [{ part: 'apart', dens: [3, 4, 5] }, { part: 'apart', dens: [5, 6, 8] }] },
    // 余りを次の谷で使う（板が 1 枚残る）
    { id: '1-4', area: 1, mode: 'overlay', example: { boards: 2, pieces: [], gaps: [90, 30] },
      cands: [{ part: 'rest', dens: [3, 4, 5, 6, 8], big: true }, { part: 'rest', dens: [3, 4, 5, 6, 8], big: false }] },
    // 割れた切れはし: いくつに割れていても、等しくなければ 1/n ではない
    { id: '1-5', area: 1, mode: 'overlay', example: { boards: 1, pieces: [45, 45, 30], gaps: [40, 40] },
      cands: [{ part: 'broken', dens: [3] }, { part: 'broken', dens: [4, 5] }] },
    // 細かく切るほど 1 枚が短い
    { id: '1-6', area: 1, mode: 'overlay', example: { boards: 3, pieces: [], gaps: [60, 30, 15] },
      cands: [{ part: 'finer', chain: true }, { part: 'finer', chain: false }] },
  ];
})();
</script>
<script>
// ステージを作る: 型（stages.js）と種から、1 回分のステージを作る（設計書 3.5）。DOM・Canvas・言語に触らない。
//   make(def, seed, prevSeed) → { id, mode, boards, pieces, gaps: [{ len, par, sign }], keep, cand, seed, fallback }
// 候補を 1 つ選び、数字を乱数で決め、解き手でねらいを確かめる。だめなら数字を決め直し、config.gen.tries 回でだめなら一例の数字（fallback: true）。
// prevSeed を渡すと、その種で作ったステージと同じ候補・同じ数字にはしない
(function () {
  const Game = (window.Game = window.Game || {});
  const gcd = (a, b) => (b ? gcd(b, a % b) : a);

  // 部品: (c: 候補, o: 乱数の状態, cfg) → { boards, pieces, gaps: [長さ…] } か null（決め直し）
  const PARTS = {
    // べつべつ: 分母の違う谷が 2 つ（どちらも 1/n のいくつ分。分子は 2 以上）
    apart(c, o, cfg) {
      const R = Game.rng, n = R.pick(o, c.dens), m = R.pick(o, c.dens);
      if (n === m) return null;
      const num = (d) => { const a = 2 + R.int(o, d - 2); return gcd(a, d) === 1 ? a : 0; };
      const a = num(n), b = num(m);
      if (!a || !b) return null;
      return { boards: 2, pieces: [], gaps: [(a * cfg.unit) / n, (b * cfg.unit) / m] };
    },
    // のこり: a/n → 残りの (n−a)/n。big: 大きいほうが先
    rest(c, o, cfg) {
      const R = Game.rng, n = R.pick(o, c.dens), a = 1 + R.int(o, n - 1);
      if (gcd(a, n) !== 1 || a * 2 === n || (a * 2 > n) !== c.big) return null;
      return { boards: 2, pieces: [], gaps: [(a * cfg.unit) / n, ((n - a) * cfg.unit) / n] };
    },
    // われた板: 板 1 枚と、不ぞろいに割れた切れはし n 個（合わせて板 1 枚ぶん）。谷は 1/n が 2 つ
    broken(c, o, cfg) {
      const R = Game.rng, n = R.pick(o, c.dens), unit = cfg.unit, part = unit / n;
      // 5 ドットきざみで、どれも 1/n と違う長さに割る
      const cuts = new Set();
      while (cuts.size < n - 1) cuts.add(5 * (3 + R.int(o, unit / 5 - 5)));
      const xs = [0, ...[...cuts].sort((x, y) => x - y), unit], pieces = [];
      for (let i = 0; i < n; i++) pieces.push(xs[i + 1] - xs[i]);
      if (pieces.some((p) => p < 15 || p === part || Math.abs(p - part) < 5)) return null;
      return { boards: 1, pieces: pieces.sort((x, y) => y - x), gaps: [part, part] };
    },
    // こまかく: 1/a・1/b・1/c（どれも 1 枚で渡る）。chain: 分母が倍々につながり、谷がだんだん短くなる
    finer(c, o, cfg) {
      const R = Game.rng, cuts = cfg.cuts;
      let ds;
      if (c.chain) {
        const chains = [];
        for (const a of cuts) for (const b of cuts) for (const d of cuts) if (a < b && b < d && b % a === 0 && d % b === 0) chains.push([a, b, d]);
        ds = R.pick(o, chains);
      } else {
        ds = [R.pick(o, cuts), R.pick(o, cuts), R.pick(o, cuts)];
        if (new Set(ds).size < 3) return null;
        const s = ds.slice().sort((x, y) => x - y);
        if (s[1] % s[0] === 0 && s[2] % s[1] === 0) return null;         // 倍々のつながりは chain のほうで出す
        if (ds[0] < ds[1] && ds[1] < ds[2]) return null;                 // だんだん短くなる並びも chain のほう
      }
      return { boards: 3, pieces: [], gaps: ds.map((d) => cfg.unit / d) };
    },
  };

  // ねらいが成り立つか（raw: 部品が返した形、an: 解き手の答え）
  const AIMS = {
    apart: (raw, an) => an.keep === 0,                                   // 谷ごとに別の板が要る
    rest: (raw, an) => an.keep === raw.boards - 1,                       // 余りを使うと板が 1 枚残る
    broken(raw, an, cfg) {                                               // 割れた切れはしだけでは 1 つめの谷を渡れない。板を切れば 1 枚ずつで渡れる
      const alone = Game.solver.crossings({ boards: 0, pieces: raw.pieces }, raw.gaps[0], cfg);
      return alone.size === 0 && an.keep === 0 && an.pars.every((p) => p === 1);
    },
    finer: (raw, an) => an.keep === 0 && an.pars.every((p) => p === 1),  // どの谷も 1 枚。板は 3 枚とも要る
  };

  function finish(def, raw, an, extra) {
    return Object.assign({
      id: def.id, mode: def.mode, boards: raw.boards, pieces: raw.pieces.slice(),
      gaps: raw.gaps.map((len, i) => ({ len, par: an.pars[i], sign: { kind: def.mode === 'overlay' ? 'none' : 'frac' } })),
      keep: an.keep,
    }, extra);
  }
  const sig = (st) => st.cand + ':' + st.boards + ':' + st.pieces.join(',') + ':' + st.gaps.map((g) => g.len).join(',');
  // かざして見分けられる谷か: 谷の分母より粗い切り方の線が、谷の右の端のすぐそば（cfg.gen.lineGap ドット未満）に来ない。
  // 遊ぶ人は粗いほうから順に試すので、先に出会う粗い切り方がそろって見えるとまちがえる。細かい側の近い線は、正しい切り方に先に出会うので構わない
  function clearEdge(len, cfg) {
    const den = cfg.unit / gcd(len, cfg.unit);
    for (const n of cfg.cuts) if (n < den) for (let k = 1; k < n; k++) { const d = Math.abs((k * cfg.unit) / n - len); if (d > 0 && d < cfg.gen.lineGap) return false; }
    return true;
  }
  const valid = (def, raw, an, cfg) => an.ok && an.keep >= 0 && raw.gaps.every((l) => Number.isInteger(l) && l > 0 && l <= cfg.maxGap && (def.mode !== 'overlay' || clearEdge(l, cfg)));

  function example(def, seed, cfg) {
    const an = Game.solver.analyze({ boards: def.example.boards, pieces: def.example.pieces, gaps: def.example.gaps.map((len) => ({ len })) }, cfg);
    return finish(def, def.example, an, { cand: -1, seed, fallback: !def.fixed });
  }

  function make(def, seed, prevSeed, cfg = Game.config) {
    if (def.fixed || !def.cands) return example(def, seed, cfg);
    const prev = prevSeed == null || prevSeed === seed ? null : sig(make(def, prevSeed, null, cfg));
    const o = { rng: Game.rng.seedFrom(seed) };
    // 候補は先に 1 つ決め、数字だけを決め直す（通りにくい候補が出にくくならないように）
    const ci = Game.rng.int(o, def.cands.length), c = def.cands[ci];
    for (let t = 0; t < cfg.gen.tries; t++) {
      const raw = PARTS[c.part](c, o, cfg);
      if (!raw) continue;
      const an = Game.solver.analyze({ boards: raw.boards, pieces: raw.pieces, gaps: raw.gaps.map((len) => ({ len })) }, cfg);
      if (!valid(def, raw, an, cfg) || !AIMS[c.part](raw, an, cfg)) continue;
      const st = finish(def, raw, an, { cand: ci, seed, fallback: false });
      if (prev && sig(st) === prev) continue;
      return st;
    }
    return example(def, seed, cfg);
  }

  Game.gen = { make, sig, PARTS, AIMS, clearEdge };
})();
</script>
<script>
// ルール: 1 ステージの状態と操作。DOM・Canvas・言語に触らない。状態はただのデータ（structuredClone で写せる）。
// 操作は一瞬で進み、起きたことを出来事の列で返す（歩く・落ちるの時間は main が演出として持つ）。
// stage = { id, mode: 'overlay' | 'hand' | 'fog', boards, pieces: [長さ…], gaps: [{ len, par, sign }], keep }（gen.js が作る）
// 長さは 1/unit を単位にした整数
(function () {
  const Game = (window.Game = window.Game || {});
  const sum = (a) => a.reduce((x, y) => x + y, 0);
  const desc = (a) => a.sort((x, y) => y - x);
  const copyHand = (h) => ({ boards: h.boards, pieces: h.pieces.slice() });

  function start(stage) {
    const hand = { boards: stage.boards, pieces: desc((stage.pieces || []).slice()) };
    return {
      stage, gi: 0,
      hand, bridge: [],          // bridge: 谷に並べた切れはし（左から）
      cutN: 1,                   // 手つかずの板に入れている線の数（1 は切らない）
      falls: stage.gaps.map(() => 0),
      helpOn: false, helpUsed: false, // 「かさねて みる」を今の谷で使っているか、このステージで一度でも使ったか
      sturdy: [],                // 渡った谷ごと: がっしりだったか
      snap: copyHand(hand),      // 今の谷に着いたときの手持ち
      stuck: null,               // 詰み: null / 'gap'（この谷の頭からなら渡りきれる）/ 'start'（最初からでないと渡りきれない）
      crossing: null,            // わたる の結果（settle で片づけるまで、ほかの操作は受けない）
      done: false,
    };
  }

  const gap = (s) => s.stage.gaps[s.gi];
  const busy = (s) => s.done || !!s.crossing;
  const canHelp = (s, cfg = Game.config) => !s.done && s.falls[s.gi] >= cfg.help.falls;
  // 板を谷にかざせるか（かさねて測る、または助け舟）
  const overlay = (s) => s.stage.mode === 'overlay' || s.helpOn;

  // 詰みの確かめ（板を切ったあとと、谷を渡ったあと）。今の手持ち（橋に置いた分も含む）で最後まで渡りきれるか。
  // 渡りきれないとき、この谷の頭からなら渡りきれるなら 'gap'、だめなら 'start'。変わったときだけ出来事を返す
  function checkStuck(s, cfg) {
    const S = Game.solver;
    let v = null;
    if (!s.done && !S.canClear({ boards: s.hand.boards, pieces: s.hand.pieces.concat(s.bridge) }, s.gi, s.stage, cfg)) v = S.canClear(s.snap, s.gi, s.stage, cfg) ? 'gap' : 'start';
    if (v === s.stuck) return [];
    s.stuck = v;
    return v ? [{ type: 'stuck', from: v }] : [];
  }

  // 切る数を決める（まだ切れていない）
  function setCut(s, n, cfg = Game.config) {
    if (busy(s) || s.hand.boards < 1) return [];
    if (n !== 1 && !cfg.cuts.includes(n)) return [];
    if (n === s.cutN) return [];
    s.cutN = n;
    return [{ type: 'cutn', n }];
  }

  // 切る: 手つかずの板 1 枚を cutN 個の等しい切れはしにする
  function cut(s, cfg = Game.config) {
    if (busy(s) || s.hand.boards < 1 || s.cutN < 2) return [];
    const n = s.cutN, len = cfg.unit / n;
    s.hand.boards--;
    for (let i = 0; i < n; i++) s.hand.pieces.push(len);
    desc(s.hand.pieces);
    s.cutN = 1;
    return [{ type: 'cut', n, len }].concat(checkStuck(s, cfg));
  }

  // 運ぶ: 長さ len の切れはしを 1 枚、谷の左から順につめて置く。窓からはみ出すほどは置けない
  function place(s, len, cfg = Game.config) {
    if (busy(s)) return [];
    const i = s.hand.pieces.indexOf(len);
    if (i < 0) return [];
    const at = sum(s.bridge);
    if (at + len > cfg.unit) return [{ type: 'full' }];
    s.hand.pieces.splice(i, 1);
    s.bridge.push(len);
    return [{ type: 'place', len, at, i: s.bridge.length - 1 }];
  }

  // 戻す: 橋の上の i 番目の切れはしを手持ちへ
  function take(s, i) {
    if (busy(s) || i < 0 || i >= s.bridge.length) return [];
    const len = s.bridge.splice(i, 1)[0];
    s.hand.pieces.push(len);
    desc(s.hand.pieces);
    return [{ type: 'take', len, i }];
  }

  // わたる: 判定だけする。片づけは settle（演出のあとで main が呼ぶ）
  function cross(s) {
    if (busy(s)) return [];
    const g = gap(s), total = sum(s.bridge), n = s.bridge.length;
    const result = total < g.len ? 'short' : total > g.len ? 'long' : n <= g.par ? 'sturdy' : 'creak';
    s.crossing = { result, total, len: g.len, bridge: s.bridge.slice() };
    return [{ type: 'cross', result, total, len: g.len, bridge: s.bridge.slice(), gi: s.gi }];
  }

  // わたる の結果を片づける
  function settle(s, cfg = Game.config) {
    if (!s.crossing) return [];
    const { result } = s.crossing, ev = [];
    s.crossing = null;
    if (result === 'short' || result === 'long') {
      // 落ちた: 橋に置いた切れはしは手持ちに戻る。切ってしまった板は戻らない
      s.hand.pieces.push(...s.bridge); desc(s.hand.pieces);
      s.bridge = [];
      s.falls[s.gi]++;
      ev.push({ type: 'fell', result, gi: s.gi, falls: s.falls[s.gi] });
      if (s.falls[s.gi] === cfg.help.falls) ev.push({ type: 'help_ready', gi: s.gi });
      return ev;
    }
    // 渡れた: 使った切れはしは手持ちからなくなる
    s.sturdy.push(result === 'sturdy');
    s.bridge = [];
    ev.push({ type: 'passed', result, gi: s.gi });
    if (result === 'sturdy') ev.push({ type: 'seed', seeds: seeds(s) });
    s.gi++;
    s.cutN = 1;
    s.helpOn = false;
    if (s.gi >= s.stage.gaps.length) {
      s.done = true;
      ev.push({ type: 'clear', result: outcome(s) });
    } else {
      s.snap = copyHand(s.hand);
      ev.push({ type: 'gap', gi: s.gi });
      ev.push(...checkStuck(s, cfg));
    }
    return ev;
  }

  // この谷からやり直す: 谷に着いたときの手持ちに戻す（この谷で切った板も元通り）
  function retryGap(s) {
    if (busy(s)) return [];
    s.hand = copyHand(s.snap);
    s.bridge = [];
    s.cutN = 1;
    if (s.stuck === 'gap') s.stuck = null;
    return [{ type: 'retry_gap', gi: s.gi }];
  }

  // 助け舟「かさねて みる」: 同じ谷で決めた回数落ちたあとだけ。今の谷で板をかざせるようにする
  function help(s, cfg = Game.config) {
    if (busy(s) || !canHelp(s, cfg) || s.helpOn) return [];
    s.helpOn = true;
    s.helpUsed = true;
    return [{ type: 'help', gi: s.gi }];
  }

  const seeds = (s) => s.sturdy.filter(Boolean).length;
  // ほっぺのふくらみ 0〜3（見た目だけ）: たねなし / 谷の数の半分より少ない / 半分以上 / 全部の谷でがっしり
  function cheek(s) {
    const n = seeds(s), all = s.stage.gaps.length;
    return n === 0 ? 0 : n >= all ? 3 : n * 2 >= all ? 2 : 1;
  }
  // 宝石 3 つ（渡りきる / 全部がっしり / 板を keep 枚以上残す）と、足あと（助け舟を使わなかった）
  function outcome(s) {
    return {
      gems: [s.done, s.done && s.sturdy.every(Boolean), s.done && s.hand.boards >= s.stage.keep],
      stamp: s.done && !s.helpUsed,
      seeds: seeds(s),
    };
  }

  Game.rules = { start, gap, busy, canHelp, overlay, setCut, cut, place, take, cross, settle, retryGap, help, seeds, cheek, outcome, sum };
})();
</script>
<script>
// 記録: 開いたステージ、ステージごとの宝石（3 つ）と足あと、前に遊んだ種。DOM・Canvas・言語に触らない。
// 保存の形: { v, stages: { '1-1': { gems: [bool, bool, bool], stamp: bool, seed: 整数 } } }
// 前に取った宝石と足あとは消えない（遊び直して、取れていない分だけを足せる）
(function () {
  const Game = (window.Game = window.Game || {});

  const fresh = (cfg = Game.config) => ({ v: cfg.save.version, stages: {} });
  const blank = () => ({ gems: [false, false, false], stamp: false, seed: null });
  const of = (p, id) => p.stages[id] || blank();

  // 壊れたデータは、読めるところだけ使う。だめなら最初から
  function parse(raw, cfg = Game.config, defs = Game.stages) {
    let d = null;
    try { if (typeof raw === 'string') d = JSON.parse(raw); } catch (e) { return fresh(cfg); }
    const p = fresh(cfg);
    if (!d || d.v !== cfg.save.version || !d.stages || typeof d.stages !== 'object') return p;
    for (const def of defs) {
      const s = d.stages[def.id];
      if (!s || typeof s !== 'object') continue;
      const e = blank();
      if (Array.isArray(s.gems)) for (let i = 0; i < 3; i++) e.gems[i] = s.gems[i] === true;
      e.stamp = s.stamp === true;
      if (Number.isInteger(s.seed)) e.seed = s.seed;
      p.stages[def.id] = e;
    }
    return p;
  }

  // 渡りきったか（1 つめの宝石）
  const cleared = (p, id) => of(p, id).gems[0];
  // 開いているか: 最初のステージか、1 つ前を渡りきっている
  function open(p, id, defs = Game.stages) {
    const i = defs.findIndex((d) => d.id === id);
    return i === 0 || (i > 0 && cleared(p, defs[i - 1].id));
  }
  // ステージに入るときの種を覚える（次に入るとき、同じ数字にしないため）
  function enter(p, id, seed) {
    const e = (p.stages[id] = of(p, id));
    const prev = e.seed;
    e.seed = seed;
    return prev;
  }
  // 結果を足す。返り値: 今回はじめて取れたもの { gems: [bool×3], stamp }
  function record(p, id, outcome) {
    const e = (p.stages[id] = of(p, id));
    const got = { gems: [false, false, false], stamp: false };
    for (let i = 0; i < 3; i++) if (outcome.gems[i] && !e.gems[i]) { e.gems[i] = true; got.gems[i] = true; }
    if (outcome.stamp && !e.stamp) { e.stamp = true; got.stamp = true; }
    return got;
  }
  // エリアの合計 { gems, stamps, stages }
  function total(p, area, defs = Game.stages) {
    const t = { gems: 0, stamps: 0, stages: 0 };
    for (const d of defs) if (d.area === area) { const e = of(p, d.id); t.stages++; t.gems += e.gems.filter(Boolean).length; if (e.stamp) t.stamps++; }
    return t;
  }

  Game.progress = { fresh, parse, of, cleared, open, enter, record, total };
})();
</script>
<script>
// 保存データの読み書き（localStorage）。記録（hoppe-bridge.progress、検め方は progress.parse）、設定（hoppe-bridge.settings）、手本を見たか（hoppe-bridge.tips）。
// 読めない・壊れているときは最初の状態から始める。書けない（容量・プライベートモード）ときは黙って続ける
(function () {
  const Game = (window.Game = window.Game || {});

  function read(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function write(key, data) { try { localStorage.setItem(key, JSON.stringify(data)); return true; } catch (e) { return false; } }
  const json = (raw) => { try { return typeof raw === 'string' ? JSON.parse(raw) : null; } catch (e) { return null; } };

  // 設定 { sound: bool }
  function parseSettings(raw) { const d = json(raw); return { sound: !(d && d.sound === false) }; }
  // 手本 { seen: { count: true, … } }（できたものだけ）
  function parseTips(raw, cfg = Game.config) {
    const d = json(raw), t = { seen: {} };
    if (d && d.seen && typeof d.seen === 'object') for (const id of cfg.tips) if (d.seen[id] === true) t.seen[id] = true;
    return t;
  }

  Game.save = {
    parseSettings, parseTips,
    loadProgress: (cfg = Game.config) => Game.progress.parse(read(cfg.save.progress), cfg),
    storeProgress: (p, cfg = Game.config) => write(cfg.save.progress, p),
    loadSettings: (cfg = Game.config) => parseSettings(read(cfg.save.settings)),
    storeSettings: (s, cfg = Game.config) => write(cfg.save.settings, s),
    loadTips: (cfg = Game.config) => parseTips(read(cfg.save.tips), cfg),
    storeTips: (t, cfg = Game.config) => write(cfg.save.tips, t),
  };
})();
</script>
<script>
// 5×7 の自作ドット文字。1文字 = 7行×5桁の文字列（'#' が点）。濁点・半濁点は bake.js で重ねる
(function () {
  const Game = (window.Game = window.Game || {});

  const G = {};
  // 7行を1行に並べて書く（' ' 区切り）
  const def = (ch, rows) => { G[ch] = rows.split(' '); };

  // 数字
  def('0', '.###. #...# #..## #.#.# ##..# #...# .###.');
  def('1', '..#.. .##.. ..#.. ..#.. ..#.. ..#.. .###.');

<script>
// 文の表（text.js）を引く t。最初の版は日本語だけ（表の形は HOPPE DIVE と同じなので、あとで言語を足せる）
(function () {
  const Game = (window.Game = window.Game || {});

  const L = {
    cur: 'ja',
    // 'a.b.c' の道をたどる。vars があれば {x} を埋める。ないときは '?'
    t(path, vars, lang = L.cur) {
      let v = Game.text[lang];
      for (const k of path.split('.')) { if (v == null) break; v = v[k]; }
      if (v == null) return '?';
      if (vars && typeof v === 'string') v = v.replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? String(vars[k]) : m));
      return v;
    },
  };

  Game.lang = L;
})();
</script>
