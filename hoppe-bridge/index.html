    if (gap) { planks(L.gapX - 5 * Math.ceil((L.gapX - x0) / 5), L.gapX); planks(L.gapX + len, x1); } else planks(x0 - (((x0 - L.gapX) % 5) + 5) % 5, x1);
    if (gap) { g.fillStyle = INK; g.fillRect(L.gapX - 1, L.deckY, 1, T + F); }
    // 霧: 谷の左の端から右を隠す（どこまでが谷かが見えない）。橋のところは濃く、上下へうすくなって広がる。置いた切れはしは霧の上に見える
    if (gap && foggy(app)) {
      const FG = cfg.fog, fx0 = L.gapX + 3, top = L.deckY - 4, bot = L.deckY + T + F + 4, reach = Game.rules.fork(s) ? FG.reachFork : FG.reach;
      g.fillStyle = FG.core; g.fillRect(fx0, top, x1 - fx0, bot - top);
      // 上下の帯: 縁はゆるく波うつ（列ごとに 0〜2 ドット）。外へ行くほどうすい
      for (let k = 0; k < FG.bands.length; k++) {
        const h = Math.ceil(reach / FG.bands.length);
        g.fillStyle = FG.mist; g.globalAlpha = FG.bands[k];
        for (let x = fx0 - 2; x < x1; x += 3) {
          const w = Math.round(1.5 + 1.5 * Math.sin(x * 0.37 + k * 1.7));
          g.fillRect(x, top - (k + 1) * h + w, 3, h); g.fillRect(x, bot + k * h - w, 3, h);
        }
      }
      g.globalAlpha = 1;
      // 流れる筋
      g.fillStyle = FG.streak;
      for (let x = fx0 + 3, i = 0; x < x1; x += 11, i++) g.fillRect(x + Math.round((app.time * 3) % 11), L.deckY + 1 + (i % 3) * 3, 5, 1);
    }
    if (other) return;

    // 谷に渡した切れはし（わたる の間は、判定したときの並び）。ギシギシ のときは 1 ドット揺れる
    const bridge = a && a.bridge ? a.bridge : s.bridge, dy = app.fx ? app.fx.bridgeDy() : 0;
    const sink = app.time - app.placeT < cfg.anim.sink ? 1 : 0;
    for (const r of R.bridgeRects(bridge, 0)) {
      const over = gap && r.x + r.w > L.gapX + len && !foggy(app); // 谷からはみ出して、右の踏み板に乗り上げている（霧の中では見せない。渡るまでわからない）
      const last = r.i === bridge.length - 1;
      wood(g, r.x, r.y - (over ? 2 : 0) + (dy && r.i % 2 === 0 ? dy : 0) + (last && sink && !a ? 1 : 0), r.w, T, F, r.i % 2 ? WOOD.piece2 : WOOD.piece, !over, r.i > 0);
    }
    // あれ？ のとき: 足りない分（ゆうれいの板。うすい輪郭）と、はみ出た分（光る）。記号は付けない
    if (a && a.mark) {
      const k = pulse(app.time, 0.9);
      if (a.mark.kind === 'short') {
        g.globalAlpha = 0.45 + 0.4 * k; g.fillStyle = '#ffffff';
        const x = a.mark.x, w = a.mark.w, y = L.deckY, h = T + F;
        for (let i = 0; i < w; i += 2) { g.fillRect(x + i, y, 1, 1); g.fillRect(x + i, y + h - 1, 1, 1); }
        for (let i = 0; i < h; i += 2) { g.fillRect(x, y + i, 1, 1); g.fillRect(x + w - 1, y + i, 1, 1); }
        g.globalAlpha = 0.12 + 0.1 * k; g.fillRect(x + 1, y + 1, Math.max(0, w - 2), h - 2);
      } else {
        g.globalAlpha = 0.35 + 0.45 * k; g.fillStyle = '#fee761';
        g.fillRect(a.mark.x, L.deckY - 2, a.mark.w, T + F);
      }
      g.globalAlpha = 1;
    }
  }

  // ---- 立て札・かざした板・探検家 ----
  function drawActors(g, app) {
    const cfg = Game.config, L = cfg.layout, s = app.rules, A = B.all(), a = app.anim;
    const gap = s.done ? null : Game.rules.gap(s);
    // 立て札（かさねて測れないとき）: 谷の長さを分数で。下に、どこからどこまでかの印
    if (gap && !Game.rules.overlay(s)) drawSign(g, gap, signOpts(s, Game.rules.fork(s) ? L.deckY - 24 : null));
    // かざした板（かさねて測る）
    const rdy = R.routeDy(s);
    g.translate(0, -rdy);
    if (!s.done && R.hasTarget(s) && Game.rules.overlay(s) && !a && !app.cutFx) drawBoard(g, app);
    if (app.cutFx && app.cutFx.overlay) drawCutFx(g, app);
    g.translate(0, rdy);

    // 探検家（板の奥行きの真ん中に立つ。つまんでいる間は、指のほうへ少し身を乗り出す）
    const h = app.ham, d = app.drag, held = d && d.kind === 'ham', footY = L.deckY + L.footDy;
    if (h.visible) {
      const set = A.hamG[Game.rules.cheek(s)];
      const img = held ? set.lean.n : h.pose === 'fall' ? set.fall[Math.floor(app.time * 8) % 2].n : h.pose === 'hit' ? set.hit.n : h.pose === 'down' ? set.down.n : h.pose === 'run' ? set.run[Math.floor(app.time / cfg.anim.stepSec) % set.run.length].n : set.hold.n;
      const pull = held ? Math.max(0, Math.min(L.ham.pull, d.x - d.x0)) * 0.5 : 0;
      const dy = app.fx && h.x > L.gapX ? app.fx.bridgeDy() : 0;
      if (h.y === 0) { g.fillStyle = 'rgba(24,20,37,0.35)'; g.fillRect(Math.round(h.x - 5 + pull), footY, 11, 1); g.fillRect(Math.round(h.x - 3 + pull), footY + 1, 7, 1); }
      g.drawImage(img, Math.round(h.x - 8 + pull), Math.round(footY - 16 + h.y + dy) + (h.pose === 'down' ? 1 : 0));
      if (h.bubble === '?') g.drawImage(A.qBubble, Math.round(h.x - 3), footY - 30);
      // 橋に切れはしがあるとき: 右へ引けることを小さな矢印で知らせる
      if (s.bridge.length > 0 && !s.done && tip(app, 'go')) fingerMove(g, app, h.x + 6, footY - 12, h.x + 6 + L.ham.pull + 8, footY - 12);
      if (!a && !held && !s.done && s.bridge.length > 0) g.drawImage(A.arrowGo, Math.round(h.x + 10 + 2 * pulse(app.time, 0.8)), footY - 22);
    }
    // ドクロの吹き出し（短いときは谷底、長いときは橋の上）
    if (h.skull) g.drawImage(A.skull, Math.round(h.x - 1), h.skull === 'deck' ? footY - 31 : L.trayY - 22);
  }

  // 立て札: 谷の上に吊るした札と、谷の幅を示す印。
  // o: { caption: 言葉も出す, bar: 小さな絵（d 個に分けた棒）を付ける, marker: 幅の印を付ける, fixed: 窓の真ん中に置く（霧。札の位置で長さがわからないように）, y: 札の上の端, rope: 上から吊るす綱 }
  // 札の中身: 分数 ／「a/d と b/d を あわせた ながさ」／「1 から a/d を とった ながさ」
  function signRows(sg, bar) {
    const f = (n, d) => ({ t: 'f', n, d, w: B.fracW(n, d), h: B.FRAC_H }), w = (str) => ({ t: 'w', s: str, w: B.textW(str), h: 7 });
    const cw = sg.d <= 6 ? 4 : 3, b = { t: 'b', sg, cw, w: sg.d * cw + 1, h: 7 };
    if (sg.kind === 'add') return [[f(sg.a, sg.d), w(lt('sign.and')), f(sg.b, sg.d), w(lt('sign.wo'))], [w(lt('sign.add'))]].concat(bar ? [[b]] : []);
    if (sg.kind === 'sub') return [[w('1'), w(lt('sign.from')), f(sg.a, sg.d), w(lt('sign.wo'))], [w(lt('sign.sub'))]].concat(bar ? [[b]] : []);
    return [[f(sg.n, sg.d)].concat(bar ? [b] : [])];
  }
  const rowW = (r) => r.reduce((a, p) => a + p.w, 0) + 3 * (r.length - 1);
  function drawSign(g, gap, o) {
    const L = Game.config.layout, U = Game.config.unit, V = Game.config.view;
    const sg = gap.sign && gap.sign.kind && gap.sign.kind !== 'none' ? gap.sign : Object.assign({ kind: 'frac' }, B.fracOf(gap.len, U));
    const rows = signRows(sg, o.bar), w = Math.max(...rows.map(rowW)) + 8, h = rows.reduce((a, r) => a + Math.max(...r.map((p) => p.h)), 0) + 2 * (rows.length - 1) + 6;
    const cx = o.fixed ? Math.round(V.w / 2) : L.gapX + Math.round(gap.len / 2), x = Math.max(2, Math.min(V.w - w - 2, cx - Math.round(w / 2)));
    const y = o.y != null ? o.y : rows.length > 1 ? L.signYop : L.signY;
    if (o.rope) { g.fillStyle = '#c28569'; g.fillRect(x + 3, -R.fy - 40, 1, y + R.fy + 40); g.fillRect(x + w - 4, -R.fy - 40, 1, y + R.fy + 40); }
    g.fillStyle = INK; g.fillRect(x, y, w, h);
    g.fillStyle = '#ead4aa'; g.fillRect(x + 1, y + 1, w - 2, h - 2);
    g.fillStyle = '#e4a672'; g.fillRect(x + 1, y + h - 3, w - 2, 2);
    let ry = y + 3;
    for (const r of rows) {
      const rh = Math.max(...r.map((p) => p.h));
      let px = x + Math.round((w - rowW(r)) / 2);
      for (const p of r) {
        const py = ry + Math.floor((rh - p.h) / 2);
        if (p.t === 'f') B.frac(g, p.n, p.d, px, py, INK);
        else if (p.t === 'w') B.text(g, p.s, px, py, INK);
        else {
          // 小さな絵: 分数は n 個に色。あわせる は a 個と b 個を別の色。とる は とった a 個をうすく
          g.fillStyle = INK; g.fillRect(px, py, p.w, 7);
          for (let i = 0; i < sg.d; i++) {
            g.fillStyle = sg.kind === 'add' ? (i < sg.a ? '#d77643' : i < sg.a + sg.b ? '#feae34' : '#ffffff') : sg.kind === 'sub' ? (i < sg.d - sg.a ? '#d77643' : '#8b9bb4') : i < sg.n ? '#d77643' : '#ffffff';
            g.fillRect(px + 1 + i * p.cw, py + 1, p.cw - 1, 5);
          }
        }
        px += p.w + 3;
      }
      ry += rh + 2;
    }
    // 言葉（記号と結びつける最初のステージ）
    if (o.caption && sg.kind === 'frac') { const str = lt('sign.cut', { d: sg.d, n: sg.n }); B.text(g, str, Math.max(2, Math.min(V.w - B.textW(str) - 2, cx - Math.round(B.textW(str) / 2))), y + h + 3, '#ffffff', INK); }
    if (!o.marker) return;
    // 幅の印: ├───┤
    const my = y + h + (o.caption ? 16 : 5), xa = L.gapX, xb = L.gapX + gap.len - 1;
    if (my + 3 >= L.deckY - 12) return;
    g.fillStyle = GUIDE;
    g.fillRect(xa, my, xb - xa + 1, 1); g.fillRect(xa, my - 2, 1, 5); g.fillRect(xb, my - 2, 1, 5);
    for (let yy = my + 4; yy < L.deckY - 1; yy += 3) { g.fillRect(xa, yy, 1, 1); g.fillRect(xb, yy, 1, 1); }
  }
  // 立て札の出し方（段階ごと）
  const signOpts = (s, forkY) => ({ caption: s.stage.caption, bar: s.stage.mode === 'hand', marker: s.stage.mode === 'hand' && forkY == null, fixed: s.stage.mode === 'fog', y: forkY, rope: forkY == null });
  // 霧が出ているか（記号だけのステージ。渡るとき・助け舟を使ったときは晴れる）
  // 晴れるのは、渡っている谷を片づけるまで（anim.bridge がある間）。次の谷へ歩いてくる間・落ちて戻ってくる間は、もう霧の中（次の谷の長さが一瞬見えないように）
  const foggy = (app) => { const s = app.rules; return !!(s && s.stage.mode === 'fog' && !s.helpOn && !(app.anim && app.anim.bridge) && !s.done); };
  R.foggy = foggy;

  // 今の板と、蛇腹の線
  function drawBoard(g, app) {
    const cfg = Game.config, L = cfg.layout, s = app.rules, r = R.boardRect(s), A = B.all();
    const th = r.h - L.boardFront;
    const bounce = app.time - app.cutT < 0.07 ? -1 : 0; // 数が変わった瞬間に 1 ドット弾む
    const d = app.drag, bench = s.bench.length > 0;
    // 線の x（板の左端から。両端も含む）。台の切れはしは、1 枚ずつに同じ数の線が入る
    const marks = [];
    if (bench) {
      // 手つかずの板は、台の奥へ少しずれて待つ
      if (s.hand.boards > 0) wood(g, r.x + 2, r.y - 4, r.w, th, L.boardFront, WOOD.under);
      const flash = app.time - app.slashT < cfg.anim.slash;
      s.bench.forEach((len, i) => {
        wood(g, r.x + i * len, r.y + bounce, len, th, L.boardFront, flash ? WOOD.flash : i % 2 ? WOOD.piece2 : WOOD.piece);
        for (let k = 0; k <= s.cutN; k++) marks.push(i * len + (k * len) / s.cutN);
      });
      g.fillStyle = INK;
      s.bench.forEach((len, i) => { for (let k = 1; k < s.cutN; k++) g.fillRect(r.x + i * len + (k * len) / s.cutN, r.y + bounce - 1, 1, r.h + 2); });
    } else {
      wood(g, r.x, r.y + bounce, r.w, th, L.boardFront, WOOD.piece);
      for (let i = 0; i <= s.cutN; i++) marks.push((i * cfg.unit) / s.cutN);
      g.fillStyle = INK;
      for (let i = 1; i < s.cutN; i++) g.fillRect(r.x + (i * cfg.unit) / s.cutN, r.y + bounce - 1, 1, r.h + 2);
    }
    // かざしているとき: 両端と線から橋へ、点線を下ろす（どこにそろうかを見る）
    if (Game.rules.overlay(s)) {
      g.fillStyle = GUIDE;
      for (const m of new Set(marks)) {
        const x = Math.min(r.x + r.w - 1, r.x + m);
        for (let y = r.y + r.h + 2; y < L.deckY + R.routeDy(s) - 1; y += 3) g.fillRect(x, y, 1, 1);
      }
    }
    // 札（右上）: 板なら切る数。台の切れはしなら、のっている合計を分数で（線を入れると、上も下も同じ数だけ増える）
    const hot = d && d.kind === 'count' ? '#fee761' : '#ead4aa';
    if (bench) {
      const n = s.bench.length * s.cutN, dn = (cfg.unit / s.bench[0]) * s.cutN, fw = B.fracW(n, dn);
      const tx = r.x + r.w - fw - 6, ty = r.y - B.FRAC_H - 8 + (app.time - app.cutT < cfg.anim.tagHop ? -1 : 0);
      g.fillStyle = INK; g.fillRect(tx, ty, fw + 6, B.FRAC_H + 4);
      g.fillStyle = hot; g.fillRect(tx + 1, ty + 1, fw + 4, B.FRAC_H + 2);
      B.frac(g, n, dn, tx + 3, ty + 2, INK);
    } else {
      const tag = String(s.cutN), tw = B.textW(tag), tx = r.x + r.w - tw - 6, ty = r.y - 13;
      g.fillStyle = INK; g.fillRect(tx, ty, tw + 6, 11);
      g.fillStyle = hot; g.fillRect(tx + 1, ty + 1, tw + 4, 9);
      B.text(g, tag, tx + 3, ty + 2, INK);
    }
    // まだ線がないとき: 左へなぞれることを、指と矢印で知らせる（指が板の上を左へ動いては、右に戻る）
    // 台の切れはしは、はじめて切るまで同じ手本を出す（切れない長さのときは出さない）
    const w0 = bench ? Game.rules.sum(s.bench) : r.w, tipCut = bench ? 'recut' : 'cut';
    if (s.cutN === 1 && (bench ? tip(app, 'recut') && Game.rules.cutOptions(s).length : tip(app, 'count'))) {
      const k = (app.time * 0.8) % 1, fx = r.x + Math.max(44, w0 - 30) - Math.round(Math.min(1, k * 1.5) * 32);
      g.drawImage(A.arrowL, fx - 8, r.y - 8);
      g.drawImage(A.finger, fx, r.y - 9);
    }
    // 線が入っているとき: 上から下へ切れることを矢印で知らせる
    if (s.cutN > 1 && !d) g.drawImage(A.arrowD, r.x + Math.round(r.w / 2) - 3, r.y - 15 + Math.round(2 * pulse(app.time, 0.8)));
    if (s.cutN > 1 && tip(app, tipCut)) fingerMove(g, app, r.x + Math.round(r.w / 2) + 6, r.y - 12, r.x + Math.round(r.w / 2) + 6, r.y + r.h + 6);
    // 板を横切ろうとしている指のあと
    if (d && d.kind === 'slash') { g.fillStyle = '#ffffff'; g.fillRect(Math.round(d.x), Math.round(d.y0), 1, Math.max(1, Math.round(d.y - d.y0))); }
  }

  // 切った直後: 切れはしが 1 ドットずつ離れて少し跳ね、手持ちの山へ落ちていく
  function drawCutFx(g, app) {
    const cfg = Game.config, L = cfg.layout, c = app.cutFx, AN = cfg.anim;
    const t = app.time - c.t0, th = L.boardH - L.boardFront;
    const gr = R.groups(app.rules.hand.pieces).find((q) => q.len === c.len);
    for (let i = 0; i < c.n; i++) {
      let x = c.x + i * c.len + Math.round((i - (c.n - 1) / 2) * Math.min(1, t / 0.05)), y = c.y;
      if (t < AN.cutHop) y -= Math.round(3 * Math.sin((Math.PI * t) / AN.cutHop));
      else if (gr) { const u = Math.min(1, (t - AN.cutHop) / AN.cutDrop), k = u * u; x = Math.round(x + (gr.x - x) * k); y = Math.round(y + (gr.y - y) * k); }
      wood(g, x, y, c.len, th, L.boardFront, t < cfg.anim.slash ? WOOD.flash : WOOD.piece);
    }
  }

  // ---- 手持ち（作業台） ----
  function drawTray(g, app) {
    const cfg = Game.config, L = cfg.layout, s = app.rules, x0 = -R.fx, d0 = app.drag;
    g.fillStyle = '#3e2731'; g.fillRect(x0, L.trayY, R.Lw, R.Lh);
    g.fillStyle = INK; g.fillRect(x0, L.trayY, R.Lw, 1);
    g.fillStyle = '#733e39'; g.fillRect(x0, L.trayY + 1, R.Lw, 2);
    g.fillStyle = '#5d2c33';
    for (let y = L.trayY + 14; y < R.Lh; y += 22) g.fillRect(x0, y, R.Lw, 1);

    // 切る台（切り直しのあるステージ）: 板も切れはしも、この上にのる
    if (s.stage.recut) {
      const bx = L.boardX - 4, by = L.boardY + L.boardH, bw = cfg.unit + 8;
      g.fillStyle = INK; g.fillRect(bx, by - 1, bw, 6); g.fillRect(bx + 4, by + 5, 5, 4); g.fillRect(bx + bw - 9, by + 5, 5, 4);
      g.fillStyle = '#b86f50'; g.fillRect(bx + 1, by, bw - 2, 2);
      g.fillStyle = '#733e39'; g.fillRect(bx + 1, by + 2, bw - 2, 2); g.fillRect(bx + 5, by + 5, 3, 3); g.fillRect(bx + bw - 8, by + 5, 3, 3);
      // 切れはしをつまんでいる間は、のせられる場所をうすく示す
      if (d0 && d0.kind === 'piece' && !Game.rules.overlay(s) && (!s.bench.length || s.bench[0] === d0.len)) { g.fillStyle = 'rgba(254,231,97,' + (0.18 + 0.1 * pulse(app.time, 0.8)).toFixed(2) + ')'; g.fillRect(L.boardX + R.benchRects(s).length * d0.len, L.boardY, d0.len, L.boardH); }
    }
    // 手元の板・台の切れはし（かざせないとき）
    if (!s.done && R.hasTarget(s) && !Game.rules.overlay(s) && !app.cutFx) drawBoard(g, app);

    // 切れはし（つまんでいる 1 枚は山から抜いて描く。切った直後に飛んでくる分は、着くまで数えない）
    const d = app.drag, c = app.cutFx, th = L.boardH - L.boardFront;
    for (const gr of R.groups(s.hand.pieces)) {
      const n = gr.n - (d && d.kind === 'piece' && d.len === gr.len ? 1 : 0) - (c && c.len === gr.len ? c.n : 0);
      if (n > 1) wood(g, gr.x + 1, gr.y + 2, gr.w, th, L.boardFront, WOOD.under);
      if (n > 0) wood(g, gr.x, gr.y, gr.w, th, L.boardFront, WOOD.piece);
      if (n > 1) B.text(g, 'x' + n, gr.x + gr.w + 3, gr.y + 1, '#c0cbdc', INK);
      // 記号（1/n の切れはしだけ。割れた切れはしには付かない）
      const dn = cfg.unit / gr.len;
      if (R.labels && n > 0 && cfg.cuts.includes(dn)) B.frac(g, 1, dn, gr.x + Math.max(0, Math.floor((gr.w - B.fracW(1, dn)) / 2)), gr.y + L.boardH + 2, '#ead4aa');
    }
    if (c && !c.overlay) drawCutFx(g, app);
    // 手本: 切れはしを台にのせる（切り直しのあるステージで、はじめてのせるまで）
    if (s.stage.recut && !s.done && !Game.rules.overlay(s) && !s.bench.length && s.bridge.length === 0 && tip(app, 'bench')) {
      const gb = R.groups(s.hand.pieces).find((q) => cfg.cuts.includes(cfg.unit / q.len) && cfg.cuts.some((k) => cfg.cuts.includes((cfg.unit / q.len) * k)));
      if (gb) {
        fingerMove(g, app, gb.x + Math.round(gb.w / 2) - 4, gb.y + 2, L.boardX + Math.round(gb.w / 2) - 4, L.boardY - 2);
        center(g, lt('demo.recut'), L.pieces.y + 34, '#ffffff');
      }
    }
    // 手本: 切れはしを谷へ運ぶ
    const gr0 = R.groups(s.hand.pieces)[0];
    if (gr0 && !s.done && s.bridge.length === 0 && s.hand.boards === 0 && !s.stage.recut && tip(app, 'carry')) fingerMove(g, app, gr0.x + Math.round(gr0.w / 2) - 4, gr0.y + 2, L.gapX + 10, L.deckY - 2);
  }

  // ---- ボタン（置き場所は R.buttons。main の当たりも同じものを使う） ----
  function button(g, b, app, color) {
    const d = app.drag, on = d && d.kind === 'btn' && d.id === b.id;
    g.fillStyle = INK; g.fillRect(b.x, b.y, b.w, b.h);
    g.fillStyle = on ? '#5a6988' : color || '#3a4466'; g.fillRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    g.fillStyle = on ? '#8b9bb4' : '#5a6988'; g.fillRect(b.x + 1, b.y + 1, b.w - 2, 1);
    if (b.label) B.text(g, b.label, b.x + Math.round((b.w - B.textW(b.label)) / 2), b.y + Math.floor((b.h - 7) / 2), '#ffffff');
  }
  const soundLabel = (app) => lt(app.settings && app.settings.sound === false ? 'sound.off' : 'sound.on');
  const hapticsLabel = (app) => lt(app.settings && app.settings.haptics === false ? 'haptics.off' : 'haptics.on');
  // 今の画面で押せるもの [{ id, x, y, w, h, label }]
  R.buttons = function (app) {
    const cfg = Game.config, V = cfg.view, L = cfg.layout, s = app.rules, out = [];
    if (app.mode === 'title') return [{ id: 'start', x: -R.fx, y: -R.fy, w: R.Lw, h: R.Lh }];
    if (app.mode === 'story') return [{ id: 'page', x: -R.fx, y: -R.fy, w: R.Lw, h: R.Lh }];
    if (app.mode === 'select') {
      const S = L.select;
      Game.stages.filter((d) => d.area === app.area).forEach((def, i) => out.push({ id: 'stage:' + def.id, def, x: S.x + (i % S.cols) * (S.w + S.gapX), y: S.y + Math.floor(i / S.cols) * (S.h + S.gapY), w: S.w, h: S.h }));
      const areas = Math.max(...Game.stages.map((d) => d.area));
      if (app.area > 1) out.push(Object.assign({ id: 'areaPrev' }, S.prev));
      if (app.area < areas) out.push(Object.assign({ id: 'areaNext' }, S.next));
      out.push(Object.assign({ id: 'story', label: lt('select.story') }, S.story));
      out.push(Object.assign({ id: 'sound' }, S.sound)); // 右上の小さな絵のボタン（下の真ん中に大きく置くと、はじめるボタンに見える）
      out.push(Object.assign({ id: 'haptics' }, S.haptics)); // スピーカーの左に、振動の入り切り
      return out;
    }
    if (app.menu) {
      ['resume', 'restart', 'sound', 'haptics', 'select'].forEach((id, i) => out.push({ id, x: 24, y: 62 + i * 17, w: 87, h: 13, label: id === 'sound' ? soundLabel(app) : id === 'haptics' ? hapticsLabel(app) : lt('menu.' + id) }));
      return out;
    }
    if (app.mode === 'clear') {
      if (app.time - app.clearT < cfg.anim.clearWait + cfg.anim.gemEvery * 5) return out;
      const ids = (app.nextId ? ['next'] : []).concat(['again', 'select']);
      ids.forEach((id, i) => out.push({ id, x: 24, y: 62 + i * 16, w: 87, h: 13, label: lt('clear.' + id) }));
      return out;
    }
    out.push(Object.assign({ id: 'retry', label: lt('btn.retry') }, L.btn.retry));
    out.push(Object.assign({ id: 'menu' }, L.btn.menu));
    if (s && !app.anim && Game.rules.canHelp(s) && !Game.rules.overlay(s)) out.push(Object.assign({ id: 'help', label: lt('btn.help') }, L.btn.help));
    return out;
  };

  // ---- 上の帯: 手持ちの板の枚数、たね、やりなおす、メニュー。その下に道の地図と、詰みの声かけ ----
  function drawHud(g, app) {
    const cfg = Game.config, L = cfg.layout, s = app.rules, A = B.all();
    g.drawImage(A.boardIcon, 2, 5);
    B.text(g, 'x' + s.hand.boards, 15, 4, '#ffffff', INK);
    g.drawImage(A.seed, 36, 4);
    B.text(g, 'x' + Game.rules.seeds(s), 43, 4, '#ffffff', INK);
    if (app.mode !== 'play') return;
    for (const b of R.buttons(app)) {
      if (b.id === 'retry' && s.stuck === 'gap' || b.id === 'menu' && s.stuck === 'start') { g.globalAlpha = 0.4 + 0.6 * pulse(app.time, 1); g.fillStyle = '#fee761'; g.fillRect(b.x - 1, b.y - 1, b.w + 2, b.h + 2); g.globalAlpha = 1; }
      button(g, b, app, b.id === 'help' ? '#3e8948' : null);
      if (b.id === 'menu') { g.fillStyle = '#ffffff'; for (let i = 0; i < 3; i++) g.fillRect(b.x + 3, b.y + 3 + i * 2, b.w - 6, 1); }
    }
    // 道の地図: 谷を左から。穴の幅は谷の長さ。渡った谷は、がっしりならたね。今の谷の下に印
    const my = L.mapY;
    const fog = s.stage.mode === 'fog';
    s.stage.gaps.forEach((gp, i) => {
      const x = 3 + i * 21, opts = gp.fork || [gp];
      g.fillStyle = INK; g.fillRect(x - 1, my - 1, 19, 5);
      g.fillStyle = '#733e39'; g.fillRect(x, my, 17, 3);
      // 穴の幅は谷の長さ（霧のステージでは見せない）。分かれ道は上下 2 本
      opts.forEach((op, k) => {
        const hole = fog ? 15 : Math.max(2, Math.round((op.len / cfg.unit) * 15)), hy = opts.length > 1 ? my + k * 2 : my, hh = opts.length > 1 ? 1 : 3;
        g.fillStyle = i >= s.gi ? INK : '#e4a672'; g.fillRect(x + 1, hy, hole, hh);
      });
      if (i < s.gi && s.sturdy[i]) g.drawImage(s.gold[i] ? A.seedGold : A.seed, x + 6, my + 5);
      if (i === s.gi) { g.fillStyle = '#fee761'; g.fillRect(x, my + 5, 17, 1); }
      // 立て札のあるステージ: 先の谷の立て札も、地図に全部出す（先を読んで計画できる）
      if (s.stage.mode !== 'overlay' && i >= s.gi) mapSign(g, opts, x + 8, my + 8, i === s.gi ? INK : '#3a4466');
    });
    if (s.stuck && !app.anim) { const str = lt('stuck.' + s.stuck); B.text(g, str, Math.round((cfg.view.w - B.textW(str)) / 2), my + (s.stage.mode !== 'overlay' ? 24 : 12), '#fee761', INK); }
  }

  // 分かれ道のお手本: 指がもう 1 本の橋をタップして探検家が移り、また元の橋をタップして戻る（main の app.demo が時間を持つ）
  function drawDemo(g, app) {
    const L = Game.config.layout, D = Game.config.anim.demo, d = app.demo, s = app.rules, dy = R.routeDy(s);
    // タップした所に、広がって消える輪（お手本でも、自分でタップしたときも）
    if (app.tapT != null && app.time - app.tapT < D.ring && app.mode === 'play') {
      const u = (app.time - app.tapT) / D.ring, r = 2 + Math.round(5 * u), p = app.tapAt && !d ? app.tapAt : { x: 96, y: L.deckY + L.forkDy[s.route] + 4 };
      g.globalAlpha = 1 - u; g.strokeStyle = '#ffffff'; g.lineWidth = 1;
      g.strokeRect(Math.round(p.x) - r + 0.5, Math.round(p.y - dy) - r + 0.5, r * 2, r * 2);
      g.globalAlpha = 1;
    }
    if (!d || app.mode !== 'play') return;
    if (d.step < 2 || d.t < D.move * 2 + D.press * 2 + D.hold + 0.25) {
      // 1 回目は もう 1 本の橋へ、2 回目は元の橋へ。上から近づき、すっと押して、少し浮く
      const second = d.t >= D.move + D.press + D.hold, t = second ? d.t - (D.move + D.press + D.hold) : d.t;
      const to = second ? d.from : 1 - d.from, ty = L.deckY + L.forkDy[to] + 4 - dy;
      const lift = t < D.move ? 14 - 8 * Math.min(1, t / D.move) : t < D.move + D.press ? 6 - 6 * ((t - D.move) / D.press) : Math.min(6, (t - D.move - D.press) * 40);
      g.drawImage(B.all().finger, 92, Math.round(ty - 9 - lift)); // 指先（絵の下の端）が橋の上の面の真ん中に来る
    }
    center(g, lt('demo.route'), L.trayY - 12 - dy, '#ffffff');
  }

  // 地図の小さな立て札（cx を中心に）: 分数 ／ 分かれ道は 2 つ並べる ／ あわせる は「a/d ＋ b/d」／ とる は「1 − a/d」
  function mapSign(g, opts, cx, y, color) {
    const parts = [];
    opts.forEach((op, k) => {
      const sg = op.sign;
      if (!sg || sg.kind === 'none') return;
      if (k > 0) parts.push({ t: 'g', w: 1 });
      if (sg.kind === 'add') parts.push({ t: 'f', n: sg.a, d: sg.d }, { t: '+', w: 3 }, { t: 'f', n: sg.b, d: sg.d });
      else if (sg.kind === 'sub') parts.push({ t: '1', w: 3 }, { t: '-', w: 3 }, { t: 'f', n: sg.a, d: sg.d });
      else parts.push({ t: 'f', n: sg.n, d: sg.d });
    });
    for (const p of parts) if (p.t === 'f') p.w = B.fracW(p.n, p.d);
    let x = cx - Math.floor((parts.reduce((a, p) => a + p.w, 0) + parts.length - 1) / 2);
    g.fillStyle = color;
    for (const p of parts) {
      if (p.t === 'f') B.frac(g, p.n, p.d, x, y, color);
      else if (p.t === '1') B.small(g, 1, x, y + 4, color);
      else if (p.t === '+') { g.fillStyle = color; g.fillRect(x, y + 6, 3, 1); g.fillRect(x + 1, y + 5, 1, 3); }
      else if (p.t === '-') { g.fillStyle = color; g.fillRect(x, y + 6, 3, 1); }
      x += p.w + 1;
    }
  }

  // ---- メニュー ----
  function panel(g, x, y, w, h) {
    g.fillStyle = INK; g.fillRect(x, y, w, h);
    g.fillStyle = '#262b44'; g.fillRect(x + 1, y + 1, w - 2, h - 2);
    g.fillStyle = '#3a4466'; g.fillRect(x + 1, y + 1, w - 2, 1);
  }
  function drawMenu(g, app) {
    g.fillStyle = 'rgba(24,20,37,0.6)'; g.fillRect(-R.fx, -R.fy, R.Lw, R.Lh);
    panel(g, 16, 54, 103, 97);
    for (const b of R.buttons(app)) button(g, b, app);
  }

  // ---- タイトル ----
  function big(g, str, cx, y, k, color) {
    const w = B.textW(str) + 2, c = B.mk(w, 9), cg = c.getContext('2d');
    B.text(cg, str, 1, 1, color, INK);
    g.drawImage(c, Math.round(cx - (w * k) / 2), y, w * k, 9 * k);
  }
  function drawTitle(g, app) {
    const V = Game.config.view, A = B.all();
    big(g, lt('title.name1'), V.w / 2, 46, 3, '#fee761');
    big(g, lt('title.name2'), V.w / 2, 76, 3, '#feae34');
    // 橋を渡る探検家
    const y = 150;
    g.fillStyle = '#c28569'; g.fillRect(-R.fx, y - 11, R.Lw, 1);
    for (let x = -R.fx - (((-R.fx) % 5) + 5) % 5; x < R.Lw; x += 5) wood(g, x, y, 6, 9, 3, WOOD.old);
    for (let i = 0; i < 3; i++) wood(g, 30 + i * 25, y, 25, 9, 3, i % 2 ? WOOD.piece2 : WOOD.piece);
    const set = A.hamG[2], f = set.run[Math.floor(app.time / Game.config.anim.stepSec) % set.run.length].n;
    g.drawImage(f, 50, y - 27, 40, 32);
    if (pulse(app.time, 1.6) > 0.25) center(g, lt('title.tap'), 196, '#ffffff');
  }

  // ---- おはなし: なぜここにいて、なぜ渡り、どんな橋がよいか。絵 1 枚と文 2 行、タップで次へ ----
  // 小さな橋: y が上の面の奥の端。gx から len が谷、pieces は谷に渡した切れはし
  function miniBridge(g, y, gx, len, pieces) {
    const L = Game.config.layout, T = L.deckH, F = L.deckFront, x0 = -R.fx, x1 = x0 + R.Lw;
    g.fillStyle = '#c28569'; g.fillRect(x0, y - 9, R.Lw, 1);
    g.fillStyle = '#733e39'; g.fillRect(x0, y + 1, R.Lw, 1);
    g.fillStyle = '#c28569'; g.fillRect(x0, y + T, R.Lw, 1);
    g.fillStyle = INK; g.fillRect(x0, y + T + 1, R.Lw, 1);
    for (let x = gx - 5 * Math.ceil((gx - x0) / 5); x < gx; x += 5) wood(g, x, y, 6, T, F, WOOD.old);
    for (let x = gx + len; x < x1; x += 5) wood(g, x, y, 6, T, F, WOOD.old);
    if (len) { g.fillStyle = INK; g.fillRect(gx - 1, y, 1, T + F); }
    let at = gx;
    (pieces || []).forEach((w, i) => { wood(g, at, y, w, T, F, i % 2 ? WOOD.piece2 : WOOD.piece, true, i > 0); at += w; });
  }
  function drawStory(g, app) {
    const cfg = Game.config, V = cfg.view, L = cfg.layout, A = B.all(), pg = Math.min(app.page, lt('story.pages').length - 1), t = app.time;
    const y = 112, gx = L.gapX, ham = (x, k) => g.drawImage(A.hamG[0][k || 'hold'].n, x - 8, y + L.footDy - 16);
    if (pg === 0) {
      // 谷の向こうで宝石が光っている
      miniBridge(g, y, 0, 0);
      ham(24);
      g.drawImage(A.gem, 102, 62 + Math.round(2 * pulse(t, 1.6)), A.gem.width * 2, A.gem.height * 2);
      g.drawImage(A.sparkle[Math.floor(t * 2) % 2], 118, 58);
    } else if (pg === 1) {
      // 踏み板が抜けている
      miniBridge(g, y, gx, 60);
      ham(7);
      g.drawImage(A.qBubble, 4, y + L.footDy - 30);
    } else if (pg === 2) {
      // 板を切って、すきまにぴったり
      miniBridge(g, y, gx, 60, [30, 30]);
      ham(7);
      const by = y - 34, th = L.boardH - L.boardFront;
      wood(g, gx, by, cfg.unit, th, L.boardFront, WOOD.piece);
      g.fillStyle = INK;
      for (let i = 1; i < 4; i++) g.fillRect(gx + i * 30, by - 1, 1, L.boardH + 2);
      g.fillStyle = GUIDE;
      for (let i = 0; i <= 4; i++) { const x = Math.min(gx + cfg.unit - 1, gx + i * 30); for (let yy = by + L.boardH + 2; yy < y - 1; yy += 3) g.fillRect(x, yy, 1, 1); }
    } else {
      // つなぎ目が少ない橋と、多い橋
      miniBridge(g, 86, gx, 60, [60]);
      B.text(g, lt('fx.sturdy'), gx + 66, 72, '#fee761', INK);
      g.drawImage(A.seed, gx + 27, 74);
      miniBridge(g, 128, gx, 60, [15, 15, 15, 15]);
      const cr = lt('fx.creak');
      B.text(g, cr + ' ' + cr, gx + 66, 114 + Math.round(pulse(t, 0.9)), '#c0cbdc', INK);
    }
    const lines = lt('story.pages')[pg];
    panel(g, 6, 160, V.w - 12, 32);
    lines.forEach((s, i) => center(g, s, 167 + i * 11, '#ffffff'));
    g.drawImage(A.arrowD, Math.round(V.w / 2) - 3, 196 + Math.round(2 * pulse(t, 0.8)));
  }

  // ---- ステージ選び ----
  function drawSelect(g, app) {
    const V = Game.config.view, A = B.all(), P = Game.progress, p = app.progress;
    const head = lt('select.area', { n: app.area }), sub = lt('select.sub')[app.area - 1];
    center(g, head, 19, '#fee761');
    center(g, sub, 30, '#c0cbdc');
    const t = P.total(p, app.area);
    // 集めきった数は黄色に
    // 編 2 のエリアは星も（3 つを左から詰めて並べる）
    const recut = Game.stages.some((d) => d.area === app.area && d.recut), xs = recut ? [14, 56, 92] : [36, 80];
    g.drawImage(A.gem, xs[0], 41); B.text(g, t.gems + '/' + t.stages * 3, xs[0] + 10, 41, t.gems === t.stages * 3 ? '#fee761' : '#ffffff', INK);
    g.drawImage(A.foot, xs[1], 41); B.text(g, t.stamps + '/' + t.stages, xs[1] + 10, 41, t.stamps === t.stages ? '#fee761' : '#ffffff', INK);
    if (recut) { g.drawImage(A.star, xs[2], 41); B.text(g, t.stars + '/' + t.stages, xs[2] + 10, 41, t.stars === t.stages ? '#fee761' : '#ffffff', INK); }
    for (const b of R.buttons(app)) {
      if (!b.def) { button(g, b, app); if (b.id === 'areaPrev' || b.id === 'areaNext') g.drawImage(b.id === 'areaPrev' ? A.arrowL : A.arrowR, b.x + 3, b.y + 3); if (b.id === 'sound') g.drawImage(app.settings && app.settings.sound === false ? A.spkOff : A.spkOn, b.x + 3, b.y + 3); if (b.id === 'haptics') g.drawImage(app.settings && app.settings.haptics === false ? A.vibOff : A.vibOn, b.x + 3, b.y + 3); continue; }
      const open = P.open(p, b.def.id), e = P.of(p, b.def.id), d = app.drag, on = d && d.kind === 'btn' && d.id === b.id;
      g.fillStyle = INK; g.fillRect(b.x, b.y, b.w, b.h);
      g.fillStyle = !open ? '#262b44' : on ? '#5a6988' : '#3a4466'; g.fillRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
      g.fillStyle = open ? '#5a6988' : '#3a4466'; g.fillRect(b.x + 1, b.y + 1, b.w - 2, 1);
      if (!open) { B.text(g, lt('select.locked'), b.x + Math.round(b.w / 2) - 2, b.y + 18, '#5a6988'); continue; }
      B.text(g, b.def.id, b.x + Math.round((b.w - B.textW(b.def.id)) / 2), b.y + 6, '#ffffff', INK);
      const ox = b.def.recut ? -5 : 0; // 編 2 は星の分だけ左へ
      for (let i = 0; i < 3; i++) g.drawImage(e.gems[i] ? A.gem : A.gemOff, b.x + 8 + ox + i * 10, b.y + 20);
      g.drawImage(e.stamp ? A.foot : A.footOff, b.x + 42 + ox, b.y + 20);
      if (b.def.recut) g.drawImage(e.star ? A.star : A.starOff, b.x + 47, b.y + 20);
    }
  }

  // ---- クリア: たねを吐き出し、宝石を 1 つずつ数える ----
  function drawClear(g, app) {
    const cfg = Game.config, V = cfg.view, L = cfg.layout, A = B.all(), o = app.result, t = app.time - app.clearT, AN = cfg.anim;
    // たねが探検家から飛び出す
    if (o) for (let i = 0; i < o.seeds; i++) {
      const u = (t - i * 0.08) / 0.5;
      if (u <= 0 || u >= 1) continue;
      g.drawImage(A.seed, Math.round(app.ham.x + 6 + (14 + i * 9) * u), Math.round(L.deckY - 8 - 22 * Math.sin(Math.PI * u)));
    }
    if (t < AN.clearWait) return;
    const y = 24;
    panel(g, 8, y, V.w - 16, 92);
    center(g, lt('clear.title'), y + 6, '#fee761');
    if (o) {
      const ox = app.def.recut ? -6 : 0; // 編 2 は星の分だけ左へ
      for (let i = 0; i < 3; i++) {
        const shown = t >= AN.clearWait + AN.gemEvery * (i + 1), x = V.w / 2 - 20 + ox + i * 12, pop = shown && t < AN.clearWait + AN.gemEvery * (i + 1) + 0.08 ? -2 : 0;
        g.drawImage(shown && o.gems[i] ? A.gem : A.gemOff, x, y + 19 + (o.gems[i] ? pop : 0));
      }
      const fs = t >= AN.clearWait + AN.gemEvery * 4;
      g.drawImage(fs && o.stamp ? A.foot : A.footOff, V.w / 2 + 20 + ox, y + 19);
      if (app.def.recut) { const ss = t >= AN.clearWait + AN.gemEvery * 5; g.drawImage(ss && o.star ? A.star : A.starOff, V.w / 2 + 26, y + 19 + (ss && o.star && t < AN.clearWait + AN.gemEvery * 5 + 0.08 ? -2 : 0)); }
    }
    for (const b of R.buttons(app)) button(g, b, app, b.id === 'next' ? '#3e8948' : null);
    if (app.reward) drawReward(g, app);
  }

  // ---- ごほうび（エリアの宝石・足あとを集めきった）: クリアの札の下の空いた所に、小さな舞台を出す ----
  // 宝石: 探検家が走ってきて、ぱんぱんのほっぺで跳ねる。跳ねた勢いでステージの数だけ宝石が飛び出し、頭の上に弧を描いて並ぶ（ゆっくり揺れて、1 つずつ光る）
  // 足あと: 探検家が舞台を端から端まで走り抜け、通ったあとに足あとが並ぶ。もう一度左から出てきて、真ん中で跳ねる
  const RW = () => Game.config.layout.reward, RA = () => Game.config.anim.reward;
  const ease = (u) => 1 - (1 - u) * (1 - u);
  // 足あとを付ける x（6 つ）
  function stampXs() { const W = RW(), n = 6; return Array.from({ length: n }, (_, k) => Math.round(W.x + 14 + (k * (W.w - 28 - 7)) / (n - 1))); }
  // 足あとのごほうびの探検家の x: 端から端まで走り抜ける → 左からもう一度出てきて真ん中へ
  function stampHamX(t) {
    const W = RW(), A = RA(), x0 = W.x - 12, cx = W.x + W.w / 2;
    if (t < A.dash) return x0 + ((W.w + 24) * t) / A.dash;
    if (t < A.dash + A.runIn) return x0 + ((cx - x0) * (t - A.dash)) / A.runIn;
    return cx;
  }
  // 足あとのごほうびで、t 秒までに付いた足あとの数（main が「トン」を鳴らすのに使う）
  R.rewardStamps = (t) => { const hx = stampHamX(Math.min(t, RA().dash)); return stampXs().filter((x) => x + 3 < hx - 10).length; };
  function drawReward(g, app) {
    const cfg = Game.config, W = RW(), AN = RA(), A = B.all(), rw = app.reward, t = app.time - rw.t0;
    const gy = W.y + W.h - 22, footY = gy + cfg.layout.footDy; // 床（踏み板の上の面の奥の端）と、探検家の足
    panel(g, W.x, W.y, W.w, W.h);
    center(g, lt('reward.' + rw.kind), W.y + 6, rw.kind === 'gems' ? '#fee761' : '#ffffff');
    g.save();
    g.beginPath(); g.rect(W.x + 1, W.y + 1, W.w - 2, W.h - 2); g.clip();
    for (let x = W.x - 4; x < W.x + W.w; x += 5) wood(g, x, gy, 6, 9, 3, WOOD.old);
    // 探検家（2 倍の大きさ）。x は体の真ん中、y は跳ねる高さ
    const ham = (x, y, cheek, run) => {
      const set = A.hamG[cheek], img = run ? set.run[Math.floor(app.time / cfg.anim.stepSec) % set.run.length].n : set.hold.n;
      if (y === 0) { g.fillStyle = 'rgba(24,20,37,0.35)'; g.fillRect(Math.round(x - 10), footY, 21, 2); }
      g.drawImage(img, Math.round(x - 16), Math.round(footY - 32 + y), 40, 32);
    };
    const hop = (u) => -AN.hopH * Math.sin(Math.PI * (u % 1));
    const cx = W.x + W.w / 2;
    if (rw.kind === 'gems') {
      const n = 6, t1 = AN.runIn, hopsEnd = t1 + AN.hop * AN.hops;
      const hx = t < t1 ? W.x - 12 + (cx - W.x + 12) * (t / t1) : cx;
      const hy = t >= t1 && t < hopsEnd ? hop((t - t1) / AN.hop) : 0;
      // 宝石: 1 回目に跳ねたいちばん上で飛び出す
      const out = t1 + AN.hop / 2, ox = cx, oy = footY - 30 - AN.hopH, ay = footY - 20, r = W.arc;
      for (let i = 0; i < n; i++) {
        const u = (t - out - i * 0.08) / AN.fly;
        if (u <= 0) continue;
        const ang = Math.PI * (1 + (0.12 + (0.76 * i) / (n - 1))), tx = cx + r * Math.cos(ang), ty = ay + r * Math.sin(ang);
        const k = ease(Math.min(1, u)), bob = u >= 1 ? Math.round(1.5 * Math.sin((t * 2 * Math.PI) / 1.6 + i)) : 0;
        const x = ox + (tx - ox) * k, y = oy + (ty - oy) * k - 14 * Math.sin(Math.PI * Math.min(1, u)) + bob;
        g.drawImage(A.gem, Math.round(x - 3), Math.round(y - 3));
        // ゆっくり 1 つずつ光る
        if (u >= 1) { const ph = ((t / AN.twinkle - i * (1 / n)) % 1 + 1) % 1; if (ph < 0.3) { const a = Math.sin((Math.PI * ph) / 0.3); g.globalAlpha = a; g.fillStyle = '#ffffff'; g.fillRect(Math.round(x + 2), Math.round(y - 6), 1, 3); g.fillRect(Math.round(x + 1), Math.round(y - 5), 3, 1); g.globalAlpha = 1; } }
      }
      ham(hx, hy, 3, t < t1);
    } else {
      const xs = stampXs(), k = R.rewardStamps(t);
      for (let i = 0; i < k; i++) g.drawImage(A.foot, xs[i], gy + 1);
      const hx = stampHamX(t), t2 = AN.dash + AN.runIn, hy = t >= t2 && t < t2 + AN.hop * 2 ? hop((t - t2) / AN.hop) : 0;
      ham(hx, hy, 2, t < t2);
    }
    g.restore();
  }

  Game.render = R;
})();
</script>
<script>
// ループと場面。指の動きを置き場所（render.layout）と照らしてルールの操作にし、返ってきた出来事を演出に配る。
// わたる の歩き・落ちるは、ここが時間を持つ（ルールは一瞬で進む）。
// 操作: 板の上を横になぞって切る数を決める / 板を上から下へ横切って切る / 切れはしをつまんで谷へ運ぶ / 探検家を右へ引いて わたる
// 画面: title → select（ステージ選び）→ play → clear。記録（宝石・足あと）は渡りきったときに保存する。
// URL（確かめ用）: ?stage=1-4 でそのステージから始める / ?seed=123 で数字を決める種 / ?fix=1 で一例の数字 / ?mode=hand で立て札の形 / ?nosave=1 で保存しない / ?open=1 で全部のステージを開く（保存しない）
(function () {
  const Game = (window.Game = window.Game || {});
  const cfg = Game.config, RU = Game.rules, L = cfg.layout, AN = cfg.anim;
  const q = new URLSearchParams(location.search);

  const HOME = 7; // 探検家が待つ場所（左の踏み板の上。体の真ん中の x）
  // OPEN: 確かめ用。全部のステージを開いた状態で始める（保存はしない）。?open=1 か、確かめ用のファイル（dist/test-open.html）
  const OPEN = q.get('open') === '1' || !!window.HB_TEST_OPEN;
  const P = Game.progress, SV = Game.save, NOSAVE = q.get('nosave') === '1' || OPEN;
  // REWARD: 確かめ用。渡りきるたびに、エリアを集めきったときのごほうび（宝石と足あと）を見せる。?reward=1 か、確かめ用のファイル
  const REWARD = () => q.get('reward') === '1' || !!window.HB_TEST_REWARD || app.testReward;

  const app = (Game.app = {
    mode: 'title',           // title | select | play | clear
    menu: false,             // play の上にメニューを開いているか
    area: 1, def: null, stage: null, nextId: null, // 選んでいるエリア、遊んでいるステージの型と中身、次のステージ（開いていれば）
    progress: null, settings: null, tips: null,
    rules: null, result: null,
    time: 0, manual: false,
    cutT: -1, slashT: -1,    // 切る数が最後に変わった時刻（蛇腹の弾み）、切った時刻（光る）
    drag: null,              // { kind: 'board' → 'count' | 'slash', x, y, x0, y0 } | { kind: 'piece', len, x, y } | { kind: 'ham', x, x0 } | { kind: 'btn', id }
    anim: null,              // わたる の演出: { steps: [{ dur, enter, tick }], i, t, bridge, mark }
    ham: { x: HOME, y: 0, pose: 'idle', visible: true, bubble: null, skull: false },
    lastEvents: [],
    audio: null, fx: null,
    cutFx: null,             // 切った直後の切れはし { t0, n, len, x, y, overlay }
    placeT: -1, clearT: 0, gemN: 0, // 置いた時刻（沈む）、クリアした時刻、数え終えた宝石の数
    rewards: [], reward: null, // クリアの画面で見せる、エリアを集めきったごほうび（'gems' | 'stamps' の列）と、いま見せているもの { kind, t0, n }
  });

  // ステージに入る: 数字を決める（前に遊んだのと同じにはしない）
  function enter(id) {
    const def = Game.stages.find((d) => d.id === id);
    if (!def) return;
    const seed = q.has('seed') ? +q.get('seed') | 0 : (Math.random() * 0x7fffffff) | 0;
    const prev = P.enter(app.progress, id, seed);
    if (!NOSAVE) SV.storeProgress(app.progress);
    app.def = def; app.area = def.area;
    app.stage = Game.gen.make(q.get('fix') === '1' ? Object.assign({}, def, { fixed: true }) : def, seed, prev);
    if (q.get('mode') === 'hand') app.stage.mode = 'hand';
    start();
  }
  // さいしょから（数字は変えない）
  function start() {
    app.rules = RU.start(structuredClone(app.stage));
    app.mode = 'play'; app.menu = false; app.result = null; app.reward = null; app.rewards = []; app.anim = null; app.drag = null; app.cutFx = null; app.demo = null;
    if (app.fx) app.fx.clear();
    Object.assign(app.ham, { x: HOME, y: 0, pose: 'idle', visible: true, bubble: null, skull: false });
  }

  // 演出の節目（歩く・落ちるの途中）で出す出来事。名前は fx_ で始める
  // app.fxLog: 直近の節目（通しテストが見る）
  const emit = (e) => { (app.fxLog = app.fxLog || []).push(e.type); if (app.fxLog.length > 60) app.fxLog.shift(); if (app.audio) app.audio.on(e); if (app.haptics) app.haptics.on(e); if (app.fx) app.fx.on(e, app); };
  // 出来事を演出（音・擬音）に配る
  function dispatch(events) {
    app.lastEvents = events;
    for (const e of events) {
      emit(e);
      if (e.type === 'cut' && e.bench) seenTip('recut'); // 台の切れはしを切った（板を切る手本とは別に数える）
      else if (TIP[e.type]) seenTip(TIP[e.type]);
      if (e.type === 'cutn') app.cutT = app.time;
      else if (e.type === 'place') app.placeT = app.time;
      else if (e.type === 'cross') startCross(e);
      else if (e.type === 'clear') { app.result = e.result; }
    }
  }

  // 手本: その操作が一度できたら、もう出さない
  const TIP = { cutn: 'count', cut: 'cut', place: 'carry', cross: 'go', route: 'route', bench: 'bench' };
  function seenTip(id) { if (app.tips.seen[id]) return; app.tips.seen[id] = true; if (!NOSAVE) SV.storeTips(app.tips); }

  // ---- わたる の演出 ----
  const inside = (r, x, y, pad = 0) => x >= r.x - pad && x < r.x + r.w + pad && y >= r.y - pad && y < r.y + r.h + pad;
  function startCross(e) {
    const h = app.ham, fail = e.result === 'short' || e.result === 'long';
    const steps = [];
    const a = (app.anim = { steps, i: -1, t: 0, bridge: e.bridge, mark: null, fail });
    if (fail) {
      // ずれた場所の手前まで歩く → あれ？ → 落ちる → キュウとドクロ → しれっと戻る
      const edge = L.gapX + Math.min(e.total, e.len);
      const stop = Math.max(HOME, edge - 4);
      steps.push(chain(stop));
      steps.push({ dur: AN.wonder, enter() { emit({ type: 'fx_wonder' }); h.pose = 'idle'; h.bubble = '?'; a.mark = e.result === 'short' ? { kind: 'short', x: edge, w: e.len - e.total } : { kind: 'long', x: L.gapX + e.len, w: e.total - e.len }; } });
      if (e.result === 'short') {
        // 短い: 一歩踏み出して穴から落ちる
        steps.push({ dur: AN.fall, enter() { emit({ type: 'fx_miss' }); h.bubble = null; h.pose = 'fall'; }, tick(st, k) { h.x = stop + 8 * Math.min(1, k * 3); h.y = k < 0.25 ? 0 : 300 * (k - 0.25) * (k - 0.25); } });
        steps.push({ dur: AN.skull, enter() { emit({ type: 'fx_kyu' }); h.visible = false; h.skull = 'pit'; } });
      } else {
        // 長い: 乗り上げた板につまずいて、橋の上で前にこける（谷には落ちない）
        steps.push({ dur: AN.trip, enter() { emit({ type: 'fx_trip' }); h.bubble = null; h.pose = 'hit'; }, tick(st, k) { const u = Math.min(1, k / AN.tripAir); h.x = stop + 9 * u; h.y = u < 1 ? -6 * Math.sin(Math.PI * u) : 0; h.pose = u < 1 ? 'hit' : 'down'; } }); // 前へ跳ねて、横倒しに着地
        steps.push({ dur: AN.skull, enter() { emit({ type: 'fx_kyu' }); h.skull = 'deck'; } });
      }
      steps.push({ dur: AN.back, enter() { emit({ type: 'fx_back' }); h.skull = false; a.mark = null; a.bridge = null; dispatch(RU.settle(app.rules)); h.visible = true; h.y = 0; h.x = -10; h.pose = 'run'; }, tick(st, k) { h.x = -10 + (HOME + 10) * k; } });
    } else {
      // 渡りきる → 最後のつなぎ目で ピタッ → 右へ抜ける → 次の谷の手前へ左から入ってくる
      // ギシギシ のときは、谷の上を歩いている間、走りのコマ送りに合わせてきしむ（creakEvery コマごと）。
      // ペースはいつも同じで、谷が長いほど回数が増える。谷が短くて一度も合わなかったら、渡りきるところで 1 回
      const walk = chain(L.gapX + e.len), tick0 = walk.tick;
      const beat = () => Math.floor(app.time / (AN.stepSec * AN.creakEvery));
      let last = null, n = 0;
      const creakOnce = () => { emit({ type: 'fx_creak', n, pitch: n++ % 2 ? 0.8 : 1 }); };
      if (e.result === 'creak') walk.tick = (st, k) => {
        tick0(st, k);
        const b = beat();
        if (h.x >= L.gapX && last != null && b !== last) creakOnce();
        last = b;
        if (k >= 1 && !n) creakOnce();
      };
      steps.push(walk);
      steps.push({ dur: AN.fit, enter() { h.pose = 'idle'; emit({ type: 'fx_fit' }); } });
      steps.push({ dur: AN.verdict, enter() { if (e.result === 'sturdy') { emit({ type: 'fx_sturdy', gold: e.gold }); emit({ type: 'fx_seed', gold: e.gold }); } } });
      steps.push(chain(cfg.view.w + 12));
      steps.push({ dur: AN.next, enter() { a.bridge = null; dispatch(RU.settle(app.rules)); h.x = -10; h.pose = 'run'; if (app.rules.done) { h.visible = false; } }, tick(st, k) { h.x = -10 + (HOME + 10) * k; } });
    }
    nextStep();
  }
  // 歩く 1 区間（始まるときの位置から x まで）
  function chain(x) {
    const h = app.ham, st = { dur: 0, x0: 0 };
    st.enter = () => { st.x0 = h.x; st.dur = Math.abs(x - h.x) / AN.walk + 1e-3; h.pose = 'run'; };
    st.tick = (_, k) => {
      const prev = h.x;
      h.x = st.x0 + (x - st.x0) * k;
      const a = app.anim;
      if (!a || !a.bridge) return;
      let at = L.gapX;
      for (const len of a.bridge) {
        const mid = at + len / 2;
        if (prev < mid && h.x >= mid) emit({ type: 'fx_step', len });
        at += len;
      }
    };
    return st;
  }
  function nextStep() {
    const a = app.anim;
    a.i++; a.t = 0;
    if (a.i >= a.steps.length) { endAnim(); return; }
    const st = a.steps[a.i];
    if (st.enter) st.enter(st);
  }
  function endAnim() {
    app.anim = null;
    Object.assign(app.ham, { x: HOME, y: 0, pose: 'idle', bubble: null, skull: false, visible: true });
    if (app.rules.done) {
      app.mode = 'clear'; app.clearT = app.time; app.gemN = 0; emit({ type: 'fx_pon' });
      // 記録する（前に取った宝石と足あとは消えない）。この記録でエリアの宝石・足あとがそろったら、ごほうびを見せる
      const area = app.def.area, before = P.total(app.progress, area);
      P.record(app.progress, app.def.id, app.result);
      const after = P.total(app.progress, area), full = (t, k) => (k === 'gems' ? t.gems === t.stages * 3 : t.stamps === t.stages);
      app.rewards = ['gems', 'stamps'].filter((k) => REWARD() || (!full(before, k) && full(after, k)));
      app.reward = null;
      if (!NOSAVE) SV.storeProgress(app.progress);
      const i = Game.stages.indexOf(app.def), next = Game.stages[i + 1];
      app.nextId = next && P.open(app.progress, next.id) ? next.id : null;
    }
  }
  function tickAnim(dt) {
    const a = app.anim;
    if (!a) return;
    a.t += dt;
    let st = a.steps[a.i];
    while (app.anim === a && a.t >= st.dur) {
      if (st.tick) st.tick(st, 1);
      const over = a.t - st.dur;
      nextStep();
      if (app.anim !== a) return;
      a.t = over;
      st = a.steps[a.i];
    }
    if (app.anim === a && st.tick) st.tick(st, Math.min(1, a.t / st.dur));
  }
  // 落ちる演出はタップで飛ばせる
  function skipAnim() {
    const a = app.anim;
    if (!a || !a.fail) return;
    while (app.anim === a) { const st = a.steps[a.i]; if (st.tick) st.tick(st, 1); nextStep(); }
  }

  // ---- 指 ----
  // 切る数: 板の上を横になぞる（左へ＝細かく） / 切る: 板を上から下へ横切る / 運ぶ: 切れはしをつまんで谷へ / わたる: 探検家を右へ引く
  // わたる の引き始めは、画面の左端から探検家の前まで受ける（端のジェスチャーを避けて、探検家の前から引ける）
  const hamRect = () => ({ x: -Game.render.fx, y: L.deckY + Game.render.routeDy(app.rules) - L.ham.h, w: Game.render.fx + L.ham.w, h: L.ham.h - 4 });
  function doCut(s) {
    const b = Game.render.boardRect(s), overlay = RU.overlay(s), ev = RU.cut(s);
    const c = ev.find((e) => e.type === 'cut');
    // 台の切れはしは、切ったあとも台に残る（光るだけ。置き場へは飛ばない）
    if (c) { app.slashT = app.time; if (!c.bench) app.cutFx = { t0: app.time, n: c.n, len: c.len, x: b.x, y: b.y, overlay }; }
    dispatch(ev);
  }
  function onInput(e) {
    const s = app.rules, R = Game.render;
    const { x, y } = e;
    // ボタン（押したところと離したところが同じボタンなら押したことにする）
    if (e.type === 'down') {
      app.drag = null;
      if (!app.anim || app.menu) for (const b of R.buttons(app)) if (inside(b, x, y, 2)) { app.drag = { kind: 'btn', id: b.id }; return; }
    }
    if (app.mode !== 'play' || app.menu) {
      const d0 = app.drag;
      if (e.type === 'up' || e.type === 'cancel') app.drag = null;
      if (e.type === 'up' && d0 && d0.kind === 'btn') { const b = R.buttons(app).find((b) => b.id === d0.id); if (b && inside(b, x, y, 4)) press(b); }
      return;
    }
    if (app.anim) { if (e.type === 'down') skipAnim(); return; }
    // 分かれ道のお手本の途中で触ったら、元の道に戻してお手本を終える（触ったことは、そのまま受ける）
    if (app.demo && e.type === 'down') endDemo();
    if (e.type === 'down') {
      // 切れはし: 絵（重ねた山の x n、下の記号も含む）から pieceSlop ドット以内で、いちばん近い山
      let best = null, bd = Infinity;
      for (const gr of R.groups(s.hand.pieces)) {
        const w = gr.w + (gr.n > 1 ? 13 : 0), h = gr.h + (R.labels ? 14 : 0);
        const dd = Math.hypot(Math.max(gr.x - x, 0, x - (gr.x + w)), Math.max(gr.y - y, 0, y - (gr.y + h)));
        if (dd <= L.pieceSlop && dd < bd) { bd = dd; best = gr; }
      }
      if (best) { app.drag = { kind: 'piece', len: best.len, x, y, y0: y }; return; }
      // 橋の上の切れはしをつまむ: いったん手持ちに戻して、そのまま指についてくる
      for (const r of R.bridgeRects(s.bridge, R.routeDy(s))) if (inside({ x: r.x, y: r.y - 4, w: r.w, h: r.h + 10 }, x, y)) { dispatch(RU.take(s, r.i)); app.drag = { kind: 'piece', len: r.len, x, y, y0: Infinity }; return; }
      if (inside(hamRect(), x, y)) { app.drag = { kind: 'ham', x, x0: x }; return; }
      // 分かれ道: 選んでいないほうの橋をタップすると、そちらへ移る
      if (RU.fork(s)) { const o = 1 - s.route, oy = L.deckY + L.forkDy[o]; if (y >= oy - 12 && y < oy + L.deckH + L.deckFront + 5) { app.tapT = app.time; app.tapAt = { x, y }; dispatch(RU.route(s, o)); return; } }
      if (R.hasTarget(s)) {
        const b = R.boardRect(s);
        // 台の切れはしは、上・下にも広くつまめる（細かく切ると小さいので。左の端は画面の端まで）
        const pick = s.bench.length > 0 && x >= -R.fx && x < b.x + RU.sum(s.bench) + 4;
        if ((x >= b.x - 4 || pick) && x < b.x + b.w + 4) {
          // 板の上: 横に動けば切る数、下へ動けば切る（動き出してから決める）。
          // 台の切れはしの上・まわりなら、上へ動かすか、線がないときに下へ動かすと、その切れはしをつまむ（pick）
          if (y >= b.y - 3 && y < b.y + b.h) { app.drag = { kind: 'board', x, y, x0: x, y0: y, pick }; return; }
          // 板のすぐ下: 横になぞると切る数（ここからは切れない）
          if (y >= b.y + b.h && y < Math.min(b.y + b.h + L.countBelow, RU.overlay(s) ? L.deckY + R.routeDy(s) - 4 : Infinity)) { app.drag = { kind: 'board', below: true, x, y, x0: x, y0: y, pick }; return; }
          // 板より上: 上から下へ横切るスワイプの始まり（台の切れはしの上からなら、横になぞる・上へ動かしてつまむ、もできる）
          if (y >= b.y - L.slash.reach && y < b.y) { app.drag = pick ? { kind: 'board', x, y, x0: x, y0: y, pick } : { kind: 'slash', x, y, x0: x, y0: y }; return; }
        }
      }
      return;
    }
    const d = app.drag;
    if (!d) return;
    if (e.type === 'move') {
      if (d.kind === 'board') {
        // 縦か横か、先に大きく動いたほうに決める
        const dx = Math.abs(x - d.x0), dy = y - d.y0;
        if (Math.max(dx, Math.abs(dy)) < L.slash.slop) return;
        // 谷は台の右上なので、上向きなら斜めでもつまむ（横になぞるのは、ほぼ真横のときだけ）
        if (d.pick && ((dy < 0 && -dy * 2 >= dx) || (dx < dy && s.cutN === 1))) {
          const ev = RU.fromBench(s), u = ev.find((q) => q.type === 'unbench');
          dispatch(ev);
          app.drag = u ? { kind: 'piece', len: u.len, x, y, y0: Infinity } : null;
          return;
        }
        if (dx < Math.abs(dy) && d.below) { app.drag = null; return; }
        d.kind = dx >= Math.abs(dy) ? 'count' : 'slash';
        if (d.kind === 'count') d.xs = d.x0;
      }
      if (d.kind === 'count') {
        // 左へ cutStep なぞるごとに 1 段細かく、右へで 1 段粗く
        d.x = x;
        while (Math.abs(x - d.xs) >= L.cutStep) {
          const dir = x < d.xs ? 1 : -1;
          d.xs -= dir * L.cutStep;
          dispatch(RU.setCut(s, R.cutStep(s, dir)));
        }
      } else if (d.kind === 'piece') { d.x = x; d.y = y; }
      else if (d.kind === 'ham') { d.x = x; if (x - d.x0 >= L.ham.pull) { app.drag = null; dispatch(RU.cross(s)); } }
      else if (d.kind === 'slash') {
        d.x = x; d.y = y;
        // 上から下へ、板の下の端を抜けたら切る
        const b = R.boardRect(s);
        if (y - d.y0 >= L.slash.min && y >= b.y + b.h) { app.drag = null; doCut(s); }
      }
      return;
    }
    app.drag = null;
    if (e.type !== 'up') return;
    if (d.kind === 'btn') { const b = R.buttons(app).find((b) => b.id === d.id); if (b && inside(b, x, y, 4)) press(b); }
    // 谷の側（手持ちの場所より上）で離したら置く。手元で離したら手持ちのまま
    // 切る台の上で離したら台にのせる（置き場から少しでも上へ動かしたとき。その場のタップではのらない）
    else if (d.kind === 'piece') {
      if (d.y - L.dragLift < L.trayY) {
        // 分かれ道: 離した所に近いほうの橋へ置く（選んでいない道なら、探検家がそちらへ移ってから置く）
        if (RU.fork(s)) { const r = d.y - L.dragLift < L.deckY + (L.forkDy[0] + L.forkDy[1]) / 2 ? 0 : 1; if (r !== s.route) dispatch(RU.route(s, r)); }
        dispatch(RU.place(s, d.len));
      }
      else if (s.stage.recut && d.y0 - d.y >= L.bench.pickUp && inside(R.benchDrop(), d.x, d.y - L.dragLift)) dispatch(RU.toBench(s, d.len));
    }
  }

  // ボタンを押した
  function press(b) {
    const s = app.rules;
    app.audio.play('click', { step: 2 });
    if (b.id === 'start') { app.mode = app.tips.seen.story ? 'select' : 'story'; app.page = 0; }
    else if (b.id === 'areaPrev') app.area--;
    else if (b.id === 'areaNext') app.area++;
    else if (b.id === 'story') { app.mode = 'story'; app.page = 0; }
    else if (b.id === 'page') { if (++app.page >= Game.lang.t('story.pages').length) { seenTip('story'); app.mode = 'select'; } }
    else if (b.id.startsWith('stage:')) { if (P.open(app.progress, b.def.id)) enter(b.def.id); else app.audio.play('deny'); }
    else if (b.id === 'sound') { app.settings.sound = !app.settings.sound; cfg.audio.enabled = app.settings.sound; if (!NOSAVE) SV.storeSettings(app.settings); app.audio.play('click', { step: 4 }); }
    else if (b.id === 'haptics') { app.settings.haptics = !app.settings.haptics; app.haptics.setEnabled(app.settings.haptics); if (!NOSAVE) SV.storeSettings(app.settings); if (app.settings.haptics) app.haptics.play('place'); }
    else if (b.id === 'retry') dispatch(RU.retryGap(s));
    else if (b.id === 'help') dispatch(RU.help(s));
    else if (b.id === 'menu') app.menu = true;
    else if (b.id === 'resume') app.menu = false;
    else if (b.id === 'restart' || b.id === 'again') { start(); emit({ type: 'fx_back' }); }
    else if (b.id === 'select') { app.mode = 'select'; app.reward = null; app.rewards = []; app.menu = false; app.anim = null; app.demo = null; app.fx.clear(); }
    else if (b.id === 'next') enter(app.nextId);
  }

  // 分かれ道のお手本（このページを開いてから、道をまだ自分で選んだことがない人に 1 回だけ）
  function endDemo() {
    const d = app.demo;
    if (!d) return;
    if (app.rules.route !== d.from) RU.route(app.rules, d.from);
    app.demo = null;
  }
  function tickDemo(dt) {
    const s = app.rules;
    if (!app.demo) {
      if (app.mode === 'play' && !app.menu && !app.anim && !app.drag && !app.demoDone && !app.tips.seen.route && RU.fork(s) && s.bridge.length === 0) { app.demo = { t: 0, step: 0, from: s.route }; app.demoDone = true; }
      return;
    }
    const d = app.demo, D = AN.demo;
    d.t += dt;
    // 道を移すのはお手本なので、手本を見た印（seenTip）は付けない。音だけ鳴らす
    // 指が押しきった瞬間に移る（指の動きと探検家の動きが結びつくように）
    const t1 = D.move + D.press, t2 = t1 + D.hold + D.move + D.press;
    if (d.step === 0 && d.t >= t1) { d.step = 1; app.tapT = app.time; emit(RU.route(s, 1 - d.from)[0] || { type: 'none' }); }
    else if (d.step === 1 && d.t >= t2) { d.step = 2; app.tapT = app.time; emit(RU.route(s, d.from)[0] || { type: 'none' }); }
    else if (d.step === 2 && d.t >= t2 + D.tail) app.demo = null;
  }

  function update(dt) {
    app.time += dt;
    if (!app.menu) tickAnim(dt);
    if (!app.menu) tickDemo(dt);
    if (app.cutFx && app.time - app.cutFx.t0 >= AN.cutHop + AN.cutDrop) app.cutFx = null;
    // クリア: 宝石を 1 つずつ数える（3 つと、足あと）
    if (app.mode === 'clear' && app.result) {
      // 編 2 は 5 つめに星
      const marks = app.def.recut ? 5 : 4, n = Math.max(0, Math.min(marks, Math.floor((app.time - app.clearT - AN.clearWait) / AN.gemEvery)));
      while (app.gemN < n) { const i = app.gemN++; if (i < 3 ? app.result.gems[i] : i === 3 ? app.result.stamp : app.result.star) emit({ type: 'fx_gem', i }); }
      // 数え終えたら、ごほうび（集めきったもの）を 1 つずつ
      const t = app.time - app.clearT - AN.clearWait - AN.gemEvery * (marks + 0.5), rw = app.reward;
      if (t >= 0 && app.rewards.length && (!rw || app.time - rw.t0 >= AN.reward.dur)) {
        app.reward = { kind: app.rewards.shift(), t0: app.time, n: 0 };
        emit({ type: 'fx_reward', kind: app.reward.kind });
      }
      // 足あとのごほうび: 探検家が通ったところに足あとが付くたび、トン
      if (app.reward && app.reward.kind === 'stamps') {
        const k = Game.render.rewardStamps(app.time - app.reward.t0);
        while (app.reward.n < k) { app.reward.n++; emit({ type: 'fx_stamp' }); }
      }
    }
    app.fx.update(dt);
  }

  // 画面が隠れたら、音と振動を止める
  function setHidden(h) {
    app.audio.setHidden(h);
    if (h) app.haptics.stop();
    else keepAwake();
  }
  // 遊んでいる間は画面を暗くしない（Wake Lock）。隠れると外れるので、戻ったときと触ったときに取り直す。ない端末では何もしない
  let wake = null, waking = false;
  function keepAwake() {
    const want = app.mode === 'play' || app.mode === 'clear';
    if (!want) { if (wake) { const w = wake; wake = null; try { w.release().catch(() => {}); } catch (e) { /* 外せなくてもよい */ } } return; }
    if (wake || waking || typeof navigator === 'undefined' || !navigator.wakeLock || document.hidden) return;
    waking = true;
    try {
      navigator.wakeLock.request('screen').then((w) => { waking = false; wake = w; w.addEventListener('release', () => { if (wake === w) wake = null; }); }, () => { waking = false; });
    } catch (e) { waking = false; }
  }

  function boot() {
    const canvas = document.getElementById('c');
    Game.render.init(canvas);
    app.audio = Game.audio.create(cfg);
    app.fx = Game.fx.create(cfg);
    Game.input.create(canvas, onInput);
    // 音の再開。タッチは指を離したときに初めて許されるので、置いたとき・離したときの両方で試す
    for (const ev of ['pointerdown', 'pointerup', 'touchend', 'keydown']) document.addEventListener(ev, () => { if (!app.audio.running()) app.audio.unlock(); }, true);
    document.addEventListener('visibilitychange', () => setHidden(document.hidden));
    // 触ったときに、画面を暗くしない仕組みを取る（考えている間に画面が消えないように）
    document.addEventListener('pointerdown', () => keepAwake(), true);
    app.progress = NOSAVE ? P.fresh() : SV.loadProgress();
    app.settings = NOSAVE ? { sound: true, haptics: true } : SV.loadSettings();
    app.tips = NOSAVE ? { seen: {} } : SV.loadTips();
    cfg.audio.enabled = app.settings.sound;
    app.haptics = Game.haptics.create(cfg);
    app.haptics.setEnabled(app.settings.haptics);
    if (OPEN) { for (const d of Game.stages) P.record(app.progress, d.id, { gems: [true, false, false], stamp: false }); app.tips.seen.story = true; }
    // ステージ選びは、開いているいちばん先のステージのエリアから
    for (const d of Game.stages) if (P.open(app.progress, d.id)) app.area = d.area;
    if (q.has('stage')) { for (const d of Game.stages) { if (d.id === q.get('stage')) break; P.record(app.progress, d.id, { gems: [true, false, false], stamp: false }); } enter(q.get('stage')); }
    let last = performance.now();
    const frame = (now) => {
      const dt = Math.max(0, Math.min(0.1, (now - last) / 1000));
      last = now;
      if (!app.manual) update(dt);
      // 曲: クリアの画面では流さない（ゴールとごほうびの短い曲を聞かせる）。音を消しているときも
      app.audio.music(app.settings.sound && app.mode !== 'clear' ? 'main' : null);
      app.audio.tick();
      Game.render.draw(app);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }

  // テスト用: 実時間に関係なく進める
  Game.debug = {
    step(sec) { app.manual = true; for (let i = 0; i < Math.round(sec * 60); i++) update(1 / 60); Game.render.draw(app); },
    start, enter, input: onInput, setHidden,
  };

  boot();
})();
</script>
